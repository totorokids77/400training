 from learning; it is another path into it.","k":"Art is not a break from learning; it is another path into it.","c":["Art Class: Another Path to Learning","Saving Money Is Every School's Top Goal","Business Skills Every Painter Needs","The Most Famous Painters in History","Why Students Need More Breaks"],"t":["-","반","세","상","이"],"r":["미술이 또 다른 배움의 길이라는 핵심이다.","글은 예산 절감의 손실을 지적한다.","비즈니스는 활용 분야의 하나일 뿐이다.","유명 화가는 지문에 없다.","휴식은 글과 무관하다."],"a":0,"n":82},{"lv":1,"ty":2,"tp":"건강","p":"Doctors now warn that sitting for long periods is harmful, even for people who exercise regularly. Staying in a chair for hours slows blood flow and burns fewer calories. The solution is not another workout but frequent movement. Standing up every thirty minutes, even briefly, can reduce these risks.","k":"Standing up every thirty minutes, even briefly, can reduce these risks.","c":["오래 앉아 있는 습관의 위험은 자주 일어나 움직이는 것으로 줄일 수 있다.","규칙적으로 운동을 하는 사람은 하루 종일 오래 앉아 있어도 건강에 아무런 문제가 생기지 않는다.","칼로리 소비를 늘리기 위해서는 격렬한 운동이 필요하다.","혈액 순환이 나빠지면 심각한 질병에 걸린다.","사무직 근로자는 정기적인 건강 검진을 받아야 한다."],"t":["-","반","비","과","상"],"r":["자주 일어나 움직이면 장시간 앉아 있는 위험이 줄어든다는 내용이다.","글은 운동하는 사람도 해롭다고 했다.","격렬한 운동은 글의 해결책이 아니다.","'심각한 질병'은 지나친 확대이다.","건강 검진은 글에 없다."],"a":0,"n":83},{"lv":1,"ty":3,"tp":"건강","p":"Skipping vacations is sometimes seen as a sign of dedication. Yet people who never rest often become less productive and more irritable. Time away from work allows the mind to recover and produces fresh ideas. Employers and workers alike should recognize rest as part of good work, not as its enemy.","k":"rest as part of good work, not as its enemy","c":["휴식은 업무의 일부로 인정되어야 하며 충분히 취해야 한다.","더 높은 성과를 내려면 휴가를 최대한 줄이고 맡은 일에만 집중하는 것이 바람직하다.","직원이 휴가를 쓰면 회사의 생산성이 높아진다.","새로운 아이디어는 일터 밖에서만 얻을 수 있다.","휴가 중에도 업무 연락에 응하는 것이 바람직하다."],"t":["-","반","과","비","이"],"r":["휴식을 좋은 일의 일부로 인정하라는 것이 주장이다.","글이 비판하는 태도이다.","글은 휴식 없는 사람의 생산성 저하를 말했을 뿐이다.","'밖에서만'은 근거 없는 단정이다.","휴가 중 업무 연락은 글에 없다."],"a":0,"n":84},{"lv":1,"ty":0,"tp":"환경","p":"Fresh water seems endless when it flows from the tap, but only a tiny fraction of Earth's water is drinkable. Even simple actions, like turning off the faucet while brushing teeth, can save many liters a day. When millions of people make such choices, the total savings become enormous. Protecting water begins in our own bathrooms and kitchens.","k":"only a tiny fraction of Earth's water is drinkable","c":["the process of cleaning dirty river water","the value of saving water through everyday actions","the difference between salt water and fresh water in the world's oceans","the role of rain in the growth of crops","the unlimited supply of water on Earth"],"t":["이","-","세","상","반"],"r":["수질 정화 과정은 다루지 않았다.","일상 속 실천으로 물을 아끼자는 내용이다.","마실 수 있는 물의 비율은 근거일 뿐이다.","비와 농작물은 지문에 없다.","글은 마실 물이 한정되어 있다고 했다."],"a":1,"n":85},{"lv":1,"ty":1,"tp":"환경","p":"Nearly one third of household trash is food scraps and yard waste. Instead of sending it to landfills, many families now compost it. Over several months, banana peels and dry leaves turn into rich soil that helps gardens grow. Composting cuts down on garbage and gives something valuable back to the earth.","k":"Composting cuts down on garbage and gives something valuable back to the earth.","c":["Landfills: A Perfect Home for Garbage","Which Vegetables Grow Best in Gardens","Why Families Throw Away More Food and Trash Than They Did Before","From Scraps to Soil: The Value of Composting","Banana Peels and Their Vitamins"],"t":["반","세","상","-","이"],"r":["글은 매립 대신 퇴비화를 말한다.","텃밭 작물은 다루지 않았다.","쓰레기 증가 이유는 지문에 없다.","음식물 찌꺼기를 흙으로 바꾸는 퇴비화의 가치이다.","바나나 껍질의 영양은 글과 무관하다."],"a":3,"n":86},{"lv":1,"ty":2,"tp":"예술","p":"Many visitors rush through museums, trying to see everything in a single afternoon. But looking quickly at hundreds of objects leaves little memory of any of them. Spending several minutes with just a few works lets us notice details and form personal reactions. Seeing less, but more attentively, makes a museum visit more meaningful.","k":"Seeing less, but more attentively, makes a museum visit more meaningful.","c":["박물관을 방문하기 전에 작품에 대한 정보를 미리 조사해야 한다.","박물관에서는 시간이 한정되어 있으므로 하루에 가능한 한 많은 작품을 빠르게 관람하는 것이 효율적이다.","박물관에서는 많은 작품을 훑어보기보다 소수의 작품을 집중해서 감상하는 것이 좋다.","작품에 대한 개인적인 반응은 전문가의 해석보다 중요하다.","박물관 관람객 수는 해마다 감소하고 있다."],"t":["상","반","-","비","이"],"r":["사전 조사는 언급되지 않았다.","글이 비판하는 방식이다.","적게 보더라도 집중해서 보라는 결론이다.","전문가와의 비교는 글에 없다.","관람객 수 추이는 언급되지 않았다."],"a":2,"n":87},{"lv":1,"ty":3,"tp":"교육","p":"Some students avoid asking for help because they fear it shows weakness. In truth, seeking help is a skill that successful learners use constantly. A short question to a teacher or classmate can save hours of confusion. Students should ask for help as soon as they feel stuck.","k":"Students should ask for help as soon as they feel stuck.","c":["스스로 해결할 수 있다는 확신이 들 때까지는 다른 사람에게 도움을 요청하지 않아야 한다.","교사에게 질문하는 것이 친구에게 질문하는 것보다 효과적이다.","학습 중 막히는 부분이 생기면 곧바로 도움을 요청해야 한다.","성공한 학습자는 혼자서 공부하는 시간이 길다.","질문은 수업이 끝난 후에 하는 것이 예의이다."],"t":["반","비","-","상","이"],"r":["글의 주장과 정반대이다.","교사와 친구의 우열은 글에 없다.","막히면 바로 도움을 요청하라는 것이 주장이다.","독학 시간은 언급되지 않았다.","질문 시점의 예의는 글에 없다."],"a":2,"n":88},{"lv":1,"ty":0,"tp":"건강","p":"Spending hours at a desk can slowly damage your posture. Leaning forward toward a screen puts pressure on the neck and back, leading to pain over time. Simple changes, such as adjusting your chair and standing up every hour, can prevent many problems. Small corrections in how we sit can protect our bodies for years.","k":"Leaning forward toward a screen puts pressure on the neck and back","c":["the best exercises for building strong muscles","the pleasure of working from home","the importance of keeping good posture while working at a desk","the history of office furniture design","ways to treat back pain with medicine"],"t":["상","이","-","이","비"],"r":["근력 운동은 지문에 없다.","재택근무의 즐거움은 소재 이탈이다.","책상 앞 바른 자세의 중요성이 중심이다.","가구 디자인의 역사는 다루지 않았다.","약물 치료는 글에서 비약된 내용이다."],"a":2,"n":89},{"lv":1,"ty":1,"tp":"사회","p":"Many older adults feel left behind as technology moves quickly. Yet when young people take time to teach them to video-call or use a smartphone, both sides benefit. The elderly feel connected to family again, and the young gain patience and respect. Helping someone cross the digital gap is a gift that returns to the giver.","k":"both sides benefit","c":["Why Older Adults Reject All Technology","The History of Smartphones","Video Calls Replace Family Visits","Patience: The Only Skill That Young People Today Truly Lack","Bridging the Digital Gap Between Generations"],"t":["반","상","비","과","-"],"r":["글은 노인이 배우려 한다고 본다.","스마트폰의 역사는 지문에 없다.","화상통화가 방문을 대체한다는 근거는 없다.","'유일한 부족함'은 지나친 단정이다.","세대 간 디지털 격차를 함께 줄인다는 핵심이다."],"a":4,"n":90},{"lv":1,"ty":2,"tp":"기술","p":"Notifications on our phones are designed to grab attention, and each interruption breaks our concentration. Studies show that it takes several minutes to return to deep focus after being distracted. Turning off unnecessary alerts during work or study hours can protect our attention. Controlling our devices, rather than being controlled by them, is essential for productive work.","k":"Controlling our devices, rather than being controlled by them, is essential for productive work.","c":["스마트폰 사용 시간이 길수록 업무 능력이 떨어진다.","공부할 때에는 스마트폰을 사용해서는 안 된다.","방해를 받은 뒤에는 휴식을 취하는 것이 집중에 도움이 된다.","스마트폰 제조 회사는 사용자의 집중력을 해치지 않도록 알림 기능을 더 신중하게 설계해야 한다.","집중력을 지키려면 불필요한 알림을 끄는 등 기기를 스스로 통제해야 한다."],"t":["과","비","반","상","-"],"r":["사용 시간이 아니라 알림으로 인한 방해가 핵심이다.","사용 금지가 아니라 불필요한 알림 차단을 말했다.","휴식은 언급되지 않았고 집중 회복에 시간이 든다고만 했다.","기업의 책임은 글에 없다.","기기를 통제하여 집중을 지켜야 한다는 결론이다."],"a":4,"n":91},{"lv":1,"ty":3,"tp":"사회","p":"In many workplaces, new ideas from junior employees are ignored simply because of their rank. This wastes valuable talent and discourages innovation. Good ideas can come from anyone, regardless of age or position. Organizations should listen to ideas on their merit, not on the status of the person who offers them.","k":"Organizations should listen to ideas on their merit","c":["신입 직원은 충분히 경험을 쌓고 조직의 사정을 이해한 후에 자신의 의견을 제시해야 한다.","조직은 제안을 직위가 아닌 내용의 가치에 따라 평가해야 한다.","회사는 젊은 직원을 더 많이 채용해야 한다.","혁신을 위해서는 직원들 사이의 경쟁을 장려해야 한다.","직위가 높은 사람은 낮은 사람의 의견을 존중해야 한다."],"t":["반","-","비","상","부"],"r":["글이 비판하는 관행이다.","제안자의 직위가 아닌 내용으로 평가하라는 것이 주장이다.","채용 확대는 글에 없다.","경쟁 장려는 지문 밖 내용이다.","상급자의 태도에 한정해 범위가 좁다."],"a":1,"n":92},{"lv":1,"ty":0,"tp":"사회","p":"Public libraries are no longer just places to borrow books. Many now offer free computer classes, job-search help, and meeting rooms for community groups. For people who cannot afford these services elsewhere, the library can be a doorway to new opportunities. Libraries continue to serve their communities by adapting to their changing needs.","k":"Public libraries are no longer just places to borrow books.","c":["the decline of reading among adults","how to find books in a large library","the types of free computer classes in libraries","the decline of libraries in modern society","the expanding role of libraries in serving communities"],"t":["상","이","세","반","-"],"r":["성인의 독서량 감소는 지문에 없다.","도서 검색법은 글과 무관하다.","컴퓨터 수업은 서비스의 한 예일 뿐이다.","글은 도서관의 역할 확대를 말한다.","도서관의 역할이 지역 사회를 위해 확대되고 있다는 내용이다."],"a":4,"n":93},{"lv":1,"ty":1,"tp":"건강","p":"Stretching for just five minutes a day can make the body more flexible and reduce the risk of injury. It also relaxes tight muscles that build up from sitting too long. Many people skip stretching because it seems unimportant. Yet this simple habit can help us move more freely and comfortably at any age.","k":"Stretching for just five minutes a day can make the body more flexible","c":["Sitting Is the Best Way to Rest","Daily Stretching: A Simple Step to Freer Movement","Injuries in Professional Sports","Why Flexibility Is Only for the Young","The Right Time to Eat Before Exercise"],"t":["반","-","이","반","상"],"r":["오래 앉는 것은 근육을 긴장시킨다고 했다.","매일 하는 스트레칭의 이점이 핵심이다.","프로 스포츠 부상은 글과 무관하다.","글은 어떤 나이에도 도움이 된다고 한다.","운동 전 식사 시간은 지문에 없다."],"a":1,"n":94},{"lv":1,"ty":2,"tp":"사회","p":"Competition is often praised as the engine of progress, but cooperation drives many of our greatest achievements. Scientists share data across borders, and engineers build on one another's designs. When people work together, they combine different strengths and avoid repeating mistakes. Progress depends not only on racing against others but on working with them.","k":"Progress depends not only on racing against others but on working with them.","c":["경쟁은 사람들 사이의 불필요한 갈등을 낳아 사회 발전을 오히려 방해하는 요소로 작용한다.","경쟁뿐 아니라 협력도 사회의 발전을 이끄는 중요한 힘이다.","과학자들은 연구 자료를 공개적으로 공유해야 한다.","다양한 능력을 가진 사람들은 서로 경쟁하지 않는다.","기술자는 다른 사람의 설계를 참고하는 것이 바람직하다."],"t":["과","-","부","비","세"],"r":["글은 경쟁을 부정하지 않는다.","경쟁과 함께 협력도 발전의 원동력이라는 내용이다.","자료 공유는 협력의 예시일 뿐이다.","경쟁 여부에 대한 단정은 글에 없다.","설계 참고는 협력의 한 사례이다."],"a":1,"n":95},{"lv":1,"ty":3,"tp":"환경","p":"Street food stalls often produce a surprising amount of waste from disposable plates and cups. Yet customers rarely notice because the items are quickly thrown away. If vendors offered reusable containers and customers returned them for a small refund, waste would drop sharply. Cities should encourage reusable containers in food markets.","k":"Cities should encourage reusable containers in food markets.","c":["노점 음식의 가격을 낮추어 소비자의 접근성을 높여야 한다.","도시는 쓰레기를 줄이기 위해 일회용 접시와 컵의 생산과 판매를 모두 중단하도록 해야 한다.","소비자는 쓰레기를 분리하여 버리는 습관을 길러야 한다.","도시는 식품 시장에서 다회용 용기의 사용을 장려해야 한다.","노점상은 위생 관리 기준을 엄격히 지켜야 한다."],"t":["이","비","부","-","상"],"r":["음식 가격은 글과 무관하다.","생산 중단은 글에 없는 비약이다.","분리배출은 글의 해결책이 아니다.","식품 시장에서 다회용 용기를 장려하라는 것이 주장이다.","위생 기준은 지문에 없다."],"a":3,"n":96},{"lv":1,"ty":0,"tp":"기술","p":"Today, news spreads faster than ever, but not all of it is true. False stories often travel faster than facts because they are surprising and emotional. Before sharing an article, ask where it comes from and whether other sources report the same thing. A few seconds of checking can prevent the spread of misinformation.","k":"False stories often travel faster than facts","c":["the need to verify information before sharing it","the speed of internet connections around the world","the role of newspapers in a democracy","the emotional effects of reading sad stories on people who follow the news","the reasons people stop watching the news"],"t":["-","세","상","부","이"],"r":["공유 전에 정보를 확인해야 한다는 내용이다.","전파 속도는 인터넷 속도와 무관하다.","신문과 민주주의는 지문에 없다.","감정적 요소는 거짓 정보가 빠른 이유일 뿐이다.","뉴스를 끊는 이유는 다루지 않았다."],"a":0,"n":97},{"lv":1,"ty":1,"tp":"기술","p":"Video games are often blamed for wasting time, but some games improve useful skills. Strategy games require planning ahead, and puzzle games sharpen problem solving. Players also learn teamwork in online games where success depends on cooperation. Of course, moderation matters, but games can be more than simple entertainment.","k":"games can be more than simple entertainment","c":["Why Games Should Be Banned for Children","The History of Puzzle Design","More Than Play: Skills Gained from Video Games","Spending All Day Gaming Is Healthy","Online Friends Are Always Better Than Real Friends in School"],"t":["반","이","-","과","비"],"r":["글은 게임의 긍정적 면을 말한다.","퍼즐 디자인 역사는 다루지 않았다.","게임으로 얻는 기술이 핵심이다.","글은 절제가 중요하다고 했다.","온라인 친구가 낫다는 근거는 없다."],"a":2,"n":98},{"lv":1,"ty":2,"tp":"환경","p":"Food often travels thousands of kilometers before reaching our tables, burning fuel along the way. Local produce, by contrast, needs less transportation and arrives fresher. Buying from nearby farmers also supports the local economy. Choosing food grown close to home is a small decision with broad benefits.","k":"Choosing food grown close to home is a small decision with broad benefits.","c":["수입 식품은 국산 식품보다 신선도가 떨어진다.","농부들은 생산량을 늘려 지역 경제에 기여해야 한다.","식품의 운송 거리가 길수록 가격이 오른다.","지역에서 생산된 식품을 선택하면 환경과 지역 경제에 이로움을 줄 수 있다.","환경과 지역 경제를 위해서라면 모든 식품은 예외 없이 반드시 가까운 지역에서 생산된 것만 구입해야 한다."],"t":["비","이","상","-","과"],"r":["수입 식품이라는 구분은 글에 없다.","생산량 증대는 글의 논점이 아니다.","가격 변화는 언급되지 않았다.","가까운 곳의 식품을 고르면 여러 이점이 있다는 결론이다.","'모든', '반드시'는 지나친 단정이다."],"a":3,"n":99},{"lv":1,"ty":3,"tp":"언어","p":"Learning to read a map or understand a chart is increasingly important in a world full of data. Yet many people accept numbers at face value. A chart can be drawn to exaggerate a small change or hide an important one. Before trusting any graph, we should check what is measured and how the scale is set.","k":"we should check what is measured and how the scale is set","c":["데이터를 모두 신뢰하여 빠르게 의사 결정을 해야 한다.","그래프보다 숫자로 된 표를 사용하는 것이 낫다.","통계 자료는 전문가만 해석할 수 있도록 제한해야 한다.","지도를 읽는 법을 학교에서 가르쳐야 한다.","그래프를 접할 때에는 측정 대상과 눈금 설정 등을 비판적으로 확인해야 한다."],"t":["반","비","과","이","-"],"r":["글은 무비판적 수용을 경계한다.","표와 그래프의 우열은 글에 없다.","해석 제한은 지나친 비약이다.","학교 교육은 글에 없다.","그래프를 믿기 전에 측정 대상과 눈금을 확인하라는 것이 주장이다."],"a":4,"n":100},{"lv":2,"ty":0,"tp":"과학","p":"Many people imagine that scientific progress comes from lone geniuses working in isolation. In reality, most breakthroughs result from teams building on the work of earlier researchers. A discovery announced today usually rests on decades of small, patient contributions from scientists who will never be famous. Recognizing this shared effort changes how we view success in science: it is less a single flash of insight than a long conversation among many minds across time.","k":"most breakthroughs result from teams building on the work of earlier researchers","c":["the rare genius behind every great discovery","the fame that scientists gain after a breakthrough","the importance of teamwork in every kind of career","science as a collective effort built across generations","the rising cost of modern scientific research"],"t":["반","세","과","-","상"],"r":["글은 고독한 천재라는 통념을 반박한다.","명성은 '유명해지지 못하는 기여자' 언급에서 나온 곁가지이다.","과학 분야 이야기를 '모든 직업'으로 넓혔다.","과학적 성과가 여러 세대의 공동 노력의 산물이라는 내용이다.","연구비 상승은 지문에 없다."],"a":3,"n":101},{"lv":2,"ty":1,"tp":"교육","p":"Students often glance at the grade on a returned essay and ignore the comments written beside it. Yet the comments contain the most useful information: what worked, what confused the reader, and how to improve. A grade only reports the past, while feedback points toward the future. Teachers who ask students to revise their work after reading comments find that improvement is faster and deeper than when a grade is the final word.","k":"A grade only reports the past, while feedback points toward the future.","c":["Why Teachers Should Stop Giving Grades","The Hidden Meaning of Every Red Mark","Beyond the Grade: Feedback as a Map to Improvement","Essay Writing Rules for Beginners","Revision: The Hardest Part of Writing"],"t":["과","세","-","이","부"],"r":["성적 폐지는 글에 없는 극단적 주장이다.","첨삭 표시는 피드백의 한 형태일 뿐이다.","점수보다 피드백이 개선의 방향을 알려 준다는 핵심이다.","글쓰기 규칙은 다루지 않았다.","수정은 피드백 활용의 일부이며 '가장 어렵다'는 근거도 없다."],"a":2,"n":102},{"lv":2,"ty":2,"tp":"교육","p":"Many schools assign group projects expecting students to learn teamwork, but the results are often uneven. When grades are shared equally, hardworking students end up doing most of the work while others coast. Teachers can prevent this by giving each member a distinct responsibility and assessing individual contributions as well as the final product. Teamwork is learned not from simply sitting together but from being accountable to one another.","k":"Teamwork is learned not from simply sitting together but from being accountable to one another.","c":["조별 과제는 학생들의 협력 능력을 기르는 데 도움이 되지 않는다.","성적을 동일하게 부여하면 조원 사이의 갈등이 줄어든다.","교사는 최종 결과물의 완성도를 가장 중요하게 평가해야 한다.","성실한 학생들이 더 많은 일을 맡는 것은 불가피하다.","조별 과제에서 협력을 배우려면 구성원 각자의 역할과 책임이 분명해야 한다."],"t":["과","반","부","비","-"],"r":["글은 과제 자체가 아니라 운영 방식을 문제 삼는다.","동일한 성적은 무임승차를 낳는다고 했다.","결과물만 보면 개인 기여를 놓친다는 것이 글의 취지이다.","불가피하다는 단정은 글과 어긋난다.","함께 앉아 있는 것이 아니라 서로에게 책임을 지는 구조가 협력을 가르친다는 결론이다."],"a":4,"n":103},{"lv":2,"ty":3,"tp":"교육","p":"Many teachers worry that allowing phones in class invites distraction, and so they ban them entirely. But phones are also dictionaries, calculators, and research tools that students will use throughout their lives. Learning to use a device with self-control is a skill best practiced under guidance, not avoided. Schools should teach students when to put phones away and when to put them to use.","k":"Schools should teach students when to put phones away and when to put them to use.","c":["학교는 휴대전화를 금지하기보다 상황에 맞게 사용하는 법을 가르쳐야 한다.","교실에서는 수업에 집중하도록 휴대전화를 전면 금지해야 한다.","학생들은 전자 사전을 쓰지 말고 종이 사전을 사용해야 한다.","휴대전화는 계산기보다 학습에 더 유용한 도구이다.","교사는 새로운 전자 기기를 수업에 적극적으로 도입해야 한다."],"t":["-","반","비","상","부"],"r":["금지가 아니라 사용 시점을 가르치라는 것이 주장이다.","글이 비판하는 조치이다.","종이 사전 권장은 글에 없는 비약이다.","두 도구의 우열은 지문에 없다.","기기 도입 일반으로 넓혀 휴대전화 사용 교육의 초점을 놓쳤다."],"a":0,"n":104},{"lv":2,"ty":0,"tp":"심리","p":"We tend to believe that we would be happier if we had more choices. Yet studies show that too many options can leave people anxious and dissatisfied. When we face dozens of similar products, we worry about picking the wrong one, and even after choosing, we wonder what we missed. A limited set of good options often leads to quicker decisions and greater satisfaction than an endless menu of possibilities.","k":"too many options can leave people anxious and dissatisfied","c":["how an abundance of choices can reduce satisfaction","practical ways to compare products and prices before making a purchase","the anxiety people feel while making hard decisions","the importance of having no options at all","the reasons stores display so many similar products"],"t":["-","상","부","과","이"],"r":["선택지가 많으면 오히려 만족이 줄어든다는 내용이다.","상품 비교 방법은 지문에 없다.","불안만 다루고 불만족과 그 원인(선택지 과다)이 빠졌다.","선택지가 '전혀 없는' 것을 권하는 극단적 확대이다.","상점의 진열 이유는 다루지 않았다."],"a":0,"n":105},{"lv":2,"ty":1,"tp":"환경","p":"In most cities, the night sky is no longer dark. Streetlights and signs shine upward, hiding the stars and confusing animals that rely on natural light. Migrating birds crash into brightly lit towers, and sea turtle hatchlings crawl toward roads instead of the ocean. Simple changes, such as shielding lights and turning them off when not needed, can restore darkness at little cost. Protecting the night is easier than most environmental goals.","k":"Simple changes, such as shielding lights and turning them off when not needed","c":["Stargazing Spots Around the World","Sea Turtles and Their Long Journey to the Ocean","Why Cities Must Remove All Streetlights","The Cost of Building Brighter Streets","Lights Out: Giving Back the Night to Nature"],"t":["이","세","과","반","-"],"r":["별 관측 명소는 다루지 않았다.","바다거북은 피해 사례 중 하나이다.","가로등 전면 철거는 지나친 확대이다.","글은 조명을 줄이자는 입장이다.","빛 공해를 줄여 밤을 되찾자는 내용이다."],"a":4,"n":106},{"lv":2,"ty":2,"tp":"환경","p":"Planting trees is widely promoted as a simple climate solution, but where and how trees are planted makes a great difference. Fast-growing single-species plantations may store carbon quickly, yet they support little wildlife and can dry out local water supplies. Mixed native forests grow more slowly but sustain richer ecosystems and survive longer. A tree-planting campaign should be judged not by the number of trees counted but by the health of the forest that results.","k":"A tree-planting campaign should be judged not by the number of trees counted but by the health of the forest that results.","c":["나무를 가능한 한 많이 심는 것이야말로 기후 변화에 대응하는 가장 효과적이고 확실한 해결책이다.","나무 심기의 가치는 심은 나무의 수가 아니라 만들어지는 숲의 건강성으로 평가해야 한다.","속성수를 심으면 탄소를 빠르게 저장할 수 있어 바람직하다.","토종 나무로 이루어진 숲은 성장이 느려 비효율적이다.","나무 심기 캠페인은 정부가 직접 관리해야 한다."],"t":["과","-","부","반","상"],"r":["글은 나무 심기를 만능 해법으로 보지 않는다.","숫자보다 숲의 건강이 평가 기준이라는 결론이다.","탄소 저장은 맞지만 단점이 간과되었다.","느리지만 더 오래 생태계를 지탱한다고 했다.","관리 주체는 지문에 없다."],"a":1,"n":107},{"lv":2,"ty":3,"tp":"환경","p":"Many of us buy bottled water for convenience, ignoring the plastic waste it creates. In most cities, tap water is safe, cheaper, and equally refreshing. A reusable bottle can replace hundreds of disposable ones over its lifetime. Rather than treating bottled water as a necessity, we should choose tap water and carry our own bottles whenever possible.","k":"we should choose tap water and carry our own bottles whenever possible","c":["수돗물의 안전성을 높이기 위해 정부가 정수 시설을 대규모로 확충해야 한다.","플라스틱 생수병의 생산을 법으로 금지해야 한다.","편의점은 생수의 판매 가격을 인하해야 한다.","가능하면 생수 대신 수돗물을 마시고 재사용 가능한 물병을 사용해야 한다.","재사용 물병은 일회용 물병보다 위생적으로 안전하다."],"t":["상","비","이","-","세"],"r":["정수 시설 확충은 지문에 없다.","생산 금지는 글에 없는 비약이다.","생수 가격 인하는 글과 무관하다.","수돗물과 개인 물병을 쓰자는 것이 주장이다.","위생 문제는 다루지 않았다."],"a":3,"n":108},{"lv":2,"ty":0,"tp":"사회","p":"Cities often respond to heavy traffic by building wider roads. However, evidence shows that new lanes quickly fill with new cars, a pattern known as induced demand. When driving becomes easier, more people choose to drive, and congestion returns within a few years. Cities that invest in public transit, cycling paths, and walkable neighborhoods tend to move people more efficiently. Solving traffic, in other words, may require giving people better ways to travel rather than more space to drive.","k":"new lanes quickly fill with new cars","c":["the construction costs of building wider highways in large and crowded cities","the advantages of living in walkable neighborhoods","why expanding roads fails to solve urban traffic problems","the environmental harm caused by car exhaust","the need to ban private cars in all cities"],"t":["세","부","-","상","과"],"r":["건설 비용은 지문에 없다.","걷기 좋은 동네는 대안 중 하나일 뿐이다.","도로를 넓혀도 교통 체증이 해결되지 않는 이유를 설명한다.","배기가스 문제는 언급되지 않았다.","'모든 도시'의 승용차 금지는 비약적 확대이다."],"a":2,"n":109},{"lv":2,"ty":1,"tp":"사회","p":"Working from home removes the commute and offers flexibility, but it also changes how colleagues relate to one another. Casual conversations by the coffee machine, where ideas often spark, rarely happen on video calls. New employees miss chances to learn by watching experienced coworkers. Companies that succeed with remote work tend to create deliberate occasions for informal contact instead of assuming that connection will arise on its own.","k":"create deliberate occasions for informal contact","c":["The Joy of Skipping the Morning Commute","Working Apart, Staying Connected","Coffee Machines: The Secret to Office Success","Why Remote Work Always Fails","How to Hire New Employees Online"],"t":["부","-","세","과","이"],"r":["출퇴근 해방은 도입부의 장점일 뿐이다.","재택근무에서도 의도적으로 유대를 만들어야 한다는 내용이다.","커피 머신은 비공식 대화의 예시일 뿐이다.","'항상 실패'는 지나친 단정이다.","온라인 채용은 다루지 않았다."],"a":1,"n":110},{"lv":2,"ty":2,"tp":"심리","p":"We often assume that talented people succeed because of what they were born with. Yet studies of experts in music and sports show that the best performers differ less in natural gifts than in how they practice. They focus on their weakest skills, seek immediate feedback, and push slightly beyond what feels comfortable. Hours alone do not make an expert; it is the quality of attention during those hours that counts.","k":"it is the quality of attention during those hours that counts","c":["전문가가 되려면 재능과 관계없이 가능한 한 오랜 시간 동안 꾸준히 연습해야 한다.","재능이 없는 사람도 노력하면 반드시 전문가가 될 수 있다.","음악과 스포츠 분야의 전문가는 연습 방식이 서로 비슷하다.","뛰어난 실력은 타고난 재능보다 연습할 때의 집중과 방법의 질에서 비롯된다.","피드백을 즉시 받으면 연습의 즐거움이 커진다."],"t":["반","과","세","-","비"],"r":["글은 시간의 양만으로는 부족하다고 한다.","'반드시'는 글에 없는 단정이다.","두 분야는 근거 사례일 뿐 요지가 아니다.","연습 시간이 아니라 연습의 질이 중요하다는 결론이다.","즐거움은 글에서 다루지 않았다."],"a":3,"n":111},{"lv":2,"ty":3,"tp":"심리","p":"When children make mistakes, adults often hurry to correct them. But constant correction can teach children to fear errors and stop trying. Pointing out what a child did well first creates the confidence needed to face what needs improvement. Adults should balance correction with encouragement so that children feel safe enough to keep trying.","k":"balance correction with encouragement","c":["아이의 실수는 아이가 스스로 깨달을 때까지 어른이 어떤 경우에도 지적하지 않고 기다려야 한다.","어른은 아이의 실수를 바로잡을 때 격려도 함께 하여 아이가 계속 시도할 수 있게 해야 한다.","아이가 잘한 점만 칭찬하고 부족한 점은 언급하지 않아야 한다.","아이들은 어른보다 실수를 두려워하는 경향이 강하다.","실수를 두려워하지 않는 아이는 학업 성적이 높다."],"t":["반","-","비","상","이"],"r":["글은 교정을 완전히 배제하지 않는다.","교정과 격려의 균형이 핵심이다.","교정을 생략하자는 것은 글에 없는 극단이다.","연령별 비교는 지문에 없다.","학업 성적은 글의 소재가 아니다."],"a":1,"n":112},{"lv":2,"ty":0,"tp":"건강","p":"Noise is usually treated as an annoyance, but its effects on health may be more serious than we think. Long exposure to traffic or construction noise raises stress hormones, disturbs sleep, and is linked to heart problems. Because the body keeps reacting even while we sleep, people may suffer without realizing the cause. Quiet is therefore not a luxury but a basic condition for well-being, and cities should treat noise as a health issue, not just a nuisance.","k":"Quiet is therefore not a luxury but a basic condition for well-being","c":["the best ways to fall asleep quickly in a noisy city apartment at night","the link between noise and heart disease","the harm that loud music does to young ears","why modern cities are always too loud","the hidden health risks of long-term noise exposure"],"t":["부","세","상","과","-"],"r":["수면 문제만 다루고 해결법은 글에 없다.","심장 질환은 여러 영향 중 하나일 뿐이다.","음악과 청력은 지문 밖 내용이다.","'항상'으로 일반화했고 원인 분석은 글에 없다.","소음이 건강에 미치는 숨은 위험이 핵심이다."],"a":4,"n":113},{"lv":2,"ty":1,"tp":"건강","p":"Many people spend almost all of daylight hours indoors, and their bodies notice. Morning light helps set the internal clock that controls sleep, so people who get outdoors early often fall asleep more easily at night. Sunlight also triggers the skin to produce vitamin D, which supports bones and the immune system. Even a short walk outside, especially in the morning, offers benefits that no indoor lamp can fully match.","k":"Even a short walk outside, especially in the morning","c":["Step Outside: What Daylight Does for Body and Sleep","Vitamin D Pills: The Best Way to Stay Healthy All Year Round","Why Sleeping Late Is Good for the Body","Bone Health in Older Adults","Sunlight Cures Every Kind of Illness"],"t":["-","상","반","부","과"],"r":["햇빛이 수면과 신체에 주는 이점이 핵심이다.","비타민 D 보충제는 지문에 없다.","글은 아침 햇빛과 수면 리듬을 강조한다.","뼈 건강은 이점 중 하나이며 노인은 언급되지 않았다.","'모든 질병'은 지나친 과장이다."],"a":0,"n":114},{"lv":2,"ty":2,"tp":"사회","p":"Public apologies from companies and celebrities have become routine, yet many leave audiences unconvinced. An apology that begins with 'if anyone was offended' shifts attention to the listener's reaction instead of the speaker's action. Sincere apologies name the specific wrong, accept responsibility without excuses, and describe how the harm will be repaired. What makes an apology trustworthy is not the emotion expressed but the accountability shown.","k":"What makes an apology trustworthy is not the emotion expressed but the accountability shown.","c":["진정성 있는 사과는 감정 표현보다 구체적인 책임 인정과 수습 의지에서 나온다.","기업과 유명인이 공개 사과를 자주 할수록 대중의 신뢰를 더 많이 얻을 수 있다.","사과할 때에는 상대의 감정 상태를 먼저 고려해야 한다.","유명인의 사과는 일반인의 사과보다 더 큰 영향력을 가진다.","사과문에는 해당 잘못을 구체적으로 밝혀야 한다."],"t":["-","과","반","상","부"],"r":["신뢰받는 사과는 감정이 아닌 책임의 표현에서 나온다는 결론이다.","빈도와 신뢰의 관계는 글에 없다.","상대의 반응에 초점을 두는 것이 문제라고 했다.","영향력 비교는 지문 밖 내용이다.","구체적 명시는 요건 중 하나일 뿐이다."],"a":0,"n":115},{"lv":2,"ty":3,"tp":"사회","p":"In many countries, public transit fares are being raised to cover costs. Yet cheap fares are not only a service to riders; they reduce traffic and pollution for everyone. When fares rise too high, people return to cars, and the whole city pays through congestion and unhealthy air. Cities should treat public transportation as shared infrastructure and keep it affordable.","k":"treat public transportation as shared infrastructure and keep it affordable","c":["대중교통의 운영 비용은 수익자 부담 원칙에 따라 이용자가 전액 부담하도록 해야 한다.","도시는 자가용 이용자에게 혼잡 통행료를 부과해야 한다.","교통 체증을 줄이기 위해 대중교통을 전면 무료로 해야 한다.","요금이 오르면 사람들은 다시 자가용을 이용하게 된다.","도시는 대중교통을 공동의 기반 시설로 보고 요금을 합리적으로 유지해야 한다."],"t":["반","상","과","세","-"],"r":["글이 비판하는 방향이다.","혼잡 통행료는 지문에 없다.","'전면 무료'는 글에 없는 극단적 확대이다.","근거로 든 현상일 뿐 주장이 아니다.","대중교통을 공공 기반 시설로 보고 요금을 낮게 유지하라는 주장이다."],"a":4,"n":116},{"lv":2,"ty":0,"tp":"경제","p":"Many people think of money as something to be saved or spent, but economists also stress a third use: investing in skills. Courses, training, and even time spent practicing a craft increase a person's future earning power. Unlike a purchase that loses value once used, knowledge tends to grow in value over time. For this reason, the most reliable investment is often not in markets but in ourselves.","k":"the most reliable investment is often not in markets but in ourselves","c":["how to earn more money by trading shares in the stock market quickly","the long-term value of investing in personal skills","the difference between saving and spending habits","the reasons education costs more every year","the guarantee of higher wages after every course"],"t":["반","-","세","상","과"],"r":["글은 시장보다 자기 자신에 대한 투자를 말한다.","기술 습득에 대한 투자가 장기적으로 가치가 크다는 내용이다.","저축·소비 구분은 도입부 배경이다.","교육비 상승은 지문에 없다.","'모든 강좌' 후 임금 보장은 지나친 단정이다."],"a":1,"n":117},{"lv":2,"ty":1,"tp":"경제","p":"When prices rise across the economy, each unit of money buys less than before. A salary that stays the same therefore loses purchasing power year after year, even though the number on the paycheck looks unchanged. Savings kept in cash shrink in real value for the same reason. Understanding inflation helps explain why economists advise people to look at what money can buy rather than at how much money they hold.","k":"look at what money can buy rather than at how much money they hold","c":["Why Salaries Always Rise Together with Prices Every Single Year","The Best Ways to Invest in Gold","Paychecks and Their Printed Numbers","Rising Prices, Shrinking Money: What Inflation Does","Inflation: The End of All Savings"],"t":["반","이","부","-","과"],"r":["글은 월급이 그대로면 구매력이 줄어든다고 한다.","금 투자는 다루지 않았다.","급여 명세의 숫자는 설명 속 일부일 뿐이다.","물가 상승으로 돈의 구매력이 줄어든다는 내용이다.","'모든 저축의 종말'은 지나친 과장이다."],"a":3,"n":118},{"lv":2,"ty":2,"tp":"건강","p":"People often check their weight every day and judge their health by the number. But weight fluctuates by a kilogram or more because of water, meals, and time of day, so daily readings can cause needless worry. Trends over several weeks reveal far more than any single measurement. When tracking health, patterns matter more than individual numbers.","k":"patterns matter more than individual numbers","c":["건강 상태를 정확히 알기 위해서는 체중을 하루에 한 번씩 매일 측정하는 것이 가장 도움이 된다.","체중의 변동은 식사와 수분 섭취량에 의해 결정된다.","건강 상태는 하루의 수치보다 오랜 기간에 걸친 변화의 추세로 판단해야 한다.","체중이 정상 범위이면 건강에 문제가 없다고 볼 수 있다.","몸무게 외에 다양한 건강 지표를 함께 확인해야 한다."],"t":["반","세","-","비","상"],"r":["글은 매일 측정의 불필요한 걱정을 지적한다.","변동 원인은 근거 설명일 뿐이다.","개별 수치보다 추세가 중요하다는 결론이다.","정상 체중과 건강의 관계는 글에 없다.","다른 지표는 지문에 나오지 않는다."],"a":2,"n":119},{"lv":2,"ty":3,"tp":"건강","p":"Many people try to fix poor eating by following strict diets, but rigid rules often backfire. Forbidden foods become more tempting, and one slip can lead to giving up altogether. People who build flexible habits, such as eating more vegetables and allowing occasional treats, tend to keep healthy patterns longer. Instead of strict diets, we should aim for sustainable habits we can maintain for years.","k":"we should aim for sustainable habits we can maintain for years","c":["체중을 줄이려면 먹어서는 안 되는 음식의 목록을 분명히 정해야 한다.","가끔 간식을 먹는 것은 식단 관리 실패의 주된 원인이다.","엄격한 식단보다 오래 지속할 수 있는 건강한 식습관을 만들어야 한다.","채소를 많이 먹을수록 체중 감량 효과가 커진다.","식단 관리에 실패하면 이전보다 체중이 더 늘어난다."],"t":["반","비","-","부","상"],"r":["글은 금지 식품이 더 큰 유혹이 된다고 한다.","간식 허용은 오히려 권장된 습관이다.","지속 가능한 습관을 목표로 하라는 것이 주장이다.","채소는 습관의 예일 뿐이며 체중 감량 효과는 언급되지 않았다.","요요 현상은 지문에 없다."],"a":2,"n":120},{"lv":2,"ty":0,"tp":"언어","p":"People often say that a language dies when its last speaker dies, but the loss begins much earlier. When younger generations stop using a language at home, stories, jokes, and ways of seeing the world fade with it. Every language holds knowledge about local plants, weather, and history that no translation can fully preserve. Protecting endangered languages therefore means protecting a unique part of human understanding.","k":"Protecting endangered languages therefore means protecting a unique part of human understanding.","c":["the number of languages spoken around the world","the cultural knowledge lost when languages disappear","how translation technology preserves old languages","why young people prefer to speak English","the story of the last speaker of a language"],"t":["상","-","반","비","세"],"r":["전 세계 언어 수는 지문에 없다.","언어가 사라질 때 함께 잃는 문화적 지식이 핵심이다.","글은 번역이 다 보존하지 못한다고 한다.","영어 선호는 글에 없는 추측이다.","마지막 화자는 도입부 표현일 뿐이다."],"a":1,"n":121},{"lv":2,"ty":1,"tp":"심리","p":"Willpower is often described as a muscle that tires. Instead of relying on it, many people succeed by changing their surroundings so that good choices become easy. A person who wants to eat healthier keeps fruit on the counter and hides sweets in a high cupboard. Over time, repeated choices turn into habits that need little effort. Designing the environment, rather than fighting temptation, is a quiet but powerful strategy for lasting change.","k":"Designing the environment, rather than fighting temptation","c":["Make It Easy: Shaping Surroundings to Shape Habits","Willpower Is the Only Way to Change Your Habits for Good","Fruit and Sweets: A Healthy Eating Guide","Why Muscles Grow Tired After Exercise","Hiding Temptation: A Trick for Dieters"],"t":["-","반","세","상","부"],"r":["환경을 설계해 습관을 바꾼다는 핵심이다.","글은 의지력에만 의존하지 말라고 한다.","과일과 과자는 예시일 뿐이다.","운동 후 근육 피로는 비유와 무관하다.","유혹 숨기기는 환경 설계의 한 예일 뿐이다."],"a":0,"n":122},{"lv":2,"ty":2,"tp":"경제","p":"When a store marks a coat down from two hundred dollars to one hundred, shoppers feel they have saved a hundred dollars. But the saving is real only if they would have bought the coat at the original price. Original prices are often set high just to make discounts look larger. A bargain is defined by whether we needed the item and would pay the final price, not by how much was cut.","k":"A bargain is defined by whether we needed the item and would pay the final price","c":["할인율이 높은 상품일수록 가치 있는 구매이다.","진짜 할인인지는 할인 폭이 아니라 내가 그 물건이 필요하고 최종 가격을 낼 의향이 있는지로 판단해야 한다.","상점은 처음부터 가격을 낮게 책정하는 것이 바람직하다.","소비자는 필요하지 않은 물건을 사는 것을 피해야 한다.","정가가 높은 상품은 모두 할인을 목적으로 한다."],"t":["반","-","상","부","과"],"r":["글은 할인 폭에 현혹되지 말라고 한다.","할인율이 아니라 필요와 최종 가격이 기준이라는 결론이다.","상점의 책정 방식 개선은 글에 없다.","필요 여부만 말하고 최종 가격 기준이 빠졌다.","'모두'는 지나친 일반화이다."],"a":1,"n":123},{"lv":2,"ty":3,"tp":"경제","p":"Impulse purchases are rarely about need; they are about mood. A stressful day makes a quick purchase feel like a reward, but the satisfaction fades faster than the credit card bill. A simple waiting rule, such as delaying any non-essential purchase for twenty-four hours, lets the urge pass. Before buying something on impulse, we should wait a day and ask whether we still want it.","k":"we should wait a day and ask whether we still want it","c":["스트레스를 받았을 때에는 마음을 달래기 위해 소비로 기분을 전환하는 것이 가장 좋은 방법이다.","신용카드 대신 현금을 사용하면 충동구매가 사라진다.","충동적으로 물건을 사고 싶을 때에는 하루를 기다리며 여전히 원하는지 되물어야 한다.","필수품이 아닌 물건은 구매하지 않는 것이 바람직하다.","기다리는 시간을 정해 두면 소비 계획을 세우기 쉽다."],"t":["반","비","-","과","부"],"r":["글은 이런 소비의 만족이 곧 사라진다고 한다.","현금 사용의 효과는 글에 없다.","하루를 기다려 보라는 것이 주장이다.","글은 구매 금지가 아니라 하루 유예를 말한다.","소비 계획이 아니라 충동 억제가 목적이다."],"a":2,"n":124},{"lv":2,"ty":0,"tp":"예술","p":"A film score rarely gets the attention that actors and directors receive, yet it shapes how we feel about every scene. The same image of a quiet street can seem peaceful with soft strings or threatening with a low, steady hum. Audiences usually do not notice this influence, which is exactly why it works so well. Music in film operates quietly in the background, guiding emotion without announcing itself.","k":"Music in film operates quietly in the background","c":["the difficulty of composing background music for actors on a film set","the fame that film directors receive","the effect of soft strings on peaceful scenes","why audiences should always notice background music","the hidden power of music in guiding a film's emotions"],"t":["이","세","부","반","-"],"r":["배우를 위한 작곡은 다루지 않았다.","감독의 명성은 비교용 언급일 뿐이다.","현악기는 예시 하나일 뿐이다.","글은 관객이 알아채지 못해서 효과적이라고 한다.","영화 음악이 눈에 띄지 않게 감정을 이끈다는 내용이다."],"a":4,"n":125},{"lv":2,"ty":1,"tp":"사회","p":"Headlines are written to attract attention, and attention is often won with strong words. A study of news stories found that headlines with emotional language were shared far more often than neutral ones, even when the articles beneath them were identical. Readers who stop at the headline carry away a distorted impression. Reading beyond the first line is a small effort that protects us from being steered by a few carefully chosen words.","k":"Reading beyond the first line is a small effort","c":["The Art of Writing Powerful Headlines","Why Emotional Stories Are Always False","Newspapers and Their Daily Printing Process","Don't Stop at the Headline","Sharing News: A Pastime of the Young"],"t":["반","과","이","-","상"],"r":["글은 자극적 제목의 왜곡을 경계한다.","감정적 기사가 항상 거짓이라는 근거는 없다.","신문 인쇄 과정은 다루지 않았다.","제목만 읽지 말고 본문까지 읽자는 핵심이다.","젊은 층의 공유 습관은 지문에 없다."],"a":3,"n":126},{"lv":2,"ty":2,"tp":"기술","p":"Streaming platforms recommend what to watch based on our past choices, which seems helpful. But the same system keeps showing us things similar to what we already like, narrowing our tastes over time. Without effort, we may never encounter music or films that would have surprised us. Algorithms are good at giving us more of the same; discovering something new is still up to us.","k":"discovering something new is still up to us","c":["추천 알고리즘은 시청자가 과거에 선택한 내용을 바탕으로 사용자의 취향을 정확하게 반영해 준다.","스트리밍 서비스는 추천 기능을 폐지해야 한다.","과거의 선택이 미래의 취향을 결정한다.","추천 알고리즘은 취향을 좁힐 수 있으므로 새로운 것을 접하려는 노력은 우리 몫이다.","음악과 영화의 취향은 사람마다 다르다."],"t":["반","비","과","-","상"],"r":["글은 취향을 좁힌다고 비판한다.","폐지 주장은 글에 없다.","취향 결정론은 지나친 단정이다.","알고리즘이 비슷한 것만 보여 주므로 새로운 발견은 우리가 해야 한다는 결론이다.","취향의 다양성은 지문에 없다."],"a":3,"n":127},{"lv":2,"ty":3,"tp":"언어","p":"Reading in a foreign language is hard at first, and many learners reach for a dictionary at every unknown word. This breaks the flow and makes reading tiring. Research shows that learners absorb more vocabulary by reading widely and guessing meanings from context. Readers should resist the urge to look up every word and focus on grasping the overall meaning.","k":"resist the urge to look up every word","c":["외국어를 읽을 때에는 사전을 전혀 사용하지 않아야 한다.","초보 학습자는 쉬운 책부터 많이 읽어야 한다.","독해 속도가 빠를수록 어휘력이 높다.","모르는 단어는 문맥과 관계없이 외워야 한다.","외국어 독해 시 모든 단어를 찾아보기보다 전체 의미를 파악하는 데 집중해야 한다."],"t":["비","부","상","반","-"],"r":["'모든 단어'를 찾지 말라는 것이지 사전 금지가 아니다.","다독은 근거 중 하나이며 난이도 조언은 글에 없다.","속도와 어휘력의 관계는 지문에 없다.","글은 문맥으로 의미를 추측하라고 한다.","모든 단어를 찾지 말고 전체 의미에 집중하라는 주장이다."],"a":4,"n":128},{"lv":2,"ty":0,"tp":"환경","p":"Eating less meat is often presented as a personal sacrifice, but its environmental logic is simple. Raising animals for food requires far more land, water, and feed than growing plants that people can eat directly. Even a modest reduction in meat consumption by many people can significantly cut greenhouse gas emissions. The goal does not have to be strict vegetarianism; small shifts in what we eat, multiplied across millions of meals, can matter.","k":"small shifts in what we eat, multiplied across millions of meals, can matter","c":["environmental benefits of modest reductions in meat consumption","the nutritional risks of giving up meat entirely for people of every age","the need for everyone to become a strict vegetarian","the amount of land needed to raise farm animals","the growing popularity of plant-based restaurants"],"t":["-","상","반","세","이"],"r":["육류 소비를 조금만 줄여도 환경에 이롭다는 내용이다.","영양 문제는 지문에 없다.","글은 엄격한 채식이 목표일 필요가 없다고 한다.","토지 사용량은 근거로 든 세부 내용이다.","채식 식당의 인기는 언급되지 않았다."],"a":0,"n":129},{"lv":2,"ty":1,"tp":"과학","p":"A single ant is not especially clever, yet an ant colony solves complex problems such as finding the shortest path to food. Each ant follows simple rules and leaves a chemical trail; trails on shorter routes get reinforced because ants return faster. No leader gives orders, but the group behaves as if it were planning. Scientists study such systems to design robots and networks that cooperate without central control.","k":"No leader gives orders, but the group behaves as if it were planning.","c":["The Brilliant Mind of a Single Ant Working All Alone","Chemical Trails: A Language of Smell","How Robots Replace Human Workers","Why Ants Build Their Nests Underground","Simple Rules, Smart Colonies: Lessons from Ants"],"t":["반","세","비","상","-"],"r":["글은 개미 한 마리가 특별히 영리하지 않다고 한다.","화학 흔적은 작동 방식의 일부일 뿐이다.","로봇의 노동 대체는 글에 없는 비약이다.","개미집 위치는 지문에 없다.","단순한 규칙의 개미들이 똑똑한 집단을 이룬다는 내용이다."],"a":4,"n":130},{"lv":2,"ty":2,"tp":"과학","p":"Textbooks often present science as a list of established facts, which makes it seem finished. In practice, scientific knowledge is revised as new evidence appears, and yesterday's firm conclusions are sometimes overturned. This is not a weakness; it is the reason science improves. A claim deserves trust not because it can never change but because it is open to being tested and corrected.","k":"A claim deserves trust not because it can never change but because it is open to being tested and corrected.","c":["과학적 주장의 신뢰성은 변하지 않는다는 데 있지 않고 검증과 수정에 열려 있다는 데 있다.","과학 지식은 새로운 증거가 나오면 어제의 결론이 쉽게 부정되므로 믿을 만한 것이 못 되며 늘 의심해야 한다.","교과서의 내용은 과학적으로 검증되지 않은 것이다.","과학자들은 기존의 결론을 의심하는 태도를 가져야 한다.","과학의 발전 속도는 점점 빨라지고 있다."],"t":["-","과","반","부","이"],"r":["수정 가능성이 과학의 약점이 아니라 신뢰의 근거라는 결론이다.","'쉽게'는 글에 없는 과장이다.","교과서는 '확립된 사실'을 제시한다고 했다.","의심만 말하고 검증·수정의 의미가 빠졌다.","발전 속도는 글의 논점이 아니다."],"a":0,"n":131},{"lv":2,"ty":3,"tp":"과학","p":"Scientists often disagree in public, and some people take this as proof that science is unreliable. In fact, debate is how errors are found and ideas improved. What matters is that disagreements are settled by evidence rather than by authority or loudness. Citizens should not lose trust in science because experts argue, but should look at how the evidence is weighed.","k":"should not lose trust in science because experts argue","c":["과학자들은 대중의 신뢰를 잃지 않도록 공개적인 자리에서는 의견 충돌을 드러내지 않아야 한다.","전문가의 권위에 따라 과학적 논쟁의 옳고 그름을 판단해야 한다.","과학적 사실은 시간이 지나도 변하지 않는다.","과학자들 사이의 논쟁을 이유로 과학에 대한 신뢰를 잃어서는 안 된다.","시민들은 모든 과학 논쟁에 직접 참여해야 한다."],"t":["반","비","상","-","과"],"r":["글은 논쟁이 오류를 찾는 과정이라고 한다.","글은 권위가 아닌 증거로 판단하라고 한다.","지문에 근거가 없는 일반 통념이다.","논쟁이 있어도 과학을 불신하지 말라는 주장이다.","'모든 논쟁에 직접 참여'는 지나친 확대이다."],"a":3,"n":132},{"lv":2,"ty":0,"tp":"교육","p":"Reviewing notes the night before an exam feels productive, but cramming produces fragile memory. Research suggests that spreading study sessions across several days, with time to forget a little in between, makes recall stronger. Each time we struggle to remember something and succeed, the memory becomes easier to reach later. A little forgetting, followed by effort, is therefore part of learning rather than a failure of it.","k":"spreading study sessions across several days","c":["ways to take better notes during lectures","the harm of studying at night before exams","the importance of forgetting unnecessary information","benefits of spaced study over last-minute cramming","why spreading study over days takes too much time"],"t":["이","비","세","-","반"],"r":["필기 요령은 다루지 않았다.","문제는 '밤'이 아니라 벼락치기 방식이다.","망각은 과정의 일부로 언급될 뿐이다.","나누어 공부하는 방식이 벼락치기보다 낫다는 내용이다.","글은 분산 학습이 기억에 더 낫다고 한다."],"a":3,"n":133},{"lv":2,"ty":1,"tp":"예술","p":"Many adults believe they cannot draw, but drawing is mostly a matter of learning to see. Beginners draw what they think an object looks like, such as a symbol of an eye, rather than what is actually in front of them. Exercises that force close observation, like copying a picture upside down, quiet this habit. The skill that improves is not the hand but the way the artist looks.","k":"The skill that improves is not the hand but the way the artist looks.","c":["Born Artists: The Gift of a Steady Hand","Upside-Down Pictures in Modern Galleries","Drawing Begins with Seeing","The Many Uses of Symbols in Art","Why Adults Should Never Try to Draw"],"t":["반","세","-","상","과"],"r":["글은 손 기술이 핵심이 아니라고 한다.","거꾸로 모사는 연습의 한 예이다.","그림 실력은 손이 아니라 보는 방식에서 나온다는 내용이다.","미술 속 상징은 지문에 없다.","성인의 그림 금지는 극단적 비약이다."],"a":2,"n":134},{"lv":2,"ty":2,"tp":"예술","p":"Some visitors to galleries stand in front of a famous painting just long enough to take a photograph. The picture proves they were there, but it often replaces the experience of looking. Those who linger discover brushwork, color shifts, and details no photo captures. A work of art is meant to be met in person, and what we gain from it grows with the time we give.","k":"what we gain from it grows with the time we give","c":["미술관에서는 관람객이 작품을 제대로 감상할 수 있도록 사진 촬영을 전면 금지해야 한다.","유명한 작품일수록 오래 감상할 가치가 있다.","예술 작품에서 얻는 것은 직접 마주하며 들이는 시간에 비례해 커진다.","작품의 세부 표현은 사진으로 완벽하게 기록할 수 있다.","미술관 방문객은 작품에 대한 지식을 미리 쌓아야 한다."],"t":["비","과","-","반","상"],"r":["촬영 금지는 글에 없는 주장이다.","작품의 유명도와 감상 가치의 연결은 글에 없다.","머무는 시간만큼 얻는 것이 커진다는 결론이다.","사진은 세부를 담지 못한다고 했다.","사전 지식은 지문에 없다."],"a":2,"n":135},{"lv":2,"ty":3,"tp":"사회","p":"People often see public libraries as outdated in the age of the internet. But libraries offer what search engines cannot: quiet space, trained guidance, and equal access for people who cannot pay. They also serve as meeting places where neighbors cross paths. Communities should keep supporting public libraries as places of equal opportunity.","k":"keep supporting public libraries as places of equal opportunity","c":["인터넷이 발달해 정보를 쉽게 얻을 수 있으므로 공공 도서관은 점차 줄여 나가야 한다.","지역 사회는 공공 도서관을 평등한 기회의 공간으로 계속 지원해야 한다.","도서관은 이용자에게 소액의 이용료를 부과해야 한다.","도서관의 장서를 모두 전자책으로 대체해야 한다.","도서관은 이웃이 만나는 모임 장소로만 활용해야 한다."],"t":["반","-","상","비","부"],"r":["글은 도서관의 가치를 옹호한다.","도서관을 계속 지원하라는 것이 주장이다.","이용료 부과는 지문에 없다.","전자책 전환은 글에 없는 비약이다.","모임 장소는 기능 중 하나일 뿐이다."],"a":1,"n":136},{"lv":2,"ty":0,"tp":"사회","p":"Volunteering abroad is often described as a way to help poor communities, but critics point out problems. Short-term volunteers rarely have the skills the community needs, and their presence can take jobs away from local workers. Money spent on flights and housing might have achieved more if given directly to local organizations. Good intentions are not enough; helping well means asking what a community actually wants and listening before acting.","k":"Good intentions are not enough","c":["the joy of traveling to poor communities as a volunteer in another country","the skills volunteers should learn before going abroad","the need to examine whether overseas volunteering truly helps","the high cost of flights and housing abroad","the duty of rich countries to end world poverty"],"t":["반","부","-","세","비"],"r":["글은 해외 봉사의 문제점을 지적한다.","기술 부족은 문제점 중 하나일 뿐이다.","해외 봉사가 실제로 도움이 되는지 따져야 한다는 내용이다.","항공·숙박 비용은 근거로 든 세부 내용이다.","부유국의 의무는 글에서 비약된 주장이다."],"a":2,"n":137},{"lv":2,"ty":1,"tp":"환경","p":"Some conservationists argue that nature recovers best when people step back. In areas where farmland was abandoned and large animals returned, forests regrew, rivers cleaned themselves, and many species came back without direct planting or breeding programs. Rewilding is not free of risk, and it needs local support, but it shows that ecosystems often repair themselves when given space and time.","k":"ecosystems often repair themselves when given space and time","c":["Farmland: The Best Place for Wild Animals","Giving Nature Room to Heal","The Risks of Returning Predators to Cities","How to Plant a Forest in One Year","Humans: The Only Cure for Damaged Land"],"t":["반","-","부","이","과"],"r":["글은 농지가 버려진 곳에서 자연이 돌아온다고 한다.","자연이 공간과 시간을 주면 스스로 회복한다는 내용이다.","위험은 단서 조항일 뿐이며 도시는 언급되지 않았다.","조림 방법은 다루지 않았다.","글의 입장과 반대되는 극단적 단정이다."],"a":1,"n":138},{"lv":2,"ty":2,"tp":"언어","p":"Translation apps can now render a sentence in seconds, tempting many people to stop learning foreign languages. Yet apps handle words better than tone, humor, and cultural context, which are exactly where misunderstandings arise. A traveler who understands even a little of the local language gains trust that no device can provide. Technology can carry words across borders, but connection still depends on the effort to understand.","k":"connection still depends on the effort to understand","c":["번역 앱의 정확도가 점점 높아지고 있으므로 이제는 외국어 학습이 더 이상 필요 없어진다.","번역 기술이 발달해도 상대를 이해하려는 노력이 있어야 진정한 소통이 가능하다.","번역 앱은 어조와 유머를 번역하는 데 서툴다.","여행자는 현지 언어를 반드시 배우고 가야 한다.","문화적 맥락을 이해하면 번역 기술이 더욱 발전한다."],"t":["반","-","부","과","비"],"r":["글은 학습 중단을 경계한다.","기술이 단어를 옮겨도 소통은 이해하려는 노력에 달려 있다는 결론이다.","한계 지적이 근거일 뿐 요지는 노력의 필요성이다.","'반드시'는 지나친 단정이다.","기술 발전과의 연결은 글에 없다."],"a":1,"n":139},{"lv":2,"ty":3,"tp":"건강","p":"Screens before bedtime keep many people awake. The bright light delays the body's release of the hormone that signals sleep, and exciting content keeps the mind alert. People who stop using devices an hour before bed tend to fall asleep faster. We should turn off screens at least an hour before going to sleep.","k":"We should turn off screens at least an hour before going to sleep.","c":["잠들기 최소 한 시간 전에는 화면 기기의 사용을 멈추어야 한다.","수면 호르몬은 밝은 빛 아래에서 더 많이 분비되므로 밤에도 조명을 밝히는 것이 좋다.","자극적인 영상을 보지 않으면 불면증이 완전히 사라진다.","숙면을 위해서는 취침 전에 가벼운 운동을 해야 한다.","스마트폰의 밝기를 낮추면 수면의 질이 높아진다."],"t":["-","반","과","상","부"],"r":["취침 한 시간 전에는 화면을 끄라는 것이 주장이다.","글은 밝은 빛이 분비를 늦춘다고 한다.","'완전히 사라진다'는 과장이다.","운동은 지문에 없다.","밝기 조절은 글이 말한 해결책이 아니다."],"a":0,"n":140},{"lv":2,"ty":0,"tp":"기술","p":"Autocomplete and spell-check save time, but some researchers worry that they also weaken our own abilities. When software fixes every error automatically, writers may stop noticing patterns in their mistakes and so never learn from them. Tools that do a task for us can quietly replace the practice that builds skill. Technology is most useful when it supports effort rather than removing it.","k":"Technology is most useful when it supports effort rather than removing it.","c":["the time-saving advantages of using spell-check software when writing emails","how writers can avoid making spelling errors","the speed at which technology develops","the danger of all digital tools in education","technology that should support our effort, not replace it"],"t":["부","상","이","과","-"],"r":["장점은 도입부 양보 내용일 뿐이다.","맞춤법 오류 예방법은 지문에 없다.","기술 발전 속도는 다루지 않았다.","'모든 디지털 도구'를 위험시하는 과장이다.","기술이 노력을 대체하지 않고 돕는 역할을 해야 한다는 내용이다."],"a":4,"n":141},{"lv":2,"ty":1,"tp":"교육","p":"Speed-reading courses promise to double reading speed without losing understanding, but research is unimpressed. Eyes can only take in so many words at once, and comprehension drops when we rush. Good readers vary their pace, slowing down for difficult ideas and moving faster through familiar material. Learning to adjust speed to purpose is more valuable than chasing a single fast pace.","k":"Learning to adjust speed to purpose is more valuable than chasing a single fast pace.","c":["Speed-Reading: A Shortcut to Better Grades","How Eyes Move Across the Page","Why Slow Readers Are Always Smarter","Read at the Right Speed, Not the Fastest","The Best Books for Quick Reading"],"t":["반","세","과","-","이"],"r":["글은 속독 강좌에 회의적이다.","시선 이동은 근거 설명의 일부이다.","느린 독자가 항상 똑똑하다는 것은 과장이다.","목적에 맞게 속도를 조절하는 것이 중요하다는 내용이다.","속독용 도서는 다루지 않았다."],"a":3,"n":142},{"lv":2,"ty":2,"tp":"교육","p":"Students are often told to find their passion, as if it were hidden somewhere and needed only to be discovered. But interest usually grows through engagement: people become passionate about things after they begin to understand them and see progress. Waiting for a perfect calling can delay the very experiences that create enthusiasm. Passion is more often built through effort than found before it.","k":"Passion is more often built through effort than found before it.","c":["학생들은 자신이 좋아하는 일을 일찍 찾아야 한다.","관심이 없는 분야는 노력해도 열정이 생기지 않는다.","어떤 일을 이해하게 되면 진전을 느끼기 쉽다.","열정은 미리 발견되는 것이 아니라 노력하는 과정에서 만들어지는 경우가 많다.","진로를 선택할 때 가장 중요한 것은 적성이다."],"t":["반","비","부","-","상"],"r":["글은 미리 찾으려는 태도를 비판한다.","글과 정반대 방향의 비약이다.","근거 설명의 일부이며 요지가 아니다.","열정이 노력 이후에 생긴다는 결론이다.","적성은 지문에 나오지 않는다."],"a":3,"n":143},{"lv":2,"ty":3,"tp":"교육","p":"Students who seek help from teachers are sometimes seen as less capable. This view is mistaken: asking questions shows engagement. Yet in large classes, shy students may never speak up. Teachers should create several easy ways, such as written questions or short conversations after class, so that every student can ask for help without embarrassment.","k":"create several easy ways","c":["학생은 교사에게 질문하기 전에 책과 인터넷을 활용하여 스스로 답을 먼저 찾아야 한다.","교사는 모든 학생이 부담 없이 질문할 수 있도록 다양한 방법을 마련해야 한다.","소심한 학생은 발표 능력을 키우는 훈련을 받아야 한다.","질문을 많이 하는 학생에게는 가산점을 주어야 한다.","학급 규모가 클수록 학생들의 참여도가 낮아진다."],"t":["반","-","비","상","세"],"r":["글은 도움 요청을 긍정한다.","질문 방법을 다양하게 마련하라는 것이 주장이다.","학생 훈련이 아니라 교사의 방법 마련이 요지이다.","가산점은 지문에 없다.","큰 학급은 배경 설명일 뿐이다."],"a":1,"n":144},{"lv":2,"ty":0,"tp":"과학","p":"Coral reefs cover less than one percent of the ocean floor, yet they support about a quarter of all marine species. Their complex structures offer shelter, breeding grounds, and food for countless fish and invertebrates. When warming water causes corals to lose their color and die, the animals that depend on them lose their homes too. The fate of a few small organisms can therefore decide the health of an entire ocean community.","k":"The fate of a few small organisms can therefore decide the health of an entire ocean community.","c":["the causes of rising ocean temperatures worldwide","the colors and shapes of different coral species","the vital role of coral reefs in sustaining marine life","the effect of warming water on corals' color","the best places to go diving among coral reefs"],"t":["상","세","-","부","이"],"r":["수온 상승 원인은 지문에 없다.","색은 백화 현상 설명 속 세부 내용이다.","산호초가 해양 생물 다양성을 떠받친다는 내용이다.","산호 백화만 다루고 생태계 역할이 빠졌다.","다이빙 명소는 글과 무관하다."],"a":2,"n":145},{"lv":2,"ty":1,"tp":"사회","p":"People generally accept waiting in line when the rules are clear and applied to everyone. What upsets them is not the length of the wait but the sense that someone has cut ahead. Researchers studying customer satisfaction found that a fair, visible system makes waits feel shorter and more acceptable. Perceived fairness often matters more than actual speed.","k":"Perceived fairness often matters more than actual speed.","c":["The Fastest Way to Cut Waiting Times","Fair Lines, Calmer Minds","Why Everyone Hates Standing in Line","Customer Service Jobs in Busy Shops","Cutting in Line: A Sign of Success"],"t":["반","-","부","이","비"],"r":["글은 속도보다 공정성이 중요하다고 한다.","공정하다고 느끼면 기다림도 받아들인다는 내용이다.","불만의 원인 중 새치기만 다루고 해결 관점이 없다.","서비스직은 다루지 않았다.","새치기를 성공의 표시로 보는 것은 근거 없는 비약이다."],"a":1,"n":146},{"lv":2,"ty":2,"tp":"사회","p":"Cities that remove cars from central streets often face protests from shop owners fearing lost business. Yet studies of pedestrian zones in many cities show that shoppers on foot visit more often and spend more over time than drivers who pass through quickly. A street full of walkers is a street full of customers. Fears about change are understandable, but evidence suggests that people-friendly streets can help local business.","k":"people-friendly streets can help local business","c":["도심의 중심 거리에서는 보행자의 안전을 위해 자동차의 진입을 전면적으로 금지해야 한다.","상점 주인들의 반대는 근거 없는 두려움에서 나온다.","걸어 다니는 사람은 운전자보다 쇼핑을 더 즐긴다.","보행자 거리를 만들려면 상인과 충분히 대화해야 한다.","보행자 중심 거리는 오히려 지역 상권에 도움이 될 수 있다."],"t":["비","과","세","상","-"],"r":["전면 금지는 글에 없는 주장이다.","글은 우려가 이해할 만하다고 했다.","방문 빈도와 소비 근거를 만족도로 바꾼 세부 변형이다.","대화 과정은 지문에 없다.","차 없는 거리가 상권에 이롭다는 연구 결과가 핵심이다."],"a":4,"n":147},{"lv":2,"ty":3,"tp":"사회","p":"Many workplaces expect employees to respond to messages at all hours. Always being reachable blurs the line between work and rest, and people who never disconnect burn out sooner. Studies link recovery time to better performance. Companies should respect employees' time off by setting clear limits on after-hours communication.","k":"setting clear limits on after-hours communication","c":["기업은 퇴근 후 연락에 분명한 한계를 두어 직원의 휴식 시간을 존중해야 한다.","직원은 근무 시간 외에도 메시지에 즉시 응답하는 태도를 가져야 한다.","재택근무를 하는 직원에게는 연락 횟수를 줄여야 한다.","탈진을 겪는 직원은 장기 휴직을 사용해야 한다.","성과가 높은 직원에게는 추가 휴가를 주어야 한다."],"t":["-","반","부","상","비"],"r":["퇴근 후 연락에 한계를 두라는 것이 주장이다.","글이 비판하는 관행이다.","재택근무자만 대상으로 좁힌 범위이다.","휴직은 지문에 없다.","성과 보상은 글에 없는 비약이다."],"a":0,"n":148},{"lv":2,"ty":0,"tp":"심리","p":"Boredom has a bad reputation, yet it may serve a purpose. When nothing demands our attention, the mind begins to wander, linking memories and ideas in unexpected ways. Many writers and inventors report their best ideas arriving during dull moments such as walks or showers. If we fill every spare second with our phones, we deny ourselves this quiet space. Allowing ourselves to be bored may be a way to make room for creativity.","k":"Allowing ourselves to be bored may be a way to make room for creativity.","c":["how to stay entertained during long walks","the creative value of letting the mind wander","the habit of getting ideas while taking showers","why writers prefer dull jobs","the ways boredom ruins our concentration"],"t":["이","-","세","비","반"],"r":["산책 중 즐길 거리는 다루지 않았다.","마음이 방황하는 지루함이 창의성의 공간이 된다는 내용이다.","샤워는 예시 중 하나이다.","지루한 직업 선호는 근거 없는 추론이다.","글은 지루함의 긍정적 기능을 말한다."],"a":1,"n":149},{"lv":2,"ty":1,"tp":"건강","p":"Handwashing may seem too ordinary to matter, but it is among the most effective ways to prevent disease. Germs picked up from door handles and shared objects enter the body when we touch our faces. Washing with soap for about twenty seconds removes most of them. Public health campaigns that encourage this habit have reduced infections in schools and hospitals more than many expensive treatments.","k":"among the most effective ways to prevent disease","c":["Small Habit, Big Protection: The Power of Handwashing","Door Handles: The Dirtiest Places in Schools","Expensive Treatments for Common Infections","Why Soap Is Better Than Water","Handwashing Prevents Every Disease"],"t":["-","세","반","상","과"],"r":["손 씻기가 질병 예방에 큰 효과가 있다는 내용이다.","문손잡이는 세균 경로의 한 예일 뿐이다.","글은 비싼 치료보다 손 씻기가 낫다고 한다.","비누와 물의 비교는 지문에 없다.","'모든 질병'은 지나친 과장이다."],"a":0,"n":150},{"lv":2,"ty":2,"tp":"심리","p":"After a setback, many people replay the event in their minds, searching for what went wrong. A little reflection can teach lessons, but endless replaying keeps us stuck in the same feelings. Psychologists suggest asking one question instead: what can I do differently next time? Turning from dwelling on the past to planning the next step is what helps people recover.","k":"Turning from dwelling on the past to planning the next step is what helps people recover.","c":["실패한 일은 마음의 상처가 깊어지기 전에 되도록 빨리 잊어버리고 새로운 일을 시작하는 것이 좋다.","실패 후에는 과거를 곱씹기보다 다음에 할 수 있는 행동을 계획하는 것이 회복에 도움이 된다.","실패의 원인을 분석하는 일은 시간 낭비이다.","회복이 빠른 사람은 낙관적인 성격을 지녔다.","심리학자의 조언을 따르면 모든 실패를 극복할 수 있다."],"t":["반","-","과","상","비"],"r":["글은 약간의 성찰이 교훈을 준다고 인정한다.","곱씹기에서 다음 단계 계획으로 전환하는 것이 회복의 핵심이라는 내용이다.","분석 자체를 부정하는 과장이다.","성격과 회복의 관계는 지문에 없다.","모든 실패의 극복은 근거 없는 비약이다."],"a":1,"n":151},{"lv":2,"ty":3,"tp":"경제","p":"News about the economy often focuses on dramatic daily swings in the stock market. For most savers, though, these movements matter little compared with steady contributions over decades. Reacting to every headline by buying and selling usually lowers returns. Long-term investors should ignore daily fluctuations and stay committed to a consistent plan.","k":"ignore daily fluctuations and stay committed to a consistent plan","c":["주가가 크게 하락하면 더 큰 손실을 막기 위해 보유하고 있는 주식을 가능한 한 빨리 모두 팔아야 한다.","경제 뉴스는 투자 판단에 도움이 되지 않으므로 보지 말아야 한다.","수십 년 동안 꾸준히 저축하면 반드시 큰 수익을 얻는다.","주식 시장의 변동 원인을 정확히 분석해야 투자에 성공한다.","장기 투자자는 일일 변동에 흔들리지 말고 꾸준한 투자 계획을 지켜야 한다."],"t":["반","비","과","상","-"],"r":["글은 뉴스에 반응한 매매가 수익을 낮춘다고 한다.","뉴스 차단은 글에 없는 비약이다.","'반드시'는 지나친 단정이다.","변동 원인 분석은 지문에 없다.","일일 변동을 무시하고 꾸준히 투자하라는 주장이다."],"a":4,"n":152},{"lv":2,"ty":0,"tp":"사회","p":"Green spaces in cities are often seen as decoration, yet they improve public life in measurable ways. Residents living near parks exercise more, report lower stress, and know more of their neighbors. Parks also give children a safe place to play without cost. Because these benefits reach everyone regardless of income, well-kept parks can narrow the gap between rich and poor neighborhoods.","k":"well-kept parks can narrow the gap between rich and poor neighborhoods","c":["the decorative role of green spaces in the design of modern cities","the exercise habits of people living near parks","the cost of maintaining public parks","social benefits that urban parks bring to all residents","why rich neighborhoods have better parks"],"t":["반","부","상","-","비"],"r":["글은 공원이 장식 이상이라고 반박한다.","운동은 이점 중 하나일 뿐이다.","유지 비용은 지문에 없다.","공원이 모든 주민에게 주는 사회적 이점이 핵심이다.","부유한 동네의 공원 수준은 글에 없다."],"a":3,"n":153},{"lv":2,"ty":1,"tp":"기술","p":"Online reviews help shoppers decide, but they are less reliable than they appear. People who write reviews tend to be those with very positive or very negative experiences, so the average score may not reflect the typical customer. Some reviews are even written or paid for by sellers. Reading a few detailed reviews, especially mixed ones, usually gives a more honest picture than looking at the star rating alone.","k":"Reading a few detailed reviews, especially mixed ones","c":["Online Reviews: The Perfect Guide for Shoppers","How Sellers Pay Customers for Positive Comments","The Rise of Online Shopping Around the World","Why Customers Never Write Reviews","Beyond the Stars: Reading Online Reviews Wisely"],"t":["반","세","상","과","-"],"r":["글은 후기의 신뢰성 문제를 지적한다.","판매자의 매수는 문제점의 한 예이다.","온라인 쇼핑의 성장은 지문에 없다.","'절대 쓰지 않는다'는 지나친 단정이다.","별점에 의존하지 말고 후기를 비판적으로 읽자는 내용이다."],"a":4,"n":154},{"lv":2,"ty":2,"tp":"건강","p":"Many people think a good night's sleep means going to bed early after a late-night weekend. But irregular sleep schedules disturb the body clock, so making up for lost sleep on weekends often leaves people tired on Monday. Going to bed and waking up at similar times every day helps the body settle into a rhythm. For better sleep, consistency counts more than catching up.","k":"consistency counts more than catching up","c":["주말에 부족한 잠을 몰아서 충분히 자 두면 평일에 쌓인 피로가 말끔하게 해소될 수 있다.","수면 시간은 개인마다 다르므로 정해진 기준이 없다.","월요일 아침에 피곤한 것은 주말의 늦잠 때문이다.","숙면을 위해서는 몰아서 자는 것보다 매일 일정한 수면 시간을 지키는 것이 중요하다.","일찍 자는 습관은 신체 리듬을 깨뜨린다."],"t":["반","상","세","-","비"],"r":["글이 반박하는 통념이다.","개인차는 지문에 없다.","월요일 피로는 근거 사례로 쓰인 세부 내용이다.","보충 수면보다 규칙성이 중요하다는 결론이다.","일찍 자기가 해롭다는 말은 아니다."],"a":3,"n":155},{"lv":2,"ty":3,"tp":"환경","p":"Some people hesitate to adopt eco-friendly habits because they fear they will not do them perfectly. But environmental progress does not require perfection; it requires many imperfect efforts. A person who reduces waste most of the time does far more good than one who gives up after a single failure. We should value steady, imperfect effort over the pursuit of perfection.","k":"value steady, imperfect effort over the pursuit of perfection","c":["친환경 실천은 완벽하게 해낼 수 없다면 어설프게 시도하기보다 차라리 하지 않는 편이 낫다.","한 번 실천에 실패한 사람은 다시 시도하지 않아야 한다.","환경을 위한 실천은 완벽함을 추구하기보다 꾸준하고 부족하더라도 이어 가야 한다.","쓰레기를 줄이는 것이 환경 보호의 가장 중요한 방법이다.","친환경 제품은 가격이 높더라도 반드시 구입해야 한다."],"t":["반","비","-","과","상"],"r":["글이 비판하는 태도이다.","글은 포기하지 말라고 한다.","완벽함보다 꾸준한 노력을 중시하라는 주장이다.","쓰레기 감축은 예시이며 '가장 중요'는 과장이다.","친환경 제품 구매는 지문에 없다."],"a":2,"n":156},{"lv":2,"ty":0,"tp":"경제","p":"A product's price rarely reflects what it truly costs society. A cheap shirt may hide low wages, polluted rivers, and long shipping routes that nobody pays for at the checkout. Economists call these hidden burdens external costs. When consumers learn to see them, they can compare products more honestly. Understanding what lies behind a price tag is the first step toward spending more responsibly.","k":"A product's price rarely reflects what it truly costs society.","c":["hidden social costs that low prices do not show","the reasons cheap shirts are popular among consumers","the working conditions of garment factory employees","how economists calculate the price of products","the need to boycott every inexpensive product"],"t":["-","상","세","이","과"],"r":["가격에 드러나지 않는 사회적 비용이 핵심이다.","싼 옷이 인기 있는 이유는 지문에 없다.","낮은 임금은 숨은 비용의 한 예일 뿐이다.","가격 산정 방식은 다루지 않았다.","모든 저가 상품 불매는 극단적 확대이다."],"a":0,"n":157},{"lv":2,"ty":1,"tp":"문화","p":"Food is more than nourishment; it carries memory. Recipes passed down through families preserve the tastes of places people have left behind. Immigrants often cook familiar dishes as a way to feel at home, and in doing so they share their culture with neighbors who taste it for the first time. A shared meal can therefore build understanding more quickly than speeches.","k":"A shared meal can therefore build understanding more quickly than speeches.","c":["The Nutritional Value of Traditional Family Recipes Around the World","Why Immigrants Refuse to Try New Foods","Dishes That Carry Memory and Connect Cultures","Speeches at Family Dinners","Cooking: The Only Way to Understand Others"],"t":["상","반","-","세","과"],"r":["전통 요리의 영양은 지문에 없다.","글은 이민자가 고향 음식을 나누며 이해를 넓힌다고 한다.","음식이 기억을 담고 문화를 이어 준다는 내용이다.","연설은 비교 대상으로 나온 말일 뿐이다.","'유일한 방법'은 지나친 단정이다."],"a":2,"n":158},{"lv":2,"ty":2,"tp":"경제","p":"Many people hold on to stocks or projects that are losing money because they have already invested so much. This pull, known as the sunk cost fallacy, makes past spending feel like a reason to continue. But money already spent cannot be recovered whatever we choose next. Wise decisions are based on future costs and benefits, not on what has already been lost.","k":"Wise decisions are based on future costs and benefits, not on what has already been lost.","c":["손실이 나는 투자는 더 큰 피해를 막기 위해 어떤 경우에도 즉시 정리하는 것이 항상 옳다.","이미 투자한 시간과 돈은 의사 결정에서 중요한 근거가 된다.","합리적인 결정은 이미 쓴 비용이 아니라 앞으로의 비용과 이익을 기준으로 내려야 한다.","주식 투자는 장기적으로 이익을 얻기 어렵다.","사람들은 손실을 이익보다 더 크게 느낀다."],"t":["과","반","-","비","상"],"r":["글은 '항상'을 주장하지 않는다.","글이 비판하는 태도이다.","매몰 비용에 얽매이지 말고 미래를 기준으로 결정하라는 결론이다.","투자 전망은 글에 없다.","손실 회피 성향은 지문 밖 지식이다."],"a":2,"n":159},{"lv":2,"ty":3,"tp":"사회","p":"Online comment sections often fill with hostile remarks that people would never say face to face. Anonymity makes cruelty feel free of consequences. Yet words wound readers regardless of the screen between them. Before posting a comment, we should ask whether we would say it to the person's face.","k":"ask whether we would say it to the person's face","c":["악성 댓글을 막기 위해서는 인터넷 공간에서 익명으로 댓글을 쓰는 것을 법으로 강력하게 금지해야 한다.","온라인 공간에서는 표현의 자유가 최대한 보장되어야 한다.","댓글을 쓰는 사람은 실명을 사용하는 것이 바람직하다.","온라인에 댓글을 달기 전에 그 말을 상대 앞에서도 할 수 있는지 스스로 물어야 한다.","악성 댓글은 읽지 않는 것이 가장 좋은 대응이다."],"t":["비","반","부","-","상"],"r":["익명 금지는 글에 없는 비약이다.","글은 무분별한 표현의 해로움을 지적한다.","실명 사용은 해결책 중 하나로 제시되지 않았다.","댓글을 쓰기 전에 상대 앞에서도 할 말인지 물으라는 주장이다.","대응 방법은 지문에 없다."],"a":3,"n":160},{"lv":2,"ty":0,"tp":"언어","p":"Learning idioms is often a frustrating part of studying a foreign language because their meanings cannot be guessed from the words alone. Yet idioms reveal how people of a culture picture the world, using images from farming, sailing, or the weather. Students who learn them as little stories rather than word lists tend to remember them more easily. Treating idioms as windows into a culture makes them easier to learn and more enjoyable.","k":"Treating idioms as windows into a culture makes them easier to learn and more enjoyable.","c":["the frustration of memorizing long lists of idioms for foreign language exams","the origin of idioms taken from sailing","learning idioms through the cultural images behind them","the importance of guessing meanings from single words","why foreign languages are harder than native ones"],"t":["세","부","-","반","상"],"r":["좌절감은 도입부의 양보 내용이다.","항해는 이미지의 예시일 뿐이다.","관용구를 문화적 이미지와 함께 배우면 쉽다는 내용이다.","글은 단어만으로 뜻을 추측할 수 없다고 한다.","외국어와 모국어의 난이도 비교는 지문에 없다."],"a":2,"n":161},{"lv":2,"ty":1,"tp":"경제","p":"Apps that connect drivers, delivery workers, and customers have created flexible jobs for millions. Workers can choose their hours, but they often lack benefits such as health insurance, paid leave, and stable income. Supporters see freedom; critics see insecurity. The question is not whether such work is good or bad, but how rules can preserve its flexibility while giving workers basic protections.","k":"how rules can preserve its flexibility while giving workers basic protections","c":["Delivery Apps: The Easiest Way for Anyone to Get Rich Quickly","Health Insurance Costs for Office Workers","Why Flexible Hours Make Workers Happy","The Complete Failure of Online Jobs","Flexible Work, Fair Protection: Rethinking the Gig Economy"],"t":["반","이","부","과","-"],"r":["글은 소득 불안정을 지적한다.","사무직 보험료는 다루지 않았다.","유연성만 다루고 보호 문제가 빠졌다.","'완전한 실패'는 글의 균형 잡힌 입장과 어긋난다.","유연성과 최소한의 보호를 함께 고민해야 한다는 내용이다."],"a":4,"n":162},{"lv":2,"ty":2,"tp":"기술","p":"A smartphone with a hundred features can feel powerful, yet people usually rely on only a handful. Designers have found that adding features often makes products harder to use, as each new option competes for attention. The most loved tools tend to do a few things exceptionally well. In design, restraint is often what turns a product from impressive into usable.","k":"restraint is often what turns a product from impressive into usable","c":["제품 설계에서는 기능을 늘리기보다 절제하는 것이 사용성을 높인다.","기능이 많은 제품일수록 소비자의 만족도가 높다.","스마트폰 사용자는 대부분의 기능을 활용하지 못한다.","디자이너는 사용자의 의견을 먼저 들어야 한다.","모든 제품은 한 가지 기능만 가져야 한다."],"t":["-","반","부","상","과"],"r":["절제가 제품을 '인상적'에서 '쓸 만한' 것으로 바꾼다는 결론이다.","글이 반박하는 통념이다.","근거 현상일 뿐 설계 원칙이라는 요지가 빠졌다.","사용자 의견 수렴은 지문에 없다.","'한 가지만'은 지나친 극단화이다."],"a":0,"n":163},{"lv":2,"ty":3,"tp":"심리","p":"Perfectionists believe that high standards lead to excellence, but perfectionism often has the opposite effect. Fear of falling short makes people delay starting, avoid risks, and judge themselves harshly. Better results usually come from finishing something imperfect and improving it. Rather than waiting until it is flawless, we should complete work and refine it step by step.","k":"complete work and refine it step by step","c":["높은 기준을 세우는 것은 결국 일의 진행을 늦추고 성과를 높이는 데 방해가 될 뿐이다.","실패의 위험이 있는 일은 하지 않는 것이 가장 안전하다.","자신을 비판하는 일은 정신 건강에 해롭다.","일을 시작하기 전에 충분히 계획을 세워야 한다.","완벽해질 때까지 기다리기보다 일단 완성하고 조금씩 다듬어 가야 한다."],"t":["과","반","비","상","-"],"r":["글은 '완벽주의'를 문제 삼지 높은 기준 자체를 부정하지 않는다.","글은 위험 회피를 문제로 본다.","자기비판 일반으로 확대한 비약이다.","철저한 사전 계획은 글과 어긋난다.","일단 완성하고 단계적으로 다듬으라는 주장이다."],"a":4,"n":164},{"lv":2,"ty":0,"tp":"환경","p":"Fixing a broken appliance has become unusual; most people simply buy a new one. Yet repair extends the life of products, keeps materials out of landfills, and saves the energy used in manufacturing replacements. Some regions now require companies to make spare parts and repair guides available. Treating repair as a normal choice rather than a last resort could reduce waste considerably.","k":"Treating repair as a normal choice rather than a last resort could reduce waste considerably.","c":["the energy costs of running household appliances","laws that force companies to sell spare parts","why people buy a new appliance whenever one breaks","repair as a practical way to cut waste","the end of manufacturing new products"],"t":["이","세","부","-","과"],"r":["가전 가동 비용은 다루지 않았다.","부품 판매 규정은 부가 설명이다.","새 제품 구매의 원인만 다룬 도입부 내용이다.","수리를 일상적 선택으로 삼아 쓰레기를 줄이자는 내용이다.","신제품 제조 중단은 극단적 확대이다."],"a":3,"n":165},{"lv":2,"ty":1,"tp":"언어","p":"In some cultures, pauses in conversation are a sign of respect and thought; in others, silence feels awkward and is quickly filled. These differences can cause misunderstandings: a speaker who waits to reply may seem uninterested to one partner and thoughtful to another. Recognizing that silence carries different meanings helps us avoid judging others by our own conversational habits.","k":"Recognizing that silence carries different meanings","c":["The Many Meanings of Silence Across Cultures","How to Fill Every Pause in a Conversation with Friends","Awkward Moments at Business Meetings","Silence as a Sign of Respect","Why Silence Is Rude in Every Language"],"t":["-","반","이","부","과"],"r":["문화마다 침묵의 의미가 다르다는 내용이다.","글은 침묵을 채우라고 하지 않는다.","업무 회의는 다루지 않았다.","존중의 의미만 다루어 다른 문화의 해석이 빠졌다.","'모든 언어'에서 무례하다는 것은 과장이다."],"a":0,"n":166},{"lv":2,"ty":2,"tp":"환경","p":"Many cities proudly collect recyclables, but a surprising share is rejected because it is contaminated with food or the wrong materials. A single greasy pizza box can spoil a batch of clean paper. Well-meant but careless recycling can therefore do more harm than good. For recycling to work, how carefully we sort matters as much as how willingly we participate.","k":"how carefully we sort matters as much as how willingly we participate","c":["재활용품은 오염되었더라도 분리 배출의 의지를 보이기 위해 일단 모아서 배출하는 것이 좋다.","재활용이 제 효과를 내려면 참여의 의지뿐 아니라 올바르게 분리하는 정확성도 중요하다.","피자 상자는 재활용이 불가능한 폐기물이다.","재활용을 하지 않는 것이 환경에 더 이롭다.","도시마다 재활용 분리 기준을 통일해야 한다."],"t":["반","-","세","과","상"],"r":["오염된 재활용품은 오히려 해가 된다고 했다.","참여만큼 올바른 분리도 중요하다는 결론이다.","피자 상자는 예시이며 종이 자체는 재활용 대상이다.","글은 재활용 중단을 말하지 않는다.","기준 통일은 지문에 없다."],"a":1,"n":167},{"lv":2,"ty":3,"tp":"교육","p":"Some argue that students should always learn from the best teacher available, even by video. Yet learning also depends on relationships: a teacher who knows a student's strengths can adapt and encourage in ways a recording cannot. Technology can extend good teaching, but it cannot replace the attention of someone who knows the learner. Schools should use video lessons to support, not replace, personal teaching.","k":"to support, not replace, personal teaching","c":["학생들은 가장 뛰어난 교사의 영상 수업만 들어야 한다.","교사는 시험을 통해 학생의 강점과 약점을 파악해야 한다.","학교는 영상 수업을 교사의 개별 지도를 대체하지 않고 보완하는 용도로 활용해야 한다.","영상 수업은 대면 수업보다 학습 효과가 항상 낮다.","교사는 새로운 교육 기술을 의무적으로 배워야 한다."],"t":["반","부","-","과","상"],"r":["글이 소개한 주장을 반박한다.","강점 파악은 근거 중 일부이며 시험은 언급되지 않았다.","영상 수업은 대면 지도를 보완하는 수단이라는 주장이다.","글은 보완의 가치를 인정하므로 '항상 낮다'는 과장이다.","교사의 기술 교육은 지문에 없다."],"a":2,"n":168},{"lv":2,"ty":0,"tp":"심리","p":"People who describe themselves as 'bad at math' often trace the belief to a single embarrassing moment in school. Such labels can become self-fulfilling: believing we lack ability, we avoid practice, and so we stop improving. Research on learning shows that skills respond to effort and good instruction far more than most people assume. Changing the story we tell about ourselves can open possibilities we had closed.","k":"Changing the story we tell about ourselves can open possibilities we had closed.","c":["how embarrassing moments in school are quickly forgotten by most students later","the best methods of teaching math to children","the biological reasons some people dislike math","the habit of describing oneself as unskilled","the limiting effect of negative beliefs about our own ability"],"t":["반","이","상","부","-"],"r":["글은 그 기억이 믿음으로 남는다고 한다.","수학 교수법은 다루지 않았다.","수학을 싫어하는 생물학적 이유는 지문에 없다.","습관만 언급하고 그 결과(가능성 차단)가 빠졌다.","스스로에 대한 부정적 믿음이 가능성을 가로막는다는 내용이다."],"a":4,"n":169},{"lv":2,"ty":1,"tp":"심리","p":"Nostalgia is often dismissed as a longing for a past that never was, but psychologists find it can be helpful. Recalling warm memories makes people feel more connected to others and more optimistic about the future. It can ease loneliness during hard times by reminding us that we have been loved. Used thoughtfully, looking back can give us strength to move forward.","k":"looking back can give us strength to move forward","c":["Living in the Past: A Certain Path to Failure and Regret Later","Warm Memories of Childhood Summers","Looking Back to Move Forward: The Strength of Nostalgia","The Science of How Memories Fade","Nostalgia Cures Every Kind of Loneliness"],"t":["반","세","-","상","과"],"r":["글은 향수의 긍정적 효과를 말한다.","어린 시절 여름은 글에 없다.","추억이 앞으로 나아갈 힘을 준다는 내용이다.","기억의 소멸 과정은 지문에 없다.","'모든 외로움'을 치유한다는 것은 과장이다."],"a":2,"n":170},{"lv":2,"ty":2,"tp":"사회","p":"Neighbors in many apartment buildings do not know each other, and the silence feels normal. Yet when a building organizes a small event such as a shared meal or a repair day, residents report feeling safer and more at home. These small occasions give people a reason to meet without awkwardness. Community rarely arises on its own; it is usually built through simple, repeated shared activities.","k":"it is usually built through simple, repeated shared activities","c":["공동체는 저절로 생기기보다 소소하고 반복적인 공동 활동을 통해 만들어진다.","아파트 주민들은 사생활을 보호하기 위해 서로 간섭하지 않고 지내는 것이 가장 편안하다.","큰 행사를 열수록 이웃 간의 유대가 깊어진다.","공동 식사는 이웃 관계를 개선하는 최선의 방법이다.","주민들의 안전을 위해 보안 시설을 강화해야 한다."],"t":["-","반","과","세","상"],"r":["공동체는 반복되는 공동 활동으로 만들어진다는 결론이다.","글은 교류가 안정감을 준다고 한다.","글은 '작은' 행사를 말했다.","공동 식사는 예시이며 '최선'은 과장이다.","보안 시설은 지문에 없다."],"a":0,"n":171},{"lv":2,"ty":3,"tp":"사회","p":"Cities grow when people feel safe walking at night. Good lighting, active storefronts, and busy sidewalks make streets safer than cameras alone. Empty, dark spaces invite trouble, while lively ones discourage it. To improve safety, cities should design streets that keep people present rather than relying only on surveillance.","k":"design streets that keep people present rather than relying only on surveillance","c":["도시는 감시 장치에만 의존하지 말고 사람들이 머물고 오가는 거리를 설계해야 한다.","범죄 예방을 위해서는 도시의 모든 거리와 골목에 감시 카메라를 빠짐없이 설치해야 한다.","밤에는 시민들이 외출을 자제하는 것이 안전하다.","상점은 영업시간을 늘려 매출을 높여야 한다.","도시는 가로등의 밝기를 자주 점검해야 한다."],"t":["-","과","반","이","부"],"r":["사람이 있는 거리를 설계하라는 것이 주장이다.","글은 카메라만으로는 부족하다고 한다.","글은 밤에 걷기 안전한 도시를 목표로 한다.","매출 증대는 글의 논점이 아니다.","조명은 설계 요소 중 하나일 뿐이다."],"a":0,"n":172},{"lv":2,"ty":0,"tp":"사회","p":"Cash gifts at weddings and holidays seem thoughtless to some, yet many recipients prefer them. A gift chosen with love may still go unused, while money lets people buy exactly what they need. Researchers find that givers often overestimate how much the personal touch matters to the receiver. Good gift-giving, then, depends less on the giver's effort than on the receiver's wishes.","k":"Good gift-giving, then, depends less on the giver's effort than on the receiver's wishes.","c":["the thoughtfulness shown by handmade presents compared with gifts bought in stores","the importance of considering what receivers actually want","the tradition of giving money at weddings","how to save money when buying holiday gifts","why cash is always the best gift"],"t":["반","-","세","이","과"],"r":["글은 정성보다 받는 이의 바람을 강조한다.","선물은 주는 이의 노력보다 받는 이의 바람이 중요하다는 내용이다.","결혼식 축의금은 예시일 뿐이다.","선물 비용 절약은 다루지 않았다.","'언제나 최고'는 지나친 일반화이다."],"a":1,"n":173},{"lv":2,"ty":
