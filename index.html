<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<title>하루 3문제 · 수능 대의파악 400 (겹침)</title>
<style>
:root{
  --bg:#f4f3fb; --bg2:#ebe9f8; --card:#ffffff; --ink:#1d1b3a; --sub:#6b6890; --line:#e4e1f4;
  --acc:#5b5bd6; --acc2:#8a63f0; --acc-soft:#eceaff; --ok:#12a97a; --ok-soft:#dcf7ee; --bad:#e5484d; --bad-soft:#fde8e9;
  --hint:#f59e0b; --hint-soft:#fff4d9; --shadow:0 10px 30px rgba(70,60,160,.12); --mark:#ffe58a;
  --r:20px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12112a; --bg2:#1a1938; --card:#1f1e40; --ink:#ecebff; --sub:#a29fcb; --line:#33316a;
    --acc:#8e8cff; --acc2:#b28cff; --acc-soft:#2c2b5c; --ok:#3ad6a3; --ok-soft:#12372f; --bad:#ff7a7f; --bad-soft:#3d1d27;
    --hint:#fbbf24; --hint-soft:#3a2f10; --shadow:0 10px 30px rgba(0,0,0,.4); --mark:#7a6512;
  }
}
:root[data-theme="dark"]{
  --bg:#12112a; --bg2:#1a1938; --card:#1f1e40; --ink:#ecebff; --sub:#a29fcb; --line:#33316a;
  --acc:#8e8cff; --acc2:#b28cff; --acc-soft:#2c2b5c; --ok:#3ad6a3; --ok-soft:#12372f; --bad:#ff7a7f; --bad-soft:#3d1d27;
  --hint:#fbbf24; --hint-soft:#3a2f10; --shadow:0 10px 30px rgba(0,0,0,.4); --mark:#7a6512;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));color:var(--ink);
  font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
.pad-top{padding-top:max(14px,env(safe-area-inset-top))}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 10px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:0 2px 8px rgba(70,60,160,.1);display:grid;place-items:center;font-size:17px}
.top .ttl{flex:1;text-align:center;font-weight:800;font-size:15px}
.top .ttl small{display:block;font-weight:600;color:var(--sub);font-size:11px;letter-spacing:.02em}
.dots{display:flex;gap:6px;justify-content:center;padding:0 16px 8px}
.dot{height:6px;flex:1;max-width:70px;border-radius:6px;background:var(--line);transition:.3s}
.dot.on{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.chip.lv{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.chip.tp{background:var(--bg2);color:var(--sub)}

/* question */
.qcard{background:var(--card);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.qs{font-weight:800;font-size:15.5px;margin:0 0 10px;letter-spacing:-.01em}
.qs .no{color:var(--acc);margin-right:6px}
.pass{font-family:Georgia,'Times New Roman','Noto Serif KR',serif;font-size:var(--fs,16px);line-height:1.8;color:var(--ink);
  background:var(--bg);border-radius:14px;padding:14px;border:1px solid var(--line);word-break:keep-all;text-align:left}
.pass mark{background:linear-gradient(transparent 38%,var(--mark) 38%);color:inherit;padding:0 1px;border-radius:2px;animation:hl .6s ease both}
@keyframes hl{from{background-size:0 100%}to{background-size:100% 100%}}
.tipbox{margin-top:10px;border-radius:14px;padding:10px 12px;background:var(--hint-soft);color:var(--ink);font-size:13.5px;border:1px dashed var(--hint);animation:in .25s ease both}
.tipbox b{color:var(--hint)}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.ch{display:flex;gap:11px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 13px;
  font-size:var(--cfs,15px);line-height:1.5;transition:.15s;box-shadow:0 2px 8px rgba(70,60,160,.05);position:relative}
.ch .n{flex:none;width:26px;height:26px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--sub)}
.ch .tx{flex:1;word-break:keep-all}
.ch:active{transform:scale(.985)}
.ch.sel{border-color:var(--acc);background:var(--acc-soft)}
.ch.sel .n{background:var(--acc);color:#fff}
.ch.elim{opacity:.45}
.ch.elim .m{text-decoration:line-through;text-decoration-thickness:1.5px}
.ch.right{border-color:var(--ok);background:var(--ok-soft)} .ch.right .n{background:var(--ok);color:#fff}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)} .ch.wrong .n{background:var(--bad);color:#fff}
.ch .why{display:block;margin-top:6px;font-size:12.5px;color:var(--sub);word-break:keep-all}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;margin-right:5px;background:var(--bad-soft);color:var(--bad);vertical-align:1px}
.tag.okt{background:var(--ok-soft);color:var(--ok)}
.tag.hx{background:var(--hint-soft);color:var(--hint)}

/* bottom bar */
.bar{padding:10px 16px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);position:relative}
.hints{display:flex;gap:8px;margin-bottom:10px}
.hbtn{flex:1;background:var(--hint-soft);border:1.5px solid transparent;border-radius:14px;padding:8px 4px;font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.25;transition:.15s}
.hbtn small{display:block;font-weight:600;color:var(--sub);font-size:10.5px}
.hbtn:active{transform:scale(.97)}
.hbtn.used{border-color:var(--hint)}
.hbtn[disabled]{opacity:.4}
.cta{width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 8px 20px rgba(91,91,214,.35);transition:.15s}
.cta:active{transform:scale(.985)}
.cta[disabled]{background:var(--line);color:var(--sub);box-shadow:none}
.cta.ghost{background:var(--card);color:var(--acc);box-shadow:none;border:1.5px solid var(--acc)}

/* explanation */
.exp{margin-top:14px;border-radius:16px;padding:13px 14px;background:var(--ok-soft);border:1px solid var(--ok);font-size:14px;animation:in .3s ease both}
.exp.no{background:var(--bad-soft);border-color:var(--bad)}
.exp h4{margin:0 0 4px;font-size:14.5px}

/* home */
.hero{margin:6px 16px 14px;border-radius:26px;padding:20px 20px 18px;color:#fff;
  background:radial-gradient(240px 120px at 90% 0,rgba(255,255,255,.3),transparent),linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 16px 34px rgba(91,91,214,.4)}
.hero small{opacity:.85;font-weight:700;letter-spacing:.04em}
.hero h1{margin:4px 0 12px;font-size:23px;line-height:1.25;letter-spacing:-.02em}
.hero .row{display:flex;gap:10px;align-items:center}
.hero .pill{background:rgba(255,255,255,.2);border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:700}
.go{margin-top:16px;width:100%;background:#fff;color:var(--acc);border-radius:16px;padding:14px;font-weight:900;font-size:16px;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 14px}
.stat{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--sub);font-weight:700}
.prog{margin:0 16px 14px}
.prog .tr{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.prog .fl{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:10px;transition:width .6s}
.prog p{margin:6px 2px 0;font-size:12px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between}
.sec{margin:18px 16px 8px;font-weight:900;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sec small{color:var(--sub);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 16px}
.day{aspect-ratio:1;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--sub);display:grid;place-items:center;position:relative}
.day.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.day.part{background:var(--hint-soft);border-color:var(--hint);color:var(--hint)}
.day.cur{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 14px rgba(91,91,214,.4)}
.lvh{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--acc);margin:10px 2px 0}
.foot{display:flex;gap:10px;margin:20px 16px 8px}
.foot button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;font-weight:700;font-size:13px;color:var(--sub)}
.legend{margin:10px 16px 0;font-size:11.5px;color:var(--sub);text-align:center}

/* result */
.cta.kakao{background:#FEE500;color:#191919;box-shadow:0 8px 20px rgba(254,229,0,.35)}
.res{text-align:center;padding:28px 16px 10px}
.res .em{font-size:64px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.res h2{margin:6px 0 4px;font-size:24px;letter-spacing:-.02em}
.res p{color:var(--sub);margin:0 0 16px;font-weight:600}
.sumrow{display:flex;gap:10px;margin:0 0 14px}
.sumcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:center}
.sumcard b{font-size:24px;display:block}.sumcard span{font-size:12px;color:var(--sub);font-weight:700}
.li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:8px;text-align:left;width:100%}
.li .no{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.li .no.ok{background:var(--ok-soft);color:var(--ok)}.li .no.bad{background:var(--bad-soft);color:var(--bad)}
.li .t{flex:1;font-size:13px;color:var(--sub);font-weight:600}
.li .t b{color:var(--ink);display:block;font-size:13.5px}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-weight:600}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:9;animation:in .25s ease both;max-width:90vw}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (min-width:520px){body{padding:18px 0}#app{height:calc(100dvh - 36px);border-radius:32px;background:var(--bg);box-shadow:0 30px 80px rgba(60,50,150,.25);border:1px solid var(--line)}}

/* ---- layered (겹침) mode ---- */
.stage{padding:0 12px 0;position:relative;--p:0}
.back{position:sticky;top:0;z-index:1;padding:4px 0 0;transform-origin:50% 0;
  filter:blur(calc(var(--p) * 5px));opacity:calc(1 - var(--p) * .62);transform:scale(calc(1 - var(--p) * .045));will-change:filter,opacity,transform}
.back .qcard{padding-bottom:12px}
.swipe{margin-top:10px;text-align:center;font-size:11.5px;font-weight:700;color:var(--acc);opacity:calc(1 - var(--p) * 3)}
.sheet{position:relative;z-index:2;margin:14px -4px 0;border-radius:28px 28px 0 0;min-height:var(--sh);padding:8px 14px 28px;
  background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid var(--line);border-bottom:0;box-shadow:0 -14px 34px rgba(70,60,160,.22)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:2px auto 12px}
.sheet .choices{margin-top:4px}
.sheet .tipbox{margin:0 0 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const D = [{"lv":1,"ty":0,"tp":"교육","p":"Many students believe that studying longer hours always leads to better grades. However, research shows that the quality of study matters more than the quantity. Students who take short breaks, review material regularly, and test themselves remember more than those who simply read the same pages for hours. Effective learning depends on how we study, not just how long we sit at our desks.","k":"the quality of study matters more than the quantity","c":["the benefits of studying in a quiet place","why students should avoid taking tests","the importance of study quality over study time","ways to reduce stress before exams","the relationship between sleep and school grades"],"t":["이","반","-","이","상"],"r":["조용한 공부 장소는 글에서 다루지 않았다.","글은 스스로 시험해 보는 것을 긍정적으로 본다.","'공부의 양보다 질이 중요하다'는 중심 문장과 일치한다.","시험 스트레스는 글의 소재가 아니다.","수면과 성적은 지문에 언급되지 않은 배경지식이다."],"a":2,"n":1},{"lv":1,"ty":1,"tp":"교육","p":"A teacher once told her class that she would reward the best mistake of the week. At first, students laughed, but soon they began to raise their hands more often and to try harder problems. They stopped fearing wrong answers because wrong answers were now useful. Every error became a chance for the whole class to learn something new. Her classroom turned into a place where curiosity grew.","k":"Every error became a chance for the whole class to learn something new.","c":["The Best Teacher Wins a Prize","Wrong Answers, Right Learning","How to Score Perfectly on Every Test","Fear: The Hidden Engine of Study","A Funny Day in School"],"t":["이","-","반","반","부"],"r":["교사가 상을 받는다는 내용은 없다.","틀린 답이 배움의 기회가 된다는 내용을 압축한 제목이다.","글은 정답보다 실수의 가치를 말한다.","글에서 두려움은 사라져야 할 것으로 나온다.","웃음은 도입부의 일부 장면일 뿐이다."],"a":1,"n":2},{"lv":1,"ty":2,"tp":"교육","p":"Teachers often praise students by saying, 'You are so smart.' Although it sounds kind, this kind of praise can backfire. Children who are praised for intelligence begin to avoid difficult tasks because they fear losing that label. In contrast, children who are praised for effort are willing to take on challenges. Effort, not talent, should be what we celebrate.","k":"children who are praised for effort are willing to take on challenges","c":["아이들에게 칭찬을 자주 하면 학업 성취도가 높아진다.","타고난 지능이 높은 학생일수록 어려운 과제를 피한다.","교사는 아이들이 더 높은 목표를 세울 수 있도록 칭찬보다 비판을 더 자주 해야 한다.","능력보다 노력을 칭찬해야 아이들이 도전하는 태도를 기른다.","친구와의 경쟁이 아이들의 학습 동기를 높인다."],"t":["과","비","반","-","이"],"r":["칭찬의 빈도가 아니라 칭찬의 대상이 핵심이다.","지능 수준이 아니라 '지능 칭찬'의 영향을 말했다.","글은 칭찬의 방향을 바꾸라는 것이지 비판을 권하지 않는다.","지능 칭찬은 도전을 피하게 하고 노력 칭찬은 도전을 이끈다는 대비가 핵심이다.","경쟁은 글에서 다루지 않았다."],"a":3,"n":3},{"lv":1,"ty":3,"tp":"교육","p":"Schools often measure success by test scores alone. But a score cannot show a student's creativity, honesty, or ability to work with others. When we focus only on numbers, students learn to chase marks instead of knowledge. Schools should value a wider range of strengths and give students chances to demonstrate them.","k":"Schools should value a wider range of strengths","c":["학교는 시험의 횟수를 늘려 학생의 실력을 정확히 측정해야 한다.","학교는 시험 점수 외에 학생의 다양한 능력도 평가해야 한다.","학생들은 점수에 연연하지 말고 친구와 협력해야 한다.","창의성은 점수로 평가할 수 없으므로 교육에서 제외해야 한다.","학생들은 정직한 태도로 시험에 임해야 한다."],"t":["반","-","부","비","세"],"r":["글은 점수 중심 평가를 비판한다.","점수만이 아닌 다양한 강점을 평가하라는 것이 주장이다.","협력은 평가해야 할 능력 중 하나일 뿐이다.","교육에서 제외하라는 것은 근거 없는 비약이다.","정직은 예시 속 단어일 뿐이다."],"a":1,"n":4},{"lv":1,"ty":0,"tp":"환경","p":"Bees do much more than make honey. As they move from flower to flower, they carry pollen that allows plants to produce fruits and seeds. Many of the foods we eat every day, such as apples, almonds, and blueberries, depend on this work. If bee populations keep declining, our food supply could face serious trouble.","k":"Bees do much more than make honey.","c":["the essential role of bees in producing our food","various methods of making honey at home","the nutritional value of apples, almonds, and blueberries","the effects of climate change on all insects","the danger of bee stings to farm workers"],"t":["-","이","세","과","이"],"r":["벌이 꽃가루를 옮겨 식량 생산을 가능하게 한다는 내용이다.","꿀 만드는 방법은 글의 초점이 아니다.","과일·견과류는 예시일 뿐 주제가 아니다.","'모든 곤충'과 '기후 변화'는 지나친 확대이다.","벌침의 위험은 언급되지 않았다."],"a":0,"n":5},{"lv":1,"ty":1,"tp":"환경","p":"In crowded cities where land is expensive, people have started planting gardens on rooftops. These green spaces grow vegetables, cool the buildings below, and give residents a place to relax. Some even collect rainwater to reduce waste. What was once empty concrete is now alive with plants, proving that nature can find a home in even the busiest urban areas.","k":"people have started planting gardens on rooftops","c":["The High Price of Land in Crowded Cities","Why Vegetables Are Healthier Than Meat","Building Taller Skyscrapers to Create More Space in Crowded Cities","Rainwater: The Cure for Every City Problem","Rooftop Gardens: Bringing Nature Above the City"],"t":["세","이","이","과","-"],"r":["땅값은 배경 설명일 뿐이다.","채소와 육류 비교는 글과 무관하다.","고층 건물 건설은 다루지 않았다.","빗물 활용을 '모든 문제의 해결책'으로 과장했다.","옥상 정원이 도시에 자연을 가져온다는 핵심을 담았다."],"a":4,"n":6},{"lv":1,"ty":2,"tp":"환경","p":"Fast fashion lets consumers buy cheap clothes that follow the latest trends. But these garments are made quickly and wear out quickly, so they are soon thrown away. The fashion industry is now one of the largest sources of waste and water pollution. Buying fewer, better-made clothes and wearing them longer is a far more sustainable choice.","k":"Buying fewer, better-made clothes and wearing them longer is a far more sustainable choice.","c":["유행에 맞는 옷을 자주 사서 입는 것이 소비를 촉진하여 경제 발전에 크게 기여한다.","옷을 적게 사서 오래 입는 것이 환경을 보호하는 데 더 효과적이다.","저렴한 옷은 품질이 낮아 소비자의 만족도가 떨어진다.","섬유 산업의 발전은 모든 환경 문제의 원인이다.","옷을 만드는 기술이 빠르게 발전하고 있다."],"t":["반","-","부","과","이"],"r":["글은 잦은 구매의 부정적 영향을 말한다.","적게 사서 오래 입는 것이 지속 가능한 선택이라는 결론이다.","품질 문제는 근거의 일부일 뿐, 요지는 환경적 선택이다.","'모든 환경 문제'는 지나친 일반화이다.","의류 제조 기술은 언급되지 않았다."],"a":1,"n":7},{"lv":1,"ty":3,"tp":"환경","p":"Many of us leave electronics plugged in even when they are not in use. This so-called standby power quietly wastes electricity every day. Unplugging chargers and turning off power strips takes only a few seconds. If each of us makes this a habit, we can reduce energy waste and lower our bills. We should unplug devices we are not using.","k":"We should unplug devices we are not using.","c":["가정의 전기 요금을 줄이려면 불필요한 전자 기기를 가능한 한 적게 구입하여 사용해야 한다.","충전기는 반드시 고품질 제품을 사용해야 한다.","가정은 전기 사용량을 주기적으로 점검해야 한다.","대기 전력은 환경에 거의 영향을 주지 않는다.","사용하지 않는 전자 기기의 플러그는 뽑아 두는 습관을 들여야 한다."],"t":["비","이","부","반","-"],"r":["구입 자제는 글에 없는 비약이다.","충전기 품질은 다루지 않았다.","사용량 점검은 글의 구체적 실천이 아니다.","글은 대기 전력이 낭비라고 말한다.","쓰지 않는 기기의 플러그를 뽑자는 것이 직접적인 주장이다."],"a":4,"n":8},{"lv":1,"ty":0,"tp":"심리","p":"Most people try to avoid failure at all costs. Yet many successful inventors say that their mistakes taught them more than their victories. Each failed attempt showed them what did not work and pushed them to think in new ways. Seen this way, failure is not the opposite of success but an important step toward it.","k":"failure is not the opposite of success but an important step toward it","c":["the secrets of becoming a famous inventor who changes the world","the importance of avoiding failure completely","reasons why people fear new challenges","the lessons inventors learn from their victories","failure as a valuable stepping stone to success"],"t":["부","반","상","반","-"],"r":["발명가는 사례일 뿐, 성공 비결을 다룬 글이 아니다.","글은 실패를 피하라고 하지 않는다.","도전을 두려워하는 이유는 언급되지 않았다.","글은 승리보다 실수에서 더 배운다고 했다.","실패가 성공으로 가는 중요한 단계라는 결론과 일치한다."],"a":4,"n":9},{"lv":1,"ty":1,"tp":"심리","p":"A smile costs nothing, yet it can change the mood of an entire room. When we smile at someone, they often smile back, and this simple exchange makes both people feel better. Studies show that even forcing a smile can slightly lift our spirits. Small acts of kindness like this travel further than we imagine.","k":"A smile costs nothing, yet it can change the mood of an entire room.","c":["A Small Smile, a Big Change","Why Forced Actions Always Fail","The Science of Facial Muscles","Money Cannot Buy Happiness","How to Look Good in Photographs"],"t":["-","반","세","상","이"],"r":["작은 미소가 큰 변화를 만든다는 내용을 표현했다.","억지 미소도 기분을 올린다고 했다.","얼굴 근육의 과학은 다루지 않았다.","돈과 행복은 지문 밖 통념이다.","사진 찍는 법은 글과 무관하다."],"a":0,"n":10},{"lv":1,"ty":2,"tp":"심리","p":"People often wait until they feel motivated before starting a task. But motivation usually follows action rather than leading it. When we begin a small task, we feel a sense of progress, and that feeling gives us energy to continue. Waiting for the perfect mood only delays our work. If we want motivation, we should act first.","k":"motivation usually follows action rather than leading it","c":["동기가 충분히 생길 때까지 기다린 뒤에 일을 시작하는 것이 결과적으로 더 효율적이다.","작은 일부터 시작하면 큰 일을 쉽게 끝낼 수 있다.","일을 미루는 사람들은 의지가 약한 사람들이다.","목표를 구체적으로 세우면 성취감이 높아진다.","동기는 행동에 앞서 생기기보다 행동을 시작한 뒤에 따라온다."],"t":["반","부","비","상","-"],"r":["글의 주장과 정반대이다.","작은 일의 시작은 근거 사례이며 큰 일 완수는 언급되지 않았다.","의지력에 대한 단정은 글에 없다.","목표 설정은 지문 밖 일반 상식이다.","동기가 먼저가 아니라 행동이 먼저라는 것이 핵심이다."],"a":4,"n":11},{"lv":1,"ty":3,"tp":"심리","p":"When we make a mistake, we often criticize ourselves harshly. But harsh self-criticism lowers confidence and makes us less likely to try again. Treating ourselves with the same kindness we offer a friend helps us recover faster and learn more. We should be gentle with ourselves when we fail.","k":"We should be gentle with ourselves when we fail.","c":["실수를 줄이기 위해서는 자신을 엄격하게 평가해야 한다.","친구의 실수를 격려하는 태도는 우정에 필수적이다.","실수했을 때는 자신에게 너그러운 태도를 가져야 한다.","실패한 경험은 다시 도전하기 전에 잊어야 한다.","자신감은 타인의 인정에서 비롯된다."],"t":["반","세","-","비","상"],"r":["글이 비판하는 태도이다.","친구는 비유의 대상일 뿐이다.","실패했을 때 자신에게 너그러우라는 것이 주장이다.","경험을 잊으라는 말은 없다.","타인의 인정은 지문 밖 내용이다."],"a":2,"n":12},{"lv":1,"ty":0,"tp":"기술","p":"When people eat together, they often place their phones on the table. Researchers have found that even a silent phone nearby makes conversations feel less personal and less satisfying. People talk about lighter topics and show less interest in each other's feelings. To keep our relationships strong, we should put our phones away during face-to-face conversations.","k":"even a silent phone nearby makes conversations feel less personal","c":["the convenience of smartphones in daily life","negative effects of nearby phones on face-to-face conversation","how to choose a restaurant for a group dinner","the history of mobile phone technology","the importance of replying quickly to messages"],"t":["반","-","이","상","이"],"r":["글은 휴대전화의 부정적 영향을 다룬다.","가까이 있는 휴대전화가 대화의 질을 떨어뜨린다는 내용이다.","식당 선택은 글과 무관하다.","휴대전화의 역사는 언급되지 않았다.","메시지 답장 속도는 글의 내용이 아니다."],"a":1,"n":13},{"lv":1,"ty":1,"tp":"기술","p":"Many students now take notes on laptops because typing is faster. However, researchers found that students who write by hand understand lectures better. Since handwriting is slower, they must decide what is important and put it into their own words. This mental effort helps ideas stay in memory. Sometimes, slower is smarter.","k":"students who write by hand understand lectures better","c":["Typing: Always the Best Choice for Notes","The Best Laptops for College Students","Slow Pens, Sharp Minds","How Lectures Have Changed Over Time","Speed: The Only Skill That Matters"],"t":["반","이","-","상","과"],"r":["글은 손글씨가 이해에 낫다고 한다.","노트북 추천은 다루지 않았다.","느린 손글씨가 이해를 높인다는 내용을 은유로 표현했다.","강의 방식의 변화는 지문에 없다.","속도만이 중요하다는 것은 글과 반대되는 과장이다."],"a":2,"n":14},{"lv":1,"ty":2,"tp":"사회","p":"Social media allows us to share our lives with hundreds of friends, yet many users report feeling lonelier than before. Scrolling through others' carefully chosen photos makes ordinary life seem dull by comparison. Meanwhile, real conversation is replaced by quick likes and short comments. Genuine friendship needs time spent together, not just a number of followers.","k":"Genuine friendship needs time spent together, not just a number of followers.","c":["진정한 우정은 온라인 교류의 양보다 함께 보내는 시간에서 만들어진다.","소셜 미디어의 사용을 완전히 금지해야 한다.","소셜 미디어에서 친구가 많은 사람일수록 일상에서 외로움을 훨씬 덜 느끼는 경향이 있다.","사진을 올릴 때에는 신중하게 고르는 것이 좋다.","다른 사람의 일상을 자주 살펴보면 사회성이 길러진다."],"t":["-","비","반","세","상"],"r":["팔로워 수가 아니라 함께한 시간이 우정을 만든다는 결론이다.","금지를 주장하는 것은 글에 없는 비약이다.","글은 친구가 많아도 외롭다고 했다.","'신중하게 고른 사진'은 세부 묘사일 뿐이다.","사회성 향상은 글에 근거가 없다."],"a":0,"n":15},{"lv":1,"ty":3,"tp":"사회","p":"Many people stay silent when they see small acts of unfairness, thinking that it is not their business. Yet injustice grows when good people say nothing. A short word of objection, or a simple act of support for the person treated unfairly, can change the atmosphere. We should speak up when we witness unfairness, however small.","k":"We should speak up when we witness unfairness, however small.","c":["부당한 일을 목격했을 때에는 작은 일이라도 목소리를 내야 한다.","다른 사람이 겪는 일에는 간섭하지 않고 조용히 지켜보는 것이 사회생활의 기본적인 예의이다.","큰 불의에 대해서만 적극적으로 대응해야 한다.","부당한 일을 막기 위해서는 법을 강화해야 한다.","좋은 사람들이 늘어나면 사회의 불의가 사라진다."],"t":["-","반","부","상","비"],"r":["작은 부당함에도 목소리를 내야 한다는 것이 주장이다.","글이 비판하는 태도이다.","글은 '작은 일이라도'라고 했다.","법 강화는 글에 없다.","불의가 사라진다는 것은 비약이다."],"a":0,"n":16},{"lv":1,"ty":0,"tp":"건강","p":"Walking is one of the simplest forms of exercise, yet its benefits are remarkable. A daily thirty-minute walk strengthens the heart, improves mood, and helps control weight. It requires no special equipment or expensive membership. Anyone, regardless of age or fitness level, can begin right away, which makes walking an ideal habit for a healthier life.","k":"A daily thirty-minute walk strengthens the heart, improves mood, and helps control weight.","c":["the best equipment and clothing for outdoor exercise in all seasons","the cost of joining a fitness center","the dangers of exercising too much","various health benefits of daily walking","the positive effect of walking on mood"],"t":["이","세","반","-","부"],"r":["걷기는 장비가 필요 없다고 했다.","회원권 언급은 부수적 세부 내용이다.","글은 운동의 이점을 말한다.","걷기가 심장·기분·체중에 주는 다양한 이점을 설명한다.","이점 중 하나(기분)만 다루어 범위가 좁다."],"a":3,"n":17},{"lv":1,"ty":1,"tp":"사회","p":"In some neighborhoods, a refrigerator stands on the street where anyone can leave or take food. Restaurants add extra meals, and families share vegetables from their gardens. People in need can take what they want without being asked questions. This simple idea reduces food waste while helping those who struggle to buy groceries. It shows that communities can solve problems together.","k":"This simple idea reduces food waste while helping those who struggle to buy groceries.","c":["The Rising Cost of Groceries Nationwide","How Restaurants Make More Profit","Gardening Tips for Growing Vegetables","Community Fridges: Sharing Food, Reducing Waste","Why Governments Should Ban All Food Waste in Every Restaurant and Home"],"t":["상","이","세","-","비"],"r":["전국의 식료품 가격 상승은 지문에 없다.","식당의 수익은 다루지 않았다.","텃밭 채소는 나눔의 예일 뿐이다.","공용 냉장고가 음식 낭비를 줄이고 이웃을 돕는다는 핵심을 담았다.","정부의 전면 금지는 근거 없는 비약이다."],"a":3,"n":18},{"lv":1,"ty":2,"tp":"경제","p":"Many people hesitate to spend money on quality tools because the price seems high. However, a cheap tool that breaks quickly must be replaced again and again, costing more in the end. A durable tool may cost more at first but serves for years. When we judge purchases, we should consider the total cost over time, not just the price on the tag.","k":"we should consider the total cost over time, not just the price on the tag","c":["가격이 비싼 물건은 항상 품질이 뛰어나므로 소비자는 값비싼 물건을 우선적으로 구입해야 한다.","싼 물건은 고장이 나도 쉽게 구할 수 있다.","물건을 살 때는 당장의 가격보다 오래 사용하는 동안의 총비용을 고려해야 한다.","공구를 사용하는 사람은 소비 습관이 합리적이다.","물건의 가격은 시간이 지날수록 오르는 경향이 있다."],"t":["과","세","-","상","이"],"r":["'항상'이라는 일반화이며 글이 말한 바가 아니다.","교체 사례를 왜곡한 세부 내용이다.","가격표가 아닌 장기적 총비용을 고려하라는 것이 핵심이다.","공구 사용자의 소비 습관은 근거가 없다.","가격 상승은 글의 소재가 아니다."],"a":2,"n":19},{"lv":1,"ty":3,"tp":"건강","p":"Teenagers often stay up late and wake up exhausted, treating sleep as time to be traded for homework or games. But the teenage brain needs about eight to ten hours of sleep to develop properly. Lack of sleep harms memory, mood, and even physical health. Teenagers should protect their sleep as seriously as they protect their studies.","k":"Teenagers should protect their sleep as seriously as they protect their studies.","c":["청소년은 숙제를 마친 후에 게임을 해야 한다.","학업 성적을 높이려면 수면 시간을 줄여야 한다.","청소년기에 이루어지는 두뇌 발달은 그날의 수면 시간에 의해서만 결정되므로 잠을 더 자야 한다.","청소년은 충분한 수면을 학업만큼 중요하게 여겨야 한다.","수면 부족은 기분 변화를 일으키므로 주의해야 한다."],"t":["이","반","과","-","부"],"r":["게임 시간 관리는 글의 논점이 아니다.","글은 수면을 줄이는 것을 비판한다.","'만'은 지나친 단정이다.","수면을 학업만큼 중요하게 지키라는 것이 주장이다.","기분은 수면 부족의 해로움 중 하나일 뿐이다."],"a":3,"n":20},{"lv":1,"ty":0,"tp":"경제","p":"Small daily purchases may seem harmless, but they add up quickly. A coffee bought every morning can cost hundreds of dollars a year. People who track their spending often discover surprising habits they never noticed. Once they see where their money goes, they can make smarter choices and save for what truly matters to them.","k":"People who track their spending often discover surprising habits","c":["the benefits of drinking coffee every morning","how tracking expenses leads to wiser saving","the reasons why prices rise every year","the danger of borrowing money from friends","the necessity of earning a higher income"],"t":["세","-","상","이","비"],"r":["커피는 예시일 뿐이다.","지출을 기록하면 습관을 알게 되어 현명하게 저축할 수 있다는 내용이다.","물가 상승은 지문에 없다.","돈을 빌리는 문제는 다루지 않았다.","소득 증대는 글에서 비약된 내용이다."],"a":1,"n":21},{"lv":1,"ty":1,"tp":"건강","p":"Many people drink water only when they feel thirsty, but by then the body is already running low. Even mild dehydration can cause headaches, tiredness, and difficulty concentrating. Drinking small amounts throughout the day keeps energy steady and the mind clear. Keeping a water bottle on your desk is an easy way to remember.","k":"Even mild dehydration can cause headaches, tiredness, and difficulty concentrating.","c":["Sports Drinks: The Ultimate Energy Source for Busy Students and Workers","Headaches and Their Many Hidden Causes","Why Thirst Is Always a Good Signal","Don't Wait for Thirst: Drink Water Regularly","Water Pollution and Our Health"],"t":["이","세","반","-","상"],"r":["스포츠 음료는 언급되지 않았다.","두통은 탈수 증상 중 하나일 뿐이다.","글은 갈증을 느낄 땐 이미 늦다고 한다.","목마르기 전에 꾸준히 물을 마시라는 핵심을 담았다.","수질 오염은 지문 밖 내용이다."],"a":3,"n":22},{"lv":1,"ty":2,"tp":"건강","p":"Many people think that eating less is the key to weight control. But skipping meals can slow the body's metabolism and lead to stronger cravings later. As a result, people often eat more than they would have otherwise. A steady pattern of balanced meals keeps hunger under control and helps maintain a healthy weight.","k":"A steady pattern of balanced meals keeps hunger under control","c":["식사량을 줄이는 것이 체중 관리의 가장 좋은 방법이다.","신진대사가 느려지면 몸이 쉽게 피로해진다.","규칙적이고 균형 잡힌 식사가 체중 관리에 더 효과적이다.","음식에 대한 강한 욕구는 의지만 있다면 누구나 쉽게 억제할 수 있으므로 식사를 줄여도 된다.","체중 감량을 위해서는 운동이 반드시 필요하다."],"t":["반","세","-","비","상"],"r":["글이 반박하는 통념이다.","신진대사 저하는 근거 설명이며 '피로'는 언급되지 않았다.","끼니를 거르기보다 규칙적·균형 식사가 낫다는 결론이다.","의지로 억제한다는 내용은 없다.","운동은 지문에 나오지 않는다."],"a":2,"n":23},{"lv":1,"ty":3,"tp":"경제","p":"Credit cards make shopping easy, but they also make spending feel painless. Because we do not see cash leaving our hands, we buy things we would not otherwise afford. The bill that arrives later can be a shock. To avoid debt, we should check our balance regularly and spend only what we can pay back each month.","k":"spend only what we can pay back each month","c":["신용카드의 사용을 법으로 금지해야 한다.","현금보다 신용카드가 더 안전한 결제 수단이다.","신용카드 회사는 소비자가 과소비하지 않도록 매달 사용 내역을 자세하게 알려 주어야 한다.","신용카드는 상환할 수 있는 범위 안에서만 사용해야 한다.","물건을 살 때에는 반드시 가격을 비교해야 한다."],"t":["비","반","상","-","이"],"r":["금지는 글에 없는 비약이다.","글은 카드의 위험을 경고한다.","카드사의 의무는 언급되지 않았다.","갚을 수 있는 만큼만 쓰라는 것이 주장이다.","가격 비교는 글의 소재가 아니다."],"a":3,"n":24},{"lv":1,"ty":0,"tp":"언어","p":"Children learn their first language without any grammar lessons. They simply listen to the people around them, day after day, and gradually begin to speak. Adults learning a new language can use the same approach. Listening to music, podcasts, and conversations helps the brain absorb natural sounds and patterns far better than memorizing word lists alone.","k":"Listening to music, podcasts, and conversations helps the brain absorb natural sounds and patterns","c":["the difficulty of teaching grammar rules to young children at school","the advantages of memorizing long word lists","the role of music in children's emotional growth","the effectiveness of listening for language learning","differences between first and second language grammar"],"t":["이","반","상","-","세"],"r":["아이에게 문법을 가르치는 어려움은 주제가 아니다.","글은 단어 암기보다 듣기가 낫다고 했다.","음악과 정서 발달은 지문 밖 내용이다.","듣기가 언어 습득에 효과적이라는 것이 글의 핵심이다.","모국어/외국어 비교는 도입부 세부 내용에 그친다."],"a":3,"n":25},{"lv":1,"ty":1,"tp":"과학","p":"An octopus has no bones and a short life, yet it solves puzzles that challenge many animals. It can open jars, escape from tanks, and use coconut shells as shelter. Scientists are amazed that such a creature learns by watching and remembering. The octopus reminds us that intelligence takes many forms, and not all of them look like our own.","k":"intelligence takes many forms","c":["Octopuses: Clever Minds in Soft Bodies","Why Short-Lived Animals Never Learn","Coconuts as the Perfect Home for Sea Life","The Dangers of Keeping Pets at Home","Every Animal Is as Clever as an Octopus"],"t":["-","반","세","이","과"],"r":["뼈 없는 몸에 깃든 문어의 영리함을 표현했다.","수명이 짧아도 문어는 학습한다.","코코넛 껍데기는 사례 하나일 뿐이다.","반려동물 사육은 글과 무관하다.","모든 동물로 일반화한 과장이다."],"a":0,"n":26},{"lv":1,"ty":2,"tp":"과학","p":"Scientists often fail in their experiments, but those failures are not wasted. When a result does not match what was expected, researchers are forced to question their assumptions. Many great discoveries, including penicillin, began with unexpected results. A scientist who is open to surprise can find answers that no one was even looking for.","k":"Many great discoveries, including penicillin, began with unexpected results.","c":["과학자는 실험 전에 정확한 가설을 세워야 한다.","실험이 실패하면 연구를 곧바로 중단해야 한다.","페니실린은 우연한 실수로 만들어진 약이다.","인류가 이룬 모든 과학적 발견은 실험에서 나온 예상하지 못한 결과에서 비롯되었다고 할 수 있다.","예상과 다른 결과는 새로운 발견으로 이어지는 중요한 계기가 될 수 있다."],"t":["상","반","세","과","-"],"r":["가설 설정은 지문에 없다.","글은 실패를 가치 있게 본다.","페니실린은 사례일 뿐이다.","'모든'은 지나친 일반화이다.","예상 밖의 결과가 발견의 계기가 된다는 내용이다."],"a":4,"n":27},{"lv":1,"ty":3,"tp":"기술","p":"Many people store photos, documents, and memories on a single device. Yet devices can break, be lost, or be stolen without warning. When that happens, years of precious data may disappear in an instant. Making copies in a second location takes little effort compared to the cost of loss. We should back up important files regularly.","k":"We should back up important files regularly.","c":["중요한 파일은 정기적으로 다른 곳에 백업해 두어야 한다.","기기를 분실하지 않도록 늘 주의해야 한다.","소중한 기억은 사진보다 글로 남겨야 한다.","새로운 기기를 구입하면 보안을 위해 이전 기기에 저장된 자료는 모두 삭제해야 한다.","개인 정보를 보호하기 위해 비밀번호를 자주 바꿔야 한다."],"t":["-","부","비","반","상"],"r":["중요 파일을 정기적으로 백업하라는 것이 주장이다.","분실 예방은 글의 해결책이 아니다.","기록 방식의 우열은 글에 없다.","글은 자료 보존을 강조한다.","비밀번호 관리는 지문 밖 내용이다."],"a":0,"n":28},{"lv":1,"ty":0,"tp":"과학","p":"While we sleep, our brains are far from idle. During deep sleep, the brain sorts through the day's experiences, strengthening important memories and discarding unnecessary details. This is why a student who sleeps well after studying often performs better than one who stays up all night. Good sleep is not a luxury but a basic tool for learning.","k":"Good sleep is not a luxury but a basic tool for learning.","c":["the role of sleep in memory and learning","effective ways to stay awake while studying","how dreams reveal our hidden desires","the daily schedule of successful students","the causes of sleep disorders in teenagers"],"t":["-","반","상","부","이"],"r":["수면이 기억을 정리해 학습을 돕는다는 내용이다.","글은 충분한 수면을 권한다.","꿈의 의미는 언급되지 않았다.","학생은 예시이며 일과표는 다루지 않았다.","수면 장애의 원인은 글과 무관하다."],"a":0,"n":29},{"lv":1,"ty":1,"tp":"경제","p":"Many people believe that buying more things will make them happier. Yet researchers find that spending money on experiences, such as trips or concerts, brings longer-lasting joy. Objects become ordinary quickly, but memories grow sweeter over time and can be shared with friends. When we choose how to spend, we should think about what we will remember.","k":"spending money on experiences, such as trips or concerts, brings longer-lasting joy","c":["Why Expensive Gadgets Make Us Happier","The Cheapest Ways to Buy Concert Tickets Before They Sell Out","Memories Over Things: Spend on Experiences","Saving Money: The Key to Happiness","Travel Is Always Better Than Staying Home"],"t":["반","세","-","상","과"],"r":["글은 물건의 기쁨이 금방 사라진다고 한다.","콘서트는 경험의 예일 뿐이다.","물건보다 경험에 쓰라는 핵심을 담았다.","저축과 행복은 지문에 없다.","'항상'이라는 지나친 일반화이다."],"a":2,"n":30},{"lv":1,"ty":2,"tp":"예술","p":"A good photograph does not depend on an expensive camera. What matters most is the photographer's eye: noticing light, choosing a moment, and deciding what to include in the frame. Beginners often spend more time on equipment than on practice. Yet the photographer who takes a thousand pictures with a simple camera will learn far more than one who only reads about lenses.","k":"What matters most is the photographer's eye","c":["값비싼 카메라를 사용해야 좋은 사진을 찍을 수 있다.","사진의 질은 장비보다 촬영자의 안목과 꾸준한 연습에 달려 있다.","좋은 사진을 찍으려면 촬영 전에 빛의 방향과 구도를 가장 먼저 고려하여 장면을 설계해야 한다.","렌즈에 관한 지식은 사진 촬영에 전혀 도움이 되지 않는다.","사진 촬영은 전문가만 할 수 있는 예술 활동이다."],"t":["반","-","부","과","상"],"r":["글의 주장과 반대이다.","장비가 아니라 안목과 연습이 중요하다는 것이 핵심이다.","빛은 안목의 한 요소일 뿐이다.","'전혀'는 지나친 단정이다.","글은 전문가 한정을 말하지 않았다."],"a":1,"n":31},{"lv":1,"ty":3,"tp":"예술","p":"Many adults say they cannot draw or sing, and so they never try. But creative activities are not only for professionals. Making something, even imperfectly, relaxes the mind and gives a sense of accomplishment. The goal is enjoyment, not perfection. We should engage in creative activities for the pleasure they bring, not for the praise they might earn.","k":"The goal is enjoyment, not perfection.","c":["창작을 하려면 전문가에게 먼저 배워야 한다.","어른들은 어린이보다 창의력이 부족하다.","그림과 노래는 가장 좋은 창작 활동이다.","창작 활동은 정신 건강을 해치지 않는 범위 안에서 적당한 시간만큼 신중하게 즐기며 해야 한다.","창작 활동은 결과보다 그 과정에서 얻는 즐거움을 위해 해야 한다."],"t":["반","상","과","비","-"],"r":["글은 전문가만의 활동이 아니라고 한다.","연령별 창의력 비교는 언급되지 않았다.","예시를 최고의 활동으로 확대했다.","정신 건강 위험은 글에 없다.","완벽함이 아닌 즐거움을 위해 창작하라는 것이 주장이다."],"a":4,"n":32},{"lv":1,"ty":0,"tp":"사회","p":"People often volunteer in order to help others, but the benefits go both ways. Volunteers report feeling happier, more connected to their communities, and more confident in their abilities. Some even discover new career interests through their work. Giving time to others, it turns out, is also a way of giving something valuable back to ourselves.","k":"the benefits go both ways","c":["the lack of volunteers in local communities","career options for people who enjoy helping others in their communities","personal rewards that volunteers gain from helping others","the importance of donating money to charity","the reason volunteers should expect payment"],"t":["이","세","-","이","반"],"r":["자원봉사자 부족은 언급되지 않았다.","진로 발견은 세부 사례 중 하나이다.","봉사자 자신이 얻는 보상이 글의 중심이다.","기부는 글의 소재가 아니다.","글은 금전적 대가를 말하지 않았다."],"a":2,"n":33},{"lv":1,"ty":1,"tp":"언어","p":"Every culture has proverbs, short sayings that carry the wisdom of generations. A single sentence can teach patience, honesty, or caution in a way people easily remember. Because proverbs use images from daily life, such as animals and farming, they are simple to understand. Learning a culture's proverbs offers a window into the values people have long held dear.","k":"Learning a culture's proverbs offers a window into the values people have long held dear.","c":["Animals in Farming Communities","Why Old Sayings Are No Longer Useful","The Fastest Way to Learn a Foreign Language Through Everyday Conversation","How Honesty Is Taught in Schools","Proverbs: Short Sayings, Lasting Cultural Wisdom"],"t":["세","반","상","부","-"],"r":["동물과 농사는 비유 소재일 뿐이다.","글은 속담의 가치를 긍정한다.","외국어 학습법은 지문에 없다.","정직은 속담이 가르치는 덕목 중 하나일 뿐이다.","속담이 문화의 지혜와 가치를 담고 있다는 내용이다."],"a":4,"n":34},{"lv":1,"ty":2,"tp":"언어","p":"People often think that being fluent in a language means never making mistakes. In reality, fluent speakers make errors all the time; they simply keep talking. Learners who wait for perfect sentences before speaking progress slowly. Those who speak despite mistakes get more practice and receive more feedback. Fear of error is the biggest barrier to fluency.","k":"Fear of error is the biggest barrier to fluency.","c":["언어를 유창하게 구사하려면 실수를 하지 않아야 한다.","원어민은 외국어 학습자의 실수를 이해하지 못한다.","외국어를 학습할 때에는 학습자의 오류를 바로잡아 주는 피드백을 제공하는 교사가 반드시 필요하다.","실수를 두려워하지 않고 말해 보는 태도가 언어 능숙도 향상의 열쇠이다.","문법을 정확하게 공부하는 것이 언어 학습의 첫걸음이다."],"t":["반","비","부","-","상"],"r":["글이 바로잡는 통념이다.","원어민의 이해 여부는 언급되지 않았다.","피드백은 근거 중 하나이며 교사의 필요성은 글에 없다.","실수에 대한 두려움이 최대 장벽이라는 결론이다.","문법 학습은 지문에 없다."],"a":3,"n":35},{"lv":1,"ty":3,"tp":"언어","p":"Online messages lack tone of voice and facial expression, so words can easily be misunderstood. A joke may seem rude, and a short reply may seem cold. Before sending a message, we should reread it and imagine how the reader will feel. A few extra seconds of care can prevent a great deal of hurt.","k":"we should reread it and imagine how the reader will feel","c":["온라인 대화보다 직접 만나서 대화하는 것을 우선해야 한다.","온라인 메시지에서는 농담이 오해를 불러일으킬 수 있으므로 어떤 경우에도 사용하지 않아야 한다.","온라인 메시지를 보내기 전에 상대방의 입장에서 다시 읽어 보아야 한다.","메시지에는 짧고 간결한 표현을 사용해야 한다.","상대방의 표정을 살피며 대화하는 것이 중요하다."],"t":["부","비","-","반","세"],"r":["대면 대화 우선은 글의 해결책이 아니다.","농담 금지는 글에 없다.","보내기 전에 상대의 입장에서 다시 읽자는 것이 주장이다.","글은 짧은 답이 차갑게 보일 수 있다고 한다.","표정은 온라인의 한계를 설명하는 요소일 뿐이다."],"a":2,"n":36},{"lv":1,"ty":0,"tp":"예술","p":"Learning a musical instrument takes patience. Beginners often feel discouraged because progress seems slow. But practicing for just fifteen minutes every day produces better results than a single three-hour session once a week. Regular, short practice allows the brain and fingers to build skills gradually and keeps motivation alive.","k":"practicing for just fifteen minutes every day produces better results","c":["the most popular instruments among beginners","the pleasure of listening to live concerts","the difficulty beginners face with slow progress","the superiority of long weekly practice sessions","the value of short, regular practice in learning music"],"t":["상","이","세","반","-"],"r":["인기 악기는 지문에 없다.","공연 감상은 글과 무관하다.","더딘 진전은 도입부의 배경일 뿐이다.","글은 짧은 매일 연습이 낫다고 했다.","짧고 꾸준한 연습의 가치가 중심 내용이다."],"a":4,"n":37},{"lv":1,"ty":1,"tp":"사회","p":"Cities that invest in buses, trains, and bike lanes enjoy cleaner air and less traffic. When people leave their cars at home, roads become less crowded and travel times shrink. Public transportation also helps those who cannot afford a car reach their jobs. A well-designed transit system makes a city healthier, fairer, and easier to live in.","k":"A well-designed transit system makes a city healthier, fairer, and easier to live in.","c":["Cars: The Backbone of Modern Cities","Better Transit, Better Cities","How to Repair a Broken Bicycle","Why Train Tickets Cost So Much","Bike Lanes: The Only Solution to Traffic"],"t":["반","-","이","상","과"],"r":["글은 자동차 의존을 줄이는 쪽을 말한다.","대중교통이 도시를 더 좋게 만든다는 핵심이다.","자전거 수리는 글과 무관하다.","기차표 가격은 지문에 없다.","자전거 도로만이 해결책이라는 과장이다."],"a":1,"n":38},{"lv":1,"ty":2,"tp":"사회","p":"Many people believe that cities are always noisy and unfriendly. However, research suggests that dense cities can build stronger social ties. Because people live close together, they share parks, markets, and public spaces. These shared places give chance for casual meetings that turn into friendships. Cities, when well planned, can bring people closer rather than push them apart.","k":"dense cities can build stronger social ties","c":["잘 계획된 도시는 공유 공간을 통해 사람들 사이의 유대를 강화할 수 있다.","도시의 소음 문제는 반드시 해결되어야 한다.","모든 도시 거주자는 이웃과 친하게 지낸다.","도시에서는 공원보다 시장이 더 중요한 공간이다.","도시가 커질수록 사람들 사이의 관계는 약해진다."],"t":["-","이","과","세","반"],"r":["잘 계획된 도시가 공유 공간을 통해 유대를 강화한다는 내용이다.","소음 해결은 글의 주장이 아니다.","'모든'은 일반화이다.","공원과 시장은 예시이며 우열은 언급되지 않았다.","글의 주장과 정반대이다."],"a":0,"n":39},{"lv":1,"ty":3,"tp":"사회","p":"Some people believe that recycling alone will solve our waste problem. But recycling uses energy and cannot handle every material. A better approach starts earlier: using less in the first place. Choosing durable goods, avoiding single-use items, and repairing instead of replacing all reduce waste at its source. We should focus on reducing consumption before recycling.","k":"We should focus on reducing consumption before recycling.","c":["쓰레기 문제를 해결하려면 모든 쓰레기를 재활용할 수 있도록 새로운 기술을 적극적으로 개발해야 한다.","쓰레기 문제를 해결하려면 재활용보다 소비 자체를 줄이는 데 힘써야 한다.","일회용품 사용을 법으로 엄격히 금지해야 한다.","물건은 고장 나면 수리해서 사용해야 한다.","재활용은 에너지를 소비하므로 중단해야 한다."],"t":["반","-","비","부","과"],"r":["글은 재활용만으로는 부족하다고 한다.","재활용에 앞서 소비 자체를 줄이라는 것이 주장이다.","법적 금지는 글에 없다.","수리는 소비 감축 방법 중 하나일 뿐이다.","재활용 중단은 지나친 비약이다."],"a":1,"n":40},{"lv":1,"ty":0,"tp":"환경","p":"Throwing a plastic bottle into the correct bin takes only a second, but its effect lasts far longer. Recycled plastic can be turned into clothing, furniture, and new containers, reducing the need for fresh raw materials. If every household recycled carefully, communities would produce much less waste and save a great deal of energy. Small daily habits can create large environmental change.","k":"Small daily habits can create large environmental change.","c":["the high cost of making plastic bottles","various clothing and furniture styles made from recycled plastic materials","government rules about garbage collection days","the importance of banning plastic completely","the environmental impact of everyday recycling habits"],"t":["이","세","상","비","-"],"r":["제조 비용은 언급되지 않았다.","의류는 재활용품의 한 예일 뿐이다.","쓰레기 수거 규정은 지문 밖 내용이다.","플라스틱 전면 금지는 근거 없는 비약이다.","일상의 재활용 습관이 큰 환경 변화를 만든다는 내용이다."],"a":4,"n":41},{"lv":1,"ty":1,"tp":"교육","p":"Young children ask questions constantly, but as they grow older, many stop. They worry that questions make them look foolish. Yet the best learners are those who keep asking why and how. Questions open doors to new ideas, and a curious mind never stops growing. Teachers should welcome questions with patience, because every question carries the desire to learn.","k":"the best learners are those who keep asking why and how","c":["Why Silence in Class Is Golden","Teachers' Daily Struggles with Children","Keep Asking: The Key to Curious Minds","The Reasons Young Children Fear Strangers","Looking Foolish: A Path to Popularity"],"t":["반","이","-","상","비"],"r":["글은 질문을 환영하라고 말한다.","교사의 어려움은 다루지 않았다.","계속 질문하는 것이 호기심을 키운다는 핵심이다.","낯선 사람에 대한 두려움은 지문에 없다.","어리석어 보이는 것과 인기는 근거 없는 연결이다."],"a":2,"n":42},{"lv":1,"ty":2,"tp":"교육","p":"Homework is meant to reinforce what students learn in class, but too much of it can have the opposite effect. Students who spend hours on assignments each night often feel exhausted and lose interest in learning. Short, well-designed tasks that focus on key ideas help students remember better. Quality, not quantity, makes homework useful.","k":"Quality, not quantity, makes homework useful.","c":["학생들은 매일 밤 충분한 시간 동안 숙제를 해야 한다.","숙제는 양을 늘리기보다 핵심에 집중한 적절한 과제로 구성해야 효과적이다.","교사들은 수업 시간에 숙제를 먼저 점검해야 한다.","숙제를 전혀 내 주지 않으면 학생들은 수업에서 배운 내용을 금세 잊어버리게 되므로 숙제는 필수이다.","숙제는 학생의 학습 동기에 큰 영향을 미친다."],"t":["반","-","이","비","부"],"r":["글은 과도한 숙제를 비판한다.","숙제는 양이 아니라 질이 중요하다는 결론이다.","숙제 점검은 언급되지 않았다.","숙제 부재의 영향은 글에 없다.","동기 저하는 과다한 숙제의 부작용 하나일 뿐이다."],"a":1,"n":43},{"lv":1,"ty":3,"tp":"교육","p":"Students often memorize facts for a test and forget them within a week. This happens because memorizing without understanding builds weak connections in the brain. When students ask why something is true and connect it to what they already know, the knowledge stays. Learners should seek to understand ideas rather than simply memorize them.","k":"Learners should seek to understand ideas rather than simply memorize them.","c":["시험에서 좋은 점수를 얻으려면 같은 내용을 반복해서 외우는 것이 가장 효과적인 학습 방법이다.","학생들은 시험 후에도 배운 내용을 복습해야 한다.","학습자는 단순히 암기하기보다 개념을 이해하려고 노력해야 한다.","교사는 학생이 이미 아는 내용을 먼저 확인해야 한다.","학습한 내용은 일주일 안에 잊혀지는 것이 자연스럽다."],"t":["반","부","-","세","상"],"r":["글이 비판하는 학습법이다.","복습은 글에서 다루지 않았다.","암기보다 이해를 추구하라는 것이 주장이다.","기존 지식 연결은 이해 방법의 일부일 뿐이다.","망각을 자연스럽다고 보는 시각은 글에 없다."],"a":2,"n":44},{"lv":1,"ty":0,"tp":"심리","p":"Writing down three things you are thankful for each night may sound too simple to matter. Yet people who keep such a gratitude journal tend to sleep better and feel more optimistic. The habit trains the mind to notice good things rather than focusing only on problems. Over time, this shift in attention can improve overall happiness.","k":"people who keep such a gratitude journal tend to sleep better and feel more optimistic","c":["the difficulty of keeping a daily diary","ways to fall asleep faster at night","the positive effects of practicing gratitude","why people complain more than they praise","the importance of solving problems quickly"],"t":["이","부","-","상","비"],"r":["일기 쓰기의 어려움은 다루지 않았다.","수면 개선은 효과의 일부일 뿐이다.","감사 일기가 주는 긍정적 효과가 중심이다.","불평이 많은 이유는 지문에 없다.","글은 문제 해결 속도를 말하지 않았다."],"a":2,"n":45},{"lv":1,"ty":1,"tp":"환경","p":"Wind turbines turn the movement of air into electricity without producing smoke or harmful gases. A single large turbine can power hundreds of homes. Though some people dislike how turbines look, wind energy is clean, renewable, and increasingly affordable. Countries that expand wind power can reduce their dependence on coal and oil.","k":"wind energy is clean, renewable, and increasingly affordable","c":["Why Turbines Ruin Beautiful Landscapes","Wind Power: Clean Energy for the Future","Coal and Oil: Energy of the Future","How Air Moves Around the Earth","Electricity Prices Around the World and Why They Keep Changing"],"t":["세","-","반","상","이"],"r":["경관 문제는 양보절의 일부일 뿐이다.","풍력이 깨끗한 미래 에너지라는 핵심이다.","글은 석탄·석유 의존을 줄이자고 한다.","공기 순환 원리는 지문에 없다.","각국의 전기 요금은 다루지 않았다."],"a":1,"n":46},{"lv":1,"ty":2,"tp":"환경","p":"When we think about protecting the environment, we often imagine large actions like building solar farms. Yet individual choices matter too. If millions of people reduce their energy use at home, the combined effect can equal that of a large power plant. Change does not need to wait for governments or corporations; it can begin with each household.","k":"If millions of people reduce their energy use at home","c":["환경 보호는 정부의 대규모 정책으로만 가능하다.","대규모 태양광 발전소를 전국 곳곳에 많이 지어야만 에너지 문제를 근본적으로 해결할 수 있다.","가정의 에너지 사용량은 해마다 줄어들고 있다.","많은 사람의 작은 에너지 절약 실천이 모이면 큰 환경 보호 효과를 낼 수 있다.","기업은 환경 보호에 대한 책임을 개인에게 넘겨서는 안 된다."],"t":["반","부","상","-","이"],"r":["글은 가정에서 시작할 수 있다고 한다.","태양광은 도입부의 예시일 뿐이다.","사용량 추이는 언급되지 않았다.","개인의 작은 실천이 모여 큰 효과를 낸다는 내용이다.","기업의 책임 문제는 글의 초점이 아니다."],"a":3,"n":47},{"lv":1,"ty":3,"tp":"환경","p":"Many people feel that their individual actions are too small to affect climate change. But social habits spread: when neighbors install solar panels or ride bicycles, others follow. Every visible green choice makes the next person more likely to act. We should not underestimate our influence and should lead by example.","k":"We should not underestimate our influence and should lead by example.","c":["개인의 행동은 기후 변화에 거의 영향을 주지 못한다.","환경을 위한 실천이 다른 사람에게 영향을 줄 수 있으므로 솔선수범해야 한다.","이웃과 함께 태양광 패널을 설치하는 사업을 추진해야 한다.","기후 변화에 대한 책임은 정부와 기업이 져야 한다.","자전거를 타는 것이 가장 환경 친화적인 이동 방법이다."],"t":["반","-","세","이","과"],"r":["글이 반박하는 생각이다.","내 실천이 타인에게 번지므로 모범을 보이라는 것이 주장이다.","태양광 설치는 예시일 뿐이다.","책임 주체 논의는 글에 없다.","예시를 '가장'으로 과장했다."],"a":1,"n":48},{"lv":1,"ty":0,"tp":"기술","p":"Navigation apps make travel easy, but they may also weaken our sense of direction. People who follow turn-by-turn instructions rarely pay attention to landmarks around them. As a result, they find it harder to remember routes or imagine a map of the area. Using the app less often and noticing the surroundings can keep our natural navigation skills sharp.","k":"they may also weaken our sense of direction","c":["the accuracy of modern map technology","how reliance on navigation apps can reduce our sense of direction","the history of paper maps and compasses","practical tips for finding the cheapest travel routes between two distant cities","the importance of memorizing street names"],"t":["상","-","이","이","부"],"r":["지도 기술의 정확성은 언급되지 않았다.","내비게이션 의존이 방향 감각을 약화시킨다는 내용이다.","종이 지도의 역사는 글과 무관하다.","저렴한 경로 찾기는 소재에서 벗어난다.","랜드마크 인식과 달리 도로명 암기는 지문에 없다."],"a":1,"n":49},{"lv":1,"ty":1,"tp":"심리","p":"Putting off a task often feels like a way to escape stress, but it usually creates more of it. The unfinished work stays in our minds, and the deadline grows closer. Experts suggest starting with just five minutes. Once we begin, the task often feels less frightening, and we keep going. The hardest step is simply the first one.","k":"The hardest step is simply the first one.","c":["The Joy of Escaping from Work","Deadlines Around the World","Five Minutes: A Cure for Every Illness and Every Kind of Stress","Just Begin: Beating Delay with a Small Start","Why Experts Disagree About Stress"],"t":["반","이","과","-","상"],"r":["미루기는 스트레스를 더 만든다고 했다.","각국의 마감 기한은 글과 무관하다.","5분이 모든 병을 고친다는 터무니없는 일반화이다.","작게라도 시작해 미루기를 이겨내라는 핵심이다.","전문가들의 의견 차이는 지문에 없다."],"a":3,"n":50},{"lv":1,"ty":2,"tp":"심리","p":"When someone shares a problem, our first instinct is often to offer advice. But advice can make the speaker feel unheard. What most people need is to feel understood. Listening patiently, without interrupting, shows care and gives the person room to find their own solution. Sometimes the kindest thing we can do is simply listen.","k":"Sometimes the kindest thing we can do is simply listen.","c":["고민을 털어놓는 사람에게는 조언보다 경청이 더 큰 도움이 될 수 있다.","상대의 문제를 대신 해결해 주려는 적극적인 태도는 결국 두 사람의 관계를 해치는 결과를 낳는다.","대화할 때에는 상대의 말을 끊고 질문하는 것이 좋다.","스스로 해결책을 찾는 사람은 조언을 필요로 하지 않는다.","고민을 털어놓는 습관은 정신 건강에 도움이 된다."],"t":["-","과","반","비","상"],"r":["조언보다 경청이 낫다는 결론이다.","'관계를 해친다'는 지나친 확대이다.","글은 끊지 않고 듣기를 권한다.","조언의 필요 여부로 비약했다.","털어놓는 사람의 건강은 지문 밖 내용이다."],"a":0,"n":51},{"lv":1,"ty":3,"tp":"심리","p":"We tend to remember what went wrong in a day more vividly than what went right. This habit can leave us feeling that life is worse than it really is. By deliberately noticing small good moments, such as a kind word or a warm cup of tea, we can balance our view. We should consciously pay attention to positive moments in daily life.","k":"We should consciously pay attention to positive moments in daily life.","c":["하루를 마무리하며 잘못한 일을 반성하는 시간을 가져야 한다.","인생은 실제보다 더 나쁘게 느껴지는 법이므로 기대를 낮춰야 한다.","따뜻한 차를 마시는 습관은 스트레스를 줄여 준다.","일상 속의 긍정적인 순간에 의식적으로 주의를 기울여야 한다.","다른 사람에게 친절한 말을 건네는 것이 중요하다."],"t":["반","비","세","-","부"],"r":["글은 나쁜 일에 치우친 기억을 문제 삼는다.","기대를 낮추라는 것은 글에 없다.","차는 예시일 뿐이다.","긍정적 순간을 의식적으로 알아차리라는 것이 주장이다.","친절한 말은 긍정적 순간의 예시이다."],"a":3,"n":52},{"lv":1,"ty":0,"tp":"사회","p":"In many cities, people live next to each other for years without knowing each other's names. Yet strong neighborhoods are built on small interactions, such as a friendly greeting or a shared garden. When neighbors know one another, they look out for each other and feel safer. Building community begins with taking the first small step to say hello.","k":"strong neighborhoods are built on small interactions","c":["the rising cost of living in large cities","the reasons people move to new neighborhoods","the importance of home security systems","how small interactions create strong communities","the danger of talking to strangers"],"t":["이","상","세","-","반"],"r":["도시 생활비는 글과 무관하다.","이사 이유는 지문에 없다.","안전함은 부수적 결과일 뿐 보안 시스템은 없다.","작은 교류가 공동체를 만든다는 것이 핵심이다.","글은 이웃과의 인사를 권한다."],"a":3,"n":53},{"lv":1,"ty":1,"tp":"건강","p":"Laughter is more than a reaction to something funny. When we laugh, the body releases chemicals that reduce pain and stress. A good laugh can even improve blood flow. Friends who laugh together also feel closer to one another. Perhaps the old saying is true: laughter really is the best medicine.","k":"When we laugh, the body releases chemicals that reduce pain and stress.","c":["Laughter: Nature's Medicine for Body and Mind","How to Become a Professional Comedian","Why Pain Is Good for You","Friendship Rules Every Child Should Know Before Starting School","Better Blood Flow Through Laughter"],"t":["-","이","반","세","부"],"r":["웃음이 몸과 마음에 이롭다는 핵심이다.","코미디언 되는 법은 글과 무관하다.","웃음은 통증을 줄여 준다고 했다.","친구와의 유대는 부수적 내용이다.","혈류 개선은 효과의 일부만 다룬 제목이다."],"a":0,"n":54},{"lv":1,"ty":2,"tp":"건강","p":"Many people exercise only on weekends, hoping to make up for a busy week. But the body responds better to steady activity than to occasional bursts. Short walks or stretches spread throughout the week keep muscles active and reduce the risk of injury. Consistency matters far more than intensity.","k":"Consistency matters far more than intensity.","c":["바쁜 사람일수록 주말에 몰아서 운동하는 것이 효율적이다.","운동 중 부상을 예방하려면 준비 운동이 필수적이다.","운동은 가끔 강하게 하기보다 꾸준히 하는 것이 몸에 더 이롭다.","걷기와 스트레칭은 모든 운동 중 가장 효과적이다.","주말에 운동을 하는 사람은 평일에 활동량이 적다."],"t":["반","상","-","과","비"],"r":["글이 비판하는 방식이다.","준비 운동은 언급되지 않았다.","꾸준함이 강도보다 중요하다는 결론이다.","예시를 '가장 효과적'으로 확대했다.","평일 활동량은 글에 없다."],"a":2,"n":55},{"lv":1,"ty":3,"tp":"건강","p":"People often take medicine for every minor ache, believing a pill is a quick solution. Yet many mild problems, such as a light cold or a slight headache, improve with rest and fluids. Using medicine unnecessarily can cause side effects and make it less effective when we really need it. We should avoid taking medicine for minor symptoms unless necessary.","k":"We should avoid taking medicine for minor symptoms unless necessary.","c":["몸이 조금이라도 아플 때에는 증상이 심해지기 전에 가능한 한 빨리 약을 먹어야 한다.","감기에 걸렸을 때에는 충분한 수분을 섭취해야 한다.","약을 먹을 때에는 부작용에 대해 의사와 상담해야 한다.","모든 약은 사용할수록 효과가 떨어진다.","가벼운 증상에는 꼭 필요하지 않다면 약 복용을 자제해야 한다."],"t":["반","세","상","과","-"],"r":["글이 비판하는 태도이다.","수분 섭취는 세부 내용일 뿐이다.","의사 상담은 글에 없다.","'모든 약'은 지나친 일반화이다.","사소한 증상에는 불필요한 약 복용을 피하라는 것이 주장이다."],"a":4,"n":56},{"lv":1,"ty":0,"tp":"건강","p":"Many people skip breakfast because they are in a hurry. However, a balanced morning meal gives the body energy after a long night without food. Students who eat breakfast concentrate better in class, and workers who eat it make fewer mistakes. Taking just ten minutes to eat in the morning can improve the whole day.","k":"a balanced morning meal gives the body energy","c":["the benefits of eating breakfast for daily performance","healthy recipes for lunch and dinner","the reasons people gain weight in the morning","differences between school and office schedules","the harm of eating too much in the morning"],"t":["-","이","상","세","반"],"r":["아침 식사가 하루의 수행에 도움이 된다는 내용이다.","점심·저녁 요리법은 다루지 않았다.","아침 체중 증가는 지문 밖 내용이다.","학생·직장인은 예시일 뿐이다.","글은 아침 식사를 권한다."],"a":0,"n":57},{"lv":1,"ty":1,"tp":"기술","p":"Every time we use a free app, we may be paying with our personal information. Companies collect data about what we search, buy, and like, and then sell it to advertisers. Most users never read the long privacy rules before clicking 'agree.' Taking a few moments to check settings can help protect what belongs to us.","k":"we may be paying with our personal information","c":["The Best Free Apps for Shopping","Why Advertisers Are Honest with Customers","Long Rules Are Always Better Rules","What We Search, Buy, and Like","Free Apps, Hidden Costs: Protect Your Data"],"t":["이","반","비","세","-"],"r":["쇼핑 앱 추천은 글과 무관하다.","글은 광고주에게 정보가 팔린다고 경고한다.","긴 약관이 더 좋다는 것은 근거가 없다.","수집 항목만 다룬 세부 내용 제목이다.","무료 앱의 숨은 비용과 정보 보호를 담았다."],"a":4,"n":58},{"lv":1,"ty":2,"tp":"기술","p":"Self-driving cars promise to make roads safer by removing human error. But they also raise difficult questions: who is responsible when an accident occurs, and how should the car choose between two harmful outcomes? Technology alone cannot answer these questions. Society must discuss and agree on clear rules before such cars become common.","k":"Society must discuss and agree on clear rules","c":["자율주행차는 인간의 실수를 완전히 없애 주기 때문에 어떤 상황에서도 인간 운전자보다 항상 더 안전하다.","자율주행차 개발 속도를 늦추어야 한다.","교통사고의 대부분은 운전자의 실수로 발생한다.","기술이 발전하면 윤리적 문제는 저절로 해결된다.","자율주행 기술이 널리 쓰이기 전에 책임 문제에 대한 사회적 합의가 필요하다."],"t":["과","비","세","반","-"],"r":["'항상'은 지나친 단정이며 글은 의문을 제기한다.","개발 속도 조절은 글에 없다.","인간 실수는 도입부의 세부 내용이다.","글은 기술만으로 풀 수 없다고 한다.","기술만으로는 안 되고 사회적 합의가 필요하다는 결론이다."],"a":4,"n":59},{"lv":1,"ty":3,"tp":"기술","p":"Artificial intelligence can write essays and solve math problems in seconds, tempting students to let it do their work. But learning happens when we struggle with ideas ourselves. If we outsource the thinking, we lose the practice that builds skill. Students should use such tools as helpers for understanding, not as replacements for their own effort.","k":"Students should use such tools as helpers for understanding, not as replacements for their own effort.","c":["학생들은 인공지능을 자신의 노력을 대신하는 도구가 아니라 이해를 돕는 도구로 써야 한다.","인공지능의 사용은 학교에서 전면 금지되어야 한다.","수학 문제는 인공지능보다 사람이 더 빠르게 풀 수 있다.","글쓰기 능력은 인공지능 시대에 더 이상 필요하지 않다.","학생들은 새로운 기술을 빠르게 익혀야 한다."],"t":["-","비","반","과","상"],"r":["인공지능은 대체가 아닌 이해의 보조 도구로 쓰라는 것이 주장이다.","전면 금지는 글에 없다.","글은 인공지능이 몇 초 만에 푼다고 한다.","글의 취지와 어긋난 과장이다.","신기술 습득은 글에 없다."],"a":0,"n":60},{"lv":1,"ty":0,"tp":"교육","p":"Reading for pleasure does more than entertain. Children who read regularly build larger vocabularies and develop stronger imaginations. They also learn to understand other people's feelings by living through the experiences of characters in stories. Parents who place books within easy reach of their children are giving them a gift that lasts a lifetime.","k":"Reading for pleasure does more than entertain.","c":["the lasting benefits of reading for children","how to choose the best bookstore in town","the importance of watching educational television","vocabulary tests for elementary school students","the high price of children's books"],"t":["-","이","상","세","이"],"r":["독서가 아이에게 주는 지속적인 이점이 중심이다.","서점 선택은 글과 무관하다.","교육 방송은 지문에 없다.","어휘력은 이점 중 하나일 뿐이다.","책 가격은 언급되지 않았다."],"a":0,"n":61},{"lv":1,"ty":1,"tp":"교육","p":"One of the best ways to understand something is to teach it to someone else. When we explain an idea, we must organize our thoughts and notice what we do not truly know. Students who tutor classmates often improve their own grades. Teaching is not only giving knowledge to others but also strengthening our own.","k":"One of the best ways to understand something is to teach it to someone else.","c":["The Difficulty of Finding a Good Tutor","Why Students Should Avoid Their Classmates During Study Time at School","Grades: The Only Measure of Learning","Organizing Your Desk for Study","Teach to Learn: Strengthening Knowledge by Sharing"],"t":["이","반","과","상","-"],"r":["좋은 교사 찾기는 다루지 않았다.","글은 급우를 가르치라고 한다.","성적만이 척도라는 과장이다.","책상 정리는 지문 밖 내용이다.","가르치면서 배운다는 핵심이다."],"a":4,"n":62},{"lv":1,"ty":2,"tp":"교육","p":"Many people believe that each student has a fixed learning style, such as visual or auditory, and should be taught only in that style. However, studies have found little evidence that matching teaching to a preferred style improves results. Students learn best when information is presented in the way that suits the content itself: maps for geography, sounds for music. Teachers should choose methods by subject, not by label.","k":"Teachers should choose methods by subject, not by label.","c":["학생마다 선호하는 학습 방식을 정확히 파악해야 한다.","학습 내용과 관계없이 시각 자료를 활용한 수업은 청각 자료를 활용한 수업보다 학습 효과가 크다.","교수법은 학생의 선호 유형보다 학습 내용의 성격에 맞게 선택해야 한다.","지리 수업에서는 지도를 활용하는 것이 효과적이다.","학생들은 자신에게 맞는 공부 방법을 스스로 찾아야 한다."],"t":["반","비","-","세","상"],"r":["글이 반박하는 통념이다.","두 유형의 우열은 글에 없다.","내용의 성격에 맞춘 교수법이 중요하다는 결론이다.","지도는 예시일 뿐이다.","학생 스스로 찾기는 글에 없다."],"a":2,"n":63},{"lv":1,"ty":3,"tp":"교육","p":"Parents often rush to solve every problem their children face, from forgotten homework to arguments with friends. While this comes from love, it prevents children from developing resilience. Children who never face difficulty struggle when problems finally arrive. Parents should allow their children to handle small challenges on their own.","k":"Parents should allow their children to handle small challenges on their own.","c":["부모는 사랑하는 자녀가 겪는 모든 문제를 미리 적극적으로 나서서 해결해 주어야 한다.","자녀의 친구 관계에 부모가 적극적으로 개입해야 한다.","자녀가 숙제를 잊지 않도록 부모가 챙겨 주어야 한다.","부모는 자녀에게 사랑을 충분히 표현해야 한다.","부모는 자녀가 작은 어려움을 스스로 해결하도록 지켜봐 주어야 한다."],"t":["반","비","세","상","-"],"r":["글이 비판하는 태도이다.","개입 권장은 글과 반대 방향의 비약이다.","숙제는 예시이며 글은 챙겨 주는 것을 비판한다.","사랑의 표현은 글에 없다.","자녀가 작은 어려움을 직접 해결하게 두라는 것이 주장이다."],"a":4,"n":64},{"lv":1,"ty":0,"tp":"환경","p":"Trees in a city do more than provide shade. They absorb pollution, cool the air in summer, and reduce noise from traffic. Studies show that neighborhoods with more trees have lower temperatures and healthier residents. Planting trees along streets is therefore a simple and effective way to improve city life.","k":"Trees in a city do more than provide shade.","c":["the best season for planting young trees","the causes of traffic noise in big cities","the damage that tall buildings do to nature","the cooling effect of tree shade on outdoor sports and exercise in summer","the multiple benefits of planting trees in cities"],"t":["상","세","이","부","-"],"r":["식재 시기는 지문에 없다.","소음은 나무의 효과 중 하나일 뿐이다.","고층 건물은 소재에서 벗어난다.","그늘의 냉각 효과 일부만, 스포츠는 지문에 없다.","도시 나무가 주는 여러 이점이 중심이다."],"a":4,"n":65},{"lv":1,"ty":1,"tp":"환경","p":"Every year, millions of tons of plastic enter the oceans. Sea turtles mistake bags for jellyfish, and seabirds feed pieces of plastic to their young. Because plastic breaks down so slowly, it remains in the water for hundreds of years. Reducing the plastic we use is the most direct way to protect marine life.","k":"Reducing the plastic we use is the most direct way to protect marine life.","c":["Jellyfish: The Favorite Food of Turtles","The Beauty of Ocean Travel","Plastic in the Sea: A Threat to Marine Life","Plastic Makes Marine Life Stronger","Seabirds in Danger from Plastic"],"t":["세","이","-","반","부"],"r":["해파리는 거북 사례의 일부일 뿐이다.","바다 여행은 글과 무관하다.","해양 플라스틱이 해양 생물을 위협한다는 핵심이다.","플라스틱은 해양 생물을 해친다.","바닷새는 피해 사례 하나일 뿐이다."],"a":2,"n":66},{"lv":1,"ty":2,"tp":"환경","p":"Roads and fences divide natural habitats into small pieces, making it hard for animals to find food and mates. In response, some countries have built bridges and tunnels that allow wildlife to cross safely. These corridors reduce accidents and help animal populations stay healthy. Protecting nature does not always mean setting land aside; sometimes it means reconnecting what we have separated.","k":"sometimes it means reconnecting what we have separated","c":["도로 건설은 야생동물 보호를 위해 중단되어야 한다.","야생동물 보호를 위해서는 넓은 땅을 따로 보존해야 한다.","동물들은 먹이를 찾기 위해 먼 거리를 이동한다.","야생동물이 도로를 건너도록 만든 다리와 터널은 모든 종류의 동물에게 똑같이 효과적인 보호 수단이다.","야생동물의 서식지를 이어 주는 시설이 생태계 보호에 도움이 된다."],"t":["비","반","세","과","-"],"r":["건설 중단은 글에 없는 비약이다.","글은 보존 외의 방법을 제시한다.","이동 거리는 배경 설명일 뿐이다.","'모든 종류'는 일반화이다.","서식지를 다시 잇는 통로가 야생동물 보호에 효과적이라는 내용이다."],"a":4,"n":67},{"lv":1,"ty":3,"tp":"사회","p":"Public parks belong to everyone, but they stay clean only when everyone cares. Litter left behind by a few visitors spoils the experience for the rest. Because shared spaces have no single owner, people often assume someone else will take care of them. Each visitor should take responsibility for keeping shared spaces clean.","k":"Each visitor should take responsibility for keeping shared spaces clean.","c":["공원 관리를 전담하는 인력을 늘려야 한다.","공원에 쓰레기를 함부로 버린 사람에게는 반드시 일정한 금액의 벌금을 부과하여 책임을 물어야 한다.","공원은 모든 사람이 자유롭게 이용할 수 있어야 한다.","공공장소를 이용하는 사람은 각자 청결을 유지할 책임을 가져야 한다.","공공장소의 소유권은 지역 사회에 있어야 한다."],"t":["반","비","부","-","이"],"r":["글은 남에게 맡기려는 태도를 문제 삼는다.","벌금은 글에 없는 비약이다.","공원의 개방성은 도입부 전제일 뿐이다.","이용자 각자가 청결 유지의 책임을 지라는 것이 주장이다.","소유권 논의는 글에 없다."],"a":3,"n":68},{"lv":1,"ty":0,"tp":"경제","p":"Online shopping lets us buy almost anything with a few clicks, but this convenience has a hidden cost. Because paying does not feel like handing over real money, people tend to spend more than they planned. Free shipping offers and one-click purchases make impulse buying even easier. Being aware of these tricks is the first step toward spending wisely.","k":"people tend to spend more than they planned","c":["the speed of delivery services around the world","the financial benefits of online shopping","how shipping companies reduce their costs","how online shopping encourages overspending","the effect of free shipping on delivery speed"],"t":["이","반","이","-","세"],"r":["배송 속도는 글과 무관하다.","글은 숨은 비용을 경고한다.","배송 업체의 비용은 다루지 않았다.","온라인 쇼핑이 과소비를 부추긴다는 내용이다.","무료 배송은 예시이며 배송 속도와는 무관하다."],"a":3,"n":69},{"lv":1,"ty":1,"tp":"사회","p":"A part-time job can teach teenagers lessons that school cannot. They learn to manage time, deal with customers, and take responsibility for their work. Earning their own money also helps them understand its value. Of course, schoolwork must not suffer, but with balance, early work experience builds character and independence.","k":"A part-time job can teach teenagers lessons that school cannot.","c":["Why Teenagers Should Never Work","Part-Time Jobs: Building Character Early","How to Deal with Angry Customers","Schoolwork Matters Less Than Money","The Easiest Jobs for Young People"],"t":["반","-","세","비","이"],"r":["글은 청소년의 일 경험을 긍정한다.","아르바이트가 성품과 독립심을 키운다는 핵심이다.","고객 응대는 배우는 것 중 하나일 뿐이다.","학업이 덜 중요하다는 것은 글과 어긋난다.","쉬운 일자리는 다루지 않았다."],"a":1,"n":70},{"lv":1,"ty":2,"tp":"심리","p":"It is natural to compare ourselves with others, but constant comparison often leads to unhappiness. There will always be someone who seems richer, smarter, or more successful. A healthier approach is to compare ourselves with who we were yesterday. Progress measured against our own past gives us a fair and encouraging standard.","k":"compare ourselves with who we were yesterday","c":["다른 사람보다 과거의 자신과 비교하는 것이 행복에 더 도움이 된다.","행복해지려면 다른 사람과 자신을 비교하는 일은 어떤 경우에도 반드시 피해야 한다고 할 수 있다.","성공한 사람들은 남과 비교하지 않는다.","남보다 더 부유해지는 것이 행복의 조건이다.","어제의 목표를 이루지 못하면 불행해진다."],"t":["-","과","상","반","비"],"r":["타인이 아닌 어제의 나와 비교하라는 결론이다.","글은 '지속적인' 비교를 문제 삼으며 비교 자체를 금하지 않는다.","성공한 사람의 습관은 언급되지 않았다.","글의 취지와 반대이다.","목표 달성 여부와 불행은 연결되지 않는다."],"a":0,"n":71},{"lv":1,"ty":3,"tp":"경제","p":"Many young people postpone learning about money because it seems boring or complicated. But financial mistakes made early, such as unplanned debt, can follow a person for years. Understanding basic ideas like budgeting and interest does not require special talent. Young people should learn how to manage money before they begin earning it.","k":"Young people should learn how to manage money before they begin earning it.","c":["젊은 시절부터 돈을 관리하는 방법을 미리 배워야 한다.","경제 지식은 타고난 재능이 있는 사람만 익힐 수 있다.","경제적으로 빚을 지지 않도록 젊은 시절부터 소비를 최대한 줄이고 저축을 우선해야 한다.","이자율이 높은 은행을 찾아 저축해야 한다.","일찍 취업하여 경제적 독립을 이루어야 한다."],"t":["-","반","비","상","이"],"r":["소득을 얻기 전에 돈 관리를 배우라는 것이 주장이다.","글은 특별한 재능이 필요 없다고 한다.","소비 억제는 글에 없다.","은행 선택은 지문에 없다.","조기 취업은 글의 소재가 아니다."],"a":0,"n":72},{"lv":1,"ty":0,"tp":"과학","p":"The moon is not just a light in the night sky; it also moves the oceans. Its gravity pulls on Earth's water, creating the rise and fall of tides twice a day. Fishermen and sailors have long used this pattern to plan their work. Understanding the moon's pull helps us predict the sea's behavior.","k":"Its gravity pulls on Earth's water, creating the rise and fall of tides","c":["the discovery of life on the moon","how fishermen build stronger boats for rough ocean waters","the moon's gravity as the cause of ocean tides","the brightness of the moon at night","the danger of sailing during storms"],"t":["이","이","-","세","상"],"r":["달의 생명체는 언급되지 않았다.","배 건조는 글과 무관하다.","달의 중력이 조수를 만든다는 내용이다.","달빛은 도입부의 언급일 뿐이다.","폭풍 속 항해는 지문 밖 내용이다."],"a":2,"n":73},{"lv":1,"ty":1,"tp":"과학","p":"Many people think the seasons change because Earth moves closer to or farther from the sun. In fact, the cause is Earth's tilted axis. When our part of the world leans toward the sun, we receive more direct sunlight and enjoy summer. When it leans away, days grow short and cold. The tilt, not the distance, creates the cycle of seasons.","k":"the cause is Earth's tilted axis","c":["The Distance from the Sun Alone Controls the Seasons of the Year","Short Days and Cold Weather in Winter","The Best Clothes for Each Season","Earth's Tilt: The Real Cause of the Seasons","Why Summer Is Everyone's Favorite"],"t":["반","부","이","-","상"],"r":["글이 바로잡는 통념이다.","겨울 현상만 다룬 일부 내용이다.","계절별 옷차림은 글과 무관하다.","계절의 원인이 지구의 기울기라는 핵심이다.","여름 선호는 지문에 없다."],"a":3,"n":74},{"lv":1,"ty":2,"tp":"사회","p":"As local newspapers close, communities lose more than a source of information. Without reporters watching city councils and school boards, officials face less scrutiny, and citizens know less about decisions affecting their lives. Studies show that towns without local news often see lower voter participation. A healthy community depends on informed citizens, and informed citizens depend on local reporting.","k":"A healthy community depends on informed citizens","c":["신문사는 수익을 높이기 위해 온라인으로 전환해야 한다.","지방 의회는 시민의 감시가 없으면 부패한다.","지역 언론이 사라진 지역에서는 시민의 정치 참여가 줄어들어 투표율이 반드시 크게 떨어진다.","지역 언론은 시민이 정보를 얻고 공동체가 건강하게 유지되는 데 필수적이다.","시민들은 정부의 결정에 직접 참여해야 한다."],"t":["이","과","비","-","상"],"r":["신문사의 수익 모델은 다루지 않았다.","'부패한다'는 지나친 단정이다.","글은 '자주'라고 했을 뿐 '반드시'가 아니다.","지역 언론이 정보에 밝은 시민과 건강한 공동체의 토대라는 내용이다.","직접 참여는 글에 없다."],"a":3,"n":75},{"lv":1,"ty":3,"tp":"환경","p":"Old buildings are often torn down because new ones seem more modern. Yet demolishing a building wastes the materials and energy used to make it, and creates huge amounts of waste. Renovating an existing building usually costs less and keeps the character of the neighborhood. Cities should preserve and reuse old buildings whenever possible.","k":"Cities should preserve and reuse old buildings whenever possible.","c":["도시는 시민들의 요구에 맞추어 더 현대적이고 효율적인 건물을 더 많이 지어야 한다.","도시는 가능하면 오래된 건물을 허물기보다 보존하고 재사용해야 한다.","건물을 짓는 데 쓰이는 자재의 양을 줄여야 한다.","건물의 보수 비용은 정부가 부담해야 한다.","오래된 건물은 지역 주민이 직접 관리해야 한다."],"t":["반","-","부","상","이"],"r":["글이 비판하는 방향이다.","오래된 건물을 보존·재사용하라는 것이 주장이다.","자재 절감은 근거의 일부일 뿐이다.","비용 부담 주체는 언급되지 않았다.","주민 관리는 글에 없다."],"a":1,"n":76},{"lv":1,"ty":0,"tp":"심리","p":"We often judge people within seconds of meeting them, based on their appearance and expression. But first impressions are frequently wrong. A quiet person may be thoughtful rather than unfriendly, and a confident speaker may not be as knowledgeable as he seems. To understand someone truly, we need time and a willingness to look beyond the surface.","k":"first impressions are frequently wrong","c":["the power of confidence in public speaking","the unreliability of first impressions","effective ways to make new friends quickly","the importance of dressing well at interviews","the advantage of making quick decisions"],"t":["세","-","상","상","반"],"r":["자신감 있는 화자는 예시일 뿐이다.","첫인상이 자주 틀린다는 것이 핵심이다.","친구 사귀는 법은 지문에 없다.","면접 복장은 지문 밖 내용이다.","글은 성급한 판단을 경계한다."],"a":1,"n":77},{"lv":1,"ty":1,"tp":"심리","p":"People often choose music to match or change their feelings. Cheerful songs can lift a low mood, while calm melodies help the body relax after a stressful day. Many athletes listen to fast music before competitions to feel energized. Music is a powerful tool for managing our emotions, available to anyone with a pair of headphones.","k":"Music is a powerful tool for managing our emotions","c":["Music as a Tool for Shaping Our Feelings","The Training Methods of Professional Athletes","Why Headphones Damage Our Hearing","Sad Songs Always Make People Cry","How Composers Write Cheerful Melodies"],"t":["-","세","상","과","이"],"r":["음악이 감정을 조절하는 도구라는 핵심이다.","운동선수는 예시일 뿐이다.","청력 손상은 지문에 없다.","'항상'이라는 근거 없는 일반화이다.","작곡 방법은 다루지 않았다."],"a":0,"n":78},{"lv":1,"ty":2,"tp":"경제","p":"Starting to save money early in life has a powerful effect. Because interest is earned on previous interest, even small amounts grow quickly over decades. Someone who saves a modest sum from age twenty can end up with more than someone who starts later and saves twice as much. In saving, time is often more valuable than the amount.","k":"In saving, time is often more valuable than the amount.","c":["저축은 많은 금액을 한꺼번에 모으는 것이 유리하다.","저축은 금액의 크기보다 일찍 시작하는 것이 더 중요할 수 있다.","이자율이 높은 금융 상품을 선택해야 한다.","나이가 들수록 저축의 필요성이 줄어든다.","20대에는 소비보다 저축을 우선해야 한다."],"t":["반","-","상","비","과"],"r":["글은 일찍 시작하는 것이 중요하다고 한다.","저축에서는 기간이 금액보다 중요하다는 결론이다.","금융 상품 선택은 지문에 없다.","저축의 필요성 감소는 글에 없다.","20세는 예시일 뿐이며 소비 억제는 언급되지 않았다."],"a":1,"n":79},{"lv":1,"ty":3,"tp":"심리","p":"Many people believe they must wait for a perfect moment to begin something important. But perfect moments rarely come, and waiting often becomes an excuse. Starting imperfectly allows us to learn and adjust along the way. Rather than waiting for ideal conditions, we should begin with what we have.","k":"we should begin with what we have","c":["중요한 일은 시작하기 전에 필요한 조건을 충분히 갖추고 철저하게 준비한 후에 시작해야 한다.","완벽한 순간은 노력하면 반드시 찾아온다.","완벽한 조건을 기다리기보다 지금 가진 것으로 일단 시작해야 한다.","실패를 줄이려면 계획을 세밀하게 세워야 한다.","시작한 일은 끝까지 포기하지 않고 해내야 한다."],"t":["반","비","-","상","부"],"r":["글이 비판하는 태도이다.","글은 완벽한 순간이 드물다고 한다.","완벽한 조건을 기다리지 말고 지금 시작하라는 것이 주장이다.","세밀한 계획은 글에 없다.","끈기는 글의 논점이 아니다."],"a":2,"n":80},{"lv":1,"ty":0,"tp":"교육","p":"Group projects can be frustrating when some members do more work than others. Even so, they teach skills that no textbook can: listening to different opinions, dividing tasks fairly, and solving disagreements. These abilities are exactly what employers look for. Students who learn to cooperate now will find it much easier to succeed in their future workplaces.","k":"they teach skills that no textbook can","c":["the unfairness of grading in group work","the best textbooks for learning cooperation","how employers choose new workers","valuable cooperation skills gained through group projects","the reasons students should avoid teamwork"],"t":["세","상","부","-","반"],"r":["불공평함은 도입부 양보 내용이다.","교재 추천은 지문에 없다.","고용주는 부수적으로만 언급된다.","조별 과제로 얻는 협력 기술이 중심이다.","글은 조별 활동의 가치를 말한다."],"a":3,"n":81},{"lv":1,"ty":1,"tp":"교육","p":"When schools cut art classes to save money, they may be losing more than they realize. Drawing and painting teach students to observe carefully, express ideas, and think creatively. These skills help in science, writing, and even business. Art is not a break
