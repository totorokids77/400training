1,"tp":"환경","p":"About one third of the food produced in the world is never eaten. Some is lost on farms and in transport, but a large share is thrown away by households and restaurants. Wasted food also wastes the water, land, and energy used to grow it. Planning meals, storing food properly, and using leftovers are small household habits that, taken together, could cut this loss significantly.","k":"small household habits that, taken together, could cut this loss significantly","c":["The Best Farms for Growing Large Crops","Restaurant Menus Around the World","How Transport Trucks Lose Their Cargo","From Plate to Trash: Cutting Down on Wasted Food","Why Households Should Stop Buying Food"],"t":["이","상","세","-","과"],"r":["대규모 농장은 다루지 않았다.","각국의 메뉴는 지문에 없다.","운송 중 손실은 원인 중 일부일 뿐이다.","음식물 낭비와 가정에서의 감축 습관이 핵심이다.","식품 구매 중단은 극단적 비약이다."],"a":3,"n":174},{"lv":2,"ty":2,"tp":"교육","p":"Standardized tests are efficient for comparing large numbers of students, which explains their popularity. But they measure only what is easy to score, such as recall of facts, and leave out skills like collaboration or creative problem solving. When schools teach to the test, these neglected skills fade from the classroom. What is measured tends to become what is taught, so choosing what to measure is itself an educational decision.","k":"choosing what to measure is itself an educational decision","c":["표준화 시험은 많은 학생을 한꺼번에 비교하는 데 있어 가장 공정하고 효율적인 평가 방법이다.","학교는 시험이 없는 수업을 늘려야 한다.","협력과 창의적 문제 해결력은 평가할 수 없는 능력이다.","무엇을 평가하느냐가 곧 무엇을 가르치느냐를 결정하므로 평가 내용의 선택은 교육적 결정이다.","교사는 시험 문제를 직접 출제하는 것이 바람직하다."],"t":["과","비","반","-","상"],"r":["공정성 평가는 글에 없다.","시험 폐지는 글에 없는 비약이다.","글은 점수화하기 어렵다고 했지 평가 불가라고 하지 않았다.","평가 항목의 선택이 교육 내용을 좌우한다는 결론이다.","출제 주체는 지문에 없다."],"a":3,"n":175},{"lv":2,"ty":3,"tp":"건강","p":"Many adults avoid medical checkups when they feel fine. But some conditions, such as high blood pressure, show no symptoms until they become serious. Early detection allows simple treatment, while late discovery often requires costly care. We should schedule regular checkups even when we feel healthy.","k":"schedule regular checkups even when we feel healthy","c":["자신이 건강하다고 느낀다면 굳이 시간을 내어 병원을 찾아가지 않아도 문제가 없다.","고혈압은 증상이 나타나면 즉시 치료를 시작해야 한다.","건강 검진 비용은 정부가 전액 지원해야 한다.","몸에 이상이 없더라도 정기적으로 건강 검진을 받아야 한다.","병원을 자주 방문하면 질병에 걸릴 확률이 줄어든다."],"t":["반","부","상","-","비"],"r":["글이 비판하는 태도이다.","증상이 없을 때 발견해야 한다는 취지와 어긋난다.","비용 지원은 지문에 없다.","건강해도 정기 검진을 받으라는 것이 주장이다.","방문 횟수와 발병률은 글에 없다."],"a":3,"n":176},{"lv":2,"ty":0,"tp":"과학","p":"Why do we yawn? The popular answer, that yawning brings in more oxygen, has been challenged by experiments showing that breathing extra oxygen does not stop yawns. A newer idea suggests that yawning helps cool the brain by drawing in cooler air and increasing blood flow. This might explain why we yawn more when we are tired or when the room is warm. Even a common habit can hide scientific puzzles that are still being solved.","k":"Even a common habit can hide scientific puzzles that are still being solved.","c":["competing scientific explanations of why we yawn","the way yawning spreads from person to person","the role of oxygen in stopping yawns","the dangers of working in warm rooms","the proven cause of yawning in animals"],"t":["-","상","부","이","과"],"r":["하품의 이유에 대한 서로 다른 과학적 설명이 핵심이다.","하품의 전염은 지문에 없다.","산소 가설만 다루고 새 가설이 빠졌다.","따뜻한 방의 위험은 다루지 않았다.","글은 원인이 확정되지 않았다고 한다."],"a":0,"n":177},{"lv":2,"ty":1,"tp":"사회","p":"A mentor does not simply hand over answers; a good one asks questions that help a younger person think. Studies of successful careers find that many professionals credit a mentor for opening a door or for encouraging them after a failure. Mentoring also benefits the mentor, who gains fresh perspectives and renews his or her sense of purpose. The relationship works best when both sides learn from each other.","k":"The relationship works best when both sides learn from each other.","c":["Mentors Who Give All the Answers","Mentoring: A Two-Way Road of Learning","Career Doors That Only Mentors Can Open","How Professionals Choose Their Careers","Choosing a Young Person to Lead a Team"],"t":["반","-","과","상","이"],"r":["글은 답을 주기보다 질문하는 멘토를 말한다.","멘토링이 서로에게 배움이 되는 관계라는 내용이다.","'멘토만이' 문을 연다는 것은 과장이다.","직업 선택 과정은 지문에 없다.","팀 리더 선발은 다루지 않았다."],"a":1,"n":178},{"lv":2,"ty":2,"tp":"심리","p":"People often believe they are good at multitasking, switching between messages and work with ease. But studies find that each switch carries a cost: the mind needs time to refocus, and errors increase. What feels like doing two things at once is actually rapid alternating that reduces the quality of both. Focusing on one task at a time is usually the faster way to get things done well.","k":"Focusing on one task at a time is usually the faster way to get things done well.","c":["멀티태스킹 능력은 꾸준히 연습하면 누구나 충분히 향상시킬 수 있으므로 적극적으로 길러야 한다.","업무 중에는 메시지를 확인해서는 안 된다.","여러 일을 동시에 하기보다 한 번에 하나에 집중하는 것이 더 빠르고 정확하다.","사람들은 자신의 능력을 실제보다 높게 평가한다.","전환할 때마다 마음이 다시 집중하는 데 시간이 든다."],"t":["반","비","-","상","세"],"r":["글은 멀티태스킹의 비용을 지적한다.","확인 금지는 글에 없다.","멀티태스킹은 비효율적이고 단일 작업 집중이 낫다는 결론이다.","자기 과대평가는 지문 밖 일반 상식이다.","전환 비용은 근거로 든 세부 내용이다."],"a":2,"n":179},{"lv":2,"ty":3,"tp":"기술","p":"Passwords are often chosen for convenience, such as a pet's name or a birthday, which makes them easy to guess. People also reuse the same password across many sites, so one leak can open many doors. A password manager can create and store strong, unique passwords without effort. We should use unique passwords for each account and let a manager remember them.","k":"use unique passwords for each account","c":["비밀번호는 잊어버리지 않도록 기억하기 쉬운 것으로 정해서 모든 계정에 사용하는 것이 가장 안전하다.","계정마다 서로 다른 비밀번호를 사용하고 관리 프로그램을 활용해야 한다.","비밀번호는 수첩에 적어 두는 것이 가장 안전하다.","비밀번호를 자주 바꾸면 해킹을 완전히 막을 수 있다.","개인 정보 유출 사고는 기업이 책임져야 한다."],"t":["반","-","비","과","상"],"r":["글은 추측하기 쉽다고 지적한다.","계정별 고유 비밀번호와 관리 프로그램 사용을 권하는 주장이다.","수첩 보관은 글에 없다.","'완전히 막는다'는 과장이다.","기업의 책임은 지문에 없다."],"a":1,"n":180},{"lv":2,"ty":0,"tp":"예술","p":"Street art is often dismissed as vandalism, but many cities now treat it as part of their cultural life. Murals brighten empty walls, tell neighborhood stories, and attract visitors who spend money in local shops. Some artists work with residents so that paintings reflect the community's own identity. When art is made with people rather than simply placed in front of them, a wall becomes a shared voice.","k":"When art is made with people rather than simply placed in front of them, a wall becomes a shared voice.","c":["the legal punishment for painting on public walls","the community value of street art in cities","the economic effects of tourism on local shops","the techniques artists use to paint large murals","the role of murals in solving every urban problem"],"t":["반","-","세","이","과"],"r":["글은 거리 예술을 문화로 본다.","거리 예술이 공동체에 주는 가치가 핵심이다.","상점 매출은 이점 중 하나일 뿐이다.","벽화 기법은 다루지 않았다.","'모든 도시 문제'의 해결은 지나친 확대이다."],"a":1,"n":181},{"lv":2,"ty":1,"tp":"교육","p":"A walk through a park can teach more about ecosystems than a page in a textbook. Students who spend lessons outdoors observe living systems directly, ask their own questions, and remember what they saw. Outdoor lessons also reduce restlessness, since movement and fresh air help children concentrate. Schools do not need special equipment to begin; a schoolyard, a garden, or a nearby stream is enough.","k":"Schools do not need special equipment to begin","c":["Textbooks: The Heart of Every Science Lesson","The Classroom Beyond the Walls","Why Children Get Restless in Class","Parks Around the World","Nature Study: The Only Real Education"],"t":["반","-","부","이","과"],"r":["글은 교과서보다 직접 관찰이 낫다고 한다.","교실 밖 야외 수업의 가치를 담았다.","산만함 감소는 이점 중 하나일 뿐이다.","세계의 공원은 다루지 않았다.","'유일한 진짜 교육'은 지나친 단정이다."],"a":1,"n":182},{"lv":2,"ty":2,"tp":"건강","p":"Fruit juice is often considered healthy because it comes from fruit. However, juicing removes most of the fiber that slows sugar absorption, so a glass of juice can raise blood sugar almost as quickly as a soft drink. Whole fruit, by contrast, fills us up and releases sugar gradually. The form in which we eat a food can matter as much as the food itself.","k":"The form in which we eat a food can matter as much as the food itself.","c":["과일은 주스로 마시는 것이 먹기에 가장 편리하다.","과일 주스는 탄산음료와 건강에 미치는 영향이 같다.","식이 섬유를 섭취하면 혈당을 완전히 조절할 수 있다.","과일을 먹을 때에는 하루 섭취량을 제한해야 한다.","같은 식품이라도 먹는 형태에 따라 건강에 미치는 영향이 달라질 수 있다."],"t":["반","과","비","상","-"],"r":["글은 주스의 단점을 지적한다.","'almost as quickly'를 '같다'로 단정했다.","'완전히'는 근거 없는 비약이다.","섭취량 제한은 지문에 없다.","식품 자체만큼 섭취 형태도 중요하다는 결론이다."],"a":4,"n":183},{"lv":2,"ty":3,"tp":"예술","p":"Many people believe that appreciating art requires special knowledge. As a result, they feel intimidated and avoid galleries. But art begins with simple responses: what does this make me feel, and why? Knowledge can deepen the experience, but it is not a ticket of entry. We should approach art with curiosity and trust our own reactions.","k":"approach art with curiosity and trust our own reactions","c":["예술 작품을 제대로 감상하려면 미술사와 같은 전문 지식을 먼저 충분히 쌓아야 한다.","미술관은 입장료를 낮추어 방문객을 늘려야 한다.","작품에 대한 감상은 사람마다 정답이 다르다.","예술을 대할 때에는 지식이 부족하더라도 호기심을 갖고 자신의 반응을 믿어야 한다.","예술 지식이 많은 사람은 작품을 더 깊이 감상할 수 있다."],"t":["반","이","상","-","세"],"r":["글이 비판하는 통념이다.","입장료는 글과 무관하다.","정답 유무 논의는 지문에 없다.","지식보다 호기심과 자신의 반응을 믿으라는 주장이다.","글이 인정한 양보 내용일 뿐 주장이 아니다."],"a":3,"n":184},{"lv":2,"ty":0,"tp":"건강","p":"We often think of mental health only when something goes wrong, but experts compare it to physical fitness, something that needs regular care. Small daily habits such as sleeping enough, staying in touch with friends, and spending time outdoors build resilience before problems arrive. Waiting until a crisis to pay attention is like waiting for a broken leg to start exercising. Prevention, not just treatment, deserves our attention.","k":"Prevention, not just treatment, deserves our attention.","c":["the treatment methods for serious mental illness in hospitals and clinics today","the relationship between friendship and physical fitness","the best exercises for strengthening broken bones","daily habits that protect mental health before problems arise","why mental health is more important than physical health"],"t":["반","부","이","-","비"],"r":["글은 치료보다 예방을 강조한다.","친구와의 교류는 습관의 예일 뿐이다.","골절 운동은 비유 속 소재일 뿐이다.","문제가 생기기 전 일상 습관으로 정신 건강을 지킨다는 내용이다.","정신 건강이 더 중요하다는 비교는 글에 없다."],"a":3,"n":185},{"lv":2,"ty":1,"tp":"과학","p":"Antibiotics transformed medicine, but their overuse is making them less effective. When bacteria are exposed to a drug that does not kill them all, the survivors multiply and pass on their resistance. Taking antibiotics for illnesses they cannot treat, such as colds caused by viruses, speeds this process. Using these medicines only when truly needed is the best way to preserve their power for the future.","k":"Using these medicines only when truly needed","c":["The Medical Miracle of Antibiotics and How They Changed the World","How Viruses Cause the Common Cold","Use It Wisely or Lose It: The Threat of Resistant Bacteria","Why Bacteria Are Harmless to Humans","A World Without Any Medicine"],"t":["부","세","-","반","과"],"r":["항생제의 업적은 도입부일 뿐이다.","감기 바이러스는 예시일 뿐이다.","항생제를 필요할 때만 써야 내성을 막는다는 내용이다.","글은 내성균의 위협을 말한다.","의약품 전무는 지나친 과장이다."],"a":2,"n":186},{"lv":2,"ty":2,"tp":"과학","p":"For centuries, people believed that heavier objects fall faster than lighter ones, because everyday experience seems to confirm it. Galileo challenged the idea by reasoning and experiment, showing that in the absence of air resistance all objects fall at the same rate. The belief had lasted not because it was proven but because no one had tested it carefully. Common sense is a starting point for questions, not a substitute for evidence.","k":"Common sense is a starting point for questions, not a substitute for evidence.","c":["상식은 탐구의 출발점일 뿐 증거를 대신할 수 없다.","갈릴레오는 무거운 물체가 더 빨리 떨어진다는 것을 증명했다.","일상의 경험은 과학적 사실과 항상 어긋난다.","과학자는 오래된 믿음일수록 의심해야 한다.","공기 저항은 낙하 속도에 큰 영향을 준다."],"t":["-","반","과","비","세"],"r":["상식 대신 증거로 확인해야 한다는 결론이다.","갈릴레오는 그 믿음을 반박했다.","'항상'은 지나친 일반화이다.","오래될수록 의심한다는 것은 근거 없는 비약이다.","공기 저항은 실험 조건에 대한 세부 설명이다."],"a":0,"n":187},{"lv":2,"ty":3,"tp":"언어","p":"Learners often wait until they feel ready to speak a new language, but readiness rarely arrives by waiting. Speaking, even badly, reveals gaps that study alone cannot show. Native speakers are usually patient and encouraging toward learners. Learners should start speaking early and treat mistakes as information.","k":"start speaking early and treat mistakes as information","c":["충분히 준비되었다고 느낄 때 말하기를 시작해야 한다.","언어 학습자는 일찍부터 말하기를 시작하고 실수를 배움의 정보로 받아들여야 한다.","원어민은 학습자의 실수를 항상 너그럽게 받아 준다.","말하기보다 읽기와 쓰기를 먼저 익혀야 한다.","실수를 줄이기 위해 문법 공부에 더 많은 시간을 써야 한다."],"t":["반","-","과","상","비"],"r":["글이 비판하는 태도이다.","일찍 말하고 실수를 배움으로 삼으라는 주장이다.","글은 '대체로'라고 했을 뿐 '항상'이 아니다.","학습 순서는 지문에 없다.","문법 공부 확대는 글과 어긋난 비약이다."],"a":1,"n":188},{"lv":2,"ty":0,"tp":"경제","p":"Subscription services promise convenience, but their pricing relies on human forgetfulness. A small monthly fee seems harmless, so people sign up and then forget to cancel. Over a year, these tiny charges can quietly add up to a significant amount. Reviewing recurring payments every few months is a simple habit that can reveal money leaking away unnoticed.","k":"Reviewing recurring payments every few months is a simple habit","c":["how forgotten subscriptions quietly drain our money","the convenience of using subscription services for music, video, and other media","the history of monthly payment systems","ways to cancel online accounts quickly","why companies should lower monthly fees"],"t":["-","부","상","세","비"],"r":["잊힌 구독료가 조용히 돈을 새게 한다는 내용이다.","편리함은 도입부 전제일 뿐이다.","결제 제도의 역사는 지문에 없다.","해지 방법은 글에서 다루지 않았다.","요금 인하 요구는 글에 없는 비약이다."],"a":0,"n":189},{"lv":2,"ty":1,"tp":"사회","p":"Small talk is often dismissed as empty, yet it performs important social work. Chatting about weather or weekend plans signals friendliness and builds comfort before deeper conversation becomes possible. Research suggests that even brief friendly exchanges with strangers lift people's mood. What looks like meaningless talk is often the first step in building trust.","k":"What looks like meaningless talk is often the first step in building trust.","c":["Why Meaningful Talk Beats Small Talk","Weather: A Favorite Topic of Strangers","Making Friends at Weekend Events","The Hidden Value of Small Talk","Chatting with Strangers Solves All Loneliness"],"t":["반","세","이","-","과"],"r":["글은 잡담의 가치를 옹호한다.","날씨는 잡담 소재의 예일 뿐이다.","주말 행사는 다루지 않았다.","잡담의 숨은 가치를 말한다.","'모든 외로움 해결'은 과장이다."],"a":3,"n":190},{"lv":2,"ty":2,"tp":"언어","p":"Learners often fear that speaking with an accent makes them hard to understand. In fact, listeners usually understand accented speech well once they adjust, and clarity depends more on rhythm and stress than on perfect pronunciation of every sound. Spending effort on being understood, rather than on sounding like a native speaker, is a more realistic and useful goal.","k":"being understood, rather than on sounding like a native speaker","c":["발음과 억양이 원어민과 조금이라도 다르면 상대방이 말의 의미를 이해하기 어려우므로 억양부터 먼저 고쳐야 한다.","리듬과 강세는 발음보다 가르치기 쉬운 요소이다.","원어민과 자주 대화하면 학습자의 억양이 개선된다.","외국어 학습자는 모든 소리를 정확히 발음해야 한다.","외국어 학습에서는 원어민처럼 말하는 것보다 상대가 이해하도록 말하는 것을 목표로 삼는 것이 현실적이다."],"t":["반","상","이","과","-"],"r":["글은 청자가 곧 적응한다고 한다.","교수 난이도는 지문에 없다.","원어민 대화의 효과는 다루지 않았다.","글이 부정하는 극단적 요구이다.","원어민 발음이 아니라 이해되는 말하기가 목표여야 한다는 결론이다."],"a":4,"n":191},{"lv":2,"ty":3,"tp":"환경","p":"Households often throw away clothes after wearing them only a few times. The fashion industry encourages this by changing styles quickly. Yet buying second-hand clothing saves resources, reduces waste, and costs less. People should consider second-hand clothes before buying new ones.","k":"consider second-hand clothes before buying new ones","c":["유행이 빠르게 변하는 만큼 새 옷을 자주 구입해야 한다.","옷을 몇 번 입은 뒤에는 기부하는 것이 가장 좋다.","새 옷을 사기 전에 중고 의류를 먼저 고려해야 한다.","의류 산업은 신제품 생산을 중단해야 한다.","중고 의류는 새 옷보다 품질이 항상 뛰어나다."],"t":["반","부","-","비","과"],"r":["글이 비판하는 소비 방식이다.","기부는 글에서 다루지 않았다.","새 옷 구매 전 중고 의류를 고려하라는 주장이다.","생산 중단은 글에 없는 비약이다.","품질 비교는 글에 없고 '항상'은 과장이다."],"a":2,"n":192},{"lv":2,"ty":0,"tp":"기술","p":"Weather forecasts have become far more accurate than they were a few decades ago. A five-day forecast today is as reliable as a one-day forecast was in 1980. The improvement comes from better satellites, faster computers, and more data about the atmosphere. Because we rarely notice forecasts that go right, we tend to remember the mistakes and overlook how much progress has been made.","k":"A five-day forecast today is as reliable as a one-day forecast was in 1980.","c":["the reasons forecasters make so many mistakes when predicting the weather for next week","how satellites collect data about the atmosphere","the remarkable improvement in the accuracy of weather forecasts","the problem of people forgetting the weather","the end of all forecasting errors in the future"],"t":["반","세","-","이","과"],"r":["글은 예보가 정확해졌다고 말한다.","위성은 개선 요인 중 하나이다.","일기 예보의 정확도가 크게 향상되었다는 내용이다.","날씨를 잊는 문제는 다루지 않았다.","'모든 오류의 종식'은 지나친 단정이다."],"a":2,"n":193},{"lv":2,"ty":1,"tp":"건강","p":"Stress is usually viewed as harmful, but studies show that how we think about it matters. People who see stress as the body preparing to meet a challenge tend to perform better and recover faster than those who see it only as a threat. The pounding heart and quick breathing are signs of energy, not failure. Changing our view of stress can change its effect on us.","k":"Changing our view of stress can change its effect on us.","c":["Stress: A Hidden Enemy of the Heart and Mind in Daily Life","The Link Between Heartbeats and Breathing","The Best Ways to Avoid Every Challenge","Performance Anxiety in Athletes","Rethinking Stress: How Mindset Shapes Its Effect"],"t":["반","세","비","부","-"],"r":["글은 스트레스를 에너지의 신호로 볼 수 있다고 한다.","심박과 호흡은 신호의 예일 뿐이다.","도전을 피하라는 것은 글에 없는 비약이다.","수행 불안은 글에서 다루지 않은 일부 사례이다.","스트레스를 보는 관점이 영향을 바꾼다는 내용이다."],"a":4,"n":194},{"lv":2,"ty":2,"tp":"역사","p":"Monuments are built to preserve memory, but they also reflect who had the power to decide what to remember. Statues of rulers outnumber those of workers or women in many cities. When communities debate a monument, they are really debating whose story the public space should tell. Public memory is not simply inherited; it is chosen.","k":"Public memory is not simply inherited; it is chosen.","c":["기념물은 과거의 역사적 사실을 어떠한 왜곡도 없이 가장 정확하게 후세에 보존하여 전달하는 수단이다.","많은 도시에서 통치자의 동상이 노동자의 동상보다 많다.","기념물을 세우기 전에 시민의 동의를 얻어야 한다.","오래된 기념물은 모두 철거해야 한다.","기념물은 과거를 있는 그대로 보존하기보다 어떤 이야기를 기억할지에 대한 선택을 반영한다."],"t":["반","세","상","과","-"],"r":["글은 기념물이 선택을 반영한다고 한다.","동상 수는 근거 사례일 뿐이다.","시민 동의 절차는 지문에 없다.","철거 주장은 글에 없는 극단적 비약이다.","공공의 기억은 물려받는 것이 아니라 선택된 것이라는 결론이다."],"a":4,"n":195},{"lv":2,"ty":3,"tp":"사회","p":"In disagreements, we often try to win the argument rather than understand the other person. This turns conversation into a contest and leaves both sides unchanged. Asking sincere questions about why someone holds a view can reveal common ground. When we disagree, we should seek to understand before seeking to persuade.","k":"we should seek to understand before seeking to persuade","c":["의견이 다를 때에는 설득하기에 앞서 상대를 이해하려고 노력해야 한다.","토론에서는 상대의 말을 이해하기보다 논리적 근거로 상대를 설득해 이기는 것이 중요하다.","의견이 다른 사람과는 대화를 피하는 것이 현명하다.","상대에게 질문을 많이 하면 갈등이 모두 해결된다.","토론에서는 감정을 드러내지 않는 것이 바람직하다."],"t":["-","반","비","과","상"],"r":["설득에 앞서 이해를 우선하라는 주장이다.","글은 이기려는 태도를 비판한다.","대화 회피는 글에 없는 비약이다.","'모두 해결'은 지나친 단정이다.","감정 억제는 지문에 없다."],"a":0,"n":196},{"lv":2,"ty":0,"tp":"역사","p":"Historians once focused mainly on kings, battles, and treaties. Today many also study ordinary lives through letters, recipes, and household accounts. These small records reveal what people ate, feared, and hoped for, details that grand narratives often miss. By including everyday voices, history becomes not just the story of the powerful but the story of everyone who lived through an age.","k":"history becomes not just the story of the powerful but the story of everyone who lived through an age","c":["the decline of interest in famous battles and treaties among historians today","how recipes have changed in different periods","the role of kings in shaping national identity","the importance of preserving old household letters","the widening scope of history to include ordinary people"],"t":["반","세","상","부","-"],"r":["글은 범위가 넓어진다고 하지 관심 감소를 말하지 않는다.","요리법은 자료의 예시일 뿐이다.","왕의 역할은 지문에 없다.","편지 보존은 자료의 한 종류에 불과하다.","역사 연구가 평범한 사람들까지 포함하게 되었다는 내용이다."],"a":4,"n":197},{"lv":2,"ty":1,"tp":"경제","p":"When we buy a cup of coffee, the farmer who grew the beans often receives only a tiny share of the price. Fair trade labels aim to ensure that producers receive a stable minimum price and invest in their communities. Critics note that the system is imperfect and that labels can raise costs. Still, informed purchases give consumers a way to support fairer conditions behind the products they enjoy.","k":"informed purchases give consumers a way to support fairer conditions","c":["Your Coffee, Their Livelihood: The Case for Fair Trade","Why Farmers Earn the Largest Share of the Profit from Coffee","The Rising Price of Coffee Beans","Criticism of Fair Trade Labels","Boycotting All Imported Goods"],"t":["-","반","상","부","비"],"r":["공정무역이 생산자의 생계를 지원할 수 있다는 내용이다.","글은 농부의 몫이 작다고 한다.","원두 가격 상승은 지문에 없다.","비판은 단서 조항일 뿐 글의 결론이 아니다.","수입품 전면 불매는 글에 없는 비약이다."],"a":0,"n":198},{"lv":2,"ty":2,"tp":"교육","p":"Parents who read aloud to young children are often told it improves vocabulary. It does, but the benefits go further. Shared reading gives children and parents time together, shows how stories are enjoyed, and associates books with warmth and attention. Children who feel this joy are more likely to read on their own later. The habit of reading is passed on less through instruction than through shared pleasure.","k":"passed on less through instruction than through shared pleasure","c":["어린 시절에 책을 읽어 주면 아이의 어휘력이 다른 아이들보다 크게 늘어난다.","부모는 아이에게 독서의 중요성을 반복해서 가르쳐야 한다.","독서 습관은 가르침보다 함께 읽는 즐거운 경험을 통해 길러진다.","독서량이 많은 아이는 부모와의 관계가 더 좋다.","어린 시절에 읽어 준 책의 종류가 평생의 취향을 결정한다."],"t":["부","반","-","비","과"],"r":["어휘력은 이점의 일부이며 글은 그 이상을 말한다.","글은 가르침보다 즐거움을 강조한다.","독서 습관이 함께하는 즐거움에서 전해진다는 결론이다.","독서량과 부모 관계의 상관은 글에 없다.","취향 결정론은 지나친 단정이다."],"a":2,"n":199},{"lv":2,"ty":3,"tp":"경제","p":"Buying a house is often described as the best investment a person can make. But housing also involves taxes, repairs, and the loss of flexibility if one must move. For some households, renting and investing the difference proves wiser. Before buying, we should compare the full costs and our own circumstances rather than rely on common belief.","k":"compare the full costs and our own circumstances rather than rely on common belief","c":["집을 사는 것은 어떤 상황에 있는 사람에게나 가장 좋은 투자이므로 가능한 한 일찍 사야 한다.","집을 구입하려면 수리 비용을 미리 준비해야 한다.","이사가 잦은 사람은 반드시 집을 임대해야 한다.","임대보다 구입이 장기적으로 세금 부담이 적다.","집을 사기 전에 통념에 기대지 말고 전체 비용과 자신의 상황을 비교해 보아야 한다."],"t":["과","세","비","반","-"],"r":["글이 반박하는 통념이다.","수리 비용은 비용 항목 중 하나일 뿐이다.","'반드시'는 글에 없는 단정이다.","글은 구입 시 세금 부담을 비용으로 든다.","통념 대신 전체 비용과 자신의 상황을 따져 보라는 주장이다."],"a":4,"n":200},{"lv":3,"ty":0,"tp":"심리","p":"It is often said that experience is the best teacher. Yet experience teaches only those who reflect on it. Two employees may work at the same job for ten years, but one repeats the same mistakes while the other grows steadily. The difference lies not in the years but in the habit of asking what happened and why. Without that pause for reflection, experience becomes mere repetition. Learning, in other words, requires turning what we have lived through into understanding.","k":"experience teaches only those who reflect on it","c":["the best teacher for employees with ten years of experience","the role of reflection in turning experience into learning","the value of repeating the same job for many years","the importance of avoiding mistakes in the workplace","the difference between mere repetition and rapid growth"],"t":["세","-","반","비","부"],"r":["10년 경력은 예시 속 설정일 뿐이다.","경험이 성찰을 거쳐야 배움이 된다는 내용이다.","글은 반복만으로는 배움이 없다고 한다.","실수 회피는 글의 주장이 아니다.","대비만 다루고 성찰이라는 핵심 요소가 빠졌다."],"a":1,"n":201},{"lv":3,"ty":1,"tp":"심리","p":"We tend to think of memory as a recording device that stores events exactly as they happened. However, each time we recall an event, the brain rebuilds it from fragments, and small details are quietly altered by our current mood and beliefs. Two siblings may remember the same family dinner very differently, and both may be sincere. Memory, in short, is not a video but a story we keep rewriting.","k":"Memory, in short, is not a video but a story we keep rewriting.","c":["Family Dinners: Why Siblings Never Agree","Recording Every Event Exactly as It Happened","How Mood Alone Destroys Our Memories","The Brain as a Collection of Small Fragments","Memory: A Story We Keep Rewriting"],"t":["세","반","과","부","-"],"r":["가족 식사는 예시일 뿐이다.","글이 부정하는 통념이다.","기분만이 기억을 파괴한다는 것은 과장이다.","조각은 재구성 과정의 일부일 뿐이다.","기억이 녹화가 아니라 계속 다시 쓰이는 이야기라는 내용이다."],"a":4,"n":202},{"lv":3,"ty":2,"tp":"심리","p":"Many people assume that confident individuals never doubt themselves. However, confidence is not the absence of doubt but the willingness to act in spite of it. A musician who feels nervous before a concert still walks onto the stage; a student who fears a question still raises a hand. Those who wait until every doubt disappears wait forever. Courage begins where certainty ends.","k":"confidence is not the absence of doubt but the willingness to act in spite of it","c":["자신감 있는 사람은 무대에 서기 전에 긴장하지 않으며 어떠한 질문에도 의심 없이 손을 들 수 있다.","긴장하는 음악가와 질문을 두려워하는 학생처럼 대부분의 사람은 공연이나 수업에서 불안을 자주 경험한다.","자신감은 의심이 없는 상태가 아니라 의심이 있어도 행동하려는 의지이다.","모든 의심이 사라질 때까지 기다리는 사람은 결국 중요한 일을 시작할 기회를 잃어버리고 만다.","용기는 확신이 있을 때에만 생기므로 충분한 준비와 확신을 갖춘 뒤에 행동하는 것이 가장 바람직하다."],"t":["반","세","-","부","비"],"r":["글이 반박하는 통념이다.","예시를 일반화한 서술로 요지가 아니다.","자신감이 의심의 부재가 아니라 의심 속에서도 행동하는 의지라는 내용이다.","글의 일부(기다림의 문제)이며 자신감의 정의가 빠졌다.","글의 결론과 반대로 확신을 전제한 비약이다."],"a":2,"n":203},{"lv":3,"ty":3,"tp":"교육","p":"Parents often rush to rescue children from every small struggle, from tying shoelaces to solving a puzzle. However, a child who is never allowed to struggle never learns that difficulty can be overcome. Frustration, handled with patient support rather than quick solutions, builds persistence. We should resist the urge to fix everything and instead let children work through manageable problems themselves.","k":"let children work through manageable problems themselves","c":["부모는 아이가 좌절하지 않도록 사소한 어려움이라도 곁에서 즉시 해결해 주는 것이 바람직하다.","아이에게 퍼즐이나 신발 끈 묶기와 같은 활동은 모두 중단시켜서 불필요한 좌절을 겪지 않게 해야 한다.","아이가 어려움을 겪을 때 부모는 어떠한 도움도 주지 말고 철저히 방관하는 태도를 유지해야 한다.","부모는 아이가 감당할 수 있는 어려움은 스스로 해결하도록 지켜보아야 한다.","좌절을 경험한 아이는 끈기가 길러지므로 학교에서도 어려운 과제를 더 많이 부여하는 것이 필요하다."],"t":["반","비","과","-","상"],"r":["글이 비판하는 태도이다.","활동 중단은 글에 없는 비약이다.","도움 없는 방관은 글과 어긋난 과장이다.","아이가 직접 해결하도록 두라는 주장이다.","학교 과제는 지문에 없다."],"a":3,"n":204},{"lv":3,"ty":0,"tp":"사회","p":"Efficiency is usually praised as an unquestioned good. Yet organizations that optimize every minute often lose the slack that makes creativity and care possible. A hospital with no empty beds cannot handle an emergency; a team with no free time cannot imagine new ideas. Spare capacity looks like waste on a spreadsheet, but it is what allows a system to absorb surprise. A little inefficiency, in this sense, is an investment in resilience.","k":"A little inefficiency, in this sense, is an investment in resilience.","c":["the importance of eliminating waste from every process","how hospitals manage the number of empty beds","the creative ideas produced by overworked teams","why spreadsheets fail to record organizational costs","the hidden value of spare capacity in organizations"],"t":["반","세","이","상","-"],"r":["글은 낭비 제거 일변도를 비판한다.","병원은 예시일 뿐이다.","과로한 팀의 아이디어는 다루지 않았다.","스프레드시트의 한계는 지문의 주제가 아니다.","여유 자원이 조직의 회복력을 만든다는 내용이다."],"a":4,"n":205},{"lv":3,"ty":1,"tp":"사회","p":"Public libraries are often described as places that lend books. Yet in many towns they also offer job-search help, free internet, language classes, and a quiet place to sit for people with nowhere else to go. Their value cannot be measured by the number of books borrowed. A library is a shared living room for the whole community, open to everyone and asking nothing in return.","k":"A library is a shared living room for the whole community","c":["The Library: A Shared Living Room for the Community","How Many Books Does a Town Library Lend?","Free Internet Access in Every Living Room","Job-Search Help: The Only Mission of Public Libraries in Towns","Language Classes and the Rise of Adult Learners"],"t":["-","반","세","과","부"],"r":["도서관이 공동체의 거실이라는 내용이다.","대출 권수로 가치를 잴 수 없다는 글과 어긋난다.","인터넷은 제공 서비스 중 하나이다.","'유일한 사명'은 과장이다.","언어 수업은 일부 서비스이다."],"a":0,"n":206},{"lv":3,"ty":2,"tp":"사회","p":"People often say that technology has made us more connected than ever. Yet being reachable is not the same as being close. We exchange hundreds of messages a day while rarely having the long, unhurried conversations through which friendships deepen. The number of contacts has grown, but the number of people who truly know us may have shrunk. Connection measured by quantity can hide a loneliness of quality.","k":"being reachable is not the same as being close","c":["기술로 연결 수는 늘었지만, 소통의 양이 관계의 깊이를 보장하지는 않는다.","기술의 발달로 우리는 하루에도 수백 개의 메시지를 주고받으며 과거보다 훨씬 더 가깝게 연결되어 있다.","긴 대화를 나누는 시간이 줄어든 오늘날 사람들은 대부분 외로움을 느끼며 친구 관계도 모두 사라지고 있다.","친구 관계가 깊어지려면 길고 느긋한 대화가 필요하므로 메신저보다 직접 만나는 것이 반드시 요구된다.","연락처의 수가 늘어난 것과 달리 자신을 진정으로 아는 사람의 수는 줄어들었는지 통계로 확인해야 한다."],"t":["-","반","과","비","부"],"r":["연결의 양과 관계의 질은 다르다는 내용이다.","글이 의문을 제기하는 통념이다.","'모두 사라진다'는 과장이다.","직접 만남의 필수성은 글에 없는 비약이다.","글은 '줄었을지도 모른다'고 했을 뿐 통계 확인을 말하지 않는다."],"a":0,"n":207},{"lv":3,"ty":3,"tp":"사회","p":"Online reviews can help us choose a restaurant or a product, but they are not neutral. People who are delighted or furious write reviews far more often than people with ordinary experiences. As a result, the average score reflects extremes rather than typical quality. We should read reviews skeptically, looking for specific details and patterns rather than trusting a number.","k":"We should read reviews skeptically","c":["온라인 후기는 극단적 경험이 반영되기 쉬우므로 비판적으로 읽어야 한다.","후기의 평균 점수는 식당과 상품의 품질을 가장 정확하게 보여 주므로 구매 전에 반드시 확인해야 한다.","온라인 후기는 기쁨이나 분노를 느낀 소비자만 쓰기 때문에 모두 신뢰할 수 없고 무시해도 좋다.","후기에 나타난 구체적 세부 사항을 근거로 판단하되 점수가 높은 후기는 광고일 가능성이 크다.","평범한 경험을 한 사람들은 후기를 쓰지 않으므로 소비자는 직접 후기를 작성하는 습관을 가져야 한다."],"t":["-","반","과","상","비"],"r":["후기를 비판적으로 읽으라는 주장이다.","글이 경계하는 태도이다.","'모두 무시'는 과장이다.","광고 가능성은 지문에 없다.","후기 작성 권유는 글에 없다."],"a":0,"n":208},{"lv":3,"ty":0,"tp":"과학","p":"Many people assume that a larger sample always yields a more reliable conclusion. However, size alone cannot repair a biased sample. A survey of one million people who all answered an online poll may be less trustworthy than a carefully chosen sample of a thousand. What matters is whether the group truly represents the population being studied. Careful selection, not sheer quantity, is the foundation of trustworthy data.","k":"Careful selection, not sheer quantity, is the foundation of trustworthy data.","c":["the advantages of surveying one million people online","how online polls are designed and distributed","why the representativeness of a sample matters more than its size","the problem of defining a population before beginning any large research project","the proof that small samples are always superior"],"t":["반","세","-","부","과"],"r":["글은 큰 표본의 한계를 지적한다.","온라인 조사는 예시일 뿐이다.","표본의 크기보다 대표성이 중요하다는 내용이다.","모집단은 개념의 일부일 뿐 핵심은 대표성이다.","'항상 우월'은 지나친 일반화이다."],"a":2,"n":209},{"lv":3,"ty":1,"tp":"과학","p":"Antibiotics have saved millions of lives, but their power is fading. Each time they are used, a few bacteria survive and multiply, and these survivors pass their resistance to others. Using antibiotics for colds, which they cannot treat, speeds up this process. Unless we use them carefully, medicines that once cured common infections may fail us. Our greatest medical tool is being worn down by careless use.","k":"Our greatest medical tool is being worn down by careless use.","c":["Antibiotics: A Cure for the Common Cold","Careless Use Is Wearing Down Our Antibiotics","How Bacteria Survive and Multiply in the Body","Why Millions of Lives Were Saved by Medicine","The End of All Medical Progress"],"t":["반","-","부","세","비"],"r":["감기에는 듣지 않는다고 했다.","부주의한 사용이 항생제를 무력화한다는 내용이다.","생존 과정은 일부 설명이다.","과거의 성과는 도입부이다.","의학 발전의 종말은 지나친 비약이다."],"a":1,"n":210},{"lv":3,"ty":2,"tp":"과학","p":"Scientists are often portrayed as seekers of certainty. In practice, good science thrives on doubt. A hypothesis is valuable only if it can be tested and possibly proven wrong. When experiments contradict a favorite theory, the honest response is to revise it, not to defend it. Progress in science comes less from confirming what we already believe than from being willing to discover that we were mistaken.","k":"Progress in science comes less from confirming what we already believe than from being willing to discover that we were mistaken.","c":["과학자는 확실성을 추구하는 사람이므로 이론과 모순되는 실험 결과가 나오면 우선 실험 방법의 오류를 의심해야 한다.","가설은 검증될 수 있어야 가치가 있으며, 반증 가능성이 없는 가설은 과학의 범주에 포함되지 않는다.","좋은 과학자는 의심에 지나치게 의존하기 때문에 어떠한 이론도 완전히 믿지 않으며 모든 가설을 폐기한다.","과학의 진보는 기존 믿음을 확인하는 데서보다 틀렸음을 기꺼이 받아들이는 태도에서 나온다.","과학자들이 가장 아끼는 이론도 새로운 실험이 거듭되면 결국 한 세기 안에 모두 틀린 것으로 판명된다."],"t":["반","부","과","-","상"],"r":["글은 이론을 수정하라고 한다.","가설의 조건만 다루고 결론(오류 수용)이 빠졌다.","모든 가설 폐기는 지나친 일반화이다.","오류를 인정하는 태도가 과학 발전의 동력이라는 내용이다.","'한 세기'라는 근거는 지문에 없다."],"a":3,"n":211},{"lv":3,"ty":3,"tp":"환경","p":"Many travelers dream of visiting remote natural places before they change. Yet the very arrival of visitors can damage fragile ecosystems through trampling, waste, and noise. Beautiful places do not always benefit from being loved. Travelers should limit their numbers, follow strict rules, or choose to stay away so that these places can survive.","k":"Travelers should limit their numbers, follow strict rules, or choose to stay away","c":["외딴 자연 지역은 훼손되기 전에 가능한 한 많은 사람이 방문하여 아름다움을 직접 경험해야 한다.","취약한 생태계를 보호하려면 정부가 입장료를 크게 올려 방문 자체를 모든 사람에게 금지해야 한다.","관광객이 남기는 쓰레기와 소음은 생태계에 피해를 주므로 분리배출 시설을 늘려 이 문제를 해결해야 한다.","여행자들은 외딴 지역을 방문하지 말고 도시의 공원이나 식물원처럼 인공적으로 조성된 곳만 찾아야 한다.","여행자는 취약한 자연 지역을 보호하기 위해 방문 규모를 제한하거나 규칙을 지켜야 한다."],"t":["반","비","부","과","-"],"r":["글은 방문이 훼손을 일으킨다고 한다.","전면 금지는 글에 없는 비약이다.","피해 원인만 다루고 여행자의 책임이 빠졌다.","자연 방문 금지는 과장이다.","방문을 자제하고 규칙을 지키라는 주장이다."],"a":4,"n":212},{"lv":3,"ty":0,"tp":"경제","p":"When a company announces record profits, the news is usually welcomed as proof of success. Yet profit measures only what the company keeps, not what it leaves behind for others. A factory may report gains while its pollution raises medical costs for the surrounding town. These costs do not appear in the accounts, but someone pays them. A fuller measure of success would count the burdens shifted onto society along with the gains collected.","k":"profit measures only what the company keeps, not what it leaves behind for others","c":["the social costs hidden behind corporate profits","how companies celebrate their financial success","the benefits of factories for local communities","how medical costs are calculated by hospitals","the claim that every company harms its neighbors"],"t":["-","세","반","이","과"],"r":["이윤에 가려진 사회적 비용이 핵심이다.","기업의 홍보는 도입부 배경이다.","글은 공장이 지역에 비용을 떠넘긴다고 한다.","의료비 산정은 다루지 않았다.","'모든 기업'은 지나친 일반화이다."],"a":0,"n":213},{"lv":3,"ty":1,"tp":"경제","p":"When prices rise, shoppers often blame the nearest store. Yet a single shop sets only a small part of what it charges; the rest comes from the costs of materials, transport, and rent that it cannot control. A bakery that pays more for flour must either raise its price or accept lower income. Prices, in other words, travel along a chain, and the shelf is merely its last link.","k":"Prices, in other words, travel along a chain, and the shelf is merely its last link.","c":["Why Shoppers Should Blame the Nearest Store","A Bakery's Struggle to Buy Cheaper Flour","The Shelf Price: The Last Link in a Chain of Costs","Rent: The Main Cause of Rising Prices in Every Local Shop","How Stores Decide on Their Own Prices"],"t":["반","세","-","과","부"],"r":["글은 가게 탓이 아니라고 한다.","제빵점은 예시이다.","가격이 비용의 사슬 마지막 고리라는 내용이다.","임대료만을 주원인으로 보는 과장이다.","가게의 결정은 가격의 일부에 불과하다."],"a":2,"n":214},{"lv":3,"ty":2,"tp":"경제","p":"A common mistake in budgeting is to focus on small daily expenses while ignoring large recurring ones. Skipping a cup of coffee feels virtuous, but a housing or car decision made once can cost far more over years. Because big decisions are made rarely, we give them less attention than the habits we repeat daily. Saving effectively means applying the most scrutiny where the most money flows.","k":"Saving effectively means applying the most scrutiny where the most money flows.","c":["매일 마시는 커피 한 잔을 포기하는 습관은 작은 절약처럼 보이지만 장기적으로는 가장 큰 효과를 낸다.","주택이나 자동차 같은 큰 결정은 평생 한두 번 이루어지므로 신중하게 한 번만 결정하면 충분히 절약된다.","큰 결정은 드물게 이루어지기 때문에 사람들은 매일 반복하는 습관보다 그것에 더 적은 주의를 기울인다.","가계부를 쓰는 사람들은 작은 지출을 모두 기록하고 있으므로 큰 지출도 자연스럽게 관리하게 된다.","효과적으로 절약하려면 가장 큰 돈이 나가는 곳을 가장 꼼꼼히 살펴야 한다."],"t":["반","비","부","상","-"],"r":["글은 작은 지출에 대한 집중을 비판한다.","한 번만 결정하면 충분하다는 비약이다.","원인 설명일 뿐 요지(해야 할 일)가 아니다.","가계부 작성은 글에 없는 내용이다.","큰 지출 항목에 주의를 집중해야 한다는 내용이다."],"a":4,"n":215},{"lv":3,"ty":3,"tp":"경제","p":"Many young people are told to follow their passion when choosing a career. Yet passion is often discovered through doing, not before it. Skills developed over time, such as solving problems and working with others, create enjoyment and opportunity. Rather than waiting to find a perfect calling, young people should build valuable skills and let interest grow from competence.","k":"young people should build valuable skills and let interest grow from competence","c":["진로를 선택할 때는 가슴이 뛰는 열정을 가장 먼저 찾고 그 분야만을 집중적으로 준비해야 한다.","진로를 정할 때는 열정을 기다리기보다 가치 있는 기술을 쌓아 흥미가 자라게 해야 한다.","문제를 해결하고 타인과 협력하는 능력은 직업의 종류와 관계없이 반드시 연봉을 높여 주는 요소이다.","완벽한 천직을 찾는 일은 불가능하므로 청년은 흥미와 무관하게 가장 보수가 높은 일을 선택해야 한다.","열정은 실제로 해 보는 과정에서 발견되는 경우가 많으므로 청년은 다양한 일을 경험해 보아야 한다."],"t":["반","-","상","비","부"],"r":["글이 의문시하는 조언이다.","역량을 쌓으면 흥미가 따라온다는 주장이다.","연봉 효과는 지문에 없다.","보수 최우선은 글에 없는 비약이다.","경험 권유는 일부이며 기술 축적이 빠졌다."],"a":1,"n":216},{"lv":3,"ty":0,"tp":"예술","p":"Critics sometimes dismiss popular art as shallow, assuming that what pleases many cannot be profound. However, history offers many counterexamples: novels once sold in cheap serial editions are now treated as classics. Popularity and depth are not opposites; what separates lasting works from forgotten ones is whether they continue to speak to new readers. Time, not initial reputation, sorts masterpieces from trends.","k":"Popularity and depth are not opposites","c":["the superiority of classics over serial novels","the reasons critics dislike popular entertainment","the cheap publishing methods of the nineteenth century and the readers they reached","the compatibility of popular appeal and lasting artistic depth","the certainty that every popular work becomes a classic"],"t":["부","세","이","-","과"],"r":["고전과 연재소설의 우열은 다루지 않았다.","비평가의 태도는 도입부 배경이다.","출판 방식은 소재에서 벗어난다.","대중성과 깊이가 양립할 수 있다는 내용이다.","'모든 대중 작품이 고전'은 지나친 일반화이다."],"a":3,"n":217},{"lv":3,"ty":1,"tp":"예술","p":"A blank page frightens many writers more than a difficult topic does. Yet those who write regularly say that waiting for inspiration is a mistake. They sit down at the same hour each day and write badly if they must, knowing that quality grows from quantity. Inspiration, they claim, arrives to those already at work. Discipline, not mood, keeps the pen moving.","k":"Discipline, not mood, keeps the pen moving.","c":["The Fear of a Blank Page and Hard Topics","Waiting for Inspiration Is the Key to Great Writing","Writing Badly Is the Goal of Every Writer","Don't Wait for Inspiration: Write Daily","Why Writers Prefer to Work at the Same Hour"],"t":["부","반","과","-","세"],"r":["공포는 도입부 설정일 뿐이다.","글이 반박하는 태도이다.","나쁜 글이 목표라는 것은 과장이다.","영감을 기다리지 말고 꾸준히 쓰라는 내용이다.","같은 시각 집필은 방법 중 하나이다."],"a":3,"n":218},{"lv":3,"ty":2,"tp":"교육","p":"Teachers sometimes avoid giving difficult problems because they fear discouraging students. But learning researchers find that a task slightly beyond a student's current ability produces the greatest growth. Too easy, and the mind drifts; too hard, and it gives up. The best zone for learning lies between boredom and frustration, where effort is demanding but still within reach.","k":"The best zone for learning lies between boredom and frustration","c":["학생들이 좌절하지 않도록 교사는 쉬운 문제를 위주로 제시하여 자신감을 충분히 키워 주어야 한다.","학습은 쉬워서 지루하지도 어려워서 좌절하지도 않는, 노력하면 닿을 수준에서 가장 효과적이다.","능력을 크게 넘어서는 매우 어려운 과제일수록 학생의 노력을 이끌어 내어 가장 큰 성장을 가져온다.","너무 쉬운 문제를 풀 때 학생의 마음이 다른 곳으로 향하는 현상은 교사가 반드시 막아야 하는 것이다.","학습 연구자들은 교사가 학생의 현재 능력을 정확히 측정하는 도구를 개발해야 한다고 강조해 왔다."],"t":["반","-","과","부","상"],"r":["글은 쉬운 과제를 비판한다.","적절한 난이도의 과제가 학습에 가장 좋다는 내용이다.","'매우 어려울수록'은 글과 어긋난 과장이다.","지루함이라는 한쪽 면만 다룬다.","측정 도구 개발은 지문에 없다."],"a":1,"n":219},{"lv":3,"ty":3,"tp":"건강","p":"Smartphones glow late into the night in many bedrooms. The bright light delays the body's release of the hormone that signals sleep, and the content keeps minds active. People who scroll in bed fall asleep later and wake more tired. A simple habit would solve much of the problem: put the phone away at least an hour before bed.","k":"put the phone away at least an hour before bed","c":["스마트폰은 밝은 빛으로 수면 호르몬의 분비를 방해하므로 침실에 두지 않고 집 밖에 두어야 한다.","침대에서 스마트폰을 보면 졸음이 더 늦게 오고 다음 날 피로하게 되므로 밤새 사용하는 것을 줄여야 한다.","숙면을 위해 잠자리에 들기 최소 한 시간 전에는 스마트폰을 치워 두어야 한다.","수면 호르몬의 분비가 늦어지는 현상은 밝은 빛 외에 소리와 진동이 원인이 되기도 한다는 점이 중요하다.","스마트폰 화면의 밝기를 가능한 한 낮추어 사용하면 잠드는 시간이 늦어지는 문제가 해결될 것이다."],"t":["과","부","-","상","비"],"r":["집 밖에 두는 것은 과장이다.","원인·결과 설명이며 구체적 행동 조언이 빠졌다.","취침 전 스마트폰 사용을 중단하라는 주장이다.","소리·진동은 지문에 없다.","밝기 조절 해결은 글에 없다."],"a":2,"n":220},{"lv":3,"ty":0,"tp":"환경","p":"Draining wetlands for farmland was once considered progress. Yet wetlands filter water, absorb floods, and shelter countless species, services that cost billions to replace with machines. When a coastal storm strikes, towns behind healthy marshes suffer far less damage than those without. What appears to be empty, unproductive ground is in fact working quietly for everyone downstream. Protecting wetlands is therefore less a sacrifice of land than an investment in natural infrastructure.","k":"an investment in natural infrastructure","c":["the history of draining wetlands for farmland","the cost of replacing natural filters with machines","the damage coastal storms cause to farmland","wetlands as valuable natural infrastructure that protects communities","why seemingly unproductive land should be converted into farm fields and pastures"],"t":["세","부","이","-","반"],"r":["농지 간척은 도입부 배경이다.","대체 비용은 근거 중 하나일 뿐이다.","폭풍의 농지 피해는 언급되지 않았다.","습지가 공동체를 보호하는 자연 기반 시설이라는 내용이다.","글은 습지 보호를 말한다."],"a":3,"n":221},{"lv":3,"ty":1,"tp":"환경","p":"Plastic bags are blamed for ocean pollution, so many cities have banned them. Yet paper bags require more energy to make and ship, and cotton bags must be reused dozens of times before they become the greener choice. A ban that replaces one bag with another can simply move the harm elsewhere. Real progress lies in reusing whatever bag we already own.","k":"Real progress lies in reusing whatever bag we already own.","c":["Why Cities Should Ban Plastic Bags at Once","Ocean Pollution and the Blame on Plastic","Paper Bags: The Greenest Choice for Shoppers","How Cotton Bags Are Made and Shipped","The Best Bag Is the One You Already Own"],"t":["반","부","과","세","-"],"r":["글은 금지만으로는 부족하다고 한다.","해양 오염은 도입부 문제 제기이다.","종이 가방이 가장 친환경이라는 것은 틀리다.","제조·운송은 근거 중 하나이다.","이미 가진 가방을 재사용하는 것이 최선이라는 내용이다."],"a":4,"n":222},{"lv":3,"ty":2,"tp":"건강","p":"Stretching before exercise is a ritual for many, yet recent studies question its value. Holding long static stretches before a workout may actually reduce muscle power briefly. A light warm-up, such as jogging slowly or moving the joints through their range, prepares the body better. The goal is to raise body temperature and blood flow, not to force flexibility. Preparation should wake the muscles, not tire them.","k":"Preparation should wake the muscles, not tire them.","c":["운동 전 준비는 근육을 지치게 하는 정적 스트레칭보다 몸을 깨우는 가벼운 워밍업이 적절하다.","운동 전 정적 스트레칭은 근육의 유연성을 길러 주므로 오래 유지할수록 운동 능력이 크게 향상된다.","가벼운 조깅과 관절 운동은 체온과 혈류를 높이므로 달리기를 전문으로 하는 선수에게만 필요하다.","스트레칭에 대한 최근 연구들은 대부분의 사람들에게 유연성이 부상 예방에 아무 영향도 없다고 보고한다.","운동 준비의 목표가 체온과 혈류를 높이는 것이라는 점은 몸이 유연한 사람에게도 동일하게 적용된다."],"t":["-","반","비","과","부"],"r":["정적 스트레칭보다 가벼운 워밍업이 낫다는 내용이다.","글은 정적 스트레칭이 근력을 일시 저하시킨다고 한다.","선수에게만 필요하다는 것은 글에 없는 비약이다.","유연성 무효과는 지나친 일반화이다.","목표만 언급하며 요지(워밍업 권고)가 빠졌다."],"a":0,"n":223},{"lv":3,"ty":3,"tp":"사회","p":"Public apologies from companies often sound alike: regret expressed for 'any inconvenience caused.' Such wording avoids admitting a specific wrong. A sincere apology names what went wrong, accepts responsibility, and explains how it will be corrected. Without these elements, an apology is merely public relations. Organizations should apologize in plain, specific terms that show they understand the harm.","k":"Organizations should apologize in plain, specific terms that show they understand the harm.","c":["기업은 사과 문구를 표준화해 모든 사고에 같은 문장을 사용함으로써 일관된 이미지를 유지해야 한다.","조직은 잘못을 구체적으로 밝히고 책임을 인정하는 분명한 말로 사과해야 한다.","진정한 사과에는 손해 배상이 포함되어야 하므로 기업은 공개 사과 대신 금전 보상을 먼저 해야 한다.","사과하지 않는 기업은 홍보 활동에 지나치게 의존하므로 소비자들은 그 제품의 구매를 중단해야 한다.","불편을 끼친 점에 유감을 표하는 표현은 구체적인 잘못을 인정하지 않기 때문에 법적 분쟁의 원인이 된다."],"t":["반","-","비","과","상"],"r":["글이 비판하는 상투적 사과이다.","구체적이고 솔직한 사과를 주장한다.","금전 보상 우선은 글에 없다.","불매 주장은 과장이다.","법적 분쟁은 지문에 없다."],"a":1,"n":224},{"lv":3,"ty":0,"tp":"언어","p":"Slang is often criticized as a corruption of proper language. Yet every standard word was once somebody's slang. New expressions arise where people need them, especially among the young, who invent words to mark identity and to name experiences older vocabulary misses. Most fade quickly; a few endure and enter dictionaries. Rather than damaging a language, slang is one of the ways it renews itself.","k":"slang is one of the ways it renews itself","c":["slang as a source of renewal in language","the decline of standard vocabulary among the young","how dictionaries decide which words to include","the identity of young people in modern society","the corruption of language by foreign words"],"t":["-","반","세","부","상"],"r":["속어가 언어를 갱신하는 힘이라는 내용이다.","글은 쇠퇴가 아니라 갱신을 말한다.","사전 등재는 부수적 언급이다.","정체성 표시는 속어가 생기는 이유 중 하나일 뿐이다.","외래어는 지문에 없다."],"a":0,"n":225},{"lv":3,"ty":1,"tp":"교육","p":"Teachers often praise students for being smart, hoping to build confidence. But research suggests that praising ability can make children avoid challenges, since failure might expose their limits. Praising effort and strategy, by contrast, encourages them to try harder tasks. The words adults choose shape how children see their own minds. What we praise is what children learn to value.","k":"What we praise is what children learn to value.","c":["Why Confident Children Always Avoid Every Difficult Challenge Ahead","Praise Effort, Not Ability: Words That Shape Young Minds","Smart Students and Their Teachers' Hopes","Failure Exposes the Limits of Every Child","Praising Ability: A Path to Greater Challenge"],"t":["과","-","세","비","반"],"r":["'항상'은 과장이다.","노력을 칭찬하는 말이 아이의 사고방식을 만든다는 내용이다.","교사의 기대는 도입부이다.","모든 아이의 한계 노출은 비약이다.","능력 칭찬은 도전을 피하게 한다는 글과 반대이다."],"a":1,"n":226},{"lv":3,"ty":2,"tp":"기술","p":"Software updates are often seen as annoying interruptions. However, many updates repair security holes that criminals are actively exploiting. Delaying an update leaves the door open for weeks or months. The small inconvenience of a restart is trivial compared with the cost of stolen data. Updating promptly is the simplest and cheapest form of digital protection.","k":"Updating promptly is the simplest and cheapest form of digital protection.","c":["소프트웨어 업데이트는 재시작이 필요한 번거로운 작업이므로 보안 위협이 확인된 경우에만 하는 것이 좋다.","범죄자들이 보안 허점을 악용하는 수법은 점점 정교해지고 있으므로 개인이 이를 막는 것은 불가능하다.","업데이트를 미루면 몇 주 또는 몇 달 동안 보안상의 문을 열어 두는 것과 같은 결과가 나타나게 된다.","소프트웨어 업데이트는 번거롭더라도 신속히 하는 것이 가장 간단하고 저렴한 보안 수단이다.","컴퓨터 보안을 위해서는 업데이트 외에도 백신 프로그램과 방화벽을 반드시 함께 설치해야만 한다."],"t":["반","비","부","-","상"],"r":["글은 즉시 하라고 한다.","방어 불가능은 글에 없는 비약이다.","미룰 때의 위험만 언급하고 요지(신속 업데이트)가 빠졌다.","신속한 업데이트가 최선의 보안이라는 내용이다.","백신·방화벽은 글에 없는 배경지식이다."],"a":3,"n":227},{"lv":3,"ty":3,"tp":"과학","p":"News headlines announce that a food causes or prevents a disease, but a single study rarely settles anything. Results from small groups may vanish when repeated, and a connection between two things may be caused by a third. Reliable conclusions come from many studies pointing the same way. Readers should therefore treat a single surprising finding as a hypothesis to be confirmed, not a fact to act on.","k":"treat a single surprising finding as a hypothesis to be confirmed","c":["뉴스에서 어떤 음식이 질병을 예방한다고 보도하면 즉시 식단을 바꾸어 건강을 지키는 것이 현명하다.","소규모 집단을 대상으로 한 연구는 반복하면 결과가 사라지므로 과학적 가치가 없어 무시해야 한다.","두 현상 사이의 연관성은 제3의 요인 때문일 수 있으므로 상관관계는 인과관계로 이어지지 않는다.","하나의 놀라운 연구 결과는 사실이 아니라 검증이 필요한 가설로 받아들여야 한다.","언론은 연구 결과를 과장해서 보도하는 일이 잦으므로 정부가 건강 관련 보도를 심의해야 한다."],"t":["반","과","부","-","비"],"r":["글이 경계하는 반응이다.","'무시'는 과장이다.","논거 중 하나이며 독자의 태도가 빠졌다.","단일 연구를 가설로 취급하라는 주장이다.","정부 심의는 글에 없다."],"a":3,"n":228},{"lv":3,"ty":0,"tp":"건강","p":"A common belief holds that if you feel pain during exercise, you should push through it. However, pain is the body's way of signaling that something may be wrong, and ignoring it can turn a small strain into a serious injury. Mild muscle soreness differs from sharp or persistent pain, and learning to tell them apart is a skill athletes develop over time. Listening to the body is not weakness but a way to keep training for years.","k":"Listening to the body is not weakness but a way to keep training for years.","c":["the benefits of pushing through pain in order to build strength and endurance quickly","the difference between sore muscles and broken bones","the training schedules of professional athletes","the weakness of athletes who stop exercising","the importance of listening to pain signals during exercise"],"t":["반","부","이","비","-"],"r":["글이 반박하는 통념이다.","근육통과 날카로운 통증의 구분이며 골절은 다루지 않았다.","훈련 일정은 글과 무관하다.","운동 중단을 약점으로 보는 것은 글에 없다.","운동 중 통증 신호에 귀 기울여야 한다는 내용이다."],"a":4,"n":229},{"lv":3,"ty":1,"tp":"건강","p":"Many people believe they can make up for lost sleep on weekends. Yet studies show that sleeping late on Saturday does not fully undo the effects of a short week: attention and mood remain below normal, and the shifted schedule makes Monday even harder. The body prefers a steady rhythm to feast and famine. Regular sleep is better than rescue sleep.","k":"Regular sleep is better than rescue sleep.","c":["Why Saturday Is the Best Day for Sleeping Late","How Short Weeks Change a Person's Mood","Steady Sleep Beats Weekend Catch-Up","Monday Mornings and the Struggle to Wake Up","The Dangers of Sleeping Less Than Eight Hours"],"t":["반","부","-","세","상"],"r":["글은 늦잠이 보충이 못 된다고 한다.","기분 변화는 결과 중 하나이다.","규칙적인 수면이 주말 보충 수면보다 낫다는 내용이다.","월요일은 부수적 언급이다.","권장 수면 시간은 지문에 없다."],"a":2,"n":230},{"lv":3,"ty":2,"tp":"환경","p":"Planting trees is widely praised as a way to fight climate change. But a tree planted in the wrong place, or one that dies for lack of care, offers little benefit. Survival rates matter more than the number planted. Projects that choose local species, involve nearby residents, and monitor growth often store more carbon than larger campaigns that simply count seedlings. What counts is not how many trees are planted but how many are still alive years later.","k":"What counts is not how many trees are planted but how many are still alive years later.","c":["기후 변화에 대응하는 가장 효과적인 방법은 가능한 한 많은 나무를 짧은 기간에 대규모로 심는 것이다.","나무 심기 사업에 지역 주민이 참여하면 일자리가 늘어나 지역 경제가 활성화되는 효과를 얻을 수 있다.","잘못된 장소에 심어진 나무는 이산화탄소를 흡수하지 못하므로 나무 심기는 기후 변화 대응에 아무 효과가 없다.","지역 고유종을 선택하고 성장을 관찰하는 사업은 단순히 묘목 수를 세는 사업보다 더 많은 탄소를 저장한다.","나무 심기의 성과는 심은 수가 아니라 여러 해 뒤까지 살아남은 수로 판단해야 한다."],"t":["반","상","과","부","-"],"r":["글은 심은 수가 중요하지 않다고 한다.","지역 경제 효과는 지문에 없다.","'아무 효과 없음'은 과장이다.","근거 사실이며 핵심 판단 기준이 빠졌다.","식수 사업의 성패는 생존율에 달렸다는 내용이다."],"a":4,"n":231},{"lv":3,"ty":3,"tp":"기술","p":"Social media platforms are designed to hold our attention, with endless feeds and constant notifications. The design is deliberate, because attention is what advertisers pay for. Users who feel pulled back repeatedly are not weak; they are facing a system built to be hard to leave. We should therefore adjust the settings and habits that capture attention, turning off notifications and setting limits.","k":"turning off notifications and setting limits","c":["사용자는 알림을 끄고 사용 시간을 제한하는 등 주의를 빼앗는 설정과 습관을 조정해야 한다.","소셜 미디어에 계속 빠져드는 것은 의지가 약하기 때문이므로 스스로 마음을 단단히 먹는 것이 중요하다.","광고주가 주의를 사려고 하는 구조이므로 소셜 미디어 기업은 광고 수익 모델을 포기해야 한다.","소셜 미디어는 끝없는 피드로 설계되었으므로 청소년의 사용은 법률로 금지해야 한다.","끝없는 피드와 잦은 알림이 사용자의 주의를 붙잡도록 의도적으로 설계되었다는 사실을 인식해야 한다."],"t":["-","반","비","과","부"],"r":["설정과 습관을 조정하라는 주장이다.","글은 사용자가 약해서가 아니라고 한다.","수익 모델 포기는 글에 없다.","법적 금지는 과장이다.","원인 인식만 다루고 대응 행동이 빠졌다."],"a":0,"n":232},{"lv":3,"ty":0,"tp":"기술","p":"New technologies are often judged by what they can do, but their lasting effects come from how they change habits. The printing press did more than speed up copying; it changed who could read, argue, and learn. Smartphones are not just portable computers; they changed how we wait, remember, and meet. To understand a technology, we must look beyond its features to the behaviors it reshapes.","k":"we must look beyond its features to the behaviors it reshapes","c":["the features that make smartphones portable computers","how technology reshapes human behavior beyond its functions","the history of the printing press and the book copying that came before it","the speed at which new technologies spread","the claim that technology alone controls our habits"],"t":["부","-","세","이","과"],"r":["기능은 글이 넘어서라고 한 대상이다.","기술이 기능을 넘어 행동을 바꾼다는 내용이다.","인쇄술은 예시 중 하나이다.","확산 속도는 언급되지 않았다.","'기술만이 습관을 지배'는 지나친 단정이다."],"a":1,"n":233},{"lv":3,"ty":1,"tp":"기술","p":"Auto-correct features save us time, but they also teach us to rely on the machine for spelling. Over years, writers who never check words themselves may lose the habit of noticing errors. The same can be said of navigation apps and our sense of direction. When tools do our thinking for us, the thinking muscle weakens from disuse. Convenience carries a hidden cost to our own skills.","k":"Convenience carries a hidden cost to our own skills.","c":["Auto-Correct: The Perfect Cure for Spelling Errors","When Tools Think for Us, Our Skills Fade","Navigation Apps and the History of Maps","Why Writers Should Never Use Any Technology","The Time Saved by Features That Fix Words"],"t":["반","-","이","과","부"],"r":["자동 수정이 철자 능력을 약화한다는 글과 반대이다.","도구에 의존하면 우리의 능력이 약해진다는 내용이다.","지도의 역사는 다루지 않았다.","'전혀 쓰지 말라'는 과장이다.","시간 절약은 글의 전반부 사실일 뿐이다."],"a":1,"n":234},{"lv":3,"ty":2,"tp":"예술","p":"When we visit a museum, we often rush from painting to painting, glancing at each for seconds. Studies of museum visitors find that the average time spent before a work is very short. Yet works reveal themselves slowly: details emerge, moods shift, and questions arise only after sustained looking. Seeing, in this sense, is a skill that rewards patience. A few works viewed carefully teach more than a hundred glimpsed.","k":"A few works viewed carefully teach more than a hundred glimpsed.","c":["박물관 방문객들은 대부분 작품 앞에서 짧게 머물기 때문에 예술에 대한 관심이 낮다고 볼 수 있다.","박물관에 갈 때는 가능한 한 많은 작품을 둘러보아야 다양한 양식과 시대를 비교할 수 있다.","미술 감상은 많은 작품을 훑어보는 것보다 몇 작품을 오래 주의 깊게 보는 것이 더 많은 것을 가르쳐 준다.","작품의 세부와 분위기는 오래 바라볼 때 비로소 드러나는 것이므로 모든 작품을 오랫동안 감상해야 한다.","그림을 보는 것은 하나의 기술이지만, 이 기술은 미술사를 전공한 사람들에게만 습득될 수 있다."],"t":["비","반","-","과","상"],"r":["관심이 낮다는 결론은 글에 없다.","글은 많이 보는 것보다 깊이 보라고 한다.","깊이 있는 관람이 낫다는 내용이다.","'모든 작품'이라는 과장이다.","미술사 전공자 한정은 지문에 없다."],"a":2,"n":235},{"lv":3,"ty":3,"tp":"심리","p":"When we are angry, we often send a sharp message immediately and regret it later. Strong emotions narrow our thinking, making revenge seem reasonable. Waiting even a few hours lets the intensity fade and allows us to see the situation more fairly. Before responding in anger, we should give ourselves time to cool down.","k":"Before responding in anger, we should give ourselves time to cool down.","c":["화가 날 때에는 감정을 억누르지 말고 즉시 솔직하게 표현하여 상대에게 자신의 상태를 알려야 한다.","강한 감정은 사고를 좁게 만들어 복수를 합리적인 것처럼 보이게 하므로 감정 자체를 없애야 한다.","날카로운 메시지를 보내고 후회한 경험이 있는 사람은 앞으로 모든 메시지를 보내기 전에 점검해야 한다.","몇 시간이 지나면 분노의 강도가 약해진다는 점은 공정하게 상황을 판단하는 일에 도움이 된다.","화가 날 때는 즉시 반응하지 말고 시간을 두어 감정이 가라앉은 뒤에 대응해야 한다."],"t":["반","과","비","부","-"],"r":["글이 경계하는 행동이다.","감정 제거는 과장이다.","모든 메시지 점검은 글에 없다.","효과 설명이며 권고가 빠졌다.","냉각 시간을 두라는 주장이다."],"a":4,"n":236},{"lv":3,"ty":0,"tp":"사회","p":"Many people fear public speaking more than almost anything else. Yet the fear shrinks with practice, not with avoidance. Those who accept small speaking opportunities, such as a toast or a short report, gradually learn that the audience is more forgiving than imagined. Each experience of surviving the moment weakens the dread. Courage in speaking, in this sense, is built rather than born.","k":"Courage in speaking, in this sense, is built rather than born.","c":["the reasons why so many people fear public speaking more than almost anything else","the avoidance of speaking as a way to reduce fear","overcoming the fear of speaking through gradual experience","the forgiving attitude of audiences toward speakers","how to write an excellent toast or short report"],"t":["세","반","-","부","이"],"r":["두려움의 원인은 도입부 서술일 뿐이다.","글은 회피가 아니라 연습을 말한다.","점진적 경험으로 말하기의 두려움을 극복한다는 내용이다.","청중의 관대함은 배우는 내용 중 일부이다.","원고 작성법은 다루지 않았다."],"a":2,"n":237},{"lv":3,"ty":1,"tp":"역사","p":"The invention of the clock did more than tell time; it taught people to live by it. Before clocks, work followed the sun and the seasons. Afterward, factories required workers to arrive at exact moments, and schedules replaced natural rhythms. Our modern sense of being 'late' is a product of this change. Time became something to be spent, saved, and wasted.","k":"Time became something to be spent, saved, and wasted.","c":["How Clocks Turned Time into Something to Spend","The Natural Rhythms of the Sun and Seasons","Factories: Where the First Clock Was Invented","How to Always Arrive at Exact Moments for Work and School","Why Modern People Are Always Late for Work"],"t":["-","반","상","이","세"],"r":["시계가 시간을 소비 대상으로 바꿨다는 내용이다.","글은 자연 리듬이 시계로 대체되었다고 한다.","시계의 발명지는 지문에 없다.","시간 엄수 방법은 다루지 않았다.","지각은 변화의 결과 예시일 뿐이다."],"a":0,"n":238},{"lv":3,"ty":2,"tp":"언어","p":"Learners of a new language often worry about making mistakes and therefore hesitate to speak. Yet mistakes are the raw material of learning. Each error shows where understanding is incomplete, and each correction fixes the pattern in memory. A learner who speaks imperfectly for six months will usually surpass one who waits silently for perfection. Fluency is built in conversation, not in waiting.","k":"Fluency is built in conversation, not in waiting.","c":["외국어를 배울 때는 오류가 고착되지 않도록 완벽하게 준비된 문장만 사용하여 말하는 것이 바람직하다.","외국어 실력은 실수를 두려워하며 기다리기보다 실제로 말하면서 길러진다.","실수를 정정받으면 그 패턴이 기억에 고정되므로 학습자는 교사의 정정을 가장 중요하게 여겨야 한다.","6개월 동안 불완전하게 말한 학습자는 완벽을 기다린 학습자와 달리 반드시 외국어를 유창하게 구사한다.","외국어 학습자는 모국어 화자와의 대화 기회가 많은 나라에서 공부할 때 가장 빠른 진전을 이룬다."],"t":["반","-","부","과","상"],"r":["글은 완벽을 기다리지 말라고 한다.","실수를 감수하고 말해야 유창해진다는 내용이다.","정정의 효과는 일부 근거이다.","'반드시'는 지나친 일반화이다.","유학은 지문에 없다."],"a":1,"n":239},{"lv":3,"ty":3,"tp":"언어","p":"In meetings, jargon can make speakers sound expert but leave listeners confused. Specialists forget that terms familiar to them are unfamiliar to others. The aim of communication is to be understood, not to impress. Experts should explain their ideas in everyday words, using technical terms only when the audience shares them.","k":"Experts should explain their ideas in everyday words","c":["전문가는 정확성을 위해 전문 용어를 사용해야 하며 청중이 이해하지 못해도 설명을 줄여야 한다.","전문 용어는 회의에서 혼란을 일으키므로 모든 전문 분야에서 전문 용어의 사용을 금지해야 한다.","전문가는 청중이 공유하지 않는 전문 용어 대신 일상적인 말로 설명해야 한다.","전문가들은 자신에게 익숙한 용어가 다른 사람에게는 낯설다는 사실을 쉽게 잊어버린다.","회의에서는 발표 시간이 길어지면 집중력이 떨어지므로 핵심 내용만 짧게 말하는 것이 효과적이다."],"t":["반","과","-","부","상"],"r":["글이 비판하는 태도이다.","전면 금지는 과장이다.","쉬운 말로 설명하라는 주장이다.","원인 서술이며 권고가 빠졌다.","발표 시간 문제는 지문에 없다."],"a":2,"n":240},{"lv":3,"ty":0,"tp":"경제","p":"Diamonds are not especially rare, yet they are expensive. Their price is held up by careful control of supply and by decades of marketing that linked them to love. Value, we tend to think, lies in the object itself. In truth it often lies in the story people believe about it. Understanding price therefore requires asking not only what something is but what others agree it means.","k":"it often lies in the story people believe about it","c":["the physical rarity of diamonds in nature","the methods used to mine diamonds efficiently","how shared beliefs, not just scarcity, shape value","the history of love and marriage traditions","the control of supply as the only source of price"],"t":["반","이","-","부","과"],"r":["글은 다이아몬드가 특별히 희귀하지 않다고 한다.","채굴 방법은 언급되지 않았다.","공유된 믿음이 가치를 만든다는 내용이다.","사랑과의 연결은 마케팅 사례의 일부이다.","'유일한 원천'은 글과 어긋나는 과장이다."],"a":2,"n":241},{"lv":3,"ty":1,"tp":"사회","p":"In a crowd, people often wait for someone else to help a person in trouble. Each person assumes another will act, so no one does. Psychologists call this the bystander effect. Yet the effect weakens if one person speaks up and points to a specific individual: 'You in the red coat, please call for help.' Clear requests turn a diffuse crowd into responsible individuals.","k":"Clear requests turn a diffuse crowd into responsible individuals.","c":["Why Crowds Are Always Ready to Help","A Red Coat and the Psychology of Fashion","The Bystander Effect: An Unavoidable Human Fate","Pointing to One Person Breaks the Bystander Effect","Why Each Person Assumes Others Will Act"],"t":["반","이","비","-","부"],"r":["군중은 돕지 않는다는 글과 반대이다.","옷은 예시의 소품일 뿐이다.","피할 수 없다는 것은 글과 어긋난다.","특정인을 지목하면 방관자 효과가 약해진다는 내용이다.","원인만 다루고 해결이 빠졌다."],"a":3,"n":242},{"lv":3,"ty":2,"tp":"사회","p":"Tradition is sometimes treated as a burden that prevents progress. Yet many traditions carry knowledge learned through trial and error over generations. A custom that seems pointless may protect people from a danger no one remembers. Before discarding a practice, it is wise to ask what purpose it once served. Change is healthiest when it follows understanding, not impatience.","k":"Change is healthiest when it follows understanding, not impatience.","c":["전통을 바꿀 때는 그것이 어떤 목적에 쓰였는지 이해한 뒤에 하는 것이 바람직하다.","전통은 시간이 지나면서 쓸모를 잃으므로 가능한 한 빨리 새로운 방식으로 바꾸어 나가야 한다.","전통에는 여러 세대에 걸친 시행착오의 지식이 담겨 있으므로 어떠한 변화도 허용해서는 안 된다.","무의미해 보이는 관습이 아무도 기억하지 못하는 위험으로부터 사람들을 보호해 줄 수 있다.","사회가 발전하려면 전통을 존중하는 교육과 함께 정부의 문화재 보호 예산을 늘리는 일이 필요하다."],"t":["-","반","과","부","상"],"r":["이해에 바탕한 변화를 권하는 내용이다.","글이 경계하는 성급한 변화이다.","변화 금지는 지나친 일반화이다.","근거 중 하나이다.","예산 확대는 지문에 없다."],"a":0,"n":243},{"lv":3,"ty":3,"tp":"경제","p":"Rewards seem a sure way to motivate people, yet they can backfire. Children paid to read may begin to see reading as a chore, losing the pleasure that made them read before. When an activity is enjoyable in itself, external rewards can weaken that inner drive. Parents and managers should be careful about attaching payments to activities people already enjoy.","k":"be careful about attaching payments to activities people already enjoy","c":["독서를 즐기는 아이에게는 용돈을 지급해서 독서량을 늘려 더 큰 동기를 부여하는 것이 효과적이다.","보상은 어떤 경우에도 사람의 동기를 약화시키므로 부모와 관리자는 보상을 완전히 폐지해야 한다.","돈을 받고 책을 읽는 아이는 독서를 숙제처럼 느끼기 때문에 학교에서 독서 과제를 없애야 한다.","외부의 보상이 약해지면 즐겁던 활동도 의무감을 주는 일로 바뀌게 되는 현상이 나타난다.","이미 즐기는 활동에 보상을 붙이면 내적 동기가 약해질 수 있으므로 신중해야 한다."],"t":["반","과","비","부","-"],"r":["글이 경계하는 방법이다.","'어떤 경우에도'는 과장이다.","독서 과제 폐지는 글에 없다.","현상 설명이며 조언이 빠졌다.","내적 동기를 훼손하는 보상에 주의하라는 주장이다."],"a":4,"n":244},{"lv":3,"ty":0,"tp":"교육","p":"Tests are usually seen as a way to measure learning after it has happened. Yet research shows that the act of retrieving information from memory strengthens it more than rereading does. A student who closes the book and tries to recall the main points learns more than one who reads the page again. Testing, then, is not only an assessment tool but also a way of learning.","k":"Testing, then, is not only an assessment tool but also a way of learning.","c":["the role of tests in measuring student achievement","the power of retrieval practice to strengthen learning","the advantages of rereading textbooks repeatedly before important examinations in school","how memory declines as students grow older","the elimination of all tests from schools"],"t":["부","-","반","상","과"],"r":["평가 기능은 글이 넘어서는 통념이다.","인출 연습이 학습을 강화한다는 내용이다.","글은 다시 읽기보다 인출이 낫다고 한다.","기억력 감퇴는 지문에 없다.","시험 폐지는 글에 없는 극단이다."],"a":1,"n":245},{"lv":3,"ty":1,"tp":"경제","p":"Anyone who has bought a cheap tool and replaced it three times knows the saying 'buy cheap, buy twice.' The lowest price tag is not the lowest cost. A durable item that costs more at first may save money over years. The same reasoning applies to shoes, mattresses, and appliances. Smart buyers compare the cost per year of use, not the price on the day of purchase.","k":"Smart buyers compare the cost per year of use","c":["Why Cheap Tools Are the Best Bargains","Replacing Shoes, Mattresses, and Appliances","The Lowest Price Is Always the Worst Choice","A Popular Saying About Buying Twice","Judge Cost per Year, Not the Price Tag"],"t":["반","세","과","부","-"],"r":["싼 것이 비싸게 먹힌다는 글과 반대이다.","품목들은 예시이다.","'항상'은 지나친 일반화이다.","속담만 소개하고 핵심 원칙이 빠졌다.","연간 사용 비용으로 판단하라는 내용이다."],"a":4,"n":246},{"lv":3,"ty":2,"tp":"경제","p":"Rising wages are generally good for workers, yet if prices rise faster, buying power falls. A salary that grows by three percent while prices grow by five has effectively shrunk. For this reason, economists distinguish between nominal wages, the number on the paycheck, and real wages, what that number can actually buy. Judging income without considering prices gives a misleading picture of living standards.","k":"Judging income without considering prices gives a misleading picture of living standards.","c":["임금이 오르면 노동자의 생활 수준은 반드시 좋아지므로 임금 인상 정책이 최우선이 되어야 한다.","물가 상승률이 임금 상승률을 넘어서면 경제학자들은 임금 인상을 막아야 한다고 주장한다.","급여 명세서에 적힌 금액은 명목 임금이라 하고 그것으로 살 수 있는 양은 실질 임금이라 불린다.","임금의 증감은 물가를 함께 고려해야 생활 수준을 정확히 판단할 수 있다.","임금이 3퍼센트 오르고 물가가 5퍼센트 오르는 현상은 대부분의 국가에서 매년 반복되고 있다."],"t":["반","비","부","-","상"],"r":["글은 물가 상승 시 구매력이 줄 수 있다고 한다.","임금 인상 억제 주장은 글에 없다.","용어 정의일 뿐 요지(함께 고려)가 빠졌다.","명목 임금과 실질 임금의 구분이 핵심이다.","반복 현상이라는 정보는 지문에 없다."],"a":3,"n":247},{"lv":3,"ty":3,"tp":"역사","p":"Old buildings are often torn down for being outdated and costly to maintain. Yet they hold the memory of a place: its craftsmanship, its stories, its sense of continuity. Once demolished, they cannot be rebuilt as the real thing. Cities should weigh heritage as seriously as profit before approving the demolition of historic structures.","k":"Cities should weigh heritage as seriously as profit","c":["도시는 오래된 건물을 철거하기 전에 유산의 가치를 이윤만큼 진지하게 고려해야 한다.","낡고 유지 비용이 많이 드는 건물은 가능한 한 빨리 철거하고 새로 건설하는 것이 도시에 이득이다.","모든 오래된 건물은 지역의 기억을 간직하고 있으므로 어떠한 경우에도 철거해서는 안 된다.","철거된 건물은 진짜와 같은 모습으로 복원할 수 없다는 점은 유산을 보존해야 하는 근거 중 하나이다.","역사적 건물을 관광 자원으로 개발하면 지역 경제가 크게 성장하므로 정부가 개발을 지원해야 한다."],"t":["-","반","과","부","상"],"r":["유산의 가치를 고려하라는 주장이다.","글이 비판하는 관점이다.","철거 전면 금지는 과장이다.","근거 중 하나이며 주장이 빠졌다.","관광 개발은 지문에 없다."],"a":0,"n":248},{"lv":3,"ty":0,"tp":"심리","p":"We usually regard patience as the ability to wait calmly. However, psychologists describe it as an active skill: choosing a calm response while frustrated. Impatient people are often not lacking in desire but in strategies for managing discomfort. Techniques such as redirecting attention and reminding oneself of the larger goal can be practiced. Patience, in this view, is less a trait than a habit trained over time.","k":"Patience, in this view, is less a trait than a habit trained over time.","c":["patience as a skill that can be trained","the inborn traits that make some people calm","the strong desires of impatient people","the best ways to wait for a delayed train","the elimination of frustration from daily life"],"t":["-","반","세","이","과"],"r":["인내가 훈련 가능한 기술이라는 내용이다.","글은 타고난 특성이라는 생각을 반박한다.","강한 욕구는 설명 속 한 구절이다.","기차 대기는 다루지 않았다.","좌절 제거는 글에 없는 비약이다."],"a":0,"n":249},{"lv":3,"ty":1,"tp":"심리","p":"When we are praised, we feel good; when we are criticized, we feel bad. But the sting of a single criticism often outweighs several compliments. This is called negativity bias, and it has deep roots: our ancestors who noticed threats survived longer. Knowing about this bias helps us keep a harsh remark in proportion. A bad review is one data point, not the whole story.","k":"A bad review is one data point, not the whole story.","c":["Why One Criticism Weighs More Than Many Compliments","How Praise Makes Us Feel Good Every Day","Ancestors Who Survived Longer by Noticing Threats","Why We Should Ignore All Harsh Remarks from Other People","The Happiness Brought by Several Compliments"],"t":["-","부","세","비","반"],"r":["부정 편향 때문에 비판이 더 크게 느껴진다는 내용이다.","칭찬의 효과는 도입부 대조이다.","조상 이야기는 원인 설명 일부이다.","모든 비판 무시는 비약이다.","칭찬의 무게가 더 작다는 글과 반대이다."],"a":0,"n":250},{"lv":3,"ty":2,"tp":"심리","p":"Procrastination is usually blamed on laziness. Yet researchers find that people delay tasks mainly to avoid unpleasant feelings such as anxiety or boredom. Putting off the task gives short-term relief, but the stress returns, often stronger. Calling it a time-management problem misses the point. Procrastination is better understood as a problem of managing emotions, not minutes.","k":"Procrastination is better understood as a problem of managing emotions, not minutes.","c":["미루는 행동은 게으른 성격에서 비롯되므로 일정을 촘촘히 짜는 시간 관리 기법으로 충분히 해결된다.","일을 미루면 단기적으로 불안이 줄어들지만 스트레스는 더 강하게 되돌아오므로 처음부터 미루지 않아야 한다.","불안이나 지루함을 느끼는 사람은 모든 업무를 반드시 미루게 되므로 감정을 완전히 없애야 한다.","마감이 임박해서야 일을 시작하는 사람들은 창의성이 높아 결과물의 질이 오히려 더 좋은 편이다.","미루는 습관은 시간 관리의 문제라기보다 불쾌한 감정을 다루는 문제로 이해해야 한다."],"t":["반","부","과","상","-"],"r":["글이 부정하는 통념이다.","원인 설명 일부이다.","'반드시'와 '완전히'는 과장이다.","창의성과 마감은 지문에 없다.","미루기를 감정 관리의 문제로 본다는 내용이다."],"a":4,"n":251},{"lv":3,"ty":3,"tp":"교육","p":"Group projects are meant to teach cooperation, but they often reward only the hardest worker while others coast. When grades are shared equally, effort becomes uneven and resentment grows. Teachers should assess both the group product and each member's individual contribution so that responsibility is clear.","k":"assess both the group product and each member's individual contribution","c":["모둠 과제의 점수는 구성원 모두에게 똑같이 부여하여 협력의 가치를 강조하는 것이 바람직하다.","무임승차하는 학생이 생기지 않도록 교사는 모둠 과제를 없애고 개인 과제만 부여해야 한다.","가장 열심히 하는 학생이 많은 일을 맡게 되므로 그 학생에게 추가 점수를 주어 동기를 보호해야 한다.","교사는 모둠 결과물과 개인별 기여도를 함께 평가하여 책임을 분명히 해야 한다.","점수가 똑같이 부여되면 노력의 차이가 커지고 불만이 쌓인다는 점은 모둠 활동에서 흔히 관찰된다."],"t":["반","과","비","-","부"],"r":["글이 문제 삼는 방식이다.","모둠 과제 폐지는 과장이다.","추가 점수는 글에 없다.","개인 기여도 평가를 포함하라는 주장이다.","문제 설명이며 해결 방안이 빠졌다."],"a":3,"n":252},{"lv":3,"ty":0,"tp":"사회","p":"Cities compete to build the tallest tower, but the buildings that shape daily life are often modest. A corner bakery, a small park, and a bus stop with a bench create the neighborhood's character. Yet these details are rarely noticed by planners focused on landmarks. Residents judge a city by the spaces they use every day, not by the skyline seen from far away. Good urban design begins at the scale of the pedestrian.","k":"Good urban design begins at the scale of the pedestrian.","c":["the competition among large cities for the tallest and most famous buildings in the world","the architecture of famous landmarks and towers","the economic value of a neighborhood bakery","the importance of everyday human-scale spaces in cities","the need to remove skyscrapers from every city"],"t":["세","반","부","-","과"],"r":["고층 경쟁은 도입부 배경이다.","글은 랜드마크보다 일상 공간을 강조한다.","빵집은 예시이며 경제적 가치는 다루지 않았다.","보행자 규모의 일상적 공간이 중요하다는 내용이다.","고층 건물 철거는 극단적 확대이다."],"a":3,"n":253},{"lv":3,"ty":1,"tp":"과학","p":"Bees do more than make honey. As they move from flower to flower, they carry pollen that lets plants produce fruit and seeds. A large share of the food we eat, from apples to almonds, depends on this work. If bee populations keep falling, harvests will shrink and prices will rise. These small insects quietly hold up a large part of the human food supply.","k":"These small insects quietly hold up a large part of the human food supply.","c":["Honey: The Sweetest Product of Bees","Apples and Almonds: A Guide to Pollen","Bees: Small Insects Supporting Our Food Supply","Why Harvests Never Depend on Insects in Modern Farming","The Disappearance of All Pollinators on Earth"],"t":["반","세","-","반","과"],"r":["글은 꿀 이상의 역할을 말한다.","사과·아몬드는 예시이다.","벌이 식량 공급을 떠받친다는 내용이다.","작물이 곤충에 의존한다는 글과 반대이다.","모든 수분 곤충 소멸은 과장이다."],"a":2,"n":254},{"lv":3,"ty":2,"tp":"과학","p":"Weather forecasts predict rain with a probability: a seventy percent chance does not mean it will rain for seventy percent of the day. It means that under similar conditions, rain fell on seven of every ten occasions. Many people misread such numbers and then complain that forecasts are wrong. Understanding probability statements is a practical skill, because it lets us make sensible choices under uncertainty.","k":"Understanding probability statements is a practical skill","c":["일기예보에서 강수 확률이 70퍼센트라는 것은 하루 중 70퍼센트의 시간 동안 비가 내린다는 뜻이다.","기상 예보가 자주 틀리는 것은 예보관이 확률을 잘못 계산하기 때문이므로 계산 방식이 개선되어야 한다.","확률적 예보의 의미를 정확히 이해하면 불확실한 상황에서 합리적으로 선택할 수 있다.","비슷한 조건에서 열 번 중 일곱 번 비가 내렸다는 것은 확률의 정의를 보여 주는 하나의 사례이다.","확률을 이해하는 사람은 일기예보를 믿지 않고 날씨를 스스로 판단하는 경향이 있어 예보에 의존하지 않는다."],"t":["반","비","-","세","과"],"r":["글이 바로잡는 오해이다.","예보관의 계산 오류는 글에 없다.","확률 해석 능력이 실용적이라는 내용이다.","예시를 풀이한 것으로 요지가 아니다.","예보 불신은 글과 어긋난다."],"a":2,"n":255},{"lv":3,"ty":3,"tp":"사회","p":"Cities that lack affordable housing push workers farther from their jobs, adding hours of commuting and cost. Nurses, teachers, and service workers who keep the city running cannot afford to live in it. A city that cannot house its own workers weakens itself. Local governments should therefore encourage the building of affordable housing near employment centers.","k":"Local governments should therefore encourage the building of affordable housing near employment centers.","c":["간호사와 교사 등 도시를 지탱하는 노동자들은 임금 인상을 요구하여 주거 비용을 직접 부담해야 한다.","지방 정부는 일자리가 모인 곳 가까이에 저렴한 주택 건설을 장려해야 한다.","도시가 노동자를 수용하지 못하면 약해지므로 주택이 부족한 도시는 외부 인구의 유입을 제한해야 한다.","직장에서 멀리 떨어져 사는 노동자는 통근 시간이 길어져 비용이 늘어나는 문제를 겪는 경우가 많다.","서비스업 종사자는 도시에서 살지 못하게 되므로 모든 직업군에 무상으로 주택을 공급해야 한다."],"t":["반","-","비","부","과"],"r":["해법은 임금 인상이 아니라 주택 공급이다.","직장 근처 저렴한 주택 건설을 장려하라는 주장이다.","인구 유입 제한은 글에 없다.","문제 설명이며 주장이 빠졌다.","무상 공급은 과장이다."],"a":1,"n":256},{"lv":3,"ty":0,"tp":"건강","p":"Short naps are often seen as a sign of laziness. Yet research shows that a nap of twenty minutes can sharpen attention and improve mood in the afternoon, when energy naturally dips. Longer naps, however, may leave people groggy and disturb night sleep. The benefit lies in brevity. A well-timed short nap is a tool for alertness, not a lapse in discipline.","k":"A well-timed short nap is a tool for alertness, not a lapse in discipline.","c":["the harmful effects of sleeping during the day","the reasons people see napping as lazy","the danger of longer naps for night sleep","the natural dip in energy at midnight","the benefits of short naps for alertness"],"t":["반","세","부","상","-"],"r":["글은 짧은 낮잠의 이점을 말한다.","게으름이라는 인식은 도입부이다.","긴 낮잠의 위험은 단서 조항일 뿐이다.","한밤의 에너지 저하는 지문에 없다.","짧은 낮잠이 각성에 이롭다는 내용이다."],"a":4,"n":257},{"lv":3,"ty":1,"tp":"언어","p":"Translators know that words rarely match one-to-one across languages. A single term for a family relationship in one language may need a whole phrase in another, and humor often fails completely. A translator must therefore choose between staying close to the original and sounding natural to new readers. Translation is not copying but negotiating between two worlds.","k":"Translation is not copying but negotiating between two worlds.","c":["Translation: Negotiating Between Two Worlds","Why Words Match Perfectly Across Languages","Family Relationships and the Names They Carry","Humor: The Only Obstacle in Translation","A Translator's Skill in Writing Natural Sentences"],"t":["-","반","세","과","부"],"r":["번역이 두 세계 사이의 협상이라는 내용이다.","글은 일대일 대응이 드물다고 한다.","가족 관계 용어는 예시이다.","유머만이 장애물이라는 것은 과장이다.","자연스러움은 선택지의 한쪽일 뿐이다."],"a":0,"n":258},{"lv":3,"ty":2,"tp":"건강","p":"Many people treat breakfast as the most important meal and force themselves to eat it even without appetite. But the evidence is mixed: some people function well on a later first meal. What seems to matter more is the overall quality of food across the day and whether eating patterns suit one's own body. No single meal has magical power. A healthy diet is judged by the whole day, not one plate.","k":"A healthy diet is judged by the whole day, not one plate.","c":["건강한 식단은 특정 한 끼가 아니라 하루 전체의 식사 구성으로 판단해야 한다.","아침 식사는 하루 중 가장 중요한 식사이므로 식욕이 없더라도 반드시 챙겨 먹는 것이 건강에 이롭다.","늦은 시간에 첫 끼를 먹는 사람들은 건강하게 활동할 수 있으므로 아침 식사는 거르는 것이 이롭다.","아침 식사의 효과에 대한 증거가 엇갈리기 때문에 영양학자들은 식사 시간을 정할 수 없다고 말한다.","식사의 질과 각자의 몸에 맞는 식사 패턴이 중요하다는 점은 성인과 어린이에게 똑같이 적용된다."],"t":["-","반","과","비","상"],"r":["하루 전체 식사의 질이 중요하다는 내용이다.","글이 의문시하는 통념이다.","아침 결식 권장은 과장이다.","정할 수 없다는 비약이다.","연령 비교는 지문에 없다."],"a":0,"n":259},{"lv":3,"ty":3,"tp":"건강","p":"Many people rely on supplements for nutrition, believing a pill can replace a balanced diet. But foods contain combinations of nutrients and fibers that work together in ways pills cannot imitate. Except for specific deficiencies diagnosed by a doctor, supplements add little. The foundation of good nutrition should be a varied diet of real food.","k":"The foundation of good nutrition should be a varied diet of real food.","c":["영양 보충제는 균형 잡힌 식단을 대체할 수 있으므로 바쁜 사람은 알약으로 영양을 해결해도 좋다.","의사가 진단한 영양 결핍이 있는 사람에게도 보충제는 무의미하므로 모든 환자의 복용은 중단되어야 한다.","영양의 기본은 보충제가 아니라 다양한 실제 음식으로 이루어진 식단이어야 한다.","음식 속 영양소와 섬유질은 함께 작용하는데 이는 알약의 성분 배합 기술이 앞으로 발전하면 해결될 것이다.","영양제를 복용하는 사람이 많아졌다는 사실은 현대인이 영양에 대한 불안을 느끼고 있음을 보여 준다."],"t":["반","과","-","상","비"],"r":["글이 부정하는 믿음이다.","결핍 시 예외를 부정하는 과장이다.","음식 위주의 식단을 주장한다.","기술 발전은 지문에 없다.","불안 해석은 글에 없는 비약이다."],"a":2,"n":260},{"lv":3,"ty":0,"tp":"언어","p":"Standard language is taught in schools, yet dialects persist in homes. Dialects carry local history: vocabulary for landscapes, foods, and customs that the standard form has no words for. When a dialect disappears, a record of the region's way of life disappears with it. Some regions now teach dialect songs and stories to children. Preserving local speech, then, is also preserving local memory.","k":"Preserving local speech, then, is also preserving local memory.","c":["the rules of standard language taught in schools","the replacement of dialects by the standard form","the songs and stories children enjoy in school","the difficulty of writing down regional pronunciations","dialects as living records of local life and memory"],"t":["세","반","부","이","-"],"r":["표준어 교육은 도입부 대조이다.","글은 방언 보존을 말한다.","노래와 이야기는 보존 방법의 한 예이다.","발음 표기는 다루지 않았다.","방언이 지역의 삶과 기억의 기록이라는 내용이다."],"a":4,"n":261},{"lv":3,"ty":1,"tp":"교육","p":"Homework is meant to reinforce what students learn in class. But when assignments pile up, students may rush through them just to finish, copying answers or skipping thought. Quantity then replaces quality. Some schools have reduced homework to a few meaningful tasks and found that students engage more deeply. More work does not mean more learning.","k":"More work does not mean more learning.","c":["Why Students Should Copy Answers Quickly","The Purpose of Reinforcing Classroom Lessons","Piling Up Assignments to Raise Achievement","Less Homework, Deeper Learning","How
