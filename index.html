Schools Assign Homework to Every Grade"],"t":["비","부","반","-","이"],"r":["베끼기를 권하는 것은 글과 무관한 비약이다.","숙제의 의도는 도입부이다.","과제 증가는 학습을 낮춘다는 글과 반대이다.","숙제를 줄이면 학습이 깊어진다는 내용이다.","학년별 배정은 다루지 않았다."],"a":3,"n":262},{"lv":3,"ty":2,"tp":"기술","p":"Passwords are tiring to remember, so people reuse the same one across many sites. The danger is that when one site is breached, criminals try the stolen password everywhere else. A password manager can create and store a unique password for each site, so a single leak causes limited harm. The solution to forgetful memory is not to simplify passwords but to let software remember them.","k":"The solution to forgetful memory is not to simplify passwords but to let software remember them.","c":["여러 사이트에서 같은 비밀번호를 사용하면 하나만 기억하면 되므로 안전성과 편의성을 모두 높일 수 있다.","비밀번호를 쉽게 만드는 대신 관리 프로그램에 기억을 맡겨 사이트마다 다른 비밀번호를 쓰는 것이 좋다.","비밀번호를 기억하기가 힘든 사람은 가능한 한 짧고 단순한 비밀번호를 사용하는 것이 현실적인 대안이다.","한 사이트에서 정보가 유출되면 범죄자들이 훔친 비밀번호를 다른 모든 사이트에 입력해 본다는 점이 위험하다.","비밀번호 관리 프로그램은 대부분 유료로 제공되므로 비용을 지불할 수 있는 사람만 안전하게 보호받는다."],"t":["반","-","반","부","상"],"r":["재사용의 위험을 지적하는 글과 반대이다.","관리 프로그램 사용을 권하는 내용이다.","단순화는 해결책이 아니라고 했다.","문제 설명이며 해결책이 빠졌다.","유료 여부는 지문에 없다."],"a":1,"n":263},{"lv":3,"ty":3,"tp":"과학","p":"Space exploration is criticized as expensive when problems exist on Earth. Yet research for spacecraft has led to advances in medicine, materials, and communication that benefit daily life. Curiosity about the unknown often yields uses no one planned. Societies should continue to fund exploration, because the search for knowledge repays itself in unexpected ways.","k":"Societies should continue to fund exploration","c":["지구에 해결할 문제가 많으므로 우주 탐사 예산은 줄이고 의료와 통신에 우선 투자해야 한다.","우주선 연구가 의료와 소재 분야에 도움이 되었으므로 모든 기초 연구는 우주 연구에 집중되어야 한다.","미지에 대한 호기심은 계획하지 못한 쓰임으로 이어지는 경우가 많다는 점이 역사적으로 확인된다.","민간 기업이 우주 탐사에 참여하면 비용이 줄어들기 때문에 정부는 우주 사업을 민간에 이양해야 한다.","사회는 지식 탐구가 예상치 못한 방식으로 보답하므로 우주 탐사에 계속 투자해야 한다."],"t":["반","과","부","상","-"],"r":["글이 반박하는 비판이다.","우주 연구 집중은 과장이다.","근거이며 주장이 빠졌다.","민간 이양은 지문에 없다.","우주 탐사 투자를 지속하라는 주장이다."],"a":4,"n":264},{"lv":3,"ty":0,"tp":"환경","p":"On a summer day, a paved parking lot can be much hotter than a nearby lawn. Dark surfaces absorb heat and release it slowly, so cities stay warmer than surrounding countryside, even at night. This 'heat island' effect raises energy use and endangers vulnerable residents. Planting trees, painting roofs white, and replacing pavement with greenery all lower temperatures. Cooling a city is largely a matter of redesigning its surfaces.","k":"Cooling a city is largely a matter of redesigning its surfaces.","c":["the energy cost of air conditioning in summer","the temperature of the countryside at night","the dangers heat poses to vulnerable residents","reducing urban heat by redesigning city surfaces","the replacement of all cities with greenery"],"t":["세","이","부","-","과"],"r":["에너지 사용 증가는 결과 중 하나이다.","시골의 밤 기온은 비교 서술일 뿐이다.","위험은 문제점의 일부이며 해결 방향이 빠졌다.","도시 표면을 재설계해 열섬을 줄인다는 내용이다.","도시 전체의 녹지화는 과장이다."],"a":3,"n":265},{"lv":3,"ty":1,"tp":"건강","p":"Drinking water is essential, but the old rule of eight glasses a day has little scientific support. Needs vary with body size, climate, and activity, and food supplies a good share of our fluids. A simpler guide is thirst itself; in most healthy adults, it works reliably. Rather than counting glasses, we can trust the body's own signal.","k":"Rather than counting glasses, we can trust the body's own signal.","c":["Why Eight Glasses of Water Are Essential","How Climate Changes the Foods We Eat","Water in Food: A Hidden Source of Fluids","Thirst as a Perfect Guide for Every Person","Trust Your Thirst, Not the Eight-Glass Rule"],"t":["반","이","부","과","-"],"r":["8잔 규칙에 근거가 적다는 글과 반대이다.","기후와 음식은 지문과 무관하다.","음식 속 수분은 근거 중 하나이다.","'모든 사람에게 완벽'은 과장이다.","갈증 신호를 믿으라는 내용이다."],"a":4,"n":266},{"lv":3,"ty":2,"tp":"환경","p":"Recycling is valuable, but it is the last of three Rs. Reducing consumption and reusing items come first, because they prevent waste from existing at all. Recycling still takes energy, and not every material can be processed repeatedly. A culture that relies on recycling alone can feel virtuous while continuing to produce excessive trash. Cutting waste at its source beats cleaning it up afterward.","k":"Cutting waste at its source beats cleaning it up afterward.","c":["재활용은 에너지를 쓰지 않고 모든 재료를 무한히 반복해서 가공할 수 있으므로 가장 훌륭한 방법이다.","재활용은 세 가지 R 중 마지막이므로 소비자는 재활용보다는 쓰레기를 버리는 법을 먼저 배워야 한다.","재활용에 의존하는 문화에서는 사람들이 쓰레기를 과도하게 만들어도 스스로 도덕적이라고 느끼게 된다.","쓰레기는 나중에 재활용하는 것보다 발생 자체를 줄이는 것이 더 낫다.","재사용 가능한 물건을 많이 사는 소비자는 환경을 보호하는 사람이므로 정부가 보조금을 지급해야 한다."],"t":["반","비","부","-","상"],"r":["글은 재활용에도 에너지가 들고 한계가 있다고 한다.","버리는 법을 배우라는 말은 비약이다.","문제점 지적이며 대안이 빠졌다.","소비 감축과 재사용이 재활용보다 우선이라는 내용이다.","보조금은 지문에 없다."],"a":3,"n":267},{"lv":3,"ty":3,"tp":"예술","p":"Many schools cut art and music classes when budgets tighten, treating them as extras. Yet creative subjects train observation, patience, and expression, which support learning in every field. A student who learns to hear a melody or notice a color learns to pay attention. Schools should protect arts education as a core part of the curriculum, not a luxury.","k":"Schools should protect arts education as a core part of the curriculum","c":["학교는 예술 교육을 사치가 아니라 교육과정의 핵심으로 보호해야 한다.","예산이 부족한 학교는 예술과 음악 수업을 줄여 핵심 교과에 자원을 집중하는 것이 합리적이다.","예술 교육은 관찰력과 인내심을 길러 주므로 다른 모든 교과를 예술 수업으로 대체해야 한다.","선율을 듣거나 색을 알아차리는 법을 배운 학생은 주의를 기울이는 법을 배우게 된다는 점이 있다.","예술 수업은 학생의 창의성을 높여 장래 직업 선택의 폭을 넓히므로 대학 입시에 반영해야 한다."],"t":["-","반","과","부","비"],"r":["예술 교육 보호를 주장한다.","글이 비판하는 결정이다.","교과 대체는 과장이다.","근거 중 하나이며 주장이 빠졌다.","입시 반영은 글에 없다."],"a":0,"n":268},{"lv":3,"ty":0,"tp":"사회","p":"Gossip has a poor reputation, yet it serves a social purpose. By sharing stories about who is helpful and who cannot be trusted, people learn the norms of their group without direct experience of every betrayal. Gossip warns us and teaches us. Of course, it can be cruel and false, and then it harms the very bonds it supports. Its value depends on whether it protects or punishes.","k":"Its value depends on whether it protects or punishes.","c":["the cruelty and falsehood found in rumors","the double-edged social function of gossip","the importance of direct experience in learning norms","how groups choose their most helpful members","the elimination of gossip from social life"],"t":["부","-","반","세","과"],"r":["해악 한 면만 다루고 사회적 기능이 빠졌다.","험담이 보호와 해악의 양면을 지닌다는 내용이다.","글은 직접 경험 없이도 배운다고 한다.","도움이 되는 사람 판단은 소문의 내용 예시이다.","험담 제거는 글에 없는 비약이다."],"a":1,"n":269},{"lv":3,"ty":1,"tp":"기술","p":"Early maps were drawn by explorers who walked or sailed through unknown lands. Today, satellites photograph every corner of the planet each day. Yet a photograph is not a map: it shows everything but explains nothing. A good map selects, simplifies, and highlights what matters for a purpose. Leaving things out is what makes a map useful.","k":"Leaving things out is what makes a map useful.","c":["Satellites: Showing Everything on Earth Daily","Explorers Who Sailed Through Unknown Lands","A Good Map Is Made by Leaving Things Out","Why a Photograph Is Better Than a Map","How Maps Predict the Weather of Each Region"],"t":["부","세","-","반","이"],"r":["위성 사진은 비교 대상일 뿐이다.","탐험가는 도입부 배경이다.","지도는 생략을 통해 유용해진다는 내용이다.","글은 사진이 지도가 아니라고 한다.","일기 예측은 다루지 않았다."],"a":2,"n":270},{"lv":3,"ty":2,"tp":"사회","p":"Rules in a community are often seen as limits on freedom. But consider a road without traffic laws: drivers would hesitate, collide, and move more slowly. Shared rules let strangers predict each other's actions and thus act with confidence. In this sense, a rule is not only a restriction but also a form of cooperation. Freedom in a crowded world depends on agreed boundaries.","k":"Freedom in a crowded world depends on agreed boundaries.","c":["교통 법규가 없는 도로에서는 운전자들이 주저하다가 충돌하므로 모든 규칙을 더 엄격히 강화해야 한다.","규칙은 개인의 자유를 제한하는 장치이므로 가능한 한 줄여서 사람들이 자유롭게 행동하게 해야 한다.","낯선 사람들이 서로의 행동을 예측할 수 있도록 하는 규칙은 신뢰를 쌓는 데 주로 도움이 된다.","교통 법규는 도로의 속도를 높이는 목적으로 만들어졌으며 자동차의 발달과 함께 정비되었다.","공동체의 규칙은 자유를 제한하기보다 서로 예측할 수 있게 하여 자유로운 활동을 가능하게 한다."],"t":["과","반","부","상","-"],"r":["규칙 강화 주장은 과장이다.","글이 반박하는 통념이다.","예측 가능성만 다루고 자유와의 관계가 빠졌다.","교통 법규의 역사는 지문에 없다.","규칙이 협력과 자유의 조건이라는 내용이다."],"a":4,"n":271},{"lv":3,"ty":3,"tp":"언어","p":"Reading in translation gives access to works we could never read in the original, and that is a gift. But a translation is an interpretation, with choices made on our behalf. When a work matters deeply to us, it is worth comparing more than one translation or learning enough of the original to sense what is lost. Readers should not assume that one translation is the work itself.","k":"Readers should not assume that one translation is the work itself.","c":["번역서는 원작의 내용을 정확히 전달하므로 독자는 원작을 배우는 데 시간을 쓸 필요가 없다.","독자는 하나의 번역을 원작 그 자체로 여기지 말아야 한다.","번역은 번역자의 해석이 개입되므로 번역서를 읽는 것은 문학 작품을 감상하는 데 아무 도움이 되지 않는다.","번역가는 독자를 대신해 선택을 내리는 일이 많으므로 번역가에게 더 많은 보수를 지급해야 한다.","중요한 작품은 원작을 배울 시간이 부족한 독자를 위해 여러 번역본을 한 권으로 묶어 출간해야 한다."],"t":["반","-","과","비","상"],"r":["글이 경계하는 가정이다.","번역은 해석임을 인식하라는 주장이다.","번역서 무용론은 과장이다.","보수 인상은 글에 없다.","출판 방식은 지문에 없다."],"a":1,"n":272},{"lv":3,"ty":0,"tp":"과학","p":"Stars appear fixed, but astronomers know that the light we see left them long ago. A star ten thousand light-years away is seen as it was ten thousand years ago. Looking at the night sky is therefore looking into the past. Telescopes that gather faint light from the most distant galaxies show the universe as it was billions of years ago, allowing scientists to study its youth. Distance in space is also distance in time.","k":"Distance in space is also distance in time.","c":["the reasons why stars appear fixed in the night sky throughout the whole year","the invention of telescopes for faint light","how looking far into space means looking back in time","the exact age of the oldest star in the galaxy","the claim that stars no longer exist today"],"t":["부","세","-","상","과"],"r":["고정돼 보인다는 것은 도입부 서술일 뿐이다.","망원경은 예시일 뿐이다.","먼 우주를 보는 것이 곧 과거를 보는 것이라는 내용이다.","가장 오래된 별의 나이는 지문에 없다.","별이 사라졌다는 단정은 글에 없다."],"a":2,"n":273},{"lv":3,"ty":1,"tp":"사회","p":"Volunteers often say they receive more than they give. Helping others brings a sense of purpose, new friendships, and a break from one's own worries. Research even links regular volunteering to lower stress and longer life. Generosity, it seems, is not a sacrifice but an exchange in which the giver also gains. Kindness returns to those who offer it.","k":"Generosity, it seems, is not a sacrifice but an exchange in which the giver also gains.","c":["The Sacrifice of Volunteers Who Give Everything","Giving Back: How Kindness Returns to the Giver","How Volunteers Find New Friendships Easily","Longer Life: The Reason People Volunteer","Why Helping Others Always Reduces Your Worries"],"t":["반","-","부","비","과"],"r":["희생이 아니라 교환이라는 글과 반대이다.","베푸는 사람도 얻는다는 내용이다.","친구 사귀기는 이점 중 하나이다.","장수가 유일한 이유라는 비약이다.","'항상'은 지나친 일반화이다."],"a":1,"n":274},{"lv":3,"ty":2,"tp":"역사","p":"History is often summarized as a list of dates, but dates alone do not explain why events occurred. A war may have started on a particular day, yet its causes ripened over decades through trade tensions, alliances, and fears. Memorizing the date without the causes leaves us unable to recognize similar patterns today. To learn from history, we must study processes, not only moments.","k":"To learn from history, we must study processes, not only moments.","c":["역사적 사건은 일어난 날짜가 가장 중요하므로 연표를 정확히 외우는 것이 역사 공부의 핵심이다.","역사에서 배우려면 사건의 날짜만이 아니라 그것에 이르는 과정을 살펴야 한다.","전쟁의 원인은 무역 갈등과 동맹, 두려움이 수십 년에 걸쳐 쌓인 것이므로 모든 전쟁은 피할 수 있다.","전쟁은 특정한 날에 시작되었더라도 그 원인은 오랜 기간에 걸쳐 무르익은 것이라는 점이 예시로 제시된다.","오늘날 비슷한 유형의 사건이 반복되는 이유는 사람들이 과거의 연표를 제대로 암기하지 못한 데 있다."],"t":["반","-","비","세","상"],"r":["글이 비판하는 태도이다.","과정 중심의 역사 학습을 강조하는 내용이다.","전쟁 회피 가능성은 글에 없는 비약이다.","예시의 서술이며 결론이 빠졌다.","반복의 원인에 대한 서술은 글과 어긋난다."],"a":1,"n":275},{"lv":3,"ty":3,"tp":"심리","p":"We often think of apologizing as a sign of weakness, so we delay or avoid it. Yet relationships frequently recover after a sincere apology, and trust may even deepen. The person who can say 'I was wrong' shows security, not fragility. We should apologize promptly when we have caused harm, instead of defending our pride.","k":"We should apologize promptly when we have caused harm","c":["사과는 약함의 표시이므로 관계를 지키려면 사과를 미루고 상대가 먼저 화해하기를 기다려야 한다.","진심 어린 사과 뒤에는 관계가 항상 회복되고 신뢰가 더욱 깊어지므로 사과는 만병통치약이다.","'내가 틀렸다'고 말할 수 있는 사람은 자신감이 있는 것이므로 자존감을 키우는 훈련이 필요하다.","해를 끼쳤을 때는 자존심을 내세우지 말고 즉시 사과해야 한다.","관계가 회복되려면 사과의 말과 함께 선물이나 편지와 같은 구체적인 행동을 곁들여야 한다."],"t":["반","과","비","-","상"],"r":["글이 반박하는 통념이다.","'항상'은 지나친 일반화이다.","자존감 훈련은 글에 없다.","신속한 사과를 권한다.","선물·편지는 지문에 없다."],"a":3,"n":276},{"lv":3,"ty":0,"tp":"경제","p":"A pin factory with ten workers, each performing one step, can produce far more than ten workers each making whole pins. This classic example shows how dividing tasks raises productivity: workers become skilled at one step and avoid switching time. Yet specialization has a cost: workers who perform one narrow task may find it dull and lose broader skills. The gains of dividing work must be weighed against its human price.","k":"The gains of dividing work must be weighed against its human price.","c":["productivity gains and human costs of dividing labor","the production of pins in modern factories","the elimination of boredom through specialization","the time workers spend switching between tasks","the claim that every worker should make whole products"],"t":["-","세","반","부","과"],"r":["분업의 생산성 이득과 인간적 비용을 함께 따진다는 내용이다.","핀 공장은 예시일 뿐이다.","글은 전문화가 단조로움을 낳는다고 한다.","전환 시간은 이득의 한 요인일 뿐이다.","모든 노동자의 완제품 생산은 글에 없는 극단이다."],"a":0,"n":277},{"lv":3,"ty":1,"tp":"경제","p":"Subscription services make buying easy: a small monthly fee, automatic renewal, no effort. But that very ease hides the total cost. People forget they are paying for services they rarely use, and small sums add up over a year. Companies count on this forgetfulness. Reviewing subscriptions regularly is a simple way to protect your wallet.","k":"Reviewing subscriptions regularly is a simple way to protect your wallet.","c":["The Ease of Buying: A Gift to Customers","Companies That Forget to Renew Their Services","Small Monthly Fees, Big Hidden Costs","Why Automatic Renewal Should Be Banned","How to Review Subscriptions in a Wallet"],"t":["반","상","-","비","세"],"r":["편리함이 비용을 가린다는 글과 반대이다.","기업의 갱신 망각은 지문에 없다.","작은 월 요금이 큰 숨은 비용이 된다는 내용이다.","금지 주장은 글에 없는 비약이다.","점검 방법은 해결책의 일부이다."],"a":2,"n":278},{"lv":3,"ty":2,"tp":"교육","p":"Reading aloud to children is often seen as a bedtime pleasantry. Yet children who are read to hear richer vocabulary and longer sentences than they do in everyday talk. They also associate books with warmth and attention, which encourages them to read later. The benefits continue long after the child can read independently. Shared reading builds both language and love of books.","k":"Shared reading builds both language and love of books.","c":["아이에게 책을 읽어 주는 것은 잠자리에서의 단순한 즐거움에 그치므로 학습 효과를 기대하기는 어렵다.","아이가 혼자 읽을 수 있게 되면 책을 읽어 주는 일은 더 이상 필요하지 않으므로 그만두어야 한다.","아이에게 책을 읽어 주는 일은 언어 능력과 독서에 대한 애정을 함께 키워 준다.","읽어 주는 책에는 일상 대화보다 풍부한 어휘와 긴 문장이 나오기 때문에 아이의 어휘력이 커진다.","부모가 책을 읽어 주면 아이는 학교 성적이 항상 높아지므로 매일 한 시간 이상 읽어 주어야 한다."],"t":["반","반","-","부","과"],"r":["글은 효과가 크다고 한다.","글은 혼자 읽게 된 뒤에도 효과가 이어진다고 한다.","함께 읽기의 이중 효과를 말하는 내용이다.","언어적 이점만 말하고 애정이 빠졌다.","'항상'과 구체 시간은 과장이다."],"a":2,"n":279},{"lv":3,"ty":3,"tp":"기술","p":"Artificial intelligence can draft emails, summarize documents, and answer questions in seconds. The convenience is real, but outputs can contain errors presented with confidence. Trusting them blindly shifts responsibility without removing risk. Users should verify important information from independent sources before relying on it.","k":"Users should verify important information from independent sources before relying on it.","c":["인공지능은 문서 요약과 질문 응답에 능숙하므로 그 결과는 별도의 확인 없이 업무에 즉시 활용해야 한다.","인공지능은 자신 있게 오류를 제시하므로 신뢰할 수 없는 도구이며 업무에서 사용하지 말아야 한다.","사용자는 중요한 정보를 의존하기 전에 독립된 출처로 확인해야 한다.","인공지능이 만든 오류에 대한 법적 책임은 개발 기업이 져야 하므로 정부가 관련 법률을 제정해야 한다.","인공지능이 수 초 안에 이메일 초안을 작성하는 편리함은 이미 업무 방식을 크게 바꾸어 놓았다."],"t":["반","과","-","비","부"],"r":["글이 경계하는 태도이다.","사용 금지는 과장이다.","AI 결과를 검증하라는 주장이다.","법률 제정은 글에 없다.","편리함만 언급하고 주장이 빠졌다."],"a":2,"n":280},{"lv":3,"ty":0,"tp":"심리","p":"People who win a lottery are expected to be happy forever, yet studies show their happiness returns to its earlier level within a year or two. We adapt quickly to improvements in circumstances, so new possessions soon feel ordinary. This tendency, called hedonic adaptation, explains why the pursuit of more rarely brings lasting satisfaction. Gratitude, which keeps us noticing what we already have, is a practical counterweight.","k":"Gratitude, which keeps us noticing what we already have, is a practical counterweight.","c":["adaptation to new circumstances and its effect on lasting happiness","the exciting lives of people who win the lottery","the lasting happiness brought by new possessions","the gratitude exercises used in schools and clinics to improve long-term well-being of people","the claim that money has no effect on any life"],"t":["-","세","반","부","과"],"r":["새 환경에 적응하면 만족이 오래가지 않는다는 내용이다.","복권 당첨은 예시일 뿐이다.","글은 새 소유물이 곧 평범해진다고 한다.","감사는 대응책 하나이며 학교·병원은 지문에 없다.","'어떤 삶에도 영향 없음'은 지나친 단정이다."],"a":0,"n":281},{"lv":3,"ty":1,"tp":"예술","p":"Music is often called a universal language, but listeners from different cultures hear the same piece differently. A scale that sounds natural in one tradition may sound strange in another, and a cheerful tune in one place may signal mourning elsewhere. What moves us depends on what we have learned to expect. Even our emotional response to music is shaped by culture.","k":"Even our emotional response to music is shaped by culture.","c":["Why Every Culture Hears Music in the Same Way","Scales and Notes: A Lesson in Music Theory","A Cheerful Tune Is Always a Sign of Mourning","How Listeners Learn to Play Foreign Instruments Across Many Cultures Today","Music Is Not a Universal Language: The Culture Behind Our Ears"],"t":["반","세","과","이","-"],"r":["문화마다 다르게 듣는다는 글과 반대이다.","음계는 예시이다.","'항상 애도'는 과장이다.","악기 학습은 다루지 않았다.","음악의 감정 반응이 문화에 좌우된다는 내용이다."],"a":4,"n":282},{"lv":3,"ty":2,"tp":"경제","p":"Tax cuts are often promised as a way to put money in citizens' pockets. But funds for public services do not disappear when taxes fall; they must come from somewhere, whether through borrowing or reduced services. The relief felt today may become a burden tomorrow. Judging a policy by its immediate benefit alone ignores who ultimately pays. Every public benefit carries a bill, even when it arrives later.","k":"Every public benefit carries a bill, even when it arrives later.","c":["공공 혜택에는 반드시 비용이 따르며, 당장 보이지 않아도 누군가는 결국 그것을 부담한다.","세금 감면은 시민의 주머니에 돈을 넣어 주는 정책이므로 장기적으로 경제에 가장 이롭다.","정부가 차입이나 서비스 축소로 재원을 마련하는 것은 공공 서비스의 질을 떨어뜨리므로 막아야 한다.","정책을 평가할 때는 오늘 느끼는 구제만을 보고 판단하는 것이 가장 객관적인 평가 방식이다.","공공 서비스에 쓰이는 재원은 세금으로만 충당되므로 세금을 내리면 서비스는 반드시 사라진다."],"t":["-","반","비","반","과"],"r":["숨은 비용을 고려하라는 내용이다.","글은 즉각적 혜택만으로 평가하지 말라고 한다.","차입 금지는 글에 없다.","즉각 혜택만 보는 태도는 글이 비판한다.","'반드시 사라진다'는 과장이다."],"a":0,"n":283},{"lv":3,"ty":3,"tp":"경제","p":"A restaurant that always has a line seems popular, but crowds can also mislead. People follow others on the assumption that the crowd knows something, though the first diners may have chosen randomly. Herd behavior can inflate prices and spread poor choices. Rather than copying others, we should check the evidence for ourselves before joining.","k":"we should check the evidence for ourselves before joining","c":["줄이 긴 식당은 많은 사람의 선택을 받은 곳이므로 처음 가는 식당일수록 대기 행렬을 기준으로 삼아야 한다.","군중은 늘 틀린 선택을 하므로 사람이 많이 몰리는 곳은 피하고 한적한 곳만 찾는 것이 현명하다.","처음 온 손님들이 임의로 식당을 선택했을 수 있다는 가능성은 식당 평가에서 고려되어야 할 요소이다.","가격이 부풀려지는 원인은 군집 행동이므로 정부는 인기 있는 식당의 가격을 규제해야 한다.","다른 사람을 따라 하기 전에 스스로 근거를 확인해야 한다."],"t":["반","과","부","비","-"],"r":["글이 경계하는 판단이다.","군중은 항상 틀린다는 과장이다.","가능성 지적이며 주장이 빠졌다.","가격 규제는 글에 없다.","군중을 맹목적으로 따르지 말고 확인하라는 주장이다."],"a":4,"n":284},{"lv":3,"ty":0,"tp":"교육","p":"In many classrooms, quiet students are assumed to be less engaged than talkative ones. However, thinking often happens silently, and a student who says little may be listening carefully and forming deep questions. Rewarding only speech risks overlooking this quiet learning. Teachers who offer written reflections and small-group discussions give different personalities a chance to contribute. Participation takes more forms than speaking aloud.","k":"Participation takes more forms than speaking aloud.","c":["the engagement of talkative students in discussion","the personality differences among teachers","the many forms that classroom participation can take","the benefits of small-group discussions in classes","the claim that silence is always a sign of deep thought"],"t":["반","이","-","부","과"],"r":["글은 말 많은 학생만 참여적이라는 생각을 비판한다.","교사의 성격은 다루지 않았다.","수업 참여의 형태가 말하기만이 아니라는 내용이다.","소집단 토론은 참여 방식 중 하나이다.","'항상'은 지나친 일반화이다."],"a":2,"n":285},{"lv":3,"ty":1,"tp":"환경","p":"Fast fashion offers new clothes at low prices every week, encouraging us to buy more and wear less. But the cost is hidden: huge amounts of water and energy go into producing each garment, and most unwanted clothing ends up in landfills. Buying fewer, better-made items and wearing them longer lowers this burden. The greenest garment is the one that stays in use.","k":"The greenest garment is the one that stays in use.","c":["Fast Fashion: New Clothes at Very Low Prices","Landfills and the Disposal of Old Clothes","Why Buying More Is Good for the Environment","The Greenest Garment Is the One You Keep Wearing","Water and Energy in the Making of Cars, Trucks, and Machines"],"t":["부","세","반","-","이"],"r":["저가 판매는 문제 상황 설명일 뿐이다.","매립은 결과 중 하나이다.","더 사는 것이 해롭다는 글과 반대이다.","오래 입는 옷이 가장 친환경이라는 내용이다.","자동차 제조는 소재 이탈이다."],"a":3,"n":286},{"lv":3,"ty":2,"tp":"심리","p":"Children who are told they are naturally bad at math often believe it and give up. Yet ability in math grows with practice, like a muscle. Students who see mistakes as steps toward improvement keep trying and improve. The belief that skill can grow, called a growth mindset, shapes persistence. What people believe about their own ability influences how far that ability develops.","k":"What people believe about their own ability influences how far that ability develops.","c":["수학 능력은 타고나는 것이므로 어려움을 겪는 아이는 일찍 다른 분야에서 재능을 찾아 주어야 한다.","수학 능력은 근육처럼 연습으로 길러지므로 하루에 가능한 한 많은 문제를 풀게 하는 것이 효과적이다.","실수를 개선의 단계로 보는 학생들은 계속 노력하여 성적이 향상되는데 이는 수학에만 해당된다.","자신의 능력에 대한 믿음이 그 능력이 얼마나 성장하는지에 영향을 미친다.","아이가 자신을 수학에 약하다고 믿으면 곧바로 모든 과목에서 포기하는 경향이 나타난다."],"t":["반","비","부","-","과"],"r":["글은 능력이 연습으로 성장한다고 한다.","문제 풀이량 권장은 비약이다.","수학에 한정하는 것은 부분적이다.","성장 마인드셋의 영향을 말하는 내용이다.","모든 과목에서의 포기는 과장이다."],"a":3,"n":287},{"lv":3,"ty":3,"tp":"환경","p":"Fixing a broken appliance has become uncommon; it is often cheaper to buy a new one. Yet this habit produces mountains of waste and wastes the resources that went into the old product. Repair shops, manuals, and spare parts make longer lives possible. Consumers and manufacturers should make repair easier and more normal than replacement.","k":"should make repair easier and more normal than replacement","c":["가전제품이 고장 나면 수리 비용보다 새 제품 가격이 저렴하므로 교체하는 것이 가장 합리적이다.","제조업체는 신제품 출시를 중단하고 기존 제품의 수리만을 전담하는 체제로 전환해야 한다.","수리점과 설명서, 예비 부품이 있으면 제품의 수명이 길어질 수 있다는 점이 분명히 확인된다.","소비자와 제조업체는 수리를 교체보다 쉽고 당연한 선택으로 만들어야 한다.","폐기된 가전제품에서 희귀 금속을 추출하는 기술을 개발하면 폐기물 문제를 해결할 수 있다."],"t":["반","과","부","-","상"],"r":["글이 비판하는 습관이다.","신제품 출시 중단은 과장이다.","수단 설명이며 주장이 빠졌다.","수리 문화를 활성화하라는 주장이다.","금속 추출 기술은 지문에 없다."],"a":3,"n":288},{"lv":3,"ty":0,"tp":"기술","p":"Self-checkout machines promise speed, but shoppers often find themselves doing the unpaid work of scanning and bagging. Stores save on labor, while customers take on tasks that were once someone's job. Convenience, in many cases, is simply a transfer of effort from the company to the consumer. When a new technology claims to save time, it is worth asking whose time is being saved.","k":"it is worth asking whose time is being saved","c":["the speed advantages of self-checkout machines","the labor costs stores pay for cashiers","the reasons shoppers avoid using technology","hidden transfers of work behind convenient technology","the claim that every machine wastes customers' time"],"t":["부","세","이","-","과"],"r":["속도는 기업이 내세우는 약속일 뿐이다.","인건비 절감은 근거의 일부이다.","기술 회피 이유는 다루지 않았다.","편리함 뒤에 숨은 노동 전가가 핵심이다.","'모든 기계'는 지나친 일반화이다."],"a":3,"n":289},{"lv":3,"ty":1,"tp":"역사","p":"Historians once focused on kings, battles, and treaties. Today many also study ordinary people: letters, diaries, and account books reveal how farmers, merchants, and servants lived. These sources show that history is made not only by those who rule but by those who work. A fuller picture of the past includes voices that were long ignored.","k":"A fuller picture of the past includes voices that were long ignored.","c":["Hearing Forgotten Voices: Toward a Fuller Past","Kings and Battles: The Only Subject of History","Account Books and the Science of Money","Why Historians Stopped Studying Any Treaties","Servants and Merchants in Modern Society"],"t":["-","반","세","과","이"],"r":["잊힌 목소리를 통해 과거를 더 온전히 본다는 내용이다.","글은 왕과 전투만 다루던 방식을 넘어선다고 한다.","장부는 사료의 예이다.","조약 연구의 중단은 과장이다.","현대 사회는 다루지 않았다."],"a":0,"n":290},{"lv":3,"ty":2,"tp":"예술","p":"Some people say they do not understand modern art and therefore dislike it. But understanding is not always the point. A piece may aim to unsettle, to ask questions, or to make us notice ordinary things anew. Expecting every artwork to deliver a clear message ignores how varied the purposes of art can be. Art can succeed by provoking thought even when it offers no answer.","k":"Art can succeed by provoking thought even when it offers no answer.","c":["현대 미술은 이해하기 어렵다는 이유로 대중에게 외면받으므로 작가는 더 분명한 메시지를 담아야 한다.","현대 미술 작품은 관람객을 불편하게 만드는 것을 유일한 목적으로 하므로 감상자에게는 불쾌함만 남긴다.","어떤 작품은 일상의 평범한 사물을 새롭게 보게 하는 것을 목표로 하여 관람객의 시선을 바꾼다.","현대 미술을 이해하려면 미술사와 철학을 먼저 공부해야 하므로 전문 교육을 받은 사람만 감상할 수 있다.","예술은 분명한 답을 주지 않더라도 생각을 불러일으키는 것만으로 성공할 수 있다."],"t":["반","과","부","상","-"],"r":["글은 분명한 메시지를 기대하는 태도를 비판한다.","'유일한 목적'은 과장이다.","목적 중 하나만 언급한다.","전문 교육 필요성은 지문에 없다.","예술의 목적이 다양함을 말하는 내용이다."],"a":4,"n":291},{"lv":3,"ty":3,"tp":"사회","p":"Elections are often decided by those who show up, not by the population as a whole. When many citizens skip voting, the preferences of the participants carry more weight and policy follows them. Complaining afterward about decisions one did not help shape is hardly consistent. Citizens should vote in every election, including small local ones.","k":"Citizens should vote in every election, including small local ones.","c":["선거는 참여한 사람들의 의사만 반영하므로 투표하지 않은 시민도 정책에 대한 불만을 제기할 권리가 있다.","투표율이 낮으면 참여자의 선호가 정책에 더 크게 반영되므로 투표를 의무화하고 위반자를 처벌해야 한다.","시민은 작은 지역 선거를 포함한 모든 선거에서 투표해야 한다.","국가 선거는 영향이 크므로 시민은 바쁜 지역 선거보다 대통령 선거에 집중하여 투표해야 한다.","지역 선거는 후보의 공약이 구체적이므로 정당보다 후보의 인물됨을 보고 투표하는 것이 바람직하다."],"t":["반","비","-","부","상"],"r":["글은 불만 제기가 일관되지 않다고 한다.","의무화·처벌은 글에 없다.","모든 선거에서 투표하라는 주장이다.","지역 선거를 제외하는 것은 부분적이다.","후보 선택 기준은 지문에 없다."],"a":2,"n":292},{"lv":3,"ty":0,"tp":"역사","p":"Photographs seem to capture reality directly, so we tend to trust them as evidence. However, every photograph is shaped by choices: where the camera was placed, what was left outside the frame, and when the shutter was pressed. Two photographs of the same event can suggest opposite stories. A picture is an answer to a question about what to show; it does not show everything. Reading images critically means asking what lies beyond the edges.","k":"Reading images critically means asking what lies beyond the edges.","c":["the accuracy of photographs as direct and trustworthy records of reality for everyone","the position of the camera at historic events","the invention of the shutter and early cameras","the impossibility of trusting any image","the need to read photographs critically as selected views"],"t":["반","세","이","과","-"],"r":["글은 사진을 곧이곧대로 믿는 태도를 비판한다.","카메라 위치는 선택 요소 중 하나이다.","카메라의 발명은 다루지 않았다.","'어떤 이미지도 믿을 수 없다'는 과장이다.","사진이 선택된 장면이므로 비판적으로 읽어야 한다는 내용이다."],"a":4,"n":293},{"lv":3,"ty":1,"tp":"심리","p":"Many people believe that multitasking makes them more productive. Yet the brain does not truly perform two demanding tasks at once; it switches rapidly between them, and each switch costs time and attention. Studies find that people who juggle several tasks make more errors and finish later than those who focus on one at a time. Doing one thing at a time is, paradoxically, the faster way to do many things.","k":"Doing one thing at a time is, paradoxically, the faster way to do many things.","c":["Multitasking: The Secret of Highly Productive People","The Hidden Cost of Switching: Focus Beats Multitasking","How the Brain Performs Two Demanding Tasks at Once","Why People Make More Errors When They Are Tired","Studies of Attention in Children and Teenagers"],"t":["반","-","반","이","상"],"r":["멀티태스킹이 비효율적이라는 글과 반대이다.","전환 비용 때문에 한 번에 하나씩 하는 것이 낫다는 내용이다.","뇌는 동시에 처리하지 못한다고 한다.","피로는 다루지 않았다.","아동·청소년 연구는 지문에 없다."],"a":1,"n":294},{"lv":3,"ty":2,"tp":"언어","p":"Words that seem harmless can carry hidden judgments. Calling a plan 'cheap' praises its price, while calling it 'cheaply made' criticizes its quality; both describe low cost. Advertisers and politicians choose such wording carefully, because framing shapes how we feel before we think. Becoming aware of word choice is a basic defense against being quietly steered. A careful reader asks not only what is said but how it is said.","k":"A careful reader asks not only what is said but how it is said.","c":["광고와 정치 연설에서 사용되는 단어는 모두 거짓이므로 어떠한 말도 믿지 않는 것이 현명하다.","'싸다'와 '싸게 만들었다'는 낮은 비용을 가리킨다는 점에서 의미가 같으므로 구별할 필요가 없다.","신중한 독자는 무엇이 말해졌는지뿐 아니라 어떻게 표현되었는지도 따져 보아야 한다.","무해해 보이는 단어도 숨은 평가를 담고 있으므로 광고주는 이를 법적으로 규제받아야 한다.","틀 짜기는 생각하기 전에 감정에 영향을 미친다는 점은 광고와 정치 분야에서 가장 분명하게 나타난다."],"t":["과","반","-","비","부"],"r":["모두 거짓이라는 것은 과장이다.","글은 두 표현이 다른 판단을 담는다고 한다.","표현 방식에 주목하라는 내용이다.","법적 규제는 글에 없는 비약이다.","원인 설명이며 독자의 태도가 빠졌다."],"a":2,"n":295},{"lv":3,"ty":3,"tp":"건강","p":"Many workers sit for eight hours a day and treat an evening workout as compensation. But long unbroken sitting itself harms circulation and metabolism, and a single session of exercise cannot fully offset it. Short breaks to stand, stretch, or walk every hour reduce the harm much more effectively. We should interrupt long periods of sitting with brief movement throughout the day.","k":"We should interrupt long periods of sitting with brief movement throughout the day.","c":["장시간 앉아 있는 사람은 하루 중 틈틈이 짧게 움직여 앉은 시간을 끊어 주어야 한다.","하루 여덟 시간을 앉아서 일하더라도 저녁에 한 번 운동을 하면 건강상의 피해를 충분히 상쇄할 수 있다.","앉아서 일하는 것은 순환과 대사에 해로우므로 직장인은 하루 종일 서서 일할 수 있도록 업무 환경을 바꾸어야 한다.","저녁 운동은 장시간 앉아 있었던 몸을 풀어 주지만 운동 강도가 높을수록 근육 손상의 위험이 커진다.","한 시간마다 일어나 스트레칭을 하는 직장인은 업무 집중력이 높아져 생산성이 향상되는 경향이 있다."],"t":["-","반","과","상","비"],"r":["틈틈이 움직이라는 주장이다.","글이 반박하는 믿음이다.","하루 종일 서서 일하는 것은 과장이다.","근육 손상은 지문에 없다.","생산성 향상은 글에 없다."],"a":0,"n":296},{"lv":3,"ty":0,"tp":"건강","p":"Gardening is often seen as a pastime, yet it appears to benefit health in several ways. Time outdoors brings sunlight and light exercise, while handling soil and plants gives a sense of purpose. Studies of community gardens report lower stress and stronger neighborly ties. Caring for something that grows, week after week, teaches patience and offers modest but steady satisfaction. A garden nourishes more than the table.","k":"A garden nourishes more than the table.","c":["the food that gardens provide for the table","the wide-ranging health benefits of gardening","the design of community gardens in cities","the importance of sunlight for plant growth","the claim that gardening cures every illness"],"t":["부","-","세","상","과"],"r":["수확물은 이점의 일부이며 글은 그 이상을 말한다.","원예가 건강에 주는 다양한 이점이 핵심이다.","공동 텃밭은 사례 중 하나이다.","식물 생장은 지문에 없다.","'모든 질병 치유'는 지나친 과장이다."],"a":1,"n":297},{"lv":3,"ty":1,"tp":"사회","p":"Neighbors who greet each other and share small favors build something that cannot be bought: trust. In neighborhoods where people know one another, crime is lower and emergencies are handled faster, because help is close at hand. Such bonds grow from tiny, repeated acts such as a wave, a borrowed tool, or a few words at the mailbox. Strong communities are built one small greeting at a time.","k":"Strong communities are built one small greeting at a time.","c":["A Borrowed Tool and the Law of Neighbors","Why Neighborhood Crime Can Never Be Reduced","How Trust Can Be Bought in a Modern City","Small Greetings, Strong Communities","Emergency Services and Their Faster Responses"],"t":["세","반","반","-","부"],"r":["빌린 도구는 예시이다.","범죄가 낮아진다는 글과 반대이다.","신뢰는 살 수 없다고 했다.","작은 인사가 모여 강한 공동체를 만든다는 내용이다.","응급 대응은 결과 중 하나일 뿐이다."],"a":3,"n":298},{"lv":3,"ty":2,"tp":"건강","p":"Walking is the simplest form of exercise, requiring no equipment or training. Yet many people dismiss it because it feels too gentle to count. Research shows that regular brisk walking lowers the risk of heart disease and improves mood, and it is easier to sustain than demanding workouts that people abandon within weeks. The best exercise is not the most intense one but the one a person actually keeps doing.","k":"The best exercise is not the most intense one but the one a person actually keeps doing.","c":["걷기는 강도가 낮아 운동으로 인정받기 어려우므로 심장 질환을 예방하려면 격렬한 운동을 선택해야 한다.","가장 좋은 운동은 강도가 가장 높은 것이 아니라 꾸준히 지속할 수 있는 것이다.","빠르게 걷는 습관은 심장 질환의 위험을 낮추고 기분을 좋게 하므로 모든 사람에게 하루 한 시간이 필요하다.","힘든 운동은 몇 주 안에 포기하는 사람이 많으므로 운동을 처음 시작하는 사람은 헬스장 등록을 피해야 한다.","걷기는 장비나 훈련이 필요 없는 가장 단순한 운동이라는 점에서 누구나 쉽게 시작할 수 있다."],"t":["반","-","과","비","부"],"r":["글은 걷기가 효과적이라고 한다.","지속 가능한 운동이 최선이라는 내용이다.","하루 한 시간은 글에 없는 과장이다.","헬스장 회피는 글에 없는 비약이다.","걷기의 장점만 언급하고 요지(지속성)가 빠졌다."],"a":1,"n":299},{"lv":3,"ty":3,"tp":"교육","p":"Students often cram the night before an exam and then forget most of it within days. Memory strengthens when study is spread across several sessions with gaps between them, because each return to the material forces the brain to retrieve it again. Spacing feels harder than cramming, but its results last. Students should distribute their study over time instead of concentrating it in one night.","k":"Students should distribute their study over time instead of concentrating it in one night.","c":["시험 전날 밤에 집중해서 공부하면 단기간에 많은 내용을 기억할 수 있으므로 벼락치기가 가장 효율적이다.","학생은 공부를 하룻밤에 몰아서 하지 말고 시간을 나누어 분산해서 해야 한다.","공부 사이에 간격을 두면 뇌가 자료를 다시 떠올려야 하므로 매일 최소 네 시간씩 나누어 공부해야 한다.","벼락치기로 외운 내용은 며칠 안에 대부분 잊히기 때문에 시험 직후에는 복습을 하지 않아도 된다.","분산 학습은 벼락치기보다 어렵게 느껴지지만 그 결과가 오래간다는 점은 실험으로 확인되었다."],"t":["반","-","과","비","부"],"r":["글이 비판하는 방식이다.","분산 학습을 주장한다.","하루 네 시간은 글에 없는 구체화이다.","복습 불필요는 글에 없다.","장점 설명이며 학생의 행동이 빠졌다."],"a":1,"n":300},{"lv":4,"ty":0,"tp":"철학","p":"Most of us treat a decision as good when its outcome is good. Yet outcomes depend on chance as much as on judgment: a careful investor may lose money to an unforeseeable event, while a reckless one may profit by luck. Judging a choice solely by how it turned out teaches the wrong lessons, rewarding gamblers and punishing prudence. A decision is better evaluated by the quality of the reasoning and information available when it was made, even when fortune later disagrees.","k":"A decision is better evaluated by the quality of the reasoning and information available when it was made","c":["the tendency of careful decision makers to avoid any form of uncertainty","the role of fortune in determining the success of risky investments","the lessons that can be learned from unfavorable outcomes of choices","the importance of assessing decisions by their process rather than their results","the necessity of gathering complete information before any decision is made"],"t":["과","부","반","-","비"],"r":["신중한 사람이 불확실성을 모두 피한다는 것은 과장이다.","운의 역할만 다루고 평가 기준 제안이 빠졌다.","글은 결과로부터의 학습이 잘못된 교훈을 준다고 한다.","결과가 아닌 의사 결정의 과정으로 판단해야 한다는 내용이다.","완전한 정보 수집의 필수성은 글에 없는 비약이다."],"a":3,"n":301},{"lv":4,"ty":1,"tp":"철학","p":"A decision is not proven wise merely because it ended well. A driver who runs a red light and arrives safely has not shown that running red lights is sound practice; he has simply been lucky. Because outcomes are tangled with chance, learning from results alone can reinforce reckless habits and discourage sensible ones. To improve our choices we must examine how we reasoned, not merely what happened.","k":"To improve our choices we must examine how we reasoned, not merely what happened.","c":["How Chance Disguises Itself as Skill in Everyday Life","Lucky Drivers: Why Safe Arrival Proves Good Judgment","Judging Choices by Reasoning, Not by Results","Red Lights and the Dangers of Reckless Driving Habits","Why Outcomes Should Never Influence Our Future Decisions"],"t":["부","반","-","세","과"],"r":["운이 기술로 위장된다는 점만 다루고 해법이 빠졌다.","글은 안전한 도착이 현명함을 증명하지 못한다고 한다.","결과가 아니라 추론 과정으로 선택을 판단해야 한다는 내용이다.","신호 위반은 예시이다.","결과를 전혀 고려하지 말라는 것은 과장이다."],"a":2,"n":302},{"lv":4,"ty":2,"tp":"철학","p":"Many assume that to understand a thing is to break it into parts. Taking apart a clock reveals its gears, but not why time matters to us; dissecting a poem into syllables destroys the very effect that made it a poem. Some properties exist only at the level of the whole, and they vanish when the parts are examined in isolation. Analysis is a powerful tool, yet it cannot by itself capture what emerges only in combination.","k":"Analysis is a powerful tool, yet it cannot by itself capture what emerges only in combination.","c":["시계의 톱니바퀴를 살펴보면 시간이 우리에게 왜 중요한지를 알 수 있기 때문에 부품의 구조를 이해해야 한다.","어떤 대상을 이해하려면 그것을 구성하는 부분들로 철저하게 나누어 살펴보는 것이 가장 확실한 방법이다.","시계를 분해하거나 시를 음절로 나누는 방식은 대상을 파괴하므로 어떤 분석도 시도하지 않는 것이 바람직하다.","전체에서만 나타나는 성질은 부분들을 하나씩 따로 관찰할 때 사라지므로 전체를 하나의 단위로만 연구해야 한다.","분석은 강력한 도구이지만 부분들이 결합될 때 비로소 나타나는 것까지 스스로 포착하지는 못한다."],"t":["반","반","과","비","-"],"r":["글은 부품만으로는 시간의 의미를 알 수 없다고 한다.","글이 한계를 지적하는 통념이다.","분석 전면 부정은 과장이다.","전체만 연구하라는 것은 글에 없는 비약이다.","분석의 한계를 말하는 내용이다."],"a":4,"n":303},{"lv":4,"ty":3,"tp":"사회","p":"Leaders often defend secrecy by saying that the public cannot handle the whole truth. Yet withholding information deprives citizens of the means to judge those who govern them, and secrecy breeds suspicion even when intentions are good. An informed public may disagree, but it can hold power to account; an uninformed one can only trust or doubt blindly. Governments should therefore disclose information by default and withhold it only when a compelling, specific reason can be shown.","k":"Governments should therefore disclose information by default","c":["정부는 정보를 원칙적으로 공개하고, 구체적이고 타당한 사유가 있을 때만 비공개해야 한다.","정부는 시민이 모든 진실을 감당하기 어려우므로 국정 정보를 선별하여 알려 주는 것이 바람직하다.","정부의 모든 정보는 예외 없이 즉시 공개되어야 하며 국가 안보에 관한 사안도 여기에서 제외될 수 없다.","시민이 정보를 충분히 갖추고 있어야 권력을 감시할 수 있으므로 시민에게 정치 교육을 강화해야 한다.","정보를 숨기는 정부는 의도가 선하더라도 의심을 키우게 되므로 지도자는 신뢰를 얻는 방법을 고민해야 한다."],"t":["-","반","과","비","부"],"r":["공개 원칙을 주장한다.","글이 비판하는 비밀주의이다.","'예외 없이'는 글의 '구체적 사유' 단서와 어긋난다.","정치 교육 강화는 글에 없다.","원인 서술이며 구체적 주장이 빠졌다."],"a":0,"n":304},{"lv":4,"ty":0,"tp":"사회","p":"A common view holds that inequality is mainly a matter of how much people earn today. But a household's position is shaped at least as much by what it inherits, from savings and property to networks and expectations. Two workers with identical salaries may stand on very different ground if one carries debt and the other a family safety net. Understanding unequal outcomes therefore requires attention to accumulated advantages that pass quietly across generations.","k":"requires attention to accumulated advantages that pass quietly across generations","c":["the importance of personal networks in finding well-paid employment","the effect of current salary differences on household spending habits","the burden of debt that restricts the career choices of young workers","the role of inherited advantages in sustaining social inequality","the impossibility of reducing inequality through changes in public policy"],"t":["부","반","세","-","비"],"r":["인맥은 상속되는 이점의 일부일 뿐이다.","글은 현재 소득만으로 설명하는 관점을 비판한다.","부채는 예시이다.","세대 간 이전되는 누적된 이점이 불평등을 유지한다는 내용이다.","정책으로 줄일 수 없다는 것은 글에 없는 비약이다."],"a":3,"n":305},{"lv":4,"ty":1,"tp":"사회","p":"Public transportation is usually justified by its benefits to riders: lower fares, convenient routes, and shorter commutes. But its value extends beyond those who ride. Fewer cars mean cleaner air, quieter streets, and less congestion for everyone, including drivers. A bus that carries forty people removes dozens of vehicles from the road. A transit system serves an entire city, not only its passengers.","k":"A transit system serves an entire city, not only its passengers.","c":["Forty People on a Bus: The Arithmetic of Crowded Travel","Lower Fares and Shorter Commutes for Daily Passengers","Why Drivers Should Be Banned from Congested City Streets","Beyond the Rider: Transit's Benefits for the Whole City","Public Transportation: A Service Designed Only for Riders"],"t":["세","부","비","-","반"],"r":["버스 탑승 인원은 예시이다.","승객의 이익은 글이 넘어서는 대상이다.","운전자 금지는 글에 없는 비약이다.","대중교통의 이익이 승객을 넘어 도시 전체에 미친다는 내용이다.","글은 승객만을 위한 것이 아니라고 한다."],"a":3,"n":306},{"lv":4,"ty":2,"tp":"사회","p":"Societies often praise the self-made individual. Yet nobody succeeds without roads built by strangers, schools staffed by teachers, and laws enforced by officials. These shared foundations, taken for granted, make private effort productive. To credit achievement entirely to personal merit is to overlook the common structures on which it stands. Individual success is always, in part, a collective accomplishment.","k":"Individual success is always, in part, a collective accomplishment.","c":["자수성가한 사람들을 칭찬하는 사회적 분위기는 공동체의 기여를 가리기 때문에 점차 사라져야 한다.","개인의 성취는 전적으로 그 사람의 능력에서 비롯되므로 사회는 노력한 사람에게 합당한 보상을 해야 한다.","도로와 학교, 법 같은 공동의 기반이 없으면 개인의 노력은 아무 성과도 낼 수 없다는 것을 인정해야 한다.","낯선 사람들이 건설한 공공 시설이 많아질수록 사회 구성원의 노력은 더욱 생산적인 방향으로 나아간다.","개인의 성공은 언제나 부분적으로 공동체가 함께 이룬 결과이다."],"t":["부","반","과","비","-"],"r":["칭찬 풍조의 폐지까지 주장하지는 않는다.","글이 비판하는 관점이다.","'아무 성과도 낼 수 없다'는 과장이다.","공공 시설 증가와 생산성의 인과는 글에 없다.","성공에는 공동체의 기반이 작용한다는 내용이다."],"a":4,"n":307},{"lv":4,"ty":3,"tp":"교육","p":"Schools typically teach subjects separately, with mathematics in one room and history in another. But real problems do not respect these boundaries: understanding a pandemic demands biology, statistics, economics, and ethics at once. Students trained only within silos may master each field yet fail to combine them. Curricula should include projects that deliberately draw on several disciplines at once, so that students practice connecting what they know.","k":"Curricula should include projects that deliberately draw on several disciplines at once","c":["학생들이 각 교과를 깊이 있게 익히도록 교과별 수업을 지금보다 더 엄격하게 구분하여 운영해야 한다.","교육과정에는 여러 학문을 의도적으로 아우르는 프로젝트가 포함되어야 한다.","현실의 문제는 학문의 경계를 따르지 않으므로 학교는 모든 교과의 구분을 없애고 통합 수업만 해야 한다.","감염병을 이해하려면 생물학과 통계학, 경제학, 윤리학이 동시에 필요하다는 사실을 학생들이 알아야 한다.","학생들이 여러 분야를 결합하는 능력을 키우도록 교사에게 융합 교육 연수를 의무화해야 한다."],"t":["반","-","과","세","비"],"r":["글이 비판하는 칸막이 교육이다.","융합 프로젝트를 주장한다.","교과 구분의 전면 폐지는 과장이다.","예시를 일반화한 서술이다.","교사 연수는 글에 없다."],"a":1,"n":308},{"lv":4,"ty":0,"tp":"과학","p":"It is tempting to explain every trait of an organism as an adaptation shaped for a purpose. Yet some features are by-products of other changes, and some persist merely because they do no harm. The human chin, for example, may not have evolved for any function of its own. Treating each characteristic as a solution can lead biologists to invent tidy stories where only accident and constraint were at work. Evolutionary explanation must therefore remain open to the possibility that not every feature was selected.","k":"not every feature was selected","c":["the process by which useful characteristics are inherited across generations","the risk of overinterpreting biological traits as purposeful adaptations","the diversity of body structures that humans have developed over time","the difficulty of identifying the function of the chin in early humans","the reasons evolutionary biology cannot be regarded as a genuine science"],"t":["반","-","이","세","과"],"r":["글은 모든 형질이 선택된 것은 아니라고 한다.","모든 형질을 적응으로 해석하는 위험이 핵심이다.","신체 구조의 다양성은 다루지 않는다.","턱은 예시이다.","과학이 아니라는 것은 지나친 일반화이다."],"a":1,"n":309},{"lv":4,"ty":1,"tp":"과학","p":"A scientific theory that explains every possible outcome may seem powerful, but it is actually empty. If no observation could ever contradict it, then it tells us nothing about the world. The strength of a theory lies in the risks it takes: the specific predictions that, if they failed, would force its abandonment. Science advances not by protecting its ideas from refutation but by exposing them to it.","k":"Science advances not by protecting its ideas from refutation but by exposing them to it.","c":["The Power of Theories That Explain Every Outcome","Testable Risk: What Makes a Scientific Theory Strong","Why Scientists Abandon Their Ideas at the First Failure","Observations That Contradict the Predictions of Science","Protecting Established Ideas from Public Criticism and Doubt"],"t":["반","-","과","부","반"],"r":["글은 모든 것을 설명하는 이론이 공허하다고 한다.","반증 위험을 감수하는 이론이 강하다는 내용이다.","첫 실패에 포기한다는 것은 과장이다.","반증 관찰은 일부 서술이다.","글은 보호가 아니라 노출이 중요하다고 한다."],"a":1,"n":310},{"lv":4,"ty":2,"tp":"과학","p":"Placebo effects are often dismissed as imaginary improvements. But measured responses, such as reduced pain and changed hormone levels, occur when patients merely expect to be helped. The mind's expectations alter the body in ways that can be recorded. This does not mean that illness is imaginary; it means that belief is one of the factors in recovery. Treatment works in a human context, and expectations are part of that context.","k":"belief is one of the factors in recovery","c":["위약 효과는 환자가 상상하는 가짜 호전에 불과하므로 신약 평가에서는 완전히 제외되어야 한다.","치료는 인간의 맥락에서 이루어지며, 환자의 기대와 믿음도 회복에 작용하는 요인의 하나이다.","환자의 기대가 호르몬 수치를 바꾼다는 점에서 질병은 마음의 문제이며 신체적 원인은 중요하지 않다.","통증이 줄어드는 것처럼 측정 가능한 반응이 위약에서도 나타난다는 사실은 의학 연구에서 확인되었다.","환자가 도움을 받으리라 기대하게 하려면 의사가 치료 효과에 대해 확신에 찬 태도를 보여야 한다."],"t":["반","-","과","부","상"],"r":["글은 위약 효과가 측정 가능하다고 한다.","기대가 회복의 요인이라는 내용이다.","질병이 상상이라는 의미가 아니라고 글이 명시한다.","근거의 일부이며 핵심 결론이 빠졌다.","의사의 태도는 지문에 없다."],"a":1,"n":311},{"lv":4,"ty":3,"tp":"환경","p":"Individuals are told that saving the planet depends on their daily choices: turning off lights, sorting waste, carrying cloth bags. These habits matter, but a small number of corporations and utilities account for a large share of emissions. Placing the burden primarily on consumers distracts from the changes that only industry and government can make. Citizens should direct their energy toward demanding systemic change as well as practicing personal restraint.","k":"Citizens should direct their energy toward demanding systemic change as well as practicing personal restraint.","c":["배출량이 많은 기업의 제품을 소비자가 구매하지 않는 불매 운동을 지속적으로 전개하는 것이 효과적이다.","환경 보호는 일상의 선택에 달려 있으므로 시민은 소등과 분리배출 같은 개인의 습관을 실천하는 데 집중해야 한다.","개인의 습관은 환경 보호에 아무 영향이 없으므로 시민은 절약을 중단하고 정부와 기업에 책임을 물어야 한다.","소수 기업이 배출량의 상당 부분을 차지하므로 정부는 이들 기업을 즉시 해체하는 조치를 취해야 한다.","시민은 개인적 절제를 실천하는 동시에 구조적 변화를 요구하는 데에도 힘을 기울여야 한다."],"t":["상","부","과","비","-"],"r":["불매 운동은 지문에 없다.","개인 실천만 강조하며 구조적 요구가 빠졌다.","개인 실천 부정은 과장이다.","기업 해체는 글에 없다.","개인 실천과 구조 개혁을 병행하라는 주장이다."],"a":4,"n":312},{"lv":4,"ty":0,"tp":"경제","p":"In many markets, a product's price tells buyers something about its quality. When wine is expensive, drinkers often expect it to taste better, and experiments show that this expectation can actually change how it is experienced. Sellers sometimes exploit the effect by pricing high on purpose. But consumers who treat price as a proxy for quality may pay more for little improvement. The number on a label can shape judgment as powerfully as the product itself.","k":"The number on a label can shape judgment as powerfully as the product itself.","c":["the experimental methods used to measure how consumers judge flavor","the strategies sellers use to maximize profit in competitive markets","the superior taste of expensive wines compared with inexpensive ones","the influence of price on consumers' perception of quality","the reasons high prices always indicate that a product is of poor value"],"t":["세","부","반","-","과"],"r":["실험은 근거일 뿐이다.","판매자 전략은 일부일 뿐이며 인식의 효과가 핵심이다.","가격이 맛을 보장한다는 것이 아니라 기대가 경험을 바꾼다는 내용이다.","가격이 품질 인식에 영향을 미친다는 내용이다.","'항상 가치가 낮다'는 과장이다."],"a":3,"n":313},{"lv":4,"ty":1,"tp":"경제","p":"When a store marks down a product from a high 'original' price, shoppers feel they have found a bargain. Yet the original price may never have been charged to anyone; its role is to set a reference point that makes the sale price look generous. Our sense of value is formed less by an item's worth than by what it is compared against. Savings depend on the anchor we are shown.","k":"Our sense of value is formed less by an item's worth than by what it is compared against.","c":["The Anchor Effect: How Comparison Shapes Our Sense of Value","Why Original Prices Are Always Charged to Shoppers First","The Hidden Worth of Items Sold at Discounted Prices","Smart Shopping: A Guide to Finding Real Bargains in Stores","Store Markdowns and the Strategies of Retail Managers"],"t":["-","반","반","상","부"],"r":["비교 기준이 가치 인식을 좌우한다는 내용이다.","글은 원래 가격이 청구된 적 없을 수 있다고 한다.","글은 할인가의 숨은 가치가 아니라 기준점 효과를 다룬다.","알뜰 쇼핑 요령은 다루지 않는다.","점주 전략은 부분적이며 인식 효과가 핵심이다."],"a":0,"n":314},{"lv":4,"ty":2,"tp":"경제","p":"A company that cuts prices may win customers in the short run. But if competitors respond in kind, everyone's profits fall and none gains a lasting advantage. Rivals trapped in such a spiral resemble spectators who stand to see better, only to find that no one sees any better and all are tired. What is rational for a single firm can be self-defeating when every firm does the same. Individually sensible moves can add up to a collectively poor result.","k":"Individually sensible moves can add up to a collectively poor result.","c":["개별 주체에게는 합리적인 선택도 모두가 같이 하면 전체에게는 좋지 않은 결과를 낳을 수 있다.","가격을 인하한 기업은 단기적으로 고객을 얻으므로 경쟁사보다 먼저 가격을 낮추는 것이 이득이다.","경쟁 기업들이 서로 가격을 낮추는 악순환에 빠지지 않으려면 정부가 가격을 규제해야 한다.","모든 기업이 가격 경쟁을 하는 시장에서는 어떤 기업도 이윤을 얻을 수 없으며 결국 모두 문을 닫게 된다.","경기장에서 일어서서 보는 관중들처럼 경쟁자들은 모두 지치지만 누구도 더 잘 보게 되지는 않는다는 점이 비유된다."],"t":["-","반","비","과","세"],"r":["개인의 합리성이 집단의 비합리를 낳는다는 내용이다.","글은 경쟁사가 대응하면 이득이 사라진다고 한다.","가격 규제는 글에 없다.","'모두 폐업'은 과장이다.","비유 서술이며 요지가 아니다."],"a":0,"n":315},{"lv":4,"ty":3,"tp":"경제","p":"When an economy slows, there is pressure to cut public spending to balance the books. But a household and a government differ: when many households cut back at once, demand falls and incomes shrink, deepening the slump. In such times, public spending can sustain demand until private spending recovers. Governments should resist the instinct to tighten budgets during downturns and instead support the economy while it is weak.","k":"Governments should resist the instinct to tighten budgets during downturns","c":["정부는 경기 침체기에 긴축 재정을 하려는 본능을 억제하고 경제를 떠받쳐야 한다.","경기가 둔화되면 정부도 가계처럼 지출을 줄여 재정 균형을 맞추는 것이 책임 있는 행동이다.","정부는 경기와 관계없이 항상 예산을 크게 늘려 지출해야 민간의 소비가 지속적으로 유지된다.","가계가 동시에 지출을 줄이면 수요가 감소하고 소득이 줄어드는 악순환이 생긴다는 점이 확인된다.","공공 지출의 재원은 국채 발행으로 마련하는 것이 세금 인상보다 경제에 덜 부담이 된다."],"t":["-","반","과","부","상"],"r":["불황기 재정 확대를 주장한다.","글이 반박하는 관점이다.","'항상'은 불황기라는 단서를 무시한 과장이다.","원인 서술이며 정부 행동 촉구가 빠졌다.","재원 조달 방식은 지문에 없다."],"a":0,"n":316},{"lv":4,"ty":0,"tp":"교육","p":"Schools tend to reward quick answers, so students learn that hesitation signals weakness. Yet many important problems cannot be solved quickly, and the ability to remain with a question when no answer is in sight is a form of intelligence in its own right. Teachers who allow silence after a hard question, and who praise a thoughtful 'I'm not sure yet,' help children tolerate uncertainty. Patience with not knowing is a capacity that education should deliberately cultivate.","k":"Patience with not knowing is a capacity that education should deliberately cultivate.","c":["the superiority of slow learners over quick learners in solving problems","the importance of giving students quick and accurate answers in class","the psychological pressure students feel when teachers wait in silence","the influence of teachers' praise on the confidence of young learners","the educational value of tolerating uncertainty and unresolved questions"],"t":["과","반","이","부","-"],"r":["느린 학습자의 우월성은 과장이다.","글은 빠른 답을 중시하는 학교를 비판한다.","침묵의 압박은 다루지 않는다.","칭찬은 수단의 일부이다.","불확실성을 견디는 능력을 길러야 한다는 내용이다."],"a":4,"n":317},{"lv":4,"ty":1,"tp":"교육","p":"In classrooms, mistakes are usually treated as failures to be corrected quickly and erased. Yet an error often reveals precisely how a student is thinking, and examining it can teach more than a correct answer does. Teachers who ask 'How did you get that?' rather than 'That's wrong' turn mistakes into material for understanding. An error is not the opposite of learning but one of its richest sources.","k":"An error is not the opposite of learning but one of its richest sources.","c":["Asking 'How Did You Get That?': A Teacher's Favorite Question","How Teachers Correct Student Errors Quickly and Effectively","Mistakes as a Rich Source of Learning","Why Students Who Never Make Errors Learn the Most","The Opposite of Learning: Failure in Every Classroom"],"t":["세","반","-","반","과"],"r":["특정 질문은 예시이다.","글은 빨리 고치고 지우는 방식을 비판한다.","오류가 학습의 풍부한 원천이라는 내용이다.","오류 없는 학생이 가장 많이 배운다는 것은 반대이다.","모든 교실에서 실패라는 것은 과장이다."],"a":2,"n":318},{"lv":4,"ty":2,"tp":"교육","p":"A student who earns high marks is assumed to understand the material. But marks can reflect skill at guessing the test's format, rather than comprehension. A student may recite definitions correctly and yet fail to apply them to a new problem. The ability to transfer knowledge to unfamiliar situations is a better signal of understanding than success on familiar questions. True understanding shows itself when the question is one never seen before.","k":"True understanding shows itself when the question is one never seen before.","c":["점수가 높은 학생은 해당 내용을 충분히 이해하고 있다고 간주되므로 성적으로 학습 성취를 평가해야 한다.","높은 점수를 받는 학생은 시험의 출제 형식에 익숙한 것이므로 시험 방식을 매년 바꾸어야 한다.","학생이 정의를 정확히 암송하는 것은 이해와 무관하므로 암기 위주의 학습은 모두 폐지해야 한다.","진정한 이해는 한 번도 본 적 없는 문제에 지식을 적용할 수 있을 때 드러난다.","시험의 형식을 추측하는 능력이 높아도 새로운 상황에서 지식을 활용하는 능력은 따로 키워야 한다."],"t":["반","비","과","-","부"],"r":["글이 의문시하는 가정이다.","출제 방식 변경은 글에 없는 비약이다.","암기 학습 전면 폐지는 과장이다.","전이 능력이 이해의 지표라는 내용이다.","형식 추측과 별개라는 점만 다루고 이해의 기준이 빠졌다."],"a":3,"n":319},{"lv":4,"ty":3,"tp":"철학","p":"In debate, we often treat changing one's mind as a defeat. But a person who never revises a belief is either infallible or inattentive, and no one is infallible. The willingness to update in light of better evidence is a mark of intellectual honesty, not weakness. We should therefore admire, and practice, the readiness to say that we were wrong.","k":"We should therefore admire, and practice, the readiness to say that we were wrong.","c":["우리는 자신이 틀렸다고 말할 수 있는 태도를 존경하고 실천해야 한다.","토론에서 자신의 주장을 바꾸는 것은 패배를 의미하므로 끝까지 신념을 지키는 자세가 필요하다.","믿음을 한 번도 수정하지 않는 사람은 어리석으므로 누구든 자주 입장을 바꾸는 사람을 신뢰해야 한다.","더 나은 증거에 비추어 믿음을 갱신하려는 의지는 지적 정직함의 표지라는 사실이 널리 인정된다.","토론에서 상대의 말을 끝까지 경청하는 습관을 길러야 자신이 틀렸음을 쉽게 인정할 수 있다."],"t":["-","반","과","부","비"],"r":["생각을 바꾸는 태도를 가치 있게 보라는 주장이다.","글이 비판하는 통념이다.","자주 바꾸는 사람을 신뢰하라는 것은 과장이다.","특징 서술이며 행동 촉구가 빠졌다.","경청 습관은 글에 없다."],"a":0,"n":320},{"lv":4,"ty":0,"tp":"예술","p":"We usually think that an original work of art must begin from nothing. In practice, creators absorb the forms, themes, and techniques of those before them, then recombine them in ways that feel new. A composer borrows a rhythm, a painter echoes a composition, and a poet answers an earlier poem. Originality, rather than escaping influence, lies in how influence is transformed. Creativity is a conversation with the past, not a departure from it.","k":"Creativity is a conversation with the past, not a departure from it.","c":["the difficulty that modern artists face in being recognized by critics","the necessity for artists to eliminate all influences from their style","the techniques by which composers borrow rhythms from folk traditions","the dependence of artistic originality on the transformation of earlier works","the tendency of great artists to imitate their predecessors without change"],"t":["이","반","세","-","과"],"r":["비평의 인정은 다루지 않는다.","글은 영향을 벗어나는 것이 아니라 변형하라고 한다.","작곡가의 차용은 예시이다.","독창성이 영향을 변형하는 데 있다는 내용이다.","변화 없는 모방은 글과 어긋난다."],"a":3,"n":321},{"lv":4,"ty":1,"tp":"예술","p":"A performance of a piece of music is never identical to another, even by the same musician. Each rendition responds to the room, the audience, and the mood of the day. Recordings freeze one version and invite us to treat it as the piece itself, but the work lives in its many interpretations. Music exists less as a fixed object than as an event that happens anew each time it is played.","k":"Music exists less as a fixed object than as an event that happens anew each time it is played.","c":["Music as a Living Event, Not a Fixed Object","The Perfect Recording: Capturing the Definitive Performance","How Rooms and Audiences Affect the Sound of Concert Halls","Why Musicians Should Always Play a Piece in the Same Way","The Mood of the Day: A Musician's Secret to Success"],"t":["-","반","부","반","세"],"r":["음악이 고정된 대상이 아니라 매번 일어나는 사건이라는 내용이다.","글은 녹음이 한 버전을 고정할 뿐이라고 한다.","공간·청중은 근거 중 하나이다.","동일한 연주 요구는 글과 반대이다.","기분은 요인 중 하나이다."],"a":0,"n":322},{"lv":4,"ty":2,"tp":"예술","p":"Observers sometimes complain that an abstract painting 'looks like nothing.' Yet representation is only one of painting's purposes. Color relationships, rhythm, and balance can move us as music does without depicting anything. To demand that every picture resemble the world is to confuse one possible aim with the whole. Painting is capable of communicating through form itself.","k":"Painting is capable of communicating through form itself.","c":["관람객이 그림에 대하여 불만을 갖는 이유는 대부분 작품의 의미를 이해하기 위한 배경지식이 부족하기 때문이다.","그림은 세계를 닮을 때에 비로소 가치를 지니므로 아무것도 묘사하지 않는 추상화는 예술로 인정받기 어렵다.","추상화는 색의 관계와 리듬, 균형으로 음악처럼 감동을 주므로 구상화보다 우월한 예술 형식이다.","그림은 대상을 재현하지 않고도 형식 자체를 통해 전달할 수 있다.","재현은 회화의 여러 목적 가운데 하나일 뿐이라는 생각은 현대 미술의 발전을 이해하는 데 도움이 된다."],"t":["상","반","과","-","부"],"r":["배경지식 부족은 지문에 없다.","글이 반박하는 요구이다.","추상화의 우월성은 글에 없다.","추상화가 형식으로 소통한다는 내용이다.","재현이 하나의 목적이라는 점만 말하고 결론이 빠졌다."],"a":3,"n":323},{"lv":4,"ty":3,"tp":"심리","p":"We often keep our worries to ourselves, fearing that voicing them will burden others or expose our weakness. Yet concerns shared aloud tend to shrink, and the act of describing a problem to a listener often clarifies it. People who confide in trusted others cope better with stress. When something troubles you, tell someone you trust rather than carrying it alone.","k":"tell someone you trust rather than carrying it alone","c":["걱정거리를 말하면 타인에게 부담을 주고 약점을 드러내게 되므로 스스로 해결하려고 노력해야 한다.","걱정이 있을 때에는 혼자 안고 있지 말고 신뢰하는 사람에게 털어놓아야 한다.","문제를 소리 내어 설명하면 걱정이 줄어드는 효과가 있으므로 고민은 누구에게든 모두 이야기해야 한다.","신뢰하는 사람에게 속마음을 말하는 사람은 스트레스에 더 잘 대처하는 경향이 있다는 연구가 있다.","걱정을 털어놓을 때에는 상대가 부담을 느끼지 않도록 간결하게 핵심만 말하는 것이 좋다."],"t":["반","-","과","부","상"],"r":["글이 비판하는 태도이다.","털어놓으라는 주장이다.","'누구에게든 모두'는 '신뢰하는 사람'이라는 단서를 벗어난다.","근거 서술이며 행동 촉구가 빠졌다.","말하는 방식은 지문에 없다."],"a":1,"n":324},{"lv":4,"ty":0,"tp":"환경","p":"Conservation efforts frequently focus on charismatic animals such as pandas and tigers, which attract donations. Yet protecting such species often means protecting the habitat they depend on, and with it countless unnoticed plants, insects, and fungi. A single flagship animal can thus serve as an umbrella for an entire community of life. The appeal of a few beloved creatures can be converted into protection for many that no one thinks to defend.","k":"serve as an umbrella for an entire community of life","c":["the broader ecological benefits of conserving popular flagship species","the methods conservation groups use to raise funds from the public","the reasons pandas and tigers are more valuable than other species","the danger of habitat loss for animals that attract public attention","the decline of insects and fungi in areas without protected animals"],"t":["-","세","과","부","이"],"r":["대표 동물 보호가 생태계 전체를 보호한다는 내용이다.","기부는 배경이다.","일부 종이 더 가치 있다는 것은 글과 어긋난다.","서식지 손실의 위험만 다루고 확대된 보호 효과가 빠졌다.","곤충·균류의 감소는 다루지 않는다."],"a":0,"n":325},{"lv":4,"ty":1,"tp":"환경","p":"Invasive species are often blamed for harming ecosystems, but the label can obscure the cause. Many newcomers thrive only where habitats have already been damaged by human activity, such as cleared forests or polluted waters. Removing the invader without repairing the habitat often changes little. Focusing on the intruder distracts attention from the conditions that allowed it to take hold. Restoring the habitat addresses the cause, not merely the symptom.","k":"Restoring the habitat addresses the cause, not merely the symptom.","c":["Invasive Species: A Symptom of Damaged Habitats","Removing Invaders: The Fastest Way to Save Ecosystems","Cleared Forests and Polluted Waters: A Catalog of Damage","Why Newcomer Species Never Harm the Places They Enter","How Invasive Species Are Transported to New Continents"],"t":["-","반","세","과","이"],"r":["외래종이 훼손된 서식지의 증상이라는 내용이다.","글은 제거만으로는 변화가 적다고 한다.","삼림 벌채·오염은 예시이다.","'전혀 해롭지 않다'는 과장이다.","전파 경로는 다루지 않는다."],"a":0,"n":326},{"lv":4,"ty":2,"tp":"환경","p":"Many cities remove fallen leaves and trim every lawn to an even height, in pursuit of tidiness. Yet leaf litter shelters insects, and uncut patches feed pollinators. Neatness is a human preference that ecosystems do not share. If we accept a bit of apparent disorder in parks and yards, the wildlife they support benefits considerably. Tolerating untidiness is a modest, effective form of conservation.","k":"Tolerating untidiness is a modest, effective form of conservation.","c":["곤충과 수분 매개자는 낙엽 더미와 깎지 않은 잔디에 의존하므로 도시의 모든 공원은 방치해야 한다.","도시는 낙엽을 제거하고 잔디를 일정한 높이로 깎아 깨끗하게 유지해야 시민의 삶의 질이 높아진다.","공원과 정원에서 어느 정도의 무질서를 용인하는 것이 소박하지만 효과적인 자연 보전이다.","인간이 선호하는 깔끔함을 생태계는 공유하지 않는다는 점은 도시 계획자가 반드시 인식해야 한다.","도시의 공원 관리 예산을 줄이면 야생 생물이 늘어나므로 예산 삭감은 환경 보호에 도움이 된다."],"t":["과","반","-","부","비"],"r":["모든 공원 방치는 과장이다.","글이 비판하는 관행이다.","깔끔함 추구를 줄이자는 내용이다.","인식 촉구만 말하고 행동 제안이 빠졌다.","예산 삭감은 글에 없는 비약이다."],"a":2,"n":327},{"lv":4,"ty":3,"tp":"과학","p":"Public trust in science is fragile because findings change, and each reversal feeds the suspicion that scientists do not know what they are doing. In fact, revision is how science works: conclusions are held provisionally and improved as evidence accumulates. Communicators should explain this openly, describing results as the best current understanding rather than as final truths, so that updates are not mistaken for failures.","k":"Communicators should explain this openly","c":["과학 지식의 변화를 이해하려면 학교에서 과학사를 필수 과목으로 가르치는 것이 필요하다.","과학자는 대중의 불신을 피하기 위해 결론이 확정되기 전에는 연구 결과를 발표하지 않아야 한다.","과학적 발견은 늘 바뀌므로 대중은 과학자의 결론을 신뢰하기보다 스스로 판단하여 받아들여야 한다.","연구 결과가 수정되는 것은 과학이 작동하는 방식이라는 점이 오해를 푸는 중요한 근거가 된다.","과학을 알리는 사람들은 과학이 잠정적 결론을 갱신하며 발전한다는 점을 공개적으로 설명해야 한다."],"t":["상","반","과","부","-"],"r":["과학사 필수 과목은 지문에 없다.","글은 잠정성을 공개하라고 한다.","과학 불신 권유는 글에 없다.","근거 서술이며 촉구가 빠졌다.","과학의 잠정성을 알리라는 주장이다."],"a":4,"n":328},{"lv":4,"ty":0,"tp":"언어","p":"Dictionaries are often consulted as final authorities on what words mean. But lexicographers do not legislate; they record how words are actually used and revise their entries as usage shifts. A word like 'literally' has acquired a second sense simply because people employ it that way. Meanings are settled by communities of speakers, with dictionaries serving as careful observers rather than rulers. Authority over language rests in common practice, not in reference books.","k":"Authority over language rests in common practice, not in reference books.","c":["the standards lexicographers apply when compiling a dictionary entry","the role of everyday usage in determining the meaning of words","the importance of consulting dictionaries to avoid misusing common words","the changes in the meaning of 'literally' over the past century","the tendency of communities to resist any change in the meaning of words"],"t":["부","-","반","세","과"],"r":["편찬 기준은 일부 서술일 뿐이다.","의미를 결정하는 것은 일상적 사용이라는 내용이다.","글은 사전을 최종 권위로 보는 것을 비판한다.","'literally'는 예시이다.","변화에 대한 저항은 글과 반대이다."],"a":1,"n":329},{"lv":4,"ty":1,"tp":"언어","p":"Children do not learn their first language by memorizing rules. They hear speech around them, form hypotheses, test them, and gradually adjust. Their early errors, such as saying 'goed' instead of 'went', show that they are applying a pattern, not merely copying. Far from being passive recorders, children are active builders of grammar who construct the rules for themselves from the speech they hear.","k":"children are active builders of grammar","c":["Children as Passive Recorders of the Speech They Hear","Memorizing Rules: The Traditional Way to Learn a Language","'Goed' and 'Went': A Study of Irregular Verbs in English","Young Children as Active Builders of Grammar","Why Parents Should Correct Every Grammar Error Immediately"],"t":["반","반","세","-","비"],"r":["글이 부정하는 관점이다.","글은 규칙 암기로 배우지 않는다고 한다.","과거형 오류는 예시이다.","아이들이 문법을 능동적으로 구축한다는 내용이다.","즉각 교정은 글에 없는 비약이다."],"a":3,"n":330},{"lv":4,"ty":2,"tp":"언어","p":"Consider the common claim that a language with many words for snow forces its speakers to see snow differently. The evidence is thin. Speakers of any language can create new words or phrases for what they need to describe. Vocabulary reflects the interests of a community more than it limits its thought. The words a people have are shaped by what they care about, not the other way around.","k":"The words a people have are shaped by what they care about, not the other way around.","c":["눈을 가리키는 단어가 많은 언어의 사용자는 그렇지 않은 사용자보다 눈을 훨씬 세밀하게 구별하여 본다.","한 공동체가 가진 어휘는 그들의 관심사에 의해 형성되는 것이지, 어휘가 사고를 제한하는 것은 아니다.","어떤 언어든 필요한 표현을 새로 만들 수 있으므로 어휘가 부족한 언어는 존재하지 않는다고 보아야 한다.","공동체의 관심사가 달라지면 새로운 어휘가 생겨나므로 언어 정책은 사용자의 관심을 반영하도록 짜여야 한다.","사용자가 필요에 따라 새로운 단어나 구절을 만들어 낼 수 있다는 사실은 언어 변화의 중요한 원리이다."],"t":["반","-","과","비","부"],"r":["글이 근거가 부족하다고 한 주장이다.","어휘가 관심사를 반영한다는 내용이다.","부족한 언어가 없다는 것은 과장이다.","언어 정책은 글에 없다.","근거 일부이며 결론이 빠졌다."],"a":1,"n":331},{"lv":4,"ty":3,"tp":"언어","p":"Some argue that correct grammar should be enforced strictly, since errors signal carelessness. But languages change, and today's error is often tomorrow's standard. Rigid correction also silences speakers who use valid regional or social varieties. What matters in communication is whether the message is clear and appropriate to its audience. Instead of policing usage, we should teach people to adapt their language to the situation.","k":"we should teach people to adapt their language to the situation","c":["문법의 오류는 부주의를 드러내는 표시이므로 학교와 직장에서 올바른 문법을 엄격히 강제해야 한다.","언어 사용을 단속하기보다 상황에 맞게 언어를 조절하는 법을 가르쳐야 한다.","언어는 변화하므로 오늘의 오류가 내일의 표준이 될 수 있다는 점을 교육과정의 주된 내용으로 삼아야 한다.","지역어나 사회 방언도 타당한 언어 변이이므로 학교는 표준어 교육을 폐지하고 방언만 가르쳐야 한다.","의사소통에서 메시지가 명확한지가 중요하므로 정확한 어휘를 많이 가르치는 어휘 교육을 강화해야 한다."],"t":["반","-","부","과","비"],"r":["글이 비판하는 주장이다.","상황에 맞는 언어 사용 교육을 주장한다.","변화만 강조하고 핵심 주장이 빠졌다.","표준어 교육 폐지는 과장이다.","어휘 교육 강화는 글에 없다."],"a":1,"n":332},{"lv":4,"ty":0,"tp":"심리","p":"People are better at spotting others' mistakes than their own. When we review our work, we read what we meant to write rather than what is on the page, because familiarity tells the brain to fill in the gaps. This is why a fresh reader finds errors that the author missed after many readings. Self-assessment is limited not by laziness but by the way perception relies on expectation. Seeking an outside view is the remedy for blind spots that no effort of our own can remove.","k":"Seeking an outside view is the remedy for blind spots","c":["the complete uselessness of effort in discovering one's own errors","the laziness of authors who fail to check their work carefully","the ways familiarity helps readers understand complex written texts","the methods writers use to correct the mistakes found in their drafts","the limits of self-evaluation and the value of outside perspectives"],"t":["과","반","부","세","-"],"r":["노력이 전혀 소용없다는 것은 과장이다.","글은 게으름이 아니라 지각의 구조가 원인이라고 한다.","친숙함의 이점은 글의 방향과 반대이다.","수정 방법은 다루지 않는다.","자기 평가의 한계와 외부 시각의 가치가 핵심이다."],"a":4,"n":333},{"lv":4,"ty":1,"tp":"심리","p":"We believe we make decisions rationally, but the way options are presented often determines our choice. A surgery described as having a ninety percent survival rate is chosen more often than the same surgery described as carrying a ten percent mortality rate. The facts are identical; only the frame differs. Because our judgments follow the frame as much as the facts, the manner of presentation holds quiet power over us.","k":"the manner of presentation holds quiet power over us","c":["Survival Rates and Mortality Rates in Modern Surgery","The Quiet Power of Framing on Our Decisions","Why Humans Make Every Decision in a Completely Rational Way","Identical Facts: Why Statistics Always Tell the Truth","How Doctors Choose the Best Treatments for Their Patients"],"t":["세","-","반","과","이"],"r":["수술 통계는 예시이다.","제시 방식이 판단에 영향을 미친다는 내용이다.","글은 합리적 결정이라는 믿음을 반박한다.","통계가 항상 진실이라는 것은 과장이다.","의사의 치료 선택은 다루지 않는다."],"a":1,"n":334},{"lv":4,"ty":2,"tp":"심리","p":"Our impressions of people form within seconds, and later information tends to be absorbed into the first impression rather than revising it. A friendly first meeting leads us to read later ambiguity charitably; a cold first meeting does the opposite. Because first impressions steer the interpretation of everything that follows, they exert far more influence than their brief duration suggests.","k":"they exert far more influence than their brief duration suggests","c":["친절한 첫 만남은 이후의 모호한 행동을 호의적으로 읽게 하므로 친한 친구 관계의 형성에 가장 유리하다.","처음 만난 사람에 대한 인상은 이후에 얻는 정보를 통해 쉽게 수정되므로 첫인상에 얽매일 필요가 없다.","첫인상이 나쁜 사람은 이후의 모호한 행동도 부정적으로 해석되므로 사람들은 첫 만남에서 늘 밝은 태도를 보여야 한다.","사람에 대한 인상은 몇 초 안에 형성되기 때문에 만남이 끝난 뒤에도 오랫동안 변하지 않고 유지된다.","첫인상은 짧은 시간 동안 형성되지만, 이후 정보의 해석을 이끌어 예상보다 훨씬 큰 영향을 미친다."],"t":["세","반","비","부","-"],"r":["친절한 만남의 예시를 우정으로 확대한 것이다.","글은 이후 정보가 첫인상에 흡수된다고 한다.","첫 만남 태도 권유는 글에 없다.","형성 속도만 서술하고 해석에 미치는 영향이 빠졌다.","첫인상의 지속적 영향이 핵심이다."],"a":4,"n":335},{"lv":4,"ty":3,"tp":"예술","p":"Funding for the arts is often the first to be cut in lean years, defended by the claim that art is a luxury. But art preserves a society's memory and imagination, and its benefits cannot be reduced to attendance figures or income. A community without cultural life loses a way of understanding itself. Public budgets should treat support for the arts as an ongoing responsibility, not a discretionary expense to be dropped in hard times.","k":"Public budgets should treat support for the arts as an ongoing responsibility","c":["문화생활이 없는 공동체는 자신을 이해하는 방법을 잃게 된다는 점에서 예술 교육이 중요하다.","재정이 어려울 때에는 예술 지원처럼 필수적이지 않은 지출을 먼저 줄이는 것이 합리적이다.","예술의 가치는 관람객 수나 수익으로 환산할 수 있으므로 성과가 높은 단체에 지원을 집중해야 한다.","예술은 사회의 기억과 상상력을 보존하는 역할을 하므로 모든 시민이 예술 활동에 참여해야 한다.","공공 예산은 예술 지원을 불황 때 줄일 수 있는 선택적 지출이 아니라 지속적인 책임으로 다루어야 한다."],"t":["부","반","반","비","-"],"r":["필요성의 서술이며 예산 주장이 빠졌다.","글이 비판하는 관점이다.","글은 수치로 환산할 수 없다고 한다.","시민 참여 의무는 글에 없다.","예술 지원 지속을 주장한다."],"a":4,"n":336},{"lv":4,"ty":0,"tp":"역사","p":"When historians read a source, the central question is not only what it says but who produced it and why. A king's chronicle celebrates the king; a merchant's ledger records what mattered to trade. Neither is false, yet each frames the past according to its author's interests. By comparing sources with conflicting purposes, historians assemble a picture no single document provides. Evidence acquires meaning only when its origin and motive are taken into account.","k":"Evidence acquires meaning only when its origin and motive are taken into account.","c":["the importance of merchants' ledgers in understanding ancient economies","the reliability of royal chronicles as accurate records of the past","the need to consider the author's purpose when interpreting historical sources","the problem of false documents deliberately created by dishonest authors","the impossibility of ever knowing what truly happened in history"],"t":["세","반","-","부","과"],"r":["장부는 예시이다.","글은 연대기가 왕의 관점을 반영한다고 한다.","사료의 저자와 목적을 고려해야 한다는 내용이다.","위조 문서는 글의 초점이 아니다.","알 수 없다는 것은 지나친 일반화이다."],"a":2,"n":337},{"lv":4,"ty":1,"tp":"역사","p":"Maps in the past often placed the mapmaker's own country at the center, with distant lands pushed to the edges and made small. These choices were not simply errors but statements about what mattered. Changing the center of a map changes how relations between regions appear. Because every map must distort in some way, the decision about what to emphasize is never neutral. A map argues for a view of the world.","k":"A map argues for a view of the world.","c":["Why Modern Mapmakers Never Make Mistakes in Their Work","The Accurate Maps of the World Drawn by Early Explorers","Distant Lands: The Dangers of Travel Across Unknown Seas","Maps as Arguments: The Politics of Where We Place the Center","Changing the Center: A Technical Guide to Map Projections"],"t":["과","반","이","-","부"],"r":["'절대 실수 없다'는 과장이다.","글은 지도가 정확하지 않고 중립적이지 않다고 한다.","여행의 위험은 다루지 않는다.","지도가 세계관을 주장하는 수단이라는 내용이다.","투영법의 기술적 설명은 일부일 뿐이다."],"a":3,"n":338},{"lv":4,"ty":2,"tp":"역사","p":"A famous battle can shape the memory of a whole war, even when it was not decisive. Later accounts, patriotic monuments, and textbooks return to the same dramatic episodes, while slower causes such as supply routes and economic exhaustion receive less attention. Memory favors the vivid over the influential. Consequently, popular history may emphasize what is memorable instead of what actually mattered.","k":"popular history may emphasize what is memorable instead of what actually mattered","c":["유명한 전투는 전쟁의 승패를 결정하는 가장 중요한 요인이므로 역사 교육에서 우선적으로 다루어야 한다.","대중이 기억하는 역사는 실제로 중요했던 것보다 인상적인 사건을 강조하는 경향이 있다.","보급로와 경제적 소진 같은 느린 원인은 극적이지 않아서 역사가들도 이를 연구 대상에서 제외해 왔다.","애국적 기념물과 교과서가 동일한 극적 장면을 반복하여 다루기 때문에 사람들은 전쟁을 쉽게 기억한다.","전쟁의 기억을 올바르게 전하려면 기념물을 철거하고 교과서에서 극적인 서술을 삭제해야 한다."],"t":["반","-","과","부","비"],"r":["글은 전투가 결정적이지 않을 수 있다고 한다.","기억에 남는 것과 중요한 것이 다르다는 내용이다.","역사가가 모두 제외했다는 것은 과장이다.","기억 형성 원인만 다루고 왜곡 경향이 빠졌다.","철거·삭제는 글에 없는 비약이다."],"a":1,"n":339},{"lv":4,"ty":3,"tp":"기술","p":"Companies collect personal data in exchange for free services, and users usually click 'agree' without reading. Consent given this way is more ritual than choice, because the terms are long, technical, and take-it-or-leave-it. If consent cannot be meaningful, responsibility should shift from individuals to those who collect data. Laws should limit what data companies may gather and how they may use it, rather than relying on users' clicks.","k":"Laws should limit what data companies may gather and how they may use it","c":["기업이 모든 개인 정보의 수집을 금지당해야 이용자가 안심하고 서비스를 이용할 수 있다.","이용자는 개인 정보를 제공하기 전에 약관을 꼼꼼히 읽고 신중하게 동의 여부를 결정해야 한다.","무료 서비스는 개인 정보 수집을 전제로 하므로 이용자가 개인 정보의 보호를 요구하는 것은 부당하다.","법은 이용자의 동의 클릭에 의존하지 말고 기업이 수집하고 사용할 수 있는 데이터를 제한해야 한다.","약관이 길고 어려워 이용자가 이해하기 힘들다는 점에서 기업은 약관을 쉽게 다시 작성해야 한다."],"t":["과","반","반","-","비"],"r":["수집 전면 금지는 과장이다.","글은 개별 동의가 형식적이라고 한다.","글과 반대이다.","법적 규제를 주장한다.","약관 개선은 글의 해법이 아니다."],"a":3,"n":340},{"lv":4,"ty":0,"tp":"기술","p":"When a technology works smoothly, we stop noticing it. Electricity, plumbing, and the internet recede into the background of daily life until they fail. Their invisibility is a sign of success, but also of risk: we cannot protect or improve what we do not see. Making the hidden structures that support us visible, through inspection and public debate, is the first step toward managing them wisely. The most important systems are often the ones we least notice.","k":"The most important systems are often the ones we least notice.","c":["the rapid development of new technologies in electricity and plumbing","the hidden dependence of society on technologies taken for granted","the failure of the internet in regions with unreliable infrastructure","the public debate over whether new technologies should be regulated","the ease with which people forget everything they have learned"],"t":["반","-","세","부","이"],"r":["글은 발전이 아니라 보이지 않음을 다룬다.","당연시되는 기술에 대한 숨은 의존이 핵심이다.","인터넷 실패는 예시일 뿐이다.","공개 논의는 해법의 일부일 뿐이다.","망각은 다루지 않는다."],"a":1,"n":341},{"lv":4,"ty":1,"tp":"기술","p":"Early mobile phones were prized for being able to make calls anywhere. Today, calls are a minor use of the device, which serves as camera, wallet, map, and library. The tool's original purpose gave way as people found uses its designers never planned. Technologies often evolve in directions their inventors did not foresee, because users, not creators, discover what they are for.","k":"users, not creators, discover what they are for","c":["The Early Mobile Phone: A Tool for Making Calls Anywhere","Unplanned Uses: How Users Redefine Technology","Inventors Who Accurately Predicted the Future of Devices","Camera, Wallet, Map, and Library: Everything in a Single Device","Why Technologies Should Be Restricted to Their Original Purpose"],"t":["세","-","반","부","비"],"r":["초기 휴대전화는 예시이다.","사용자가 기술의 용도를 재정의한다는 내용이다.","글은 발명가가 예견하지 못했다고 한다.","기능 목록은 현상의 서술일 뿐이다.","원래 용도 제한은 글에 없는 비약이다."],"a":1,"n":342},{"lv":4,"ty":2,"tp":"기술","p":"A tool that makes a task easier does not necessarily make its users more capable. Calculators spare us arithmetic, yet someone who never practices sums may lose the ability to judge whether an answer is plausible. The help is real, but it can quietly erode the underlying skill, leaving us dependent. To benefit from tools without being weakened by them, we must continue to exercise the abilities they replace.","k":"we must continue to exercise the abilities they replace","c":["기술이 빠르게 발전할수록 사람이 가진 능력은 필요 없어지므로 새로운 능력을 계발해야 한다.","계산기는 산술의 부담을 덜어 주므로 학생들이 계산 능력을 따로 기를 필요는 없다.","도구는 사용자의 능력을 반드시 퇴화시키므로 일상생활에서 모든 도구의 사용을 줄여야 한다.","계산 연습을 하지 않은 사람은 답이 그럴듯한지 판단하는 능력을 잃을 수 있다는 점이 한 사례로 제시된다.","도구의 도움을 받으면서도 약해지지 않으려면 도구가 대신하는 능력을 계속 사용해야 한다."],"t":["상","반","과","세","-"],"r":["새 능력 계발은 지문에 없다.","글이 경계하는 태도이다.","'반드시'와 '모든'은 과장이다.","사례 서술이며 요지가 아니다.","도구 의존을 경계하라는 내용이다."],"a":4,"n":343},{"lv":4,"ty":3,"tp":"건강","p":"Health advice often focuses on individual willpower: eat less, move more, sleep more. But people's choices are shaped by their surroundings, such as the food sold nearby, the safety of streets, and the hours their jobs demand. Blaming individuals for failing to change habits ignores the circumstances that make healthy choices hard. Public health efforts should therefore redesign environments to make the healthy option the easy one.","k":"Public health efforts should therefore redesign environments to make the healthy option the easy one.","c":["개인이 건강한 습관을 지키지 못하는 것은 환경 탓이므로 개인에게는 어떠한 책임도 물을 수 없다.","건강은 개인의 의지에 달려 있으므로 보건 당국은 식사와 운동, 수면에 대한 지침을 더 강하게 홍보해야 한다.","공중 보건은 건강한 선택이 쉬운 선택이 되도록 환경을 재설계해야 한다.","주변에서 파는 음식과 거리의 안전, 노동 시간이 선택에 영향을 미친다는 점이 근거로 제시된다.","건강한 식품의 가격을 낮추기 위해 정부가 농가에 지급하는 보조금을 대폭 늘려야 한다."],"t":["과","반","-","세","상"],"r":["책임 전면 부정은 과장이다.","글이 한계를 지적하는 접근이다.","환경 개선을 주장한다.","근거 서술이며 주장이 아니다.","농가 보조금은 지문에 없다."],"a":2,"n":344},{"lv":4,"ty":0,"tp":"사회","p":"Cities offer anonymity, which many people value, yet anonymity has a cost: when no one knows us, no one expects anything of us. Small communities, with their watchful neighbors, impose obligations but also provide recognition and support. People in large cities often seek out clubs and congregations to rebuild this web of mutual expectation. Freedom from scrutiny and belonging to a group pull in opposite directions, and every society must balance them.","k":"Freedom from scrutiny and belonging to a group pull in opposite directions","c":["the obligations that neighbors in small towns impose on one another","the advantages of anonymity for residents of large modern cities","the tension between personal freedom and social belonging in communities","the reasons city dwellers prefer clubs over religious congregations","the superiorit
