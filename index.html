y of small communities over urban societies in all respects"],"t":["부","부","-","세","과"],"r":["의무는 한쪽 측면이다.","익명성의 장점은 한쪽 측면이다.","자유와 소속감 사이의 긴장이 핵심이다.","클럽·교회의 선호는 예시이다.","모든 면에서의 우월성은 과장이다."],"a":2,"n":345},{"lv":4,"ty":1,"tp":"사회","p":"A new neighborhood café may bring jobs and vitality to a declining area. But as the area becomes fashionable, rents rise and longtime residents, who gave the place its character, can no longer afford to stay. The improvement that attracts newcomers may expel the very community that made improvement possible. Urban renewal can thus produce benefits and losses at once, distributed to different people.","k":"Urban renewal can thus produce benefits and losses at once, distributed to different people.","c":["The Character of a Neighborhood and Its Local Architecture","The Café Boom: A Recipe for Neighborhood Prosperity","How Rising Rents Drive Out Newcomers from Cities","Why Fashionable Areas Should Never Be Redeveloped","Renewal and Displacement: Who Gains and Who Loses"],"t":["이","부","반","과","-"],"r":["건축은 다루지 않는다.","이익 한 면만 다루고 퇴거가 빠졌다.","퇴거되는 것은 신규 이주자가 아니라 기존 주민이다.","재개발 전면 반대는 과장이다.","도시 재생의 이익과 손실이 서로 다른 사람에게 돌아간다는 내용이다."],"a":4,"n":346},{"lv":4,"ty":2,"tp":"사회","p":"Trust is slow to build and quick to lose, which makes it an expensive asset. A single deception can erase years of reliability, because it forces others to reconsider everything they believed. Institutions that depend on public confidence, such as banks and courts, therefore have more to lose from small lapses than they may realize. Protecting trust requires treating even minor breaches as serious.","k":"Protecting trust requires treating even minor breaches as serious.","c":["한 번의 기만이 수년간 쌓은 신뢰를 지워 버리므로 한 번 신뢰를 잃은 기관은 다시 회복할 수 없다.","신뢰는 쌓기는 어렵지만 잃기는 쉬우므로 은행과 법원은 신뢰 회복을 위한 캠페인을 벌여야 한다.","신뢰를 지키려면 사소한 위반도 심각하게 다루어야 한다.","공적 신뢰에 의존하는 기관은 작은 실수가 가져올 손실이 크지 않으므로 사소한 위반은 눈감아 주어도 된다.","사람들이 어떤 기만을 경험하면 이전에 믿던 모든 것을 다시 생각하게 된다는 점은 신뢰의 특징이다."],"t":["과","비","-","반","부"],"r":["회복 불가는 과장이다.","캠페인은 글에 없다.","작은 위반도 엄중히 하라는 내용이다.","글과 반대이다.","원인 설명이며 요지가 빠졌다."],"a":2,"n":347},{"lv":4,"ty":3,"tp":"역사","p":"Nations often teach a flattering version of their past, emphasizing triumphs and omitting wrongs. Such stories may build unity, but they also leave citizens unprepared to understand grievances that still shape the present. A people able to acknowledge its past errors is better equipped to avoid repeating them. Societies should therefore include their own failures and injustices in the history that they teach.","k":"Societies should therefore include their own failures and injustices in the history that they teach.","c":["역사 교육의 효과를 높이려면 교과서 서술을 줄이고 박물관 견학 중심으로 수업을 운영해야 한다.","국가는 국민의 단결을 위해 자랑스러운 업적을 중심으로 역사를 가르치고 잘못은 언급하지 않는 것이 좋다.","국가가 과거에 저지른 잘못은 모두 현재 세대의 책임이므로 국민은 그에 대하여 배상해야 한다.","아름답게 꾸민 역사는 현재에도 영향을 미치는 불만을 이해하지 못하게 하는 결과를 낳는다.","사회는 자신들의 실패와 불의도 가르치는 역사에 포함시켜야 한다."],"t":["상","반","과","부","-"],"r":["견학 중심 수업은 지문에 없다.","글이 비판하는 방식이다.","현세대 배상은 글에 없다.","문제 서술이며 주장이 빠졌다.","부끄러운 역사를 교육하라는 주장이다."],"a":4,"n":348},{"lv":4,"ty":0,"tp":"과학","p":"Scientists often speak of 'laws of nature' as if they were commands that matter obeys. Yet physical laws are better understood as concise descriptions of regularities we have observed. They do not cause events; they summarize them. When a law fails in an extreme setting, we do not conclude that nature has broken a rule but that our description was incomplete. Scientific laws are maps of the world, not instructions given to it.","k":"Scientific laws are maps of the world, not instructions given to it.","c":["the discovery of extreme settings in which natural laws completely fail","the obedience of matter to the laws that govern the universe","the nature of scientific laws as descriptions rather than commands","the methods scientists use to observe regularities in nature accurately","the uselessness of physical laws in predicting future events"],"t":["세","반","-","부","과"],"r":["극한 상황은 예시이다.","글이 비판하는 이해이다.","법칙이 명령이 아니라 서술이라는 내용이다.","관찰 방법은 다루지 않는다.","법칙이 쓸모없다는 것은 과장이다."],"a":2,"n":349},{"lv":4,"ty":1,"tp":"과학","p":"Taxonomists once sorted organisms by outward appearance, grouping creatures that looked alike. DNA analysis has since revealed that some similar-looking species are distant relatives, while others that seem unrelated share recent ancestors. Appearance can mislead because unrelated lineages may evolve similar forms under similar pressures. Classification based on shared ancestry offers a deeper truth about the living world than surface resemblance.","k":"Classification based on shared ancestry offers a deeper truth about the living world than surface resemblance.","c":["Why Similar-Looking Species Are Always Close Relatives","Beyond Appearances: Classifying Life by Ancestry","DNA Analysis: A New Laboratory Technique for Scientists","The Pressures That Shape the Forms of Living Creatures","Taxonomists and Their Long History of Mistaken Beliefs"],"t":["반","-","부","세","과"],"r":["글은 닮은 종이 먼 친척일 수 있다고 한다.","외형이 아닌 계통으로 분류해야 한다는 내용이다.","DNA 분석은 수단이며 핵심 주장이 빠졌다.","환경 압력은 근거 중 하나이다.","분류학자의 오류 역사는 과장이다."],"a":1,"n":350},{"lv":4,"ty":2,"tp":"과학","p":"Correlation is easy to find and cause hard to establish. Ice cream sales and drowning rates rise together, but eating ice cream does not drown anyone; summer heat explains both. A hidden third factor can produce a pattern that tempts us toward a false story. Before concluding that one thing causes another, we should ask whether something else could account for both.","k":"Before concluding that one thing causes another, we should ask whether something else could account for both.","c":["아이스크림 판매량과 익사율은 함께 증가하므로 여름에는 아이스크림을 많이 먹지 않도록 주의해야 한다.","한 현상이 다른 현상의 원인이라고 결론짓기 전에 둘 다를 설명하는 제3의 요인이 없는지 따져야 한다.","두 현상이 함께 변하는 경우는 모두 제3의 요인 때문이므로 상관관계 연구는 의미가 없다.","여름철의 더위는 아이스크림 판매와 익사 사고를 모두 늘리는 요인이므로 더울 때의 수영은 위험하다.","숨은 제3의 요인은 우리를 거짓된 이야기로 이끌기 쉬우므로 통계는 신뢰할 수 있는 연구에서만 인용해야 한다."],"t":["반","-","과","세","비"],"r":["글은 이 연관이 인과가 아니라고 한다.","상관과 인과를 구별하라는 내용이다.","모든 상관을 부정하는 과장이다.","예시를 확대한 것이다.","인용 제한은 글에 없다."],"a":1,"n":351},{"lv":4,"ty":3,"tp":"경제","p":"Entrepreneurs are celebrated for taking risks, yet most business ventures fail, and failure often leaves the founder with debts and shame. Societies that punish failure heavily discourage experimentation, and fewer good ideas are tried. Bankruptcy rules and public attitudes that allow people to recover and start again encourage more people to take the risks from which new industries grow. We should make failure survivable.","k":"We should make failure survivable.","c":["파산 제도가 관대한 나라일수록 창업이 활발하여 경제 성장률이 높아지는 경향이 뚜렷하게 나타난다.","창업가는 위험을 감수하는 사람이므로 사업이 실패하면 그에 따른 책임을 모두 스스로 져야 한다.","대부분의 창업이 실패하므로 정부는 창업을 장려하는 정책을 중단하고 안정적 직업을 권장해야 한다.","실패를 감당할 수 있게 만들어 사람들이 위험을 감수하고 새로 시작할 수 있도록 해야 한다.","실패한 창업가가 겪는 빚과 수치심은 새로운 도전에 대한 의욕을 꺾는 요인으로 작용한다."],"t":["상","반","비","-","부"],"r":["성장률과의 상관은 지문에 없다.","글이 비판하는 사회적 태도이다.","창업 장려 중단은 글에 없다.","재기 가능한 환경을 주장한다.","원인 서술이며 주장이 빠졌다."],"a":3,"n":352},{"lv":4,"ty":0,"tp":"경제","p":"Economists describe a 'free rider' as someone who benefits from a shared resource without paying for it. A lighthouse protects every ship in the harbor, whether or not each pays. If enough people free ride, the service collapses, and everyone is worse off. Such problems explain why many goods, from clean air to public safety, are funded collectively rather than left to individual choice. Shared benefits require shared contributions.","k":"Shared benefits require shared contributions.","c":["the moral failure of everyone who benefits from public resources","the profits that lighthouses earn from ships entering a harbor","the freedom of individuals to choose which public services to support","the collapse of private companies that provide goods to the public","why collective funding is needed for goods that benefit everyone"],"t":["과","반","반","부","-"],"r":["모든 수혜자의 도덕적 실패는 과장이다.","등대는 수익이 아니라 무임승차 때문에 문제가 된다.","글은 개인 선택에 맡길 수 없다고 한다.","민간 기업의 붕괴는 결과 일부이다.","공공재가 공동 부담이 필요하다는 내용이다."],"a":4,"n":353},{"lv":4,"ty":1,"tp":"경제","p":"Some work, such as caring for the elderly or teaching the young, produces benefits that are hard to measure and tend to be paid poorly. Because the market rewards what is easily counted, the social value of such work is underrepresented in wages. The result is a mismatch between how much society needs these jobs and how little it pays for them. Pay and worth are not always the same.","k":"Pay and worth are not always the same.","c":["Why Markets Always Reward the Most Valuable Work","Caring for the Elderly: A Rewarding Career with High Wages","The Mismatch Between What Work Pays and What It Is Worth","Teachers and Their Struggles in Measuring Student Success","How Society Can Count the Value of Every Single Job"],"t":["반","반","-","세","과"],"r":["시장이 가치를 항상 반영한다는 생각은 글과 반대이다.","글은 돌봄 노동이 낮게 지급된다고 한다.","임금과 가치가 일치하지 않는다는 내용이다.","교사는 예시이다.","모든 직업의 가치를 센다는 것은 과장이다."],"a":2,"n":354},{"lv":4,"ty":2,"tp":"건강","p":"People who take up exercise often expect quick transformations and quit when none appears. Yet fitness builds through small, cumulative gains: a slightly longer walk, a slightly heavier weight. The changes are invisible day to day but substantial over months. Patience with slow progress is therefore as essential to fitness as effort itself. Results come not from intensity in one week but from consistency across many.","k":"Results come not from intensity in one week but from consistency across many.","c":["매일 조금씩 늘리는 걷기 거리나 무게는 하루하루 보이지 않으므로 효과가 없다고 판단하고 중단해야 한다.","운동을 시작한 사람은 단기간에 눈에 띄는 변화를 기대하고 강도를 높여 집중적으로 훈련해야 한다.","운동의 결과는 한 주의 강도가 아니라 여러 주에 걸친 꾸준함에서 나온다.","운동의 성과를 높이려면 처음부터 무거운 무게를 들어 올리는 근력 훈련을 병행하는 것이 좋다.","느린 진전을 인내하는 자세는 운동의 노력만큼 필수적이므로 포기하지 않는 마음을 가지는 것이 중요하다."],"t":["반","반","-","상","부"],"r":["글은 보이지 않아도 누적된다고 한다.","글이 경계하는 기대이다.","꾸준함이 핵심이라는 내용이다.","근력 훈련 병행은 지문에 없다.","인내만 말하고 꾸준함의 대비가 빠졌다."],"a":2,"n":355},{"lv":4,"ty":3,"tp":"교육","p":"Memorizing facts is out of fashion; it is said that students can look anything up. Yet thinking depends on what is already in memory: we cannot analyze, compare, or imagine with material we do not hold. A well-stocked mind notices connections that a search engine cannot suggest. Schools should therefore continue to ensure that students commit essential knowledge to memory, even in an age of instant access.","k":"Schools should therefore continue to ensure that students commit essential knowledge to memory","c":["사고는 기억에 있는 내용에 의존하므로 학교는 가능한 한 많은 사실을 학생에게 외우도록 요구해야 한다.","정보는 언제든 검색할 수 있으므로 학교는 암기 교육을 줄이고 정보를 찾는 방법을 가르쳐야 한다.","학교는 즉각적으로 정보를 찾을 수 있는 시대에도 학생이 핵심 지식을 기억하도록 계속 지도해야 한다.","잘 채워진 기억은 검색 엔진이 제안하지 못하는 연결을 알아차리게 한다는 점이 암기의 중요한 장점이다.","학생이 기억한 지식을 활용할 수 있도록 학교는 토론과 발표 수업의 비중을 높여야 한다."],"t":["과","반","-","부","비"],"r":["'가능한 한 많은'은 '핵심 지식'이라는 단서를 벗어난다.","글이 반박하는 주장이다.","핵심 지식의 기억 교육을 주장한다.","근거 서술이며 학교의 책임이 빠졌다.","토론·발표 수업은 글에 없다."],"a":2,"n":356},{"lv":4,"ty":0,"tp":"교육","p":"We often assume that listening to a lecture is an efficient way to learn. But information received passively is quickly forgotten, whereas ideas we have had to explain, apply, or debate are retained. Teaching a concept to someone else, in particular, exposes gaps in our own understanding. The act of making knowledge useful to others transforms it into our own. We learn best when we do something with what we hear.","k":"We learn best when we do something with what we hear.","c":["the superiority of active use over passive reception in learning","the efficiency of lectures in transmitting large amounts of information","the techniques teachers use to expose gaps in students' understanding","the importance of explaining ideas to others in a way they can enjoy","the impossibility of retaining any information received through listening"],"t":["-","반","세","부","과"],"r":["능동적 활용이 수동적 수용보다 낫다는 내용이다.","글은 강의의 효율성을 의문시한다.","교사의 기법은 예시이다.","설명하기는 활용의 한 방식일 뿐이다.","'전혀 기억 못함'은 과장이다."],"a":0,"n":357},{"lv":4,"ty":1,"tp":"교육","p":"Students who struggle with reading are often given easier texts, but this solution can backfire. Without exposure to challenging vocabulary and ideas, their reading level stays low while peers advance. Support works best when it helps students reach demanding texts rather than replacing them. Lowering the bar may comfort a learner today while limiting the heights he can reach tomorrow.","k":"Support works best when it helps students reach demanding texts rather than replacing them.","c":["Vocabulary Lists: The Only Way to Improve Reading Skills","The Comfort of Easier Texts for Struggling Readers","Why Advanced Peers Should Never Be Given Demanding Books","Reading Levels: A Statistical Study of Classroom Progress","Helping Students Reach Challenging Texts, Not Avoid Them"],"t":["과","반","비","이","-"],"r":["단어 목록이 유일한 방법이라는 것은 과장이다.","글은 쉬운 글이 역효과를 낸다고 한다.","또래에게 어려운 책을 주지 말라는 것은 글에 없다.","통계적 연구는 다루지 않는다.","어려운 텍스트에 도달하도록 돕는 지원이 필요하다는 내용이다."],"a":4,"n":358},{"lv":4,"ty":2,"tp":"경제","p":"The 'sunk cost' fallacy leads people to continue a failing project because they have already invested so much. Money and time spent are gone whether we continue or not; only future costs and benefits should influence the decision. Yet abandoning a project feels like admitting a loss. Rational choice looks forward, ignoring what cannot be recovered.","k":"Rational choice looks forward, ignoring what cannot be recovered.","c":["매몰 비용의 오류에 빠지는 사람은 심리적 압박이 심한 상황에서 판단력이 흐려지는 경향이 있다.","이미 많은 돈과 시간을 투자한 사업은 쉽게 포기할 수 없으므로 끝까지 지속하는 것이 합리적이다.","실패하고 있는 사업은 손실을 인정하는 것처럼 느껴져도 즉시 중단하는 것이 언제나 최선이다.","사업에 투입된 돈과 시간은 계속하든 중단하든 사라지므로 과거의 투자 기록을 철저히 정리해야 한다.","합리적 선택은 회수할 수 없는 과거의 비용이 아니라 앞으로의 비용과 이익을 기준으로 한다."],"t":["상","반","과","부","-"],"r":["심리적 압박은 지문에 없다.","글이 오류라고 지적하는 판단이다.","'언제나 최선'은 과장이다.","원인 설명이며 기준 제시가 빠졌다.","매몰 비용을 무시하라는 내용이다."],"a":4,"n":359},{"lv":4,"ty":3,"tp":"사회","p":"Tourists flock to famous sites, and local economies benefit. But when visitors outnumber residents, daily life suffers: rents rise, shops cater only to tourists, and neighborhoods lose their character. A place that is consumed as a spectacle may cease to be a place where people live. Destinations should therefore limit visitor numbers to levels that residents and sites can sustain.","k":"Destinations should therefore limit visitor numbers to levels that residents and sites can sustain.","c":["관광객이 많이 찾는 유명 장소는 지역 경제에 이득이 되므로 방문객 수를 늘리는 방향으로 홍보해야 한다.","관광지는 방문객 수를 주민과 장소가 감당할 수 있는 수준으로 제한해야 한다.","관광객이 주민보다 많아지면 생활이 나빠지므로 관광 산업 자체를 폐지하고 지역 산업으로 전환해야 한다.","임대료 상승과 관광객 중심의 상점은 동네의 특성을 잃게 만든다는 점이 현실에서 확인되고 있다.","관광지의 주민에게 관광 수익의 일부를 환원하는 제도를 도입하면 갈등을 줄일 수 있다."],"t":["반","-","과","세","비"],"r":["글이 비판하는 방향이다.","방문객 수 제한을 주장한다.","관광 산업 폐지는 과장이다.","현상 서술이며 주장이 아니다.","수익 환원은 글에 없다."],"a":1,"n":360},{"lv":4,"ty":0,"tp":"심리","p":"Nostalgia is often dismissed as a longing to escape the present. Yet research finds that remembering cherished moments can raise mood and strengthen a sense of belonging and purpose. People who reflect on their past tend to feel more connected to others and more optimistic about what lies ahead. Looking backward, then, can supply energy for moving forward. The past, thoughtfully revisited, can be a resource for the present.","k":"The past, thoughtfully revisited, can be a resource for the present.","c":["the positive psychological functions of recalling the past","the desire of people to escape from the difficulties of the present","the optimism of individuals who have never experienced hardship","the loss of cherished moments as people grow older over time","the guarantee that nostalgia will make every person feel happier"],"t":["-","반","이","세","과"],"r":["과거 회상의 긍정적 기능이 핵심이다.","글이 반박하는 통념이다.","고난 없는 사람은 다루지 않는다.","소중한 순간의 상실은 다루지 않는다.","모든 사람의 행복 보장은 과장이다."],"a":0,"n":361},{"lv":4,"ty":1,"tp":"심리","p":"We tend to remember how an experience ended far better than how it unfolded. A long, pleasant vacation spoiled by a bad final day may be recalled as disappointing, while a painful procedure that tapers off gently may be remembered as tolerable. The memory we carry away is a summary dominated by its peak and its end. Since we choose by memory rather than by the experience itself, endings carry a disproportionate weight.","k":"endings carry a disproportionate weight","c":["Remembering Every Moment of an Experience Equally Well","The Pleasures of a Long and Relaxing Vacation Abroad","Why Painful Procedures Should Be Avoided at All Costs","The Weight of Endings in How We Remember","How Memory Improves When People Are Given Enough Time"],"t":["반","세","비","-","이"],"r":["글은 끝부분이 지배한다고 한다.","휴가는 예시이다.","시술 회피는 글에 없다.","끝부분이 기억에 과도한 비중을 차지한다는 내용이다.","시간에 따른 기억 향상은 다루지 않는다."],"a":3,"n":362},{"lv":4,"ty":2,"tp":"교육","p":"Standardized tests promise fairness by giving everyone the same questions. But identical questions do not ensure identical opportunities: students with more resources prepare more extensively, and the language of items may favor some backgrounds. A test can be impartial in form yet unequal in effect. Fairness requires attention not only to how students are measured but also to what they have had the chance to learn.","k":"Fairness requires attention not only to how students are measured but also to what they have had the chance to learn.","c":["공정성은 학생을 어떻게 측정하느냐뿐 아니라 학생이 무엇을 배울 기회를 가졌는지에도 주의해야 한다.","표준화 시험은 모든 학생에게 같은 문제를 제시하므로 형식에서나 결과에서나 완전히 공정한 평가이다.","자원이 많은 학생이 시험을 더 철저히 준비하기 때문에 표준화 시험은 즉시 폐지되어야 한다.","시험 문항의 언어가 특정 배경을 가진 학생에게 유리하게 작용할 수 있다는 점은 평가 설계의 한계이다.","공정한 시험을 위해서는 학생이 가정에서 받는 교육 수준을 조사하여 점수에 반영해야 한다."],"t":["-","반","과","부","상"],"r":["측정 방식과 학습 기회를 함께 보라는 내용이다.","글이 의문시하는 믿음이다.","즉시 폐지는 과장이다.","근거 일부이며 결론이 빠졌다.","가정 교육 점수 반영은 지문에 없다."],"a":0,"n":363},{"lv":4,"ty":3,"tp":"철학","p":"It is tempting to define success as being better than others. But comparison has no endpoint: someone will always be richer, faster, or more admired. Measuring ourselves against others makes our contentment hostage to their achievements. A more stable measure is the distance between who we were and who we are becoming. We should judge our progress against our own past, not against other people.","k":"We should judge our progress against our own past, not against other people.","c":["자신의 만족이 타인의 성취에 좌우된다는 점에서 비교는 개인의 행복을 해치는 요인으로 작용한다.","성공은 다른 사람들보다 뛰어난 정도로 평가되므로 끊임없이 타인과 비교하며 자신을 채찍질해야 한다.","타인과의 비교는 끝이 없으므로 다른 사람의 성취에는 전혀 관심을 가지지 않고 살아가야 한다.","우리는 남이 아니라 자신의 과거와 비교하여 발전을 판단해야 한다.","과거의 자신보다 나아지려면 목표를 구체적으로 세우고 정기적으로 점검하는 습관이 필요하다."],"t":["부","반","과","-","상"],"r":["문제 서술이며 대안 제시가 빠졌다.","글이 비판하는 정의이다.","관심 단절은 과장이다.","자기 자신과 비교하라는 주장이다.","목표 점검 습관은 지문에 없다."],"a":3,"n":364},{"lv":4,"ty":0,"tp":"사회","p":"Language shapes what we can easily say, and rules of etiquette shape what we are expected to say. Politeness is often mocked as empty ritual, yet it performs a serious function: it lets strangers cooperate without testing each other's intentions. A greeting signals peaceful intent; a thank-you acknowledges debt. Without such habits, every encounter would need negotiation from scratch. Courtesy is a quiet technology for reducing friction between people.","k":"Courtesy is a quiet technology for reducing friction between people.","c":["the social function of politeness in smoothing cooperation","the mockery that polite people endure from those who dislike ritual","the differences in greeting customs across various cultures worldwide","the grammatical rules that govern the formal use of language","the necessity of formal manners in every kind of human encounter"],"t":["-","세","이","이","과"],"r":["예절이 협력을 원활하게 하는 기능을 한다는 내용이다.","조롱은 도입부이다.","관습의 문화 차이는 다루지 않는다.","문법은 다루지 않는다.","모든 만남에서의 필수성은 과장이다."],"a":0,"n":365},{"lv":4,"ty":1,"tp":"사회","p":"Rumors spread fastest when they confirm what people already believe. A story that fits our assumptions is passed along without checking, while one that contradicts them is questioned or ignored. The accuracy of a claim matters less to its spread than its emotional and social fit. Falsehoods travel well when they flatter our expectations. Belief, not evidence, is the engine of rumor.","k":"Belief, not evidence, is the engine of rumor.","c":["Rumors That Contradict Assumptions: A Case Study of Failure","The Careful Checking of Stories Before They Are Shared","Why Rumors Spread: The Pull of Belief over Evidence","Emotional Fit: The Secret of Successful Public Speeches","Why All Falsehoods Spread Faster Than the Truth Itself"],"t":["부","반","-","이","과"],"r":["반대 소문은 일부 서술이다.","글은 확인 없이 전달된다고 한다.","소문이 증거가 아닌 믿음에 의해 퍼진다는 내용이다.","연설은 다루지 않는다.","모든 거짓이 더 빠르다는 것은 과장이다."],"a":2,"n":366},{"lv":4,"ty":2,"tp":"철학","p":"We are inclined to say that a promise obliges us because we consented to it. But we often promise things in circumstances we did not foresee, and circumstances change. Still, keeping a promise even when it becomes inconvenient is what gives promises their value: if they bound us only when convenient, no one could rely on them. The worth of a commitment lies in its ability to hold when it would be easier to break.","k":"The worth of a commitment lies in its ability to hold when it would be easier to break.","c":["우리는 예견하지 못한 상황에서 약속을 하는 일이 많기 때문에 약속은 구속력이 약하다.","약속은 우리가 동의했기 때문에 의무가 되며 상황이 바뀌면 의무도 자연스럽게 사라진다.","약속을 지키는 일이 불편해지는 경우가 많으므로 중요한 약속일수록 아예 하지 않는 것이 현명하다.","약속의 가치는 지키기 불편해졌을 때에도 유지될 수 있다는 데에 있다.","편리할 때에만 사람을 구속하는 약속은 다른 사람이 믿고 의지할 수 없다는 점이 지적된다."],"t":["반","반","비","-","부"],"r":["글의 결론과 어긋난다.","글은 상황 변화에도 지켜야 한다고 한다.","약속을 하지 말라는 것은 글에 없다.","불편해도 지키는 데 약속의 가치가 있다는 내용이다.","논거 일부이며 결론이 빠졌다."],"a":3,"n":367},{"lv":4,"ty":3,"tp":"환경","p":"Water seems abundant until it is not. Cities draw from rivers and aquifers as if supplies were endless, while pricing keeps water cheap and invites waste. When water costs almost nothing, there is little reason to conserve it. Pricing water at a level that reflects its scarcity, with protection for low-income households, would encourage more careful use.","k":"Pricing water at a level that reflects its scarcity, with protection for low-income households, would encourage more careful use.","c":["물 가격을 희소성에 맞게 책정하되 저소득 가구를 보호하면 더 절약하는 사용을 유도할 수 있다.","물은 생활에 필수적이므로 가격을 낮게 유지하여 모든 가구가 부담 없이 사용할 수 있게 해야 한다.","물 값이 싸서 낭비가 심하므로 물 가격을 크게 올려 소득과 관계없이 모든 가구에 동일하게 적용해야 한다.","도시가 강과 지하수에서 물을 끌어다 쓰는 방식은 한계가 있으므로 새로운 수원을 개발해야 한다.","물 값이 거의 들지 않으면 아낄 이유가 없다는 점은 자원 관리에서 흔히 나타나는 문제이다."],"t":["-","반","과","비","부"],"r":["물 가격 현실화를 주장한다.","글은 낮은 가격이 낭비를 부른다고 한다.","저소득 보호 단서를 무시한 과장이다.","수원 개발은 글에 없다.","문제 서술이며 해법이 빠졌다."],"a":0,"n":368},{"lv":4,"ty":0,"tp":"환경","p":"A river is more than a channel of water; it carries sediment that nourishes floodplains downstream. Dams, built to control floods and generate power, trap that sediment, starving farmland and shrinking deltas. The benefits of a dam are visible and immediate, while its costs emerge slowly and far from the site. Evaluating such projects requires counting the consequences that unfold beyond the place and time of construction.","k":"requires counting the consequences that unfold beyond the place and time of construction","c":["the hidden downstream costs of large dam construction","the benefits of dams in generating power and controlling floods","the role of rivers in providing water for agriculture and industry","the techniques engineers use to prevent sediment from collecting behind dams","the certainty that every dam destroys farmland and delta ecosystems"],"t":["-","반","이","세","과"],"r":["댐의 하류에 나타나는 숨은 비용이 핵심이다.","글은 이득이 눈에 띄지만 비용을 간과한다고 한다.","하천의 용수 공급은 다루지 않는다.","토사 방지 기술은 다루지 않는다.","모든 댐이 파괴한다는 것은 과장이다."],"a":0,"n":369},{"lv":4,"ty":1,"tp":"환경","p":"A forest fire is usually described as a disaster, and it can be devastating to homes. But in many ecosystems fire is a natural process that clears dead material, releases nutrients, and allows certain seeds to germinate. Decades of suppressing every small fire have let fuel accumulate, making later fires larger and more destructive. Managing forests wisely may mean allowing, and even setting, controlled burns.","k":"Managing forests wisely may mean allowing, and even setting, controlled burns.","c":["Forest Fires: Natural Disasters Humans Must Always Prevent","Fire as a Forest's Friend: The Case for Controlled Burns","Homes in Danger: How Families Escape a Spreading Blaze","Seeds That Germinate: The Biology of Plant Reproduction","Why Small Fires Cause More Destruction Than Large Ones"],"t":["반","-","이","세","반"],"r":["글은 모든 산불을 막는 것의 문제를 지적한다.","통제된 산불의 필요성을 말하는 내용이다.","대피 요령은 다루지 않는다.","씨앗 발아는 근거 중 하나이다.","작은 불이 더 큰 파괴를 낳는다는 것은 반대이다."],"a":1,"n":370},{"lv":4,"ty":2,"tp":"환경","p":"Consumers are urged to buy 'eco-friendly' products, and the label often suffices to reassure them. But a greener item bought in addition to, rather than instead of, an existing one adds to total consumption. The most sustainable product is frequently the one never purchased. Environmental responsibility is measured by how much we use, not merely by what we choose to buy.","k":"Environmental responsibility is measured by how much we use, not merely by what we choose to buy.","c":["친환경 상품이라는 표시가 붙은 제품을 구매하면 소비자의 환경적 책임은 충분히 이행된 것이다.","환경에 대한 책임은 무엇을 사느냐뿐 아니라 얼마나 사용하느냐로 가늠된다.","친환경 제품은 기존 제품에 추가로 구매되는 경우가 많으므로 기업은 친환경 상품의 생산을 중단해야 한다.","가장 지속 가능한 제품은 구매하지 않은 제품이므로 소비자는 어떠한 물건도 사서는 안 된다.","소비자는 친환경 라벨의 신뢰성을 확인하기 위해 인증 제도의 운영 기준을 직접 조사해야 한다."],"t":["반","-","비","과","상"],"r":["글이 경계하는 안심이다.","소비의 총량이 중요하다는 내용이다.","생산 중단은 글에 없는 비약이다.","구매 전면 금지는 과장이다.","인증 제도 조사는 지문에 없다."],"a":1,"n":371},{"lv":4,"ty":3,"tp":"과학","p":"Funding agencies favor projects with predictable results, since they can be promised and measured. But many breakthroughs came from curiosity-driven inquiry with no obvious application, whose payoff was recognized only decades later. A research system that rewards only certain outcomes will miss such discoveries. Funders should therefore reserve a portion of resources for open-ended inquiry whose results cannot be foretold.","k":"Funders should therefore reserve a portion of resources for open-ended inquiry whose results cannot be foretold.","c":["연구 성과의 평가 기간을 늘리면 연구자가 장기적 안목으로 연구에 몰두할 수 있게 된다.","연구비는 성과를 예측하고 측정할 수 있는 과제에 집중 지원하는 것이 효율적이다.","많은 발견이 호기심에서 비롯되었으므로 모든 연구비는 응용 목적이 없는 연구에만 지원되어야 한다.","호기심에서 나온 연구가 수십 년 뒤에 가치를 인정받은 사례는 과학사에서 여러 차례 나타났다.","연구비 지원 기관은 결과를 미리 알 수 없는 개방적 탐구를 위해 자원의 일부를 남겨 두어야 한다."],"t":["상","반","과","세","-"],"r":["평가 기간 연장은 지문에 없다.","글이 비판하는 방식이다.","'모든 연구비'는 과장이다.","근거 서술이며 주장이 빠졌다.","개방적 연구 지원을 주장한다."],"a":4,"n":372},{"lv":4,"ty":0,"tp":"예술","p":"Critics sometimes treat an artist's biography as the key to a work's meaning. But the work often says more than its maker intended, and readers bring experiences of their own that expand its sense. A poem written in grief may console people who know nothing of the author's loss. Once released, a work leads a life independent of its origin. Meaning is made in the encounter between a work and its audience, not fixed at the moment of creation.","k":"Meaning is made in the encounter between a work and its audience","c":["the biographical information that explains an artist's creative decisions","the role of audiences in creating the meaning of artworks","the loss experienced by poets who write works of grief and mourning","the intentions artists hold when they release works to the public","the irrelevance of the maker's life to the understanding of any work"],"t":["반","-","세","부","과"],"r":["글은 전기에 의존하는 해석을 한정한다.","관객이 작품의 의미를 만든다는 내용이다.","애도시는 예시이다.","작가의 의도는 글이 상대화하는 대상이다.","작가의 삶이 무관하다는 것은 과장이다."],"a":1,"n":373},{"lv":4,"ty":1,"tp":"언어","p":"A word borrowed from another language rarely brings its meaning intact. It arrives in a new setting, and users adjust it to local needs, sometimes narrowing it, sometimes inverting it. 'Mansion' in one language may mean a modest apartment building in another. Loanwords thus carry traces of two cultures at once, and their altered meanings record how communities adapt foreign ideas to their own lives.","k":"their altered meanings record how communities adapt foreign ideas to their own lives","c":["The Cultural Differences That Prevent Communities from Interacting","Why Loanwords Always Keep Their Original Meaning Abroad","Mansions and Apartments: A Study of Housing Vocabulary","Borrowed Words and the Marks of Cultural Adaptation","Narrowing and Inverting: Two Rules of Semantic Change"],"t":["이","반","세","-","부"],"r":["문화 충돌은 다루지 않는다.","글은 의미가 그대로 오지 않는다고 한다.","'mansion'은 예시이다.","차용어의 의미 변화가 문화적 적응을 보여 준다는 내용이다.","의미 변화 방식만 다루고 문화적 의의가 빠졌다."],"a":3,"n":374},{"lv":4,"ty":2,"tp":"언어","p":"Silence in conversation is often experienced as awkward, and people rush to fill it. Yet pauses give listeners time to absorb what was said and speakers time to choose their words. In some cultures, extended silence signals respect and thought rather than discomfort. Learning to be comfortable with pauses can improve communication more than learning to talk more. Good conversation depends as much on what is left unsaid as on what is said.","k":"Good conversation depends as much on what is left unsaid as on what is said.","c":["침묵은 존중과 사려를 의미하므로 모든 문화권에서 긴 침묵을 유지하는 것이 예의에 맞는다.","대화에서 침묵이 생기면 어색하므로 사람들은 가능한 한 빨리 다른 화제를 꺼내어 분위기를 이어야 한다.","좋은 대화는 말해진 것만큼이나 말해지지 않은 것에도 달려 있다.","말하는 사람은 말을 고를 시간을 얻고 듣는 사람은 내용을 받아들일 시간을 얻는다는 점이 중요하다.","의사소통 능력을 높이려면 어휘와 표현력을 풍부하게 하는 말하기 훈련을 꾸준히 해야 한다."],"t":["과","반","-","부","상"],"r":["모든 문화권은 과장이다.","글이 의문시하는 반응이다.","침묵의 가치를 강조하는 내용이다.","침묵의 효과만 서술하고 결론이 빠졌다.","말하기 훈련은 지문에 없다."],"a":2,"n":375},{"lv":4,"ty":3,"tp":"건강","p":"Many believe that a calm mind is a gift some people simply have. Yet attention can be trained: practices such as paying deliberate attention to breathing strengthen the ability to notice thoughts without being swept away. Studies find that regular practice reduces anxiety over weeks. Instead of waiting for calm to arrive, we should cultivate it through regular, deliberate practice.","k":"we should cultivate it through regular, deliberate practice","c":["호흡에 주의를 기울이는 훈련을 하면 불안이 줄어들기 때문에 모든 사람은 매일 한 시간씩 명상해야 한다.","마음의 평온은 타고나는 선물이므로 불안이 많은 사람은 약물 치료를 우선적으로 받아야 한다.","차분함은 타고나기를 기다리지 말고 규칙적이고 의도적인 훈련으로 길러야 한다.","규칙적인 훈련이 몇 주 안에 불안을 줄인다는 연구 결과는 훈련의 효과를 입증하는 근거이다.","생각에 휩쓸리지 않고 알아차리는 능력은 업무에서 집중력을 높여 직무 성과를 향상시킨다."],"t":["과","반","-","부","상"],"r":["'매일 한 시간'은 글에 없는 과장이다.","글이 반박하는 통념이다.","훈련으로 차분함을 기르라는 주장이다.","근거 서술이며 주장이 빠졌다.","직무 성과는 지문에 없다."],"a":2,"n":376},{"lv":4,"ty":0,"tp":"건강","p":"Medicine has become skilled at treating disease, but health is more than the absence of illness. Sleep, social ties, meaningful work, and a sense of control over one's life all influence how long and how well people live. A person without symptoms may still be unwell in ways a test cannot show. Improving health therefore means attending to the conditions of daily life, not only to the body's malfunctions.","k":"Improving health therefore means attending to the conditions of daily life","c":["the influence of sleep on the speed at which wounds recover","the skill of modern medicine in treating a wide range of diseases","the reasons people without symptoms should avoid medical examinations","the importance of everyday living conditions in determining health","the control individuals have over every factor that affects their health"],"t":["세","반","비","-","과"],"r":["수면은 요인 중 하나일 뿐이다.","글은 치료 중심 관점을 넘어서라고 한다.","검사 회피는 글에 없는 비약이다.","일상의 조건이 건강을 좌우한다는 내용이다.","모든 요인의 통제는 과장이다."],"a":3,"n":377},{"lv":4,"ty":1,"tp":"기술","p":"Because algorithms recommend what resembles what we have liked before, our feeds narrow over time. We see more of what we already enjoy and less of what might surprise us. The convenience of personalization is real, but it quietly shrinks the range of what we encounter. A mind fed only on the familiar grows less capable of the unfamiliar. Deliberately seeking the unexpected is a way to keep one's thinking from narrowing.","k":"Deliberately seeking the unexpected is a way to keep one's thinking from narrowing.","c":["Personalized Feeds and the Narrowing of Our Horizons","The Convenience of Personalization: A Gift of Modern Software","How Algorithms Learn to Recommend What People Dislike","The Technical Design of Algorithms That Sort Online Content","Why Surprising Content Should Be Banned from Every Feed"],"t":["-","부","반","이","비"],"r":["개인화가 시야를 좁힌다는 내용이다.","편리함은 글이 한계를 지적하는 대상이다.","글은 좋아한 것과 닮은 것을 추천한다고 한다.","알고리즘 설계는 다루지 않는다.","놀라운 콘텐츠 금지는 글에 없다."],"a":0,"n":378},{"lv":4,"ty":2,"tp":"예술","p":"A restored painting can look dazzling, yet restoration involves judgment about what to remove and what to keep. Cleaning away old varnish may reveal original colors, or it may strip subtle layers added by the artist. Each intervention reflects the values of its time. Conservators therefore aim to act minimally and reversibly, so that later generations may reconsider the choices made today.","k":"so that later generations may reconsider the choices made today","c":["복원은 후대가 오늘의 선택을 다시 검토할 수 있도록 최소한으로, 되돌릴 수 있게 이루어져야 한다.","복원된 그림은 눈부시게 선명해야 하므로 오래된 니스는 철저히 제거하여 원래의 색을 되찾아야 한다.","복원은 시대의 가치를 반영하므로 복원 작업은 중단하고 낡은 상태 그대로 보존하는 것이 낫다.","복원가의 판단에 따라 그림의 색이 달라질 수 있다는 점은 미술 감상에서 유의해야 하는 사항이다.","복원을 위한 개입은 어떠한 경우에도 작품에 해를 끼치므로 전문가는 복원을 시도하지 말아야 한다."],"t":["-","반","비","부","과"],"r":["복원의 최소·가역 원칙을 말하는 내용이다.","글은 니스 제거가 층을 해칠 수 있다고 한다.","복원 중단은 글에 없다.","문제점만 서술하고 원칙이 빠졌다.","'어떠한 경우에도'는 과장이다."],"a":0,"n":379},{"lv":4,"ty":3,"tp":"언어","p":"Online writing encourages abbreviations and fragments, and critics lament the decline of writing. But people who write across media often adapt effortlessly, using relaxed styles with friends and formal ones in essays. The ability to shift register is a mark of linguistic skill, not its loss. Rather than condemning informal writing, educators should recognize it as one register among many and teach when each is appropriate.","k":"educators should recognize it as one register among many and teach when each is appropriate","c":["친구와는 편한 문체를, 과제에서는 격식 있는 문체를 쓰는 사람들이 많다는 사실이 관찰되었다.","온라인에서 줄임말과 단편적 표현이 늘어나므로 교육자는 비격식적 글쓰기를 엄격히 금지해야 한다.","교육자는 비격식적 글쓰기를 여러 문체 중 하나로 인정하고 각각이 언제 적절한지를 가르쳐야 한다.","비격식적 글쓰기도 언어 능력의 표현이므로 학교에서 공식적 글쓰기 교육은 더 이상 필요하지 않다.","문체를 전환하는 능력은 언어 기술의 표지이므로 학생에게 다양한 매체의 글을 많이 읽도록 해야 한다."],"t":["세","반","-","과","비"],"r":["현상 서술이며 주장이 아니다.","글이 비판하는 태도이다.","문체의 적절성 교육을 주장한다.","공식 글쓰기 교육 폐지는 과장이다.","다독 권유는 글에 없다."],"a":2,"n":380},{"lv":4,"ty":0,"tp":"철학","p":"We tend to think of freedom as the absence of constraints. But a person with unlimited options and no guidance may be paralyzed rather than free. A musician is freest not when any note is allowed but when long discipline lets her play what she hears in her mind. Skill, commitments, and structure can widen what a person is able to do. Freedom in its fullest sense is the capacity to act well, not merely the absence of restraint.","k":"Freedom in its fullest sense is the capacity to act well, not merely the absence of restraint.","c":["the paralysis that people experience when faced with too many options","a redefinition of freedom as the ability to act effectively","the discipline musicians need to perform in front of large audiences","the importance of removing all constraints on individual action","the danger that structures and commitments pose to personal liberty"],"t":["부","-","세","반","반"],"r":["선택 과잉은 예시적 논거이다.","자유를 구속의 부재가 아닌 잘 행동할 능력으로 재정의한다.","음악가는 예시이다.","글은 구속의 부재를 자유로 보는 생각을 비판한다.","글은 구조가 자유를 넓힌다고 한다."],"a":1,"n":381},{"lv":4,"ty":1,"tp":"철학","p":"Thought experiments allow philosophers to examine ideas without physical laboratories. By imagining a runaway trolley or a ship whose planks are replaced one by one, they test principles against extreme or unusual cases that reveal hidden commitments. An intuition that seems obvious in ordinary life may crumble in an imagined scenario. The imaginary case works as a lens, bringing the structure of our beliefs into focus.","k":"The imaginary case works as a lens, bringing the structure of our beliefs into focus.","c":["The Collapse of All Beliefs Under Extreme Circumstances","Runaway Trolleys and Ships: A Guide to Famous Puzzles","Why Philosophers Need Physical Laboratories for Their Work","Ordinary Life: The Source of All Obvious Human Intuitions","Imagined Scenarios as a Lens on Our Beliefs"],"t":["과","세","반","부","-"],"r":["모든 믿음이 무너진다는 것은 과장이다.","전차·배는 예시이다.","글은 실험실 없이 검토한다고 한다.","일상 직관은 일부 언급이다.","가상 사례가 믿음의 구조를 드러낸다는 내용이다."],"a":4,"n":382},{"lv":4,"ty":2,"tp":"사회","p":"Anonymous online comments are often more aggressive than anything people would say face to face. Without a visible face or a lasting reputation, restraint weakens. The effect is not that bad people appear but that ordinary people behave worse when consequences vanish. Designing platforms that link speech to identity or accountability can raise the level of discussion. Civility depends heavily on the conditions under which people speak.","k":"Civility depends heavily on the conditions under which people speak.","c":["정체성과 책임을 연결하는 방식으로 플랫폼을 설계하면 토론의 수준이 높아질 수 있다는 것이 제안된다.","온라인에서 공격적인 댓글을 쓰는 사람들은 본래 성격이 나쁜 사람들이므로 이들을 가려내어 제재해야 한다.","익명성이 보장되는 공간에서는 어떤 의견도 표현할 수 있으므로 모든 온라인 활동은 익명으로 허용되어야 한다.","예의 바른 태도는 사람들이 말하는 조건에 크게 좌우된다.","모든 온라인 대화는 얼굴을 보며 이루어지는 대화보다 공격적이므로 사람들은 온라인 소통을 줄여야 한다."],"t":["부","반","비","-","과"],"r":["해법의 일부이며 요지가 빠졌다.","글은 평범한 사람이 달라지는 것이라고 한다.","전면 익명 허용은 글에 없다.","환경이 예의를 좌우한다는 내용이다.","'모든'과 소통 축소 주장은 과장이다."],"a":3,"n":383},{"lv":4,"ty":3,"tp":"사회","p":"People are quick to judge those who accept help as dependent. But every person is helped at many stages: as children, in illness, in old age. A society that treats help as shameful keeps people from asking when they most need to, worsening their situation. We should regard giving and receiving help as normal parts of life rather than signs of failure.","k":"We should regard giving and receiving help as normal parts of life rather than signs of failure.","c":["우리는 도움을 주고받는 일을 실패의 표지가 아니라 삶의 정상적인 부분으로 여겨야 한다.","도움을 받는 사람은 의존적이므로 스스로 해결할 수 있도록 지원을 최소한으로 제공하는 것이 바람직하다.","누구나 일생 동안 도움을 받으므로 사회는 모든 구성원에게 동일한 수준의 복지를 제공해야 한다.","도움을 부끄럽게 여기는 사회에서는 필요한 순간에 요청하지 못해 상황이 악화되기도 한다.","도움을 주는 일은 베푸는 사람의 행복도 높이므로 자원봉사를 학교 교육과정에 포함해야 한다."],"t":["-","반","비","부","상"],"r":["도움 받는 일을 당연시하라는 주장이다.","글이 비판하는 관점이다.","동일 수준의 복지 제공은 글에 없다.","문제 서술이며 주장이 빠졌다.","자원봉사 교육은 지문에 없다."],"a":0,"n":384},{"lv":4,"ty":0,"tp":"경제","p":"A country's output is usually measured by adding up goods and services sold. Under this method, an hour spent caring for a child at home counts for nothing, while paying a stranger to do the same counts as growth. The figure thus misses much useful work and may even rise when family life deteriorates. A statistic, however convenient, reflects the choices of those who designed it. What we choose to measure shapes what we notice and value.","k":"What we choose to measure shapes what we notice and value.","c":["the difficulty of calculating the exact value of goods sold in a country","the rapid growth of economies that rely on paid caregiving services","how measurement choices shape what a society recognizes as valuable","the economic contribution of strangers who care for children at home","the complete uselessness of every statistic in understanding the economy"],"t":["부","반","-","세","과"],"r":["계산의 어려움이 아니라 측정의 방향이 핵심이다.","글은 성장이 가족생활 악화와 함께 오를 수 있다고 한다.","측정 방식이 가치 인식을 좌우한다는 내용이다.","아이 돌봄은 예시이다.","모든 통계가 쓸모없다는 것은 과장이다."],"a":2,"n":385},{"lv":4,"ty":1,"tp":"건강","p":"Loneliness is sometimes treated as a mood that passes, but research links long-term isolation to risks comparable to well-known health hazards. Isolated people sleep worse, heal more slowly, and are more prone to illness. Social connection is not an optional pleasure; it works as a basic requirement for physical well-being. Caring for relationships is therefore a form of caring for the body.","k":"Caring for relationships is therefore a form of caring for the body.","c":["Well-Known Health Hazards and the Methods to Avoid Them","Loneliness: A Passing Mood That Requires No Attention","Sleep and Healing: Common Troubles of Elderly Patients","Why Isolation Is Always the Cause of Serious Illness","Social Connection as a Foundation of Physical Health"],"t":["이","반","세","과","-"],"r":["건강 위험 회피법은 다루지 않는다.","글은 일시적 기분이 아니라고 한다.","수면·치유는 근거 중 하나이다.","'항상 원인'은 과장이다.","사회적 관계가 신체 건강의 토대라는 내용이다."],"a":4,"n":386},{"lv":4,"ty":2,"tp":"과학","p":"Beginners in science think of experiments as ways to prove ideas right. Experienced researchers use them as ways to find where ideas break. An experiment designed only to confirm teaches little, since a favorable result can arise in many ways. A design that gives a wrong idea a fair chance to fail yields information. The most informative experiment is the one most likely to show we are mistaken.","k":"The most informative experiment is the one most likely to show we are mistaken.","c":["노련한 연구자는 가설이 깨지는 지점을 찾기 때문에 실험 결과에 대하여 언제나 회의적인 태도를 가진다.","실험은 연구자의 생각이 옳음을 입증하는 것이 목적이므로 가설을 지지하는 결과를 얻도록 설계해야 한다.","가장 유익한 실험은 우리의 생각이 틀렸음을 보여 줄 가능성이 가장 큰 실험이다.","확인만을 위한 실험은 유리한 결과가 여러 경로로 나올 수 있어서 얻는 것이 적다는 점이 지적된다.","실험이 유익하려면 표본의 크기를 충분히 확보하고 같은 실험을 여러 번 반복하는 것이 필요하다."],"t":["과","반","-","부","상"],"r":["'언제나 회의적'은 과장이다.","글이 초보자의 관점으로 비판한다.","반증 가능한 실험이 유익하다는 내용이다.","근거 일부이며 결론이 빠졌다.","표본·반복은 지문에 없다."],"a":2,"n":387},{"lv":4,"ty":3,"tp":"예술","p":"Some insist that great art must be experienced in its original form, in the gallery or concert hall. Yet reproductions and recordings carry works to people who could never travel, and for many they are the first encounter that sparks deeper interest. The experience may differ from the original, but access outweighs the loss of aura for most viewers. We should welcome reproductions as a way to widen the audience for art.","k":"We should welcome reproductions as a way to widen the audience for art.","c":["복제물을 통한 접촉이 깊은 관심을 일으키는 계기가 된다는 점은 관객 개발 연구에서 확인되었다.","위대한 예술은 갤러리나 공연장에서 원본으로 감상해야 하므로 복제물은 예술 교육에서 사용하지 말아야 한다.","복제물은 원작과 동일한 감동을 주므로 앞으로 미술관은 원본을 전시할 필요가 없다.","우리는 복제와 녹음을 예술의 관객을 넓히는 방법으로 환영해야 한다.","복제물의 질을 높이기 위해 미술관은 고해상도 촬영과 인쇄 기술에 대한 투자를 확대해야 한다."],"t":["부","반","과","-","상"],"r":["근거 서술이며 주장이 빠졌다.","글이 반박하는 주장이다.","원본 전시 불필요는 과장이다.","복제물의 가치를 인정하라는 주장이다.","기술 투자는 지문에 없다."],"a":3,"n":388},{"lv":4,"ty":0,"tp":"언어","p":"Metaphors are usually seen as decoration added to plain speech. But we think through them: we say that arguments are 'defended' and 'attacked,' time is 'spent' or 'saved.' Such expressions quietly guide how we conceive these matters. A different metaphor, treating argument as a dance, would suggest different behavior. Far from being ornaments, metaphors are tools that structure our understanding.","k":"metaphors are tools that structure our understanding","c":["the tendency of speakers to be controlled entirely by their metaphors","the ornamental beauty that metaphors add to literary expression","the history of expressions describing arguments as battles in English","the difficulty of translating metaphors from one language to another","the function of metaphors in shaping thought beyond decoration"],"t":["과","반","세","이","-"],"r":["완전히 지배된다는 것은 과장이다.","글은 은유가 장식이 아니라고 한다.","논쟁 은유는 예시이다.","번역은 다루지 않는다.","은유가 사고를 구조화한다는 내용이다."],"a":4,"n":389},{"lv":4,"ty":1,"tp":"예술","p":"Photography was once feared as a threat to painting, since a camera could reproduce reality faster than any brush. Instead, it freed painters from the duty to imitate and encouraged them to explore color, form, and feeling. The arrival of a rival technology pushed an older art toward what only it could do. Competition from new media can sharpen, rather than destroy, the identity of an older art.","k":"Competition from new media can sharpen, rather than destroy, the identity of an older art.","c":["How a Rival Medium Redefined Painting","The Camera: A Machine That Reproduces Reality Faster","Why Painters Must Imitate Reality to Survive Today","Color, Form, and Feeling: A History of Modern Brush Techniques","The Destruction of Older Arts by Every New Technology"],"t":["-","부","반","세","과"],"r":["경쟁 매체가 회화의 정체성을 재정의했다는 내용이다.","카메라의 속도는 배경 설명일 뿐이다.","글은 모방의 의무에서 풀려났다고 한다.","색·형태·감정은 예시이다.","모든 신기술이 파괴한다는 것은 과장이다."],"a":0,"n":390},{"lv":4,"ty":2,"tp":"경제","p":"When a resource is free to everyone, no one has reason to conserve it. Fishermen who share a lake each catch as much as possible, because any fish left behind will be taken by another. The result is a collapsed fishery that harms all. Where users cannot be excluded and each gain is private while each cost is shared, overuse tends to follow. Managing shared resources therefore requires rules that align individual incentives with collective interest.","k":"Managing shared resources therefore requires rules that align individual incentives with collective interest.","c":["공유 자원을 관리하려면 개인의 유인과 공동의 이익이 일치하도록 하는 규칙이 필요하다.","자원이 누구에게나 개방되어 있으면 사람들이 스스로 아끼게 되므로 규칙 없이 이용하는 것이 가장 효율적이다.","호수를 공유하는 어부들은 가능한 한 많이 잡으려 하므로 어업은 개인이 소유한 어장에서만 허용해야 한다.","각 구성원의 이득은 사적이고 비용은 공유될 때 과도한 사용이 일어난다는 점은 경제학에서 널리 알려져 있다.","어부들은 모두 이기적이어서 물고기를 남겨 두지 않으므로 어업은 결국 반드시 붕괴하게 된다."],"t":["-","반","비","부","과"],"r":["공유 자원 관리에 규칙이 필요하다는 내용이다.","글은 아낄 이유가 없다고 한다.","사유화는 글에 없다.","원인 설명이며 요지가 빠졌다.","'반드시 붕괴'는 과장이다."],"a":0,"n":391},{"lv":4,"ty":3,"tp":"심리","p":"We often avoid beginning tasks that matter because we fear doing them imperfectly. Yet a flawed start can be improved, while a perfect plan never executed yields nothing. Momentum comes from action, and clarity often arrives only after we have begun. When a worthwhile task seems daunting, start with a small imperfect step instead of waiting until you feel ready.","k":"start with a small imperfect step instead of waiting until you feel ready","c":["불완전한 시작도 개선할 수 있으므로 계획 없이 즉흥적으로 모든 일을 시작하는 것이 가장 좋다.","일을 시작하기 전에는 완벽한 계획을 세워 실수가 없도록 철저히 준비하는 것이 중요하다.","중요한 일이 부담스러울 때에는 준비되었다고 느낄 때까지 기다리지 말고 작고 불완전한 첫걸음을 시작해야 한다.","행동에서 추진력이 생기며 명확함은 시작한 후에야 오는 경우가 많다는 점은 일의 특징이다.","부담스러운 일은 작은 단위로 나누어 매일 일정한 시간에 처리하는 일정표를 만들어야 한다."],"t":["과","반","-","부","상"],"r":["'계획 없이 모든 일'은 과장이다.","글이 비판하는 태도이다.","일단 시작하라는 주장이다.","근거 서술이며 행동 촉구가 빠졌다.","일정표는 지문에 없다."],"a":2,"n":392},{"lv":4,"ty":0,"tp":"과학","p":"Statistics can mislead when a trend in the whole population hides the opposite trend in every subgroup. A treatment may appear to fail overall because it was given mostly to the sickest patients, yet succeed within each group. Combining data without understanding how it was generated can reverse the truth. Numbers do not speak for themselves; they must be read with knowledge of how they were collected and grouped.","k":"Numbers do not speak for themselves","c":["the reasons statistics should never be used to compare different groups","the effectiveness of medical treatments for patients who are seriously ill","the necessity of interpreting statistics with an understanding of their context","the reliability of large data sets in revealing the truth about populations","the methods by which researchers divide patients into separate subgroups"],"t":["과","세","-","반","부"],"r":["비교 금지는 과장이다.","치료 효과는 예시이다.","통계는 맥락을 알고 해석해야 한다는 내용이다.","글은 합산한 자료가 진실을 뒤집을 수 있다고 한다.","집단 분류법은 일부일 뿐이다."],"a":2,"n":393},{"lv":4,"ty":1,"tp":"교육","p":"Praise is generally thought to motivate, but its effect depends on what is praised. Compliments on a child's intelligence tend to make the child cautious, since any failure threatens the flattering image. Compliments on effort and strategy invite the child to try again after setbacks. The same warm words can build resilience or fragility depending on their target. What adults choose to praise teaches children what to value in themselves.","k":"What adults choose to praise teaches children what to value in themselves.","c":["Why Children Should Never Be Praised for Their Efforts","Intelligence Compliments: The Best Way to Motivate Children","What We Praise Teaches Children What to Value","Warm Words and the Emotional Lives of Young Children","How Failure Threatens the Flattering Image of Teachers"],"t":["반","반","-","부","이"],"r":["노력 칭찬이 바람직하다는 글과 반대이다.","글은 지능 칭찬이 아이를 조심스럽게 만든다고 한다.","칭찬의 대상이 아이의 가치관을 형성한다는 내용이다.","따뜻한 말만 다루고 대상의 차이가 빠졌다.","교사의 이미지는 다루지 않는다."],"a":2,"n":394},{"lv":4,"ty":2,"tp":"건강","p":"Doctors increasingly recommend 'preventive' screening for people with no symptoms. Early detection can save lives, but screening also finds harmless abnormalities that would never have caused trouble, leading to anxiety and unnecessary treatment. A test is valuable only when its benefits outweigh such costs for the person tested. More testing is not automatically better care.","k":"More testing is not automatically better care.","c":["검사를 많이 하는 것이 자동으로 더 나은 진료를 의미하지는 않는다.","증상이 없는 사람도 예방을 위해 가능한 한 많은 검사를 받는 것이 건강을 지키는 가장 확실한 방법이다.","선별 검사는 무해한 이상을 발견하여 불필요한 치료로 이어지기 때문에 어떤 검사도 받지 않는 것이 낫다.","조기 발견은 생명을 구할 수 있지만 검사받는 사람의 불안을 줄이기 위한 상담이 반드시 함께 제공되어야 한다.","해가 되지 않을 이상을 발견했을 때 걱정과 불필요한 치료가 따를 수 있다는 점은 검사의 부작용이다."],"t":["-","반","과","비","부"],"r":["과잉 검사의 한계를 말하는 내용이다.","글이 경계하는 믿음이다.","검사 전면 거부는 과장이다.","상담 제공은 글에 없다.","비용 측면만 서술하고 결론이 빠졌다."],"a":0,"n":395},{"lv":4,"ty":3,"tp":"경제","p":"Cheap goods from distant factories have made consumers richer in some respects, but they also hide the conditions under which items are made: low wages, unsafe workplaces, and pollution. When prices omit these costs, buyers cannot respond to them. Labels and disclosure rules that show how goods are produced would let consumers choose with fuller knowledge. Companies should be required to disclose the conditions under which their products are made.","k":"Companies should be required to disclose the conditions under which their products are made.","c":["소비자는 값싼 제품을 구매함으로써 이익을 얻으므로 기업의 생산 방식에 간섭하지 않아야 한다.","기업은 자사 제품이 만들어지는 조건을 공개하도록 요구받아야 한다.","저임금과 위험한 작업장에서 만들어진 제품은 소비자가 구매하지 못하도록 정부가 수입을 금지해야 한다.","가격에 생산의 비용이 반영되지 않으면 구매자가 그에 반응할 수 없다는 점이 문제이다.","해외 공장의 근로자들이 받는 임금을 국제 기구가 일정 수준 이상으로 정해야 한다."],"t":["반","-","비","부","상"],"r":["글은 숨겨진 비용을 지적한다.","생산 조건 공개를 주장한다.","수입 금지는 글에 없다.","문제 서술이며 주장이 빠졌다.","국제 최저 임금은 지문에 없다."],"a":1,"n":396},{"lv":4,"ty":0,"tp":"건강","p":"Many people treat stress as purely harmful and try to eliminate it. Yet short bursts of stress sharpen attention and prepare the body to meet a challenge, as when an athlete or a speaker feels a surge before performing. Trouble arises when stress becomes constant and recovery never comes. The issue is therefore not the presence of stress but the absence of rest that follows it. What damages health is stress without recovery.","k":"What damages health is stress without recovery.","c":["the surge of attention that speakers experience before they perform","the harmful effects of every form of stress on the human body","the strategies athletes use to prepare for important competitions","the methods for completely eliminating stress from modern working life","the importance of recovery in preventing harmful effects of stress"],"t":["부","반","세","과","-"],"r":["각성은 이로운 면의 일부일 뿐이다.","글은 짧은 스트레스가 이롭다고 한다.","운동선수는 예시이다.","스트레스 완전 제거는 글에 없다.","회복 없는 스트레스가 해롭다는 내용이다."],"a":4,"n":397},{"lv":4,"ty":1,"tp":"경제","p":"Interest on a loan seems like a simple fee for borrowing. But because interest is charged on previously accumulated interest, a small debt left unpaid can grow far faster than people expect. The same arithmetic that makes savings grow quietly works against borrowers who delay repayment. Time, in finance, is a force that benefits the patient saver and burdens the indebted. Compounding rewards those who start early and punishes those who postpone.","k":"Compounding rewards those who start early and punishes those who postpone.","c":["The Burden of Debt: Why Every Loan Leads to Ruin","Why Interest Is Merely a Simple Fee for Borrowing","Saving Quietly: A Beginner's Guide to Growing Wealth","How Banks Calculate the Rates That Borrowers Must Pay","The Double-Edged Power of Compounding over Time"],"t":["과","반","부","이","-"],"r":["모든 대출이 파멸로 이어진다는 것은 과장이다.","글은 단순한 수수료가 아니라고 한다.","저축의 이점만 다루고 부채 측면이 빠졌다.","금리 산정은 다루지 않는다.","복리가 저축자에게는 이익, 채무자에게는 부담이라는 내용이다."],"a":4,"n":398},{"lv":4,"ty":2,"tp":"역사","p":"Historical figures are often judged by today's moral standards, which can make the past look uniformly wicked. But people act within the beliefs and constraints of their era, and understanding those conditions is necessary to explain their choices. This is not to excuse harm. Rather, explanation and judgment are different tasks, and confusing them weakens both. To understand a past action is not the same as approving it.","k":"To understand a past action is not the same as approving it.","c":["설명과 판단은 서로 다른 작업이므로 역사가는 도덕적 판단을 하지 않고 사실만 기술하는 것이 바람직하다.","역사적 인물은 오늘날의 도덕 기준으로 엄격히 평가되어야 하며 시대적 조건은 고려할 필요가 없다.","사람들은 자신이 속한 시대의 믿음과 제약 속에서 행동하므로 역사적 인물의 잘못은 모두 면책되어야 한다.","과거의 행위를 이해하는 것은 그것을 승인하는 것과 같지 않다.","시대의 조건을 이해하는 것은 당시 사람들의 선택을 설명하기 위해 필요하다는 점은 역사 연구의 기본이다."],"t":["비","반","과","-","부"],"r":["판단 포기는 글에 없는 비약이다.","글이 비판하는 태도이다.","글은 면책이 아니라고 명시한다.","이해와 승인의 구별이 핵심이다.","필요성만 말하고 결론이 빠졌다."],"a":3,"n":399},{"lv":4,"ty":3,"tp":"철학","p":"We usually believe that more choices make us freer and happier. But beyond a point, abundant options produce anxiety, regret, and paralysis: we worry that we chose wrongly. People facing fewer alternatives often feel more satisfied with the outcome. Wise individuals and institutions should therefore limit the options they consider to a manageable few.","k":"limit the options they consider to a manageable few","c":["선택지가 적은 사람이 결과에 더 만족하는 경향이 있다는 연구가 있다.","선택지가 많을수록 사람은 더 자유롭고 행복해지므로 시장은 가능한 한 다양한 상품을 제공해야 한다.","선택지가 많으면 불안과 후회가 커지므로 누구든 어떤 결정도 스스로 내려서는 안 된다.","현명한 개인과 기관은 고려하는 선택지를 감당할 만한 소수로 제한해야 한다.","후회를 줄이려면 결정을 내리기 전에 가족이나 친구와 충분히 상의하는 습관이 필요하다."],"t":["부","반","과","-","상"],"r":["근거 서술이며 행동 촉구가 빠졌다.","글이 반박하는 통념이다.","결정 포기는 과장이다.","선택지 제한을 주장한다.","상의 습관은 지문에 없다."],"a":3,"n":400}];

const TIPS = [
 "주제: 글 전체를 아우르는 '소재 + 핵심 관점'을 찾으세요. 예시나 일부 내용만 다룬 선지는 부분 일치입니다.",
 "제목: 글의 핵심어를 압축한 표현이에요. 예시 속 단어를 그대로 쓴 제목은 세부 내용 확대를 의심하세요.",
 "요지: However·Yet·Therefore 뒤나 마지막 문장에 결론이 와요. 필자의 결론을 한 문장으로 묶은 선지를 고르세요.",
 "주장: '~해야 한다(should, must)'로 표현된 필자의 요구를 찾으세요. 극단적 표현(모든·항상)은 오답일 확률이 높아요."
];
const N = D.length, PER = 3, DAYS = Math.ceil(N / PER);
const KEY = "msy-daily3-v1-layered";
const $app = document.getElementById("app");

/* ---------- state ---------- */
let S = load();
function blank(){ return {q:{}, log:{}, fs:1, theme:"auto", lastDay:1}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.q) return Object.assign(blank(), s); }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function qs(i){ return S.q[i] || (S.q[i] = {sel:null, tip:0, key:0, elim:[], done:0, ok:0}); }
function today(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hintCount(i){ const q = S.q[i]; return q ? (q.tip?1:0)+(q.key?1:0)+q.elim.length : 0; }
function dayItems(d){ const a=[]; for(let k=(d-1)*PER;k<Math.min(N,d*PER);k++) a.push(k); return a; }
function dayStatus(d){ const it = dayItems(d); const n = it.filter(i=>S.q[i]&&S.q[i].done).length; return n===0?0:(n===it.length?2:1); }
function currentDay(){ for(let d=1;d<=DAYS;d++) if(dayStatus(d)!==2) return d; return DAYS; }
function streak(){
  let c=0, d=new Date();
  const f = x => x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!S.log[f(d)]) d.setDate(d.getDate()-1);
  while(S.log[f(d)]){ c++; d.setDate(d.getDate()-1); }
  return c;
}
function applyTheme(){
  const r = document.documentElement;
  if(S.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  r.style.setProperty("--fs", [14.5,16,18][S.fs]+"px"); r.style.setProperty("--cfs", [14,15,16.5][S.fs]+"px");
}

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(k==="class") e.className=v; else if(k==="on") for(const ev in v) e.addEventListener(ev, v[ev]);
    else if(k==="html") e.innerHTML=v; else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null && c!==false) e.append(c.nodeType?c:document.createTextNode(c));
  return e;
}
function toast(msg){ const t = el("div",{class:"toast"},msg); document.body.append(t); setTimeout(()=>t.remove(),1800); }
function confetti(){
  const box = el("div",{class:"confetti"}); const cols=["#5b5bd6","#8a63f0","#12a97a","#f59e0b","#e5484d","#38bdf8"];
  for(let i=0;i<46;i++){ const p=el("i"); p.style.left=Math.random()*100+"%"; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.6)+"s"; p.style.animationDelay=Math.random()*.4+"s"; box.append(p); }
  document.body.append(box); setTimeout(()=>box.remove(),3800);
}
function show(node){ $app.replaceChildren(node); }
function passageNode(q, showKey){
  const p = D[q].p, k = D[q].k, box = el("div",{class:"pass"});
  const at = showKey ? p.indexOf(k) : -1;
  if(at<0) box.textContent = p;
  else box.append(p.slice(0,at), el("mark",null,k), p.slice(at+k.length));
  return box;
}
function elimOrder(i){
  const it = D[i], pri = {"이":0,"상":1,"반":2,"비":3,"과":4,"세":5,"부":6};
  return it.c.map((_,j)=>j).filter(j=>j!==it.a).sort((x,y)=>pri[it.t[x]]-pri[it.t[y]]);
}

/* ---------- home ---------- */
function home(){
  S.lastDay = currentDay(); save();
  const d = currentDay(), solved = Object.values(S.q).filter(x=>x.done).length, ok = Object.values(S.q).filter(x=>x.done&&x.ok).length;
  const acc = solved? Math.round(ok/solved*100):0, finished = solved>=N;
  const hero = el("div",{class:"hero"},
    el("small",null,"수능 영어 대의 파악 · 400제"),
    el("h1",null, finished? "400제 완주! 🎉" : `Day ${d}`, el("br"), finished? "정말 대단해요" : "오늘의 3문제"),
    el("div",{class:"row"},
      el("span",{class:"pill"},"오늘 "+Math.min(3,S.log[today()]||0)+" / 3 풀이"),
      el("span",{class:"pill"},"🔥 "+streak()+"일 연속")),
    el("button",{class:"go",on:{click:()=>startDay(d)}}, finished?"복습하기":(dayStatus(d)===1?"이어서 풀기 →":"오늘 문제 시작 →")));
  const stats = el("div",{class:"stats"},
    el("div",{class:"stat"},el("b",null,solved),el("span",null,"푼 문제")),
    el("div",{class:"stat"},el("b",null,acc+"%"),el("span",null,"정답률")),
    el("div",{class:"stat"},el("b",null,Object.values(S.q).filter(x=>x.done&&!x.ok).length),el("span",null,"오답노트")));
  const prog = el("div",{class:"prog"},el("div",{class:"tr"},el("div",{class:"fl",style:`width:${solved/N*100}%`})),
    el("p",null,el("span",null,"전체 진도"),el("span",null,solved+" / "+N)));
  const grid = el("div",{class:"grid"});
  let lastLv = 0;
  for(let x=1;x<=DAYS;x++){
    const lv = D[(x-1)*PER].lv;
    if(lv!==lastLv){ grid.append(el("div",{class:"lvh"},`${lv}단계 · ${LVN[lv]}`)); lastLv=lv; }
    const st = dayStatus(x);
    grid.append(el("button",{class:"day "+(x===d&&!finished?"cur":st===2?"done":st===1?"part":""),on:{click:()=>startDay(x)}}, st===2&&x!==d?"✓":x));
  }
  const foot = el("div",{class:"foot"},
    el("button",{on:{click:notes}},"📒 오답노트"),
    el("button",{on:{click:()=>{S.fs=(S.fs+1)%3;save();applyTheme();toast("글자 크기 "+["작게","보통","크게"][S.fs]);}}},"가 글자 크기"),
    el("button",{on:{click:()=>{const o=["auto","light","dark"];S.theme=o[(o.indexOf(S.theme)+1)%3];save();applyTheme();toast("화면: "+{auto:"자동",light:"라이트",dark:"다크"}[S.theme]);}}},"🌓 화면"));
  const reset = el("div",{class:"legend"},"하루 3문제씩 · 총 "+DAYS+"일 ",
    el("a",{href:"#",style:"color:var(--sub)",on:{click:e=>{e.preventDefault();if(confirm("모든 진도와 기록을 지울까요?")){S=blank();save();applyTheme();home();}}}},"기록 초기화"));
  show(el("div",{class:"screen"},el("div",{class:"scroll pad-top",style:"padding:0 0 24px"},
    el("div",{style:"padding:max(14px,env(safe-area-inset-top)) 0 0"}),hero,stats,prog,el("div",{class:"sec"},"학습 캘린더",el("small",null,"✓ 완료 · 노랑 진행중")),grid,foot,reset)));
}

/* ---------- quiz ---------- */
let CTX = null; // {list:[idx], pos, title, onEnd}
function startDay(d){ CTX = {list:dayItems(d), pos:0, title:"Day "+d, kind:"day", day:d}; 
  const f = CTX.list.findIndex(i=>!(S.q[i]&&S.q[i].done)); CTX.pos = f<0?0:f; quiz(); }
function quiz(){
  const i = CTX.list[CTX.pos], it = D[i], q = qs(i), done = !!q.done;
  const sub = CTX.kind==="day" ? `${CTX.pos+1} / ${CTX.list.length}` : "다시 풀기";
  const top = el("div",{class:"top"},
    el("button",{class:"icon-btn",on:{click:home},"aria-label":"홈"},"✕"),
    el("div",{class:"ttl"},CTX.title,el("small",null,sub)),
    el("button",{class:"icon-btn",on:{click:()=>{S.fs=(S.fs+1)%3;save();applyTheme();}},"aria-label":"글자 크기"},"가"));
  const dots = el("div",{class:"dots"}, CTX.list.map((x,k)=>{ const s=S.q[x]; return el("div",{class:"dot "+(s&&s.done?(s.ok?"ok":"bad"):(k===CTX.pos?"on":""))}); }));
  const chips = el("div",{class:"chips"},el("span",{class:"chip lv"},`${it.lv}단계 ${LVN[it.lv]}`),el("span",{class:"chip"},TYPES[it.ty]),el("span",{class:"chip tp"},it.tp));
  const showKey = q.key || done;
  const back = el("div",{class:"back"},el("div",{class:"qcard"},chips,
    el("p",{class:"qs"},el("span",{class:"no"},"Q"+String(it.n).padStart(3,"0")),STEMS[it.ty]),
    passageNode(i, showKey),
    el("div",{class:"swipe"},"▼ 아래로 스크롤하면 선지가 지문 위로 떠올라요")));
  const card = el("div",{class:"sheet"},el("div",{class:"grab"}));
  if(q.tip||done) card.append(el("div",{class:"tipbox"},el("b",null,"💡 유형 팁  "),TIPS[it.ty]));
  if(q.key&&!done) card.append(el("div",{class:"tipbox"},el("b",null,"🔍 핵심 문장  "),"노란 표시된 문장이 글쓴이가 가장 말하고 싶은 부분이에요."));
  const chs = el("div",{class:"choices"});
  it.c.forEach((txt,j)=>{
    const elim = q.elim.includes(j);
    let cls = "ch";
    if(done){ if(j===it.a) cls+=" right"; else if(j===q.sel) cls+=" wrong"; else if(elim) cls+=" elim"; }
    else { if(elim) cls+=" elim"; else if(j===q.sel) cls+=" sel"; }
    const body = el("span",{class:"tx"}, el("span",{class:"m"},txt));
    if(done){
      const t = it.t[j];
      body.append(el("span",{class:"why"}, j===it.a ? el("span",{class:"tag okt"},"정답") : el("span",{class:"tag"},TAGS[t]), it.r[j]));
    } else if(elim){
      body.append(el("span",{class:"why"},el("span",{class:"tag hx"},"소거 · "+TAGS[it.t[j]]), TAGHINT[it.t[j]]));
    }
    const b = el("button",{class:cls,disabled:done||elim?true:false,on:{click:()=>{ if(done||elim)return; q.sel=(q.sel===j?null:j); save(); quiz(); keepScroll(); }}},
      el("span",{class:"n"},"①②③④⑤"[j]),body);
    chs.append(b);
  });
  card.append(chs);
  if(done){
    const good = q.ok;
    card.append(el("div",{class:"exp"+(good?"":" no")},el("h4",null,good?"🎯 정답이에요!":"💭 아쉬워요, 오답을 확인해 보세요"),
      `정답은 ${"①②③④⑤"[it.a]}번 · ${it.r[it.a]}`+(hintCount(i)?` (힌트 ${hintCount(i)}회 사용)`:"")));
  }
  const keep = $app.querySelector(".scroll"); const keepTop = keep ? keep.scrollTop : 0;
  const scroll = el("div",{class:"scroll stage"},back,card);
  let bar;
  if(!done){
    const left = elimOrder(i).filter(j=>!q.elim.includes(j)).length;
    bar = el("div",{class:"bar"},
      el("div",{class:"hints"},
        el("button",{class:"hbtn"+(q.tip?" used":""),disabled:!!q.tip,on:{click:()=>{q.tip=1;save();quiz();}}},"💡 유형 팁",el("small",null,"글 읽는 법")),
        el("button",{class:"hbtn"+(q.key?" used":""),disabled:!!q.key,on:{click:()=>{q.key=1;save();quiz();}}},"🔍 핵심 문장",el("small",null,"내용이 헷갈려요")),
        el("button",{class:"hbtn"+(q.elim.length?" used":""),disabled:q.elim.length>=2||q.sel!=null&&false,on:{click:()=>{
          const nxt = elimOrder(i).find(j=>!q.elim.includes(j)); if(nxt==null)return; q.elim.push(nxt); if(q.sel===nxt)q.sel=null; save(); quiz(); }}},
          "✂️ 오답 지우기",el("small",null,q.elim.length>=2?"모두 사용":`선지가 헷갈려요 (${2-q.elim.length})`))),
      el("button",{class:"cta",disabled:q.sel==null,on:{click:()=>submit(i)}},q.sel==null?"선지를 골라 보세요":"정답 확인"));
  } else {
    const last = CTX.pos>=CTX.list.length-1;
    bar = el("div",{class:"bar"},el("button",{class:"cta",on:{click:()=>{ if(last) finish(); else {CTX.pos++; quiz();} }}},
      CTX.kind==="day"?(last?"오늘 결과 보기 🎉":"다음 문제 →"):"완료"));
  }
  show(el("div",{class:"screen"},top,dots,scroll,bar));
  const sc = $app.querySelector(".scroll"); layer(sc); if(keepTop) { sc.scrollTop = keepTop; sc.dispatchEvent(new Event("scroll")); } 
}
function keepScroll(){}
function layer(sc){
  const back = sc.querySelector(".back"), sheet = sc.querySelector(".sheet");
  sheet.style.setProperty("--sh", Math.max(240, sc.clientHeight - 28) + "px");
  const upd = () => { const bh = back.offsetHeight || 1; const p = Math.max(0, Math.min(1, sc.scrollTop / (bh * 0.5))); sc.style.setProperty("--p", p.toFixed(3)); };
  sc.addEventListener("scroll", upd, {passive:true}); upd();
}
function submit(i){
  const q = qs(i), it = D[i]; q.done=1; q.ok = q.sel===it.a?1:0;
  if(!q.retry){ const t = today(); S.log[t] = (S.log[t]||0) + 1; } save();
  quiz(); const sc=$app.querySelector(".scroll"); if(sc) sc.scrollTop=0;
  if(q.ok) toast("정답! 🎯");
}
function finish(){
  if(CTX.kind==="review"){ home(); return; }
  if(CTX.kind!=="day"){ notes(); return; }
  const it = CTX.list, ok = it.filter(i=>S.q[i].ok).length, hints = it.reduce((a,i)=>a+hintCount(i),0), d = CTX.day;
  const em = ok===it.length?"🏆":ok>=2?"🎉":ok===1?"💪":"🌱";
  const msg = ok===it.length?"완벽해요! 오늘도 해냈어요":ok>=2?"좋아요! 틀린 문제만 다시 볼까요?":"괜찮아요, 오답노트로 복습해요";
  if(ok>=2) confetti();
  const list = it.map(i=>el("button",{class:"li",on:{click:()=>{CTX={list:[i],pos:0,title:"Q"+D[i].n+" 복습",kind:"review"};quiz();}}},
    el("span",{class:"no "+(S.q[i].ok?"ok":"bad")},S.q[i].ok?"O":"X"),
    el("span",{class:"t"},el("b",null,`Q${String(D[i].n).padStart(3,"0")} · ${TYPES[D[i].ty]}`),`${D[i].tp} · 힌트 ${hintCount(i)}회`)));
  const nextDay = d<DAYS;
  show(el("div",{class:"screen"},
    el("div",{class:"top"},el("button",{class:"icon-btn",on:{click:home}},"✕"),el("div",{class:"ttl"},"Day "+d+" 완료")),
    el("div",{class:"scroll"},
      el("div",{class:"res"},el("div",{class:"em"},em),el("h2",null,`${ok} / ${it.length} 정답`),el("p",null,msg)),
      el("div",{class:"sumrow"},
        el("div",{class:"sumcard"},el("b",null,hints),el("span",null,"사용한 힌트")),
        el("div",{class:"sumcard"},el("b",null,"🔥 "+streak()),el("span",null,"연속 학습일"))),
      list),
    el("div",{class:"bar"},nextDay?el("button",{class:"cta",on:{click:()=>startDay(d+1)}},"Day "+(d+1)+" 이어서 풀기 →"):el("button",{class:"cta",on:{click:home}},"홈으로"),
      el("div",{style:"height:8px"}),el("button",{class:"cta kakao",on:{click:()=>shareDay(d)}},"💬 오늘 결과 카톡으로 보내기"),el("div",{style:"height:8px"}),el("button",{class:"cta ghost",on:{click:home}},"홈으로"))));
}

/* ---------- share ---------- */
function shareText(d){
  const it = dayItems(d), ok = it.filter(i=>S.q[i]&&S.q[i].ok).length, hints = it.reduce((a,i)=>a+hintCount(i),0);
  const lines = it.map(i=>{ const s=S.q[i]; return `${s&&s.done?(s.ok?"⭕":"❌"):"▫️"} Q${String(D[i].n).padStart(3,"0")} ${TYPES[D[i].ty]} (${D[i].tp}) · 힌트 ${hintCount(i)}회`; });
  const who = S.name ? S.name+" · " : "";
  return `📘 수능 대의파악 · ${who}Day ${d} 결과\n✅ ${ok} / ${it.length} 정답 · 💡 힌트 ${hints}회\n${lines.join("\n")}\n🔥 ${streak()}일 연속 학습 중!`;
}
function copyText(t){
  return new Promise(res=>{
    const fallback=()=>{ try{ const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.append(a); a.select(); const ok=document.execCommand("copy"); a.remove(); res(ok);}catch(e){res(false);} };
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(()=>res(true),fallback); else fallback();
  });
}
async function shareDay(d){
  if(S.name===undefined){ const n = prompt("카톡에 함께 보낼 이름을 입력하세요 (비워도 돼요)", ""); S.name = (n||"").trim().slice(0,12); save(); }
  const text = shareText(d);
  if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  const ok = await copyText(text);
  toast(ok?"복사됐어요! 카톡 대화창에 붙여넣기 하세요 📋":"복사에 실패했어요. 직접 선택해 복사해 주세요");
  if(!ok) prompt("아래 내용을 복사하세요", text);
}

/* ---------- notes ---------- */
function notes(){
  const wrong = Object.keys(S.q).map(Number).filter(i=>S.q[i].done&&!S.q[i].ok).sort((a,b)=>a-b);
  const body = wrong.length ? wrong.map(i=>el("button",{class:"li",on:{click:()=>{ // retry
      const q=S.q[i]; S.q[i]={sel:null,tip:0,key:0,elim:[],done:0,ok:0,retry:1}; save(); CTX={list:[i],pos:0,title:"Q"+D[i].n+" 다시 풀기",kind:"retry"}; quiz(); }}},
      el("span",{class:"no bad"},"X"),
      el("span",{class:"t"},el("b",null,`Q${String(D[i].n).padStart(3,"0")} · ${TYPES[D[i].ty]} · ${LVN[D[i].lv]}`),D[i].tp+" · 눌러서 다시 풀기")))
    : [el("div",{class:"empty"},"아직 틀린 문제가 없어요 👏")];
  show(el("div",{class:"screen"},
    el("div",{class:"top"},el("button",{class:"icon-btn",on:{click:home}},"←"),el("div",{class:"ttl"},"오답노트",el("small",null,wrong.length+"문제"))),
    el("div",{class:"scroll"},body)));
}
applyTheme(); home();
</script>
